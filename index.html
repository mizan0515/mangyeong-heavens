window.ARCHIVE_DATA={"schemaVersion":1,"defaultWork":"mangyeong","works":[{"id":"mangyeong","title":"서로 다른 천국","subtitle":"낙원이 완성된 뒤, 이야기가 시작된다.","hero":{"title":"서로 다른 천국","emphasis":"모두가 행복해질 수 있다.\n모두가 같은 결말을 원하지는 않는다.","description":"쓸모를 증명해야 존중받던 시대가 끝났다. 각자 원하는 세계를 살 수 있게 된 사람들에게, 과거가 돌아오기 시작한다.","action":"본편 처음부터 읽기","caption":"하나의 세계\n서로 다른 결말"},"theme":{"accent":"#254b43","accentSoft":"#e9eee5","gold":"#8c622b"},"scope":"만경과 항구도시 해원의 현재, 개원 172년 전의 구조 항해, 개원 42년 전의 긴 저녁, 개원 2,400년 뒤까지. 연속 장면·세계 설정·인물·단서와 원전 읽기를 연결한 독립 창작 자료집.","rights":"창작 세계관 · 웹 자료집","sourceLabel":"독립 창작 · 원전과 변형을 구별한 읽기","types":[{"id":"world","label":"세계","plural":"세계와 생활","icon":"§"},{"id":"character","label":"인물","plural":"인물과 동기","icon":"◇"},{"id":"history","label":"과거","plural":"오래전의 사건","icon":"◷"},{"id":"story","label":"본편","plural":"본편과 장면","icon":"↳"},{"id":"future","label":"훗날","plural":"먼 훗날","icon":"↗"},{"id":"deep","label":"겹쳐 읽기","plural":"이야기 더 깊게","icon":"§"},{"id":"guide","label":"길잡이","plural":"길잡이와 질문","icon":"?"}],"groups":[],"entries":[{"id":"start","title":"처음 만나는 세계","summary":"장면을 읽기 전 알아도 좋은 것 세 가지. 배경지식 없이 바로 본편으로 가도 됩니다.","type":"guide","kind":"읽기 길잡이","tags":["처음 읽기","한 통의 편지"],"sections":[{"id":"premise","title":"풍요로운데도, 늘 부족한 사람으로 살았다","blocks":[{"type":"paragraph","text":"해원에서는 식량과 집보다 인정과 발언권이 귀했다. 공헌청은 시민을 기여도로 줄 세웠고, 사람들은 존중받기 위해 끊임없이 더 나아져야 했다. 시민들의 개혁으로 이 제도는 이미 해체되었다. 본편은 그 뒤에서 시작한다.","terms":["나래","메이"],"id":"premise-p1"}]},{"id":"promise","title":"이제는 원하는 세계를 고를 수 있다","blocks":[{"type":"paragraph","text":"만경은 각자에게 다른 현실을 열어준다. 함께 있고 싶은 사람은 같은 공간을 살고, 서로 다른 일을 원하면 장면을 나눌 수 있다. 누군가가 행복해지기 위해 반드시 다른 누군가가 불행해질 필요는 없다.","id":"promise-p1","terms":["나래","여울"]},{"type":"paragraph","text":"장면이 갈라질 때마다 사람까지 복제되는 것은 아니다. 원하면 따로 경험하는 의식이 없는 꿈배역이 상대의 역할을 맡는다. 실제 다른 사람과 만나기로 했다면 그 사람의 선택도 남는다.","id":"promise-p2","terms":["시민심판","에이렌","라잔","리아"]}]},{"id":"heart","title":"그런데 함께 살았던 과거는 남아 있다","blocks":[{"type":"paragraph","text":"에이렌은 새 삶을 시작할 권리를 지킨다. 리아는 좋은 삶을 얻은 뒤에도 함께 해결해야 할 일을 묻는다. 둘은 원수가 아니라 같은 제도를 고친 동료다. 일반 개원일에 도착한 편지 한 통이 두 사람을 다른 선택 앞에 세운다.","terms":["에이렌","나래","리아","만경","메이","여울"],"id":"heart-p1"}]},{"id":"read","title":"읽다가 궁금해지면","blocks":[{"type":"choice","label":"먼저 한 장면","options":[{"label":"본편 첫 장면으로","entry":"prologue"}],"id":"read-p1","terms":[]},{"type":"choice","label":"세계와 문장의 뒷면","options":[{"label":"만경의 생활을 더 알아보기","entry":"mangyeong"}],"id":"read-p2","terms":[]},{"type":"paragraph","text":"밑줄 친 단어를 누르면 짧은 설명이 열린다. 닫으면 같은 문장으로 돌아온다. §는 이 문서 안의 구역을 가리킨다. 이름의 유래와 결말 해설은 본편을 읽은 뒤 따로 찾을 수 있다.","id":"read-p3","terms":[]}]},{"id":"another-book","title":"본편 밖에도 시간이 흐른다","blocks":[{"type":"paragraph","text":"본편을 읽고 나면, 낙원 이전을 다룬 외전과 옛 인물들의 기록, 먼 훗날의 짧은 이야기로 이어갈 수 있다. 어느 쪽도 본편을 이해하기 위한 선행 학습은 아니다.","id":"another-book-p1","terms":["귀환제","에이렌","아벨","이사"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"본편 시작","entry":"prologue"}],"id":"another-book-p2"}]}],"sources":[],"relations":[],"spoiler":false,"shortTitle":"처음 만나는 세계","preview":"","readingMinutes":1,"requires":[]},{"id":"prologue","title":"서장 — 내 글씨로 온 편지","summary":"자기 글씨로 도착한 편지. 나래는 자신이 그 말을 한 적 없다고 생각한다.","type":"story","kind":"이야기","tags":["도입","편지","두 나래","귀환의 서"],"sections":[{"id":"envelope","title":"첫 문장","blocks":[{"type":"paragraph","text":"나래는 자기가 쓴 용서장을 받았다. 자신은 누구도 용서하지 않았는데.","id":"envelope-p1","terms":["나래"]},{"type":"paragraph","text":"봉투의 글씨는 오래전의 자기 글씨였다. 오른손 셋째 손가락을 다친 뒤부터 길게 끌던 받침, 마지막 점을 찍고 한 번 더 누르는 버릇. 만경은 그 상처를 이미 고쳐주었지만, 글씨는 고쳐달라고 하지 않았다.","id":"envelope-p2","terms":["만경"]},{"type":"paragraph","text":"날짜가 두 줄이었다. 공통력: 개원 전날. 살아온 시간: 분기 뒤 이백 년. 발신인: 여울. 일 년 전 시범 거주를 시작하며 자기 삶을 둘로 나누었을 때, 다른 세계로 떠난 쪽이 고른 이름이었다.","id":"envelope-p3","terms":["살아온 시간","나래 운","공통력","나래","분기","여울"]},{"type":"paragraph","text":"편지는 라잔에게 보내졌고, 나래에게는 참조본이 왔다. 나래는 끝까지 읽은 뒤 처음으로 돌아갔다.","id":"envelope-p4","terms":["나래","라잔"]},{"type":"quote","text":"나는 당신을 용서합니다.\n당신이 옳았다는 뜻은 아닙니다.\n나래 운의 삶에서 갈라져 나온 여울.","attribution":"여울의 편지 일부","id":"envelope-p5","terms":["나래 운","나래","여울"]}]},{"id":"counter","title":"배달 사고는 아니었다","blocks":[{"type":"paragraph","text":"미결 우체국의 시민 조정자 리아가 봉투를 돌려주었다. 발신인 확인은 끝나 있었다. 일 년 전 헤어진 여울이 실제로 보낸 편지였다. 나래는 낯선 필체이기를 잠깐 바랐던 자신이 부끄러웠다.","id":"counter-p1","terms":["미결 우체국","리아"]},{"type":"dialogue","speaker":"리아","text":"공개를 허락했대요. 자기 말로만요.","id":"counter-p2","terms":[]},{"type":"dialogue","speaker":"나래","text":"저것도 내 말이었겠지. 저만큼 살았다면.","id":"counter-p3","terms":[]},{"type":"paragraph","text":"나래는 잠깐 웃었다. 여울이 식탁을 치울 때 컵부터 포개는 버릇도 바꾸었을까 궁금해졌다. 그리고 그 궁금증 옆에서 화가 났다. 편지 자체보다, 이미 행사장에 걸렸다는 문장 때문에.","id":"counter-p4","terms":["나래","여울"]},{"type":"quote","text":"이제 모두 돌아왔습니다.","attribution":"개원식 무대의 문구","id":"counter-p5","terms":[]},{"type":"dialogue","speaker":"나래","text":"나는 오늘도 여기 있는데, 왜 누가 돌아왔다고 해야 하지?","id":"counter-p6","terms":[]}]},{"id":"two-applications","title":"두 번째 봉투","blocks":[{"type":"paragraph","text":"리아의 책상에는 다른 봉투도 있었다. 옛 통치자 라잔의 만경 입주 신청서였다. 거주지는 실제 시민이 없는 개인 왕국. 동반자는 꿈배역. 신청 사유는 짧았다. 사랑받으며 살고 싶습니다.","id":"two-applications-p1","terms":["꿈배역","라잔","리아","만경"]},{"type":"paragraph","text":"그 아래에는 같은 서명으로 시민심판 출석을 거부하는 문서가 붙어 있었다. 하나는 받아달라는 말이었고, 하나는 답하지 않겠다는 말이었다.","id":"two-applications-p2","terms":["시민심판"]},{"type":"paragraph","text":"만경의 첫 사용 원칙을 세운 에이렌이 들어왔을 때, 리아는 두 장을 나란히 놓았다.","id":"two-applications-p3","terms":["에이렌","리아"]},{"type":"dialogue","speaker":"리아","text":"이것도 둘 다 가능한 거야?","id":"two-applications-p4","terms":[]},{"type":"dialogue","speaker":"에이렌","text":"가능해.","id":"two-applications-p5","terms":[]},{"type":"paragraph","text":"그는 곧바로 잘된 일이라고 덧붙이지 않았다. 나래의 손에 들린 봉투를 보았기 때문이다.","id":"two-applications-p6","terms":["나래"]},{"type":"paragraph","text":"개원식의 종이 울렸다. 밖에서는 같은 경기의 우승자 둘이 서로의 어깨를 두드리고 있었다. 나래는 접었던 편지를 다시 폈다.","id":"two-applications-p7","terms":["나래"]}]},{"id":"third-envelope","title":"세 번째 의뢰인","blocks":[{"type":"paragraph","text":"세 번째 사람은 초대장을 손에 들지 않았다. 창구 앞에서 자기 얼굴이 인쇄된 것을 주워 왔다. 금색 테두리 안에 메이 란의 옆얼굴이 있었다. 아래에는 귀환제의 첫 손님, 이름 없는 성녀라고 적혀 있었다.","terms":["메이 란","귀환제","메이"],"id":"third-envelope-p1"},{"type":"paragraph","text":"리아는 사람과 인쇄물을 번갈아 보았다. 부활자의 신원 확인은 이미 끝나 있었다. 귀환제는 돌아오고 싶은 죽은 사람과 멀리 떠난 갈래들을 초대하는 축제였다. 낯선 손님들이 같은 날 도착한 것은 우연이 아니었다.","terms":["귀환제","리아"],"id":"third-envelope-p2"},{"type":"dialogue","text":"제 얼굴이 이렇게 생겼었나요?","terms":[],"speaker":"메이","id":"third-envelope-p3"},{"type":"dialogue","text":"조각가가 조금 다듬은 모양이에요.","terms":[],"speaker":"리아","id":"third-envelope-p4"},{"type":"dialogue","text":"얼굴 말고요. 여기 써 있는 사람 말이에요.","terms":[],"speaker":"메이","id":"third-envelope-p5"},{"type":"paragraph","text":"나래가 자기 필체의 편지를 접었다. 메이는 자기 얼굴의 초대장을 뒤집었다. 두 사람 모두 가짜를 가져온 것은 아니었다.","terms":["나래","메이"],"id":"third-envelope-p6"},{"type":"dialogue","text":"제가 돌아오면 어떤 서약을 읽게 되어 있다던데요. 저는 동의한 적이 없어요. 그 대목부터 취소하고 싶습니다.","terms":[],"speaker":"메이","id":"third-envelope-p7"},{"type":"paragraph","text":"천장 너머로 태양이 세 번 깜빡였다. 아이들이 박수를 쳤다. 창건자가 돌아온 것을 하늘도 안다는 뜻이라고 누군가 말했다. 메이는 오래된 기관실을 떠올리는 표정으로 그 빛을 올려다보았다.","terms":["메이"],"id":"third-envelope-p8"}]}],"sources":[],"relations":[{"target":"clocks","label":"두 날짜","reason":"예언과 분기를 혼동하지 않기.","evidence":{"entry":"clocks","anchor":"nara","label":"나래와 여울의 경우"}},{"target":"yeoul","label":"누가 썼나","reason":"편지 뒤의 이백 년.","evidence":{"entry":"yeoul","anchor":"years","label":"이백 년을 한 문장으로 줄이지 않기"}},{"target":"deep-forgive","label":"단어의 함정","reason":"나는 언제 우리가 되는가.","evidence":{"entry":"deep-forgive","anchor":"pronoun","label":"누가 말한 우리인가"}},{"target":"founder-return","label":"다음 장면","reason":"세 번째 손님이 자기 비문을 보러 간다.","evidence":{"entry":"founder-return","anchor":"door","label":"정문에 없는 손님"}}],"spoiler":false,"era":"개원일 아침 · 미결 우체국","shortTitle":"서장","preview":"","readingMinutes":2,"requires":[],"readerCue":{"지금 따라가는 사람":"나래 · 편지를 받은 사람","이 장면에서 원하는 것":"자기가 쓰지 않은 문장을 확인하려 한다."}},{"id":"founder-return","title":"2장 — 신전의 옆문","summary":"돌아온 손님과, 그 손님을 기다리며 쓴 대본이 만난다.","type":"story","kind":"작중 장면","tags":["귀환의 서"],"sections":[{"id":"door","title":"정문에 없는 손님","blocks":[{"type":"paragraph","text":"메이는 자기 신전의 옆문으로 들어갔다. 정문이 닫혀서가 아니라, 정문 앞에서 사람들이 줄을 서고 있었기 때문이다. 오늘 돌아올 성녀의 얼굴을 기다리는 줄이었다. 그녀는 그 사이에 끼어들고 싶지 않았다.","terms":["메이"],"id":"door-p1"},{"type":"paragraph","text":"신전은 도시가 안정된 뒤 생긴 기념관이었다. 메이가 늙어 죽은 다음, 무명관이라는 이름에 사람들이 신전이라는 별명을 붙였다. 오래전 메이가 열일곱 사람을 구했다는 일은 사실이었다. 그 뒤 서른여섯 해를 살았다는 사실도 연표에 남아 있었다. 거짓은 대개 없었다. 대신 그 서른여섯 해에 관해 묻는 사람이 없었다.","terms":["무명관","메이"],"id":"door-p2"},{"type":"paragraph","text":"진열장에는 젖은 승선 명부와 접수 도장이 있었다. 메이는 도장에 손을 내밀다가 멈췄다. 자기 물건이라는 것과 지금 마음대로 만져도 된다는 것은 다르다는 듯했다.","terms":["메이"],"id":"door-p3"},{"type":"dialogue","text":"내 도장을 이렇게 반듯하게 놓았네. 원래는 한쪽이 갈라져서 잉크가 샜어.","terms":[],"speaker":"메이","id":"door-p4"}]},{"id":"inscription","title":"비문에 없는 뒷문장","blocks":[{"type":"paragraph","text":"가장 큰 벽에는 그녀의 문장이 새겨져 있었다. 다음 사람이 오면 문을 넘겨주시오. 그 아래에는 이름 없는 구원자가 다음 구원자에게 자리를 물려주리라는 해설이 붙어 있었다. 새로운 인류를 맞이하는 에이렌의 초상은 그 바로 옆에 걸렸다.","terms":["에이렌"],"id":"inscription-p1"},{"type":"paragraph","text":"메이는 해설부터 지우자고 하지 않았다. 먼저 문장을 끝까지 읽어달라고 했다.","terms":["메이"],"id":"inscription-p2"},{"type":"quote","text":"다음 사람이 오면 문을 넘겨주시오. 나는 집에 가겠소.","terms":[],"attribution":"창건 당시 메이의 당직 인계장","id":"inscription-p3"},{"type":"paragraph","text":"당직 인계장이었다. 다음 사람은 예언된 구원자가 아니라 교대 근무자였다. 집은 피안의 비유가 아니라 한동안 돌아가지 못한 작은 객실이었다.","terms":["당직 인계장"],"id":"inscription-p4"},{"type":"paragraph","text":"리아가 물었다. 기록이 잘려 있다는 사실을 왜 먼저 알리지 않았느냐고. 메이는 말했다. 자신도 이 벽을 오늘 처음 보았다고.","terms":["리아","메이"],"id":"inscription-p5"}]},{"id":"request","title":"고마움을 없애달라는 것이 아니다","blocks":[{"type":"paragraph","text":"환대회 대표 결 로안이 찾아왔다. 그녀는 원문을 보관하고 있었다. 여백의 문장도 부정하지 않았다. 다만 오랫동안 도시가 그 문장을 통해 더 큰 희망을 읽어 왔다고 말했다. 메이도 누군가에게 도움이 되었다는 사실까지 없애고 싶지는 않았다.","terms":["결 로안","환대회","메이"],"id":"request-p1"},{"type":"dialogue","text":"그 문장이 당신에게 그런 뜻일 수는 있어요. 그런데 제가 아직 하지 않은 서약을 그 뜻에 맞춰 대신 써주지는 마세요.","terms":[],"speaker":"메이","id":"request-p2"},{"type":"paragraph","text":"결은 예정된 무대의 대본을 꺼냈다. 첫 구조의 성녀가 마지막 구조의 창조자에게 문을 건네는 장면. 살아 돌아온 피해자가 용서장을 읽는 장면. 죽은 사람과 살아 있는 사람이 한목소리로 이제는 돌아왔다고 말하는 장면.","terms":[],"id":"request-p3"},{"type":"paragraph","text":"그 장면들은 하나하나 아름다웠다. 아름다운 까닭에 메이의 거절은 더 큰 소란이 되었다. 리아는 대본의 출연자 옆에 실제로 받은 동의 표시부터 확인했다. 빈칸이 생각보다 많았다.","terms":["리아","메이","빈칸"],"id":"request-p4"}]}],"sources":[],"relations":[{"target":"mei","label":"이름 뒤의 삶","reason":"구조 뒤 서른여섯 해가 있었던 사람.","evidence":{"entry":"mei","anchor":"after","label":"구조 다음의 서른여섯 해"}},{"target":"gyeol","label":"반대편의 동기","reason":"같은 신화 덕분에 집을 얻은 사람의 입장.","evidence":{"entry":"gyeol","anchor":"argument","label":"그녀가 옳은 부분"}},{"target":"deep-messiah","label":"문장에 숨긴 장치","reason":"예언과 교대 요청을 가르는 뒷문장.","evidence":{"entry":"deep-messiah","anchor":"cut","label":"예언의 원전은 당직 인계장이었다"}}],"era":"개원 2일 · 무명관","spoiler":false,"shortTitle":"2장","preview":"","readingMinutes":2,"requires":[],"readerCue":{"지금 따라가는 사람":"메이 · 돌아온 창건기 접수원","이 장면에서 원하는 것":"자기가 읽기로 하지 않은 서약을 확인한다."}},{"id":"rescue-night","title":"항해록 — 태양을 훔친 밤","summary":"개원 172년 전. 신의 불꽃이 아니라 꺼지면 안 되는 조난등 하나를 둘러싼 항해.","type":"history","kind":"과거의 기록","tags":["귀환의 서"],"sections":[{"id":"six","title":"여섯 빛이 세 빛이 될 때","blocks":[{"type":"paragraph","text":"항로의 표지가 하나씩 꺼졌다. 지도는 그대로인데 지도에 그려진 점들이 답하지 않았다. 에이레네호의 식당에서는 저녁을 치우지 못했다. 접시가 흔들릴 때마다 승객들이 창문을 보았다. 누가 보기 전에 사라진 배도 있었다.","terms":["에이레네호"],"id":"six-p1"},{"type":"paragraph","text":"그때 사람들은 죽음을 되돌릴 수 없었다. 여섯 선박의 각 기능도 서로 완전히 대신하지 못했다. 에우노미아호는 남은 물자와 추진량을 계산했고, 디케호는 구조자를 치료했다. 생활선의 접수원 메이는 사람이 늘 때마다 짐이 들어갈 자리를 줄였다.","terms":["에우노미아호","디케호","메이"],"id":"six-p2"}]},{"id":"light","title":"통신관 안의 작은 불","blocks":[{"type":"paragraph","text":"기관사 유란은 에우노미아호의 장거리 식별등을 생활선 외벽으로 옮기자고 했다. 지휘선의 깃발을 옮기는 일이어서 승인이 늦어졌다. 메이는 지휘권을 훔칠 생각이 없었다. 흩어진 구명정이 가장 많은 사람이 있는 곳을 찾게 하고 싶었다.","terms":["에우노미아호","메이","유란"],"id":"light-p1"},{"type":"paragraph","text":"분리한 광원은 금속 통신관 안에 실려 왔다. 주민들은 훗날 이 모습을 신의 불을 품고 달린 사람으로 그렸다. 그러나 관은 신성한 유물이 아니라 운반 중 누군가의 눈을 다치지 않게 하려고 씌운 덮개였다. 유란은 배관 절연재를 열 번 확인했다.","terms":["유란"],"id":"light-p2"},{"type":"paragraph","text":"그들은 어둠에 세 번씩 빛을 보냈다. 여기에 사람들이 있다. 여기에 사람들이 있다. 긴 선단의 번호 대신 구조 위치를 알리는 신호였다. 열일곱 사람이 탄 구명정이 그 빛을 보고 접근했다.","terms":[],"id":"light-p3"}]},{"id":"seventeen","title":"문은 누가 열었는가","blocks":[{"type":"paragraph","text":"메이는 빈자리가 있다고 거짓말하지 않았다. 화물반에게 접이식 침대를 옮겨달라고 부탁하고, 승객들에게 짐을 줄일 수 있는지 물었다. 어떤 사람은 자기 침대 한쪽을 내주었다. 어떤 사람은 귀중한 물건은 지키되 쌓여 있던 포장재를 버렸다. 모두가 거룩하지 않아도 자리는 생겼다.","terms":["메이"],"id":"seventeen-p1"},{"type":"paragraph","text":"열일곱 명의 마지막 사람이 통로에 쓰러졌을 때, 메이는 먼저 이름을 쓰려는 손에서 연필을 빼냈다. 의료 담당이 다리를 들고 다른 승객이 머리를 받쳤다. 그 뒤 명부 여백에 메이의 문장이 남았다.","terms":["메이"],"id":"seventeen-p2"},{"type":"quote","text":"이름은 나중에 쓰시오. 먼저 태우시오.","terms":[],"attribution":"승선 명부의 여백","id":"seventeen-p3"}]},{"id":"shore","title":"그 뒤에는 기적이 아니라 생활이 있었다","blocks":[{"type":"paragraph","text":"세 척은 살아남은 정박지에서 선체를 서로 연결했다. 지휘선 위에는 관청, 기록선 위에는 진료소와 서고, 생활선 위에는 시장과 부엌이 생겼다. 다른 세 척의 행방과 사망자 기록도 조사되었다. 돌아온 세 배의 노래가 그 기록까지 없애지는 않았다.","terms":[],"id":"shore-p1"},{"type":"paragraph","text":"이튿날 메이는 당직표에 두 문장을 썼다. 다음 사람이 오면 문을 넘겨주시오. 나는 집에 가겠소. 바람이 젖은 종이를 넘겼다. 오래 뒤 신전은 첫 문장만 돌에 옮겼다.","terms":["메이"],"id":"shore-p2"}],"reveal":true}],"sources":[],"relations":[{"target":"sun","label":"빛이 남긴 뜻","reason":"식별등이 신의 눈으로 읽히기까지.","evidence":{"entry":"sun","anchor":"origin","label":"보는 눈에서 보아달라는 눈으로"}},{"target":"deep-fire","label":"프로메테우스의 변형","reason":"신의 불 대신 서로를 찾는 신호를 옮긴다.","evidence":{"entry":"deep-fire","anchor":"tube","label":"통신관 안에 들어 있던 것은"}}],"era":"개원 172년 전 · 지역 항로 재난","spoiler":true,"shortTitle":"항해록","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"descent","title":"3장 — 태양 아래의 계단","summary":"메이는 기록을 확인한 뒤에도 옛 식당에 가고 싶다고 말한다.","type":"story","kind":"작중 장면","tags":["귀환의 서"],"sections":[{"id":"why","title":"아래층에서 만나기로 했다","blocks":[{"type":"paragraph","text":"리아가 내려가겠다고 하자 에이렌은 필요한 자료를 열람 허가 범위 안에서 즉시 가져다주었다. 승선 명부, 교대장, 신전의 초판 해설. 사실 확인에 며칠을 허비할 이유는 없었다. 여백의 문장은 진본이었다.","terms":["에이렌","리아"],"id":"why-p1"},{"type":"paragraph","text":"그런데 메이는 다시 아래층에 가고 싶다고 했다. 자료를 못 믿어서가 아니라 그 배를 마지막으로 떠날 때도 가보지 못한 식당이 있었기 때문이다. 결은 그곳에서 메이를 직접 만나겠다고 했다. 다음 공연의 소재가 아니라, 대본을 거절한 손님으로 만나기 위해서였다.","terms":["메이"],"id":"why-p2"}]},{"id":"stairs","title":"도시의 갈비뼈","blocks":[{"type":"paragraph","text":"엘리베이터는 배의 원래 천장을 가로질러 내려갔다. 계단 옆에 객실 번호가 거꾸로 붙어 있었다. 선체를 지반으로 고정하며 기울어진 부분이었다. 아이들은 이곳을 거인의 갈비뼈라고 불렀다. 이 거인은 살아 있는 제물도, 갇힌 신도 아니었다. 수십 년 동안 사람들이 수리하며 살았던 배였다.","terms":[],"id":"stairs-p1"},{"type":"paragraph","text":"디케호의 선실 문이 열렸다. 벽화의 삼박등 아래에는 열일곱 칸이 있었다. 창건자의 이름을 따라 미래의 위인들을 쓰던 시민 놀이였다. 실제 열일곱 사람이 그 뒤 위대해졌다는 기록은 없었다. 어떤 사람은 장사를 했고, 어떤 사람은 이웃 도시로 떠났다.","terms":["디케호","삼박등"],"id":"stairs-p2"}]},{"id":"soup","title":"구조자의 기억도 완전한 초상은 아니다","blocks":[{"type":"paragraph","text":"메이는 옛 주방을 알아보지 못했다. 비슷한 것을 복원한 것은 알았지만, 자기가 알고 있던 선반은 늘 기름기가 있었고 여기 것은 깨끗했다. 그녀는 자기 기억에 맞춰 더러워지게 만들 필요까지는 없다고 말했다.","terms":["메이"],"id":"soup-p1"},{"type":"paragraph","text":"결은 준비해 온 대본을 접고 국자를 들었다. 메이는 잊었던 배 멀미를 이야기했다. 나래는 여울이 돌아오면 자기 국에 다른 간을 할까 봐 걱정된다고 했다. 메이는 사람이 이백 년을 살았는데 소금 양쯤 달라질 수 있지 않겠느냐고 말했다. 그러고 나서 자기도 아까 벽화를 보고 화를 냈다는 사실을 떠올렸다.","terms":["나래","메이","여울"],"id":"soup-p2"}]},{"id":"original","title":"그녀가 자기 이야기를 고치는 방식","blocks":[{"type":"dialogue","text":"사람들이 나를 멋있게 기억한 게 화난 건 아닌 것 같아요.","terms":[],"speaker":"메이","id":"original-p1"},{"type":"dialogue","text":"그러면 뭐가요?","terms":[],"speaker":"결","id":"original-p2"},{"type":"dialogue","text":"그 멋있는 사람이 지금의 나더러 자리를 비키라고 해서요.","terms":[],"speaker":"메이","id":"original-p3"},{"type":"paragraph","text":"결은 메이에게 다시 무대에 나와달라고 부탁했다. 이번에는 완성된 대사가 없었다. 메이는 자기 뒤에 구조에 참여한 사람들의 이름도 함께 올리는 조건으로 수락했다. 이름이 공개되지 않기를 원하는 사람은 빈칸으로 남기되, 구하지 않은 사람의 칸으로 읽지 말아달라고 했다.","terms":["메이","빈칸"],"id":"original-p4"},{"type":"paragraph","text":"리아는 등대동 합의문에 자기 서명을 다시 보았다. 자신도 누군가를 구하고 싶어서 그 사람이 나중에 할 말까지 미리 정리해버린 적이 있었다.","terms":["등대동","리아"],"id":"original-p5"}]}],"sources":[],"relations":[{"target":"deep-canon","label":"정전의 두 한자","reason":"도시의 아래를 내려가는 말놀이.","evidence":{"entry":"deep-canon","anchor":"two","label":"한 건물에 두 개의 정전"}},{"target":"world-route","label":"도시를 따라 걷기","reason":"선체와 서고, 부엌, 태양의 위치.","evidence":{"entry":"world-route","anchor":"rib","label":"선체 아래 · 이름보다 먼저 놓인 침대"}}],"era":"개원 3일 · 구조선의 아래층","spoiler":false,"shortTitle":"3장","preview":"","readingMinutes":2,"requires":[],"readerCue":{"지금 따라가는 사람":"메이와 결 · 손님과 행사 준비자","이 장면에서 원하는 것":"옛 식당에서 서로가 기억하는 도시를 이야기한다."}},{"id":"act-two","title":"4장 — 두 사람의 식탁","summary":"서로를 너무 잘 아는 두 사람이 다시 저녁을 먹는다.","type":"story","kind":"이야기","tags":["본편","대면","선택","귀환의 서"],"sections":[{"id":"records","title":"등대동으로 돌아가는 길","blocks":[{"type":"paragraph","text":"리아와 에이렌은 옛 회복원 앞을 지났다. 건물은 이미 문 없는 숙소가 되었고, 철거한 출입문은 기록실에 있다. 사람을 여전히 가둬두어야 과거를 증명할 수 있는 것은 아니었다.","id":"records-p1","terms":["에이렌","회복원","리아"]},{"type":"paragraph","text":"에이렌은 문보다 책상 위의 신청서가 더 오래 기억난다고 말했다. 자신을 믿고 문장을 다시 쓰던 사람들. 리아는 서안의 손을 잡고 나가던 날을 떠올렸다. 그 좋은 날을 나쁜 날이라고 바꿀 필요는 없었다. 그날 뒤에 남은 사람들의 날도 함께 기억하면 되었다.","id":"records-p2","terms":["에이렌","리아","서안"]}]},{"id":"nara","title":"소금 한 숟갈","blocks":[{"type":"paragraph","text":"여울이 해원으로 돌아왔을 때 나래는 먼저 국을 떠주었다. 여울은 예전보다 짜다고 말했다. 나래는 똑같이 끓였다고 답했다. 두 사람은 한동안 아무 말 없이 국을 먹었다.","id":"nara-p1","terms":["나래","여울","해원"]},{"type":"dialogue","speaker":"여울","text":"내가 달라졌나 보다.","id":"nara-p2","terms":[]},{"type":"dialogue","speaker":"나래","text":"맛은 네가 고쳐도 돼. 내가 잘못 끓였다고 할 필요는 없고.","id":"nara-p3","terms":[]},{"type":"paragraph","text":"그 말로 용서 문제까지 해결되지는 않았다. 하지만 서로 다른 입맛을 가진 사람이 어느 쪽도 가짜가 아니라는 사실부터 식탁에 앉았다.","id":"nara-p4","terms":[]}]},{"id":"seoan","title":"누가 공개될지를 정한다","blocks":[{"type":"paragraph","text":"리아는 서안에게 공개 증언을 다시 권했다. 여울의 용서장이 라잔에게 유리하게 쓰일 수 있다는 이유였다. 서안은 잠시 악보를 덮었다.","id":"seoan-p1","terms":["라잔","리아","서안","여울"]},{"type":"dialogue","speaker":"서안","text":"그러면 내가 나가야 하는 이유도 그 사람 때문이네.","id":"seoan-p2","terms":[]},{"type":"paragraph","text":"그는 기존 명령 기록의 공개에는 동의했다. 자신의 오늘을 공개 무대로 옮기는 일에는 동의하지 않았다. 리아는 두 선택을 같은 서명 칸에 넣지 않았다.","id":"seoan-p3","terms":["리아"]}]},{"id":"deal","title":"한 번 더 서명하면","blocks":[{"type":"paragraph","text":"라잔은 화해식의 좌석 배치를 보냈다. 자신과 에이렌은 가운데, 리아는 진행석, 나래와 여울은 앞줄이었다. 누구도 감옥에 가는 배치가 아니었다. 다만 시민이 묻고 지도자가 답하는 배치도 아니었다.","id":"deal-p1","terms":["에이렌","나래","라잔","리아","여울"]},{"type":"paragraph","text":"서안의 퇴소를 위해 서명했던 날처럼, 이번에도 실제로 얻을 좋은 것이 있었다. 나래는 라잔을 만날 수 있었다. 에이렌은 라잔의 안전을 보장하는 것과 이 무대를 공인하는 것은 다르다고 했다. 리아는 펜을 내려놓았다.","id":"deal-p2","terms":["에이렌","나래","라잔","리아","서안"]}]},{"id":"cost","title":"그렇다고 사라져주지는 않겠다는 사람","blocks":[{"type":"dialogue","speaker":"리아","text":"당신의 용서장이 그 사람에게 좋은 무대가 되었어요.","id":"cost-p1","terms":[]},{"type":"dialogue","speaker":"여울","text":"그렇다면 무대를 고쳐주세요. 내가 느낀 것을 없애라고 하지는 말고요.","id":"cost-p2","terms":[]},{"type":"paragraph","text":"여울은 공개석상에 나오겠다고 했다. 자신의 말을 자신이 제한하기 위해서였다. 나래는 아직 그와 나란히 앉을지 결정하지 못했다. 두 사람은 그날의 저녁만 함께 먹었다.","id":"cost-p3","terms":["나래","여울"]}]},{"id":"below","title":"기념비를 세운 사람도 만나야 한다","blocks":[{"type":"paragraph","text":"리아는 이미 확인 가능한 공개 기록을 먼저 확보한다. 메이와 결이 서고 아래에서 만날 때에는 위조를 밝혀 악인을 잡으러 가는 것이 아니다. 결에게 그 기념관이 집을 주었듯, 메이에게는 그 기념관이 자기 삶을 돌려줄 필요가 있다. 두 사실은 함께 참이다.","terms":["리아","메이"],"id":"below-p1"},{"type":"paragraph","text":"나래와 여울의 국 한 그릇은 이 만남과 교차한다. 메이의 인계장에서 잘린 휴식의 문장, 여울의 용서장에서 빠질 뻔한 개인의 이름이 같은 방식으로 돌아온다. 에이렌은 회복원에서 개인의 거절을 더 큰 선의 안에 넣었던 자신의 서명을 다시 읽는다.","terms":["에이렌","회복원","나래","메이","여울"],"id":"below-p2"}],"readerLayer":"commentary","reveal":true}],"sources":[],"relations":[{"target":"yeoul","label":"다른 증인의 삶","reason":"이백 년을 요약하지 않기.","evidence":{"entry":"yeoul","anchor":"years","label":"이백 년을 한 문장으로 줄이지 않기"}},{"target":"act-three","label":"다음 막","reason":"누구를 증인에서 제외할 것인가.","evidence":{"entry":"act-three","anchor":"empty","label":"세 개의 의자"}}],"spoiler":false,"era":"개원 7일 · 등대동","shortTitle":"4장","preview":"","readingMinutes":2,"requires":[],"readerCue":{"지금 따라가는 사람":"나래와 여울 · 같은 과거에서 갈라진 두 사람","이 장면에서 원하는 것":"상대가 살아온 시간을 듣는다."}},{"id":"act-three","title":"5장 — 비어 있는 의자","summary":"누가 말하고, 누구의 말까지 대신할 수 있는가.","type":"story","kind":"이야기","tags":["본편","심판","회수","귀환의 서"],"sections":[{"id":"boundary","title":"열리지 않는 경계","blocks":[{"type":"paragraph","text":"시민심판은 한 차례의 제한된 출석을 집행할 수 있도록 공동체에 예외를 요청했다. 에이렌은 반대 의견서에 자기 이름을 썼다. 그의 서명 하나가 모든 문을 잠근 것은 아니었다. 기존 권리 규칙을 바꿀 합의는 이루어지지 않았고, 라잔의 출석도 강제되지 않았다.","id":"boundary-p1","terms":["시민심판","에이렌","만경"]},{"type":"paragraph","text":"리아는 요청서 옆에 기각 사유를 붙였다. 에이렌을 끌어내리면 작동하는 비밀 열쇠는 없었다. 그녀가 바꾸려는 것은 한 사람의 의자가 아니라, 시민심판과 개인의 거절 사이에 놓인 규칙이었다.","id":"boundary-p2","terms":["에이렌","리아"]}]},{"id":"empty","title":"세 개의 의자","blocks":[{"type":"paragraph","text":"피고석은 비어 있었다. 증언석에는 나래와 여울의 의자가 각각 놓였다. 둘을 같은 사람이라고 한 의자에 번갈아 앉히지 않았다. 분기 이전의 삶에 대해 두 사람이 당사자라는 사실과, 두 증언이 독립된 두 사건을 증명하는 것은 아니라는 사실을 함께 적었다.","id":"empty-p1","terms":["나래","분기","여울"]},{"type":"paragraph","text":"심판관은 여울에게 용서장 때문에 피해 사실에 대한 평가도 달라졌는지 물었다. 여울은 아니라고 답했다. 나래에게는 여울의 용서를 철회시켜야 자신의 요구가 성립하는지 물었다. 나래도 아니라고 답했다.","id":"empty-p2","terms":["나래","여울"]}]},{"id":"ria","title":"자기 문장을 읽는 사람","blocks":[{"type":"paragraph","text":"리아는 자신의 합의문을 읽었다. 서안이 밖으로 나온 것은 좋은 일이었다고 말했다. 그 좋은 결과로 공동 민원을 종결한 것은 잘못이었다고도 말했다. 둘 중 하나를 지우지 않은 진술이었다.","id":"ria-p1","terms":["리아","서안"]},{"type":"paragraph","text":"나래는 공동 명령 기록을 확인하고 가족 대화의 비공개 범위를 유지했다. 더 감동적인 장면을 만들기 위해 그 경계를 열지 않았다. 라잔의 책임은 피해자가 얼마나 잘 울 수 있는지에 달리지 않았다.","id":"ria-p2","terms":["나래","라잔"]}]},{"id":"verdict","title":"두 도장만 찍는다","blocks":[{"type":"paragraph","text":"라잔의 명령과 강제 격리에 대한 공적 책임이 인정되었다. 불출석을 유죄의 증거로 더하지는 않았다. 확인된 명령이 판단의 근거였다. 그의 개인 세계에는 형벌을 이유로 생존 조건을 빼앗는 조치가 취해지지 않았다.","id":"verdict-p1","terms":["개인 세계","공적 책임","라잔"]},{"type":"paragraph","text":"우체국은 판정문에 발송과 공개 기록 도장을 찍었다. 라잔이 읽거나 동의했다는 도장은 찍지 않았다. 누구도 완료되지 않은 일을 완료되었다고 인쇄하지 않았다.","id":"verdict-p2","terms":["라잔"]}]},{"id":"next","title":"같은 무대에 다른 결말","blocks":[{"type":"paragraph","text":"심판이 끝난 뒤 결이 다음 무대의 문구를 가져왔다. ‘이제 모두 돌아왔다’는 문장에는 취소선이 그어져 있었다. 여울과 나래에게는 서로 다른 발언 시간이 배정되어 있었다.","id":"next-p1","terms":["환대회","나래","라잔","여울"]},{"type":"paragraph","text":"나래는 배치도를 보다가 라잔의 이름이 없는 자리를 손끝으로 짚었다. “그 사람의 답은 없네요.” 리아는 없다고 말했다. 답이 온 것처럼 다음 순서를 진행하지는 않겠다고 덧붙였다.","id":"next-p2","terms":["나래","리아"]}]},{"id":"light","title":"관객에게 돌아간 빛","blocks":[{"type":"paragraph","text":"메이는 인계장 원본의 복사본을 챙겼다. 그날 밤 읽을 범위를 자기가 골랐다. 결은 기념 무대가 판정에 대한 전원 찬성처럼 보이지 않도록 안내문을 다시 썼다.","terms":["당직 인계장","나래","라잔","메이","여울"],"id":"light-p1"},{"type":"paragraph","text":"관객 모두가 한목소리로 답하는 순서가 빠졌다. 삼박등 담당자가 밝은 관람석과 안전등은 그대로 두겠다고 확인했다. 저녁까지 몇 시간이 남아 있었다.","terms":["삼박등"],"id":"light-p2"}]}],"sources":[],"relations":[{"target":"deep-forgive","label":"두 의자의 뜻","reason":"대표가 아니라 당사자.","evidence":{"entry":"deep-forgive","anchor":"payoff","label":"떡밥의 뒷면 · 대표를 정하지 않는 두 의자"}},{"target":"last-scene","label":"마지막 장면","reason":"다음 증언자.","evidence":{"entry":"last-scene","anchor":"room","label":"늦은 오후의 기록실"}}],"spoiler":false,"era":"개원 30일 오전 · 시민심판","shortTitle":"5장","preview":"","readingMinutes":2,"requires":[],"readerCue":{"지금 따라가는 사람":"리아 · 요청의 제안자이자 사건 당사자","이 장면에서 원하는 것":"어느 증언도 원하는 결론에 맞춰 지우지 않으려 한다."}},{"id":"festival-night","title":"종장 — 여기에 사람들이 있다","summary":"사람들이 같은 광장에 모인다. 마지막 순서는 아직 고치는 중이다.","type":"story","kind":"작중 장면","tags":["귀환의 서"],"sections":[{"id":"before","title":"태양을 끄는 데 동의한 사람들","blocks":[{"type":"paragraph","text":"도시를 어둡게 하자는 결정은 이미 관객들에게 안내되어 있었다. 밝은 관람석은 남았고, 거리의 안전등은 꺼지지 않았다. 메이는 거대한 원반이 천천히 빛을 줄이는 동안 작은 삼박등을 보았다. 자신이 기억하는 빛은 원래 저 정도 크기였다.","terms":["삼박등","메이"],"id":"before-p1"},{"type":"paragraph","text":"결이 마지막 대본을 찢는 장면은 없었다. 대본은 고쳐서 사용했다. 누군가의 뜻을 존중하는 일이 언제나 극적인 파괴처럼 보여야 하는 것은 아니었다. 다만 완벽한 합창으로 끝나던 순서는 사라졌다.","terms":[],"id":"before-p2"}]},{"id":"names","title":"열일곱 칸의 독백","blocks":[{"type":"paragraph","text":"메이는 인계장을 읽었다. 집에 가겠소라는 뒷문장까지 읽자 사람들 사이에서 작은 웃음이 일었다. 메이는 그 웃음이 싫지 않았다. 자기 삶이 처음으로 농담을 견딜 만큼 가까워진 느낌이었다.","terms":["메이"],"id":"names-p1"},{"type":"paragraph","text":"그녀는 기관사 유란과 의료진, 공간을 내준 승객들의 이름을 불렀다. 구조받은 열일곱 사람의 이후 직업을 위대한 업적처럼 소개하지 않았다. 어떤 사람은 이름을 공개하지 않기로 했다고만 했다. 빈칸은 아직 완성되지 않은 실패가 아니라, 그 사람이 고른 사생활이었다.","terms":["빈칸","유란"],"id":"names-p2"},{"type":"dialogue","text":"그분들이 나중에 훌륭한 사람이 되었기 때문에 구한 건 아닙니다. 저는 그걸 확인하러 돌아오지 않았어요.","terms":[],"speaker":"메이","id":"names-p3"}]},{"id":"two","title":"한목소리로 끝나지 않는 밤","blocks":[{"type":"paragraph","text":"여울은 용서장을 읽었다. 나래는 자기 차례에 긴 말을 하지 않았다. 나는 아직 용서하지 않았습니다. 그러고는 무대의 다른 쪽에 앉았다. 박수가 두 번 나뉘었다. 관객 일부는 둘 다에게 쳤고 일부는 한 사람에게만 쳤다. 그 표정을 서로 똑같게 만드는 일은 하지 않았다.","terms":["나래","여울"],"id":"two-p1"},{"type":"paragraph","text":"리아가 기대한 라잔의 응답은 끝내 오지 않았다. 기록실은 책임을 인정했고, 개인 세계의 라잔은 자기 시민들에게 환영받았다. 객석의 나래는 그 사실을 알았다. 오늘의 무대가 충분하지 않다는 마음도 더는 축제의 금지된 손님이 아니었다.","terms":["개인 세계","나래","라잔","리아"],"id":"two-p2"}]},{"id":"signal","title":"여기에 사람들이 있다","blocks":[{"type":"paragraph","text":"삼박등이 세 번 빛났다. 메이는 이번에는 하늘을 보지 않고 객석을 보았다. 신이 누군가를 선택하는 신호가 아니었다. 배에서 서로를 놓치지 않기 위해 보냈던 신호였다.","terms":["삼박등","메이"],"id":"signal-p1"},{"type":"paragraph","text":"서안의 연주는 마지막 쉼표를 길게 놓았다. 에이렌은 그동안 아무 말도 하지 않았다. 누구도 그가 영원한 구원자로 남겠다고 약속할 때까지 음악을 멈춰두지 않았다.","terms":["에이렌","서안"],"id":"signal-p2"},{"type":"paragraph","text":"메이는 먼저 일어났다. 내일 돌아올 거냐는 질문에 아직 모르겠다고 답했다. 그러고도 누군가는 그녀에게 문을 열어주었다.","terms":["메이"],"id":"signal-p3"}]}],"sources":[],"relations":[{"target":"deep-messiah","label":"뒷문장의 회수","reason":"집에 가겠다는 말이 수백 년 뒤에 다시 나온다.","evidence":{"entry":"deep-messiah","anchor":"payoff","label":"먼 훗날, 뒷문장이 에이렌에게 돌아온다"}}],"era":"개원 30일 밤 · 귀환제의 마지막 무대","spoiler":false,"shortTitle":"종장","preview":"","readingMinutes":2,"requires":[],"readerCue":{"지금 따라가는 사람":"귀환제의 손님들","이 장면에서 원하는 것":"각자의 이름으로 마지막 무대를 맞는다."}},{"id":"last-scene","title":"6장 — 다음 증언자","summary":"리아가 도장을 정리할 때, 에이렌이 자기 이름의 통지서를 가져온다.","type":"story","kind":"이야기","tags":["마지막 대사","에이렌","미결","귀환의 서"],"sections":[{"id":"room","title":"늦은 오후의 기록실","blocks":[{"type":"paragraph","text":"나래와 여울이 먼저 나갔다. 두 사람은 저녁에 다시 만나기로 했다. 어느 쪽도 상대에게 용서할지 말지 미리 정하고 오라고 하지 않았다.","id":"room-p1","terms":["나래","여울"]},{"type":"paragraph","text":"리아는 책상 위 도장을 정리했다. 도착. 열람. 동의. 같은 모양의 손잡이였지만 바닥의 글자는 달랐다. 에이렌은 자기 이름이 적힌 출석 통지서를 들고 들어왔다.","id":"room-p2","terms":["에이렌","리아"]}]},{"id":"dialogue","title":"이겨도 끝나지 않는 것","blocks":[{"type":"dialogue","speaker":"리아","text":"그 사람은 잘 지내겠지.","id":"dialogue-p1","terms":[]},{"type":"dialogue","speaker":"에이렌","text":"그래.","id":"dialogue-p2","terms":[]},{"type":"dialogue","speaker":"리아","text":"우리가 무슨 말을 했는지 듣지 않고도.","id":"dialogue-p3","terms":[]},{"type":"dialogue","speaker":"에이렌","text":"그것도 가능해.","id":"dialogue-p4","terms":[]},{"type":"paragraph","text":"리아는 처음으로 듣는 대답처럼 화내지 않았다. 처음부터 알고 있었기에 아직 반대할 수 있었다.","id":"dialogue-p5","terms":["리아"]},{"type":"dialogue","speaker":"리아","text":"그래도 오늘은 남의 편지를 내 결말로 쓰지 않았어.","id":"dialogue-p6","terms":[]},{"type":"dialogue","speaker":"에이렌","text":"너도, 나도.","id":"dialogue-p7","terms":[]},{"type":"dialogue","speaker":"리아","text":"이게 끝이라고는 생각하지 않아. 사람을 낙원에서 쫓아내지 않고도, 자기 일에 답하게 할 길을 찾을 거야.","id":"dialogue-p8","terms":[]},{"type":"paragraph","text":"에이렌은 종결 도장 옆에 놓인 작은 빈칸을 보았다. 오래전 구조 명부에서 보았던 여백과 닮아 있었다. 아직 답을 쓰지 않았다는 이유로 사람부터 버릴 필요는 없었다.","id":"dialogue-p9","terms":["에이렌","빈칸"]}]},{"id":"line","title":"마지막 선언","blocks":[{"type":"quote","text":"그대들의 낙원이 더 많은 이를 구할 수 있다면, 직접 내 앞길을 끊어내라.","attribution":"에이렌 베일","id":"line-p1","terms":[]},{"type":"paragraph","text":"그는 자신의 이름이 적힌 의자에 앉았다. 리아는 연장 승인서의 첫 장을 폈다. 그가 오늘 구한 사람의 수가 아니라, 그날 서명한 이유를 묻기 위해서였다.","id":"line-p2","terms":["리아"]},{"type":"paragraph","text":"바깥에서 서안이 저녁 공연을 연습하고 있었다. 긴 쉼표가 왔다. 에이렌은 조용해진 창 쪽을 한 번 보고, 다시 리아의 질문을 기다렸다.","id":"line-p3","terms":["서안"]}]},{"id":"meaning","title":"대사의 뒷면","blocks":[{"type":"paragraph","text":"그대들은 더 나은 사회를 만들 능력이 없는 피해자가 아니라, 다른 구원의 방식을 실제로 세우겠다고 나선 상대를 가리킨다. 피해자가 대안을 제시하지 못한다고 말할 권리를 잃는 것은 아니다.","id":"meaning-p1","terms":[]},{"type":"paragraph","text":"더 많은 이는 인격을 복제해서 표를 늘리라는 말이 아니다. 지금의 구원이 닿지 않은 요구까지 보라는 도전이다. 그 도전이 진심인지는 에이렌이 자기 이름으로 다음 질문을 받는 행동으로 확인된다.","id":"meaning-p2","terms":["에이렌"]}],"reveal":true,"readerLayer":"commentary"},{"id":"inherited-line","title":"그 마지막 선언은 처음 쓰인 문장이 아니었다","blocks":[{"type":"paragraph","text":"에이렌의 선언은 아벨이 자기 재판에서 남긴 문장과 같다. 하지만 지금 에이렌은 더 좋은 낙원을 아직 완성하지 못한 사람에게도 자신을 묻고 비판할 자리를 열어둔다. 반대를 허용한 채 앉는 의자가, 같은 말을 다른 약속으로 만든다.","id":"inherited-line-p1","terms":["에이렌","아벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"문장의 앞선 주인","entry":"deep-lastwords"}],"id":"inherited-line-p2"}],"reveal":true,"readerLayer":"commentary"}],"sources":[],"relations":[{"target":"deep-carrier","label":"도장과 빈칸","reason":"남겨두는 물건들.","evidence":{"entry":"deep-carrier","anchor":"payoff","label":"떡밥의 뒷면 · 찢어진 봉투의 역할"}},{"target":"future-offduty","label":"먼 미래","reason":"다른 방식의 퇴장.","evidence":{"entry":"future-offduty","anchor":"door","label":"한 사람만 통과하지 못한 출구"}},{"target":"inheritance-war","label":"이전 세대의 선택","reason":"지금의 제도가 만들어진 이유를 앞선 사건에서 확인한다.","evidence":{"entry":"inheritance-war","anchor":"network","label":"한 줄 계보 대신 충돌하는 연결"}}],"spoiler":false,"era":"개원 30일 오후 · 기록실","shortTitle":"6장","preview":"","readingMinutes":1,"requires":[],"readerCue":{"지금 따라가는 사람":"에이렌과 리아 · 함께 개혁했던 동료","이 장면에서 원하는 것":"자신의 행동에 관한 질문을 앞두고 다시 만난다."}},{"id":"synopsis","title":"귀환의 서 — 전체 줄거리","summary":"세 장의 서류가 도시의 창세기를 흔든다. 진짜 낙원을 지키면서, 그 낙원의 정답이 되기를 거부하는 사람들.","type":"story","kind":"작중 장면","tags":[],"sections":[{"id":"opening","title":"서장 · 내 글씨로 온 편지","blocks":[{"type":"paragraph","text":"나래는 자기의 다른 갈래 여울이 이백 년을 살고 쓴 진짜 용서장을 받는다. 같은 날 라잔의 낙원 입주 신청과 시민심판 출석 거부가 도착한다. 리아가 두 서류를 에이렌 앞에 놓는 순간, 부활한 창건자 메이 란이 찾아온다. 그녀는 미리 홍보된 귀환 서약을 취소해달라고 한다. 모두 귀환제에 초대된 손님이지만, 준비된 역할에는 동의하지 않았다.","terms":["메이 란","시민심판","귀환제","에이렌","나래","라잔","리아","메이","여울"],"id":"opening-p1"}]},{"id":"past","title":"1부 · 성녀의 인계장","blocks":[{"type":"paragraph","text":"메이는 신전에서 자신의 당직 인계장을 예언으로 해석한 비문을 본다. 다음 사람이 오면 문을 넘겨주시오 뒤의 나는 집에 가겠소가 빠져 있다. 자료는 즉시 확인된다. 중요한 것은 위조범 추적이 아니라 그 신화가 실제로 도왔던 사람들과 어떻게 다시 이야기하느냐이다. 환대회 대표 결은 그 기념관 덕에 집과 교육을 얻었다.","terms":["당직 인계장","환대회","메이"],"id":"past-p1"}]},{"id":"people","title":"2부 · 태양 아래의 사람들","blocks":[{"type":"paragraph","text":"공개 기록을 확보한 리아와 메이, 결이 세 배의 선체 아래에서 만난다. 172년 전 구조 항해의 이야기가 교차한다. 신의 눈이라는 태양이 원래 여기에 사람이 있다는 조난 신호였음이 드러난다. 열일곱 명은 선택된 인물이 아니라 이름을 적기 전에 구해야 했던 사람이었다. 메이가 원한 후일은 영원한 당직이 아니었다.","terms":["리아","메이"],"id":"people-p1"},{"type":"paragraph","text":"나래와 여울은 같은 부엌에서 다른 간의 국을 먹는다. 미래에서 온 정답이 아니라 옆집에서 오래 산 타인과의 만남이다. 리아는 여울의 용서를 숨기려 했던 자신을, 에이렌은 여울의 행복으로 나래까지 설득하려 했던 자신을 돌아본다. 둘 다 사랑하는 사람이 자기 주장을 지지하지 않을 수 있음을 배운다.","terms":["에이렌","나래","리아","여울"],"id":"people-p2"}]},{"id":"offer","title":"3부 · 응답의 가격","blocks":[{"type":"paragraph","text":"라잔은 심판이 아니라 화해식이라면 등장하겠다고 제안한다. 여울의 용서와 메이의 귀환이 새 시대의 종결 선언이 되는 조건이다. 실제 라잔을 만나고 싶었던 리아에게는 유혹이다. 에이렌은 라잔의 보호를 유지하되 그 조건에는 반대한다. 둘은 함께 제안을 거절한다. 구제를 받았다는 이유로 다른 사람의 입을 다물게 하던 등대동 합의를 반복하지 않는다.","terms":["등대동","에이렌","라잔","리아","메이","여울"],"id":"offer-p1"}]},{"id":"hearing","title":"4부 · 세 개의 의자","blocks":[{"type":"paragraph","text":"리아가 요청한 강제 출석은 성사되지 않는다. 피고석은 비고 나래와 여울은 각자의 의자에 앉는다. 증언은 같은 사건에 관한 두 독립 당사자의 말로 다루되, 같은 기억을 숫자로 두 배 부풀리지 않는다. 사생활을 공개하지 않고도 남은 공적 명령으로 라잔의 책임을 판단한다. 사과를 얻지 못한 사실도 판정문 밖에서 지워지지 않는다.","terms":["나래","라잔","리아","여울"],"id":"hearing-p1"}]},{"id":"ending","title":"종장 · 성녀가 먼저 집에 간 밤","blocks":[{"type":"paragraph","text":"개원 30일 오후, 에이렌은 자신의 과거 연장 승인에 관해 증언하러 온다. 리아는 낙원을 닫지 않고도 책임 있는 응답을 얻을 방법을 찾겠다고 말한다. 에이렌은 자기 계획을 비판할 자리를 열어둔 채 마지막 선언을 하고 의자에 앉는다.","terms":["에이렌","리아"],"id":"ending-p2"},{"type":"quote","text":"그대들의 낙원이 더 많은 이를 구할 수 있다면, 직접 내 앞길을 끊어내라.","terms":[],"attribution":"에이렌","id":"ending-p3"},{"type":"paragraph","text":"같은 날 밤, 결은 축제를 열되 모두가 같은 결말에 도달했다는 선언을 철회한다. 메이는 인계장의 뒷문장을 읽고 동료들의 이름을 돌려준다. 여울은 용서장을 읽고 나래는 아직 용서하지 않았다고 말한다. 주간 원반이 빛을 줄이고 조난등이 관객에게 신호를 보낸다. 다른 사람의 낙원은 꺼지지 않는다.","terms":["개인 세계","나래","라잔","메이","여울"],"id":"ending-p1"},{"type":"paragraph","text":"메이는 먼저 집으로 간다. 다른 사람도 자신의 역할에서 일어설 수 있다는 작은 선례가 된다. 240년 뒤, 에이렌은 비슷한 인계장을 쓴다.","terms":["에이렌","메이"],"id":"ending-p4"}]}],"sources":[],"relations":[{"target":"prologue","label":"첫 장면","reason":"내 글씨로 온 편지.","evidence":{"entry":"prologue","anchor":"envelope","label":"첫 문장"}},{"target":"future-museum","label":"먼 훗날","reason":"누가 영웅담을 남기는가.","evidence":{"entry":"future-museum","anchor":"poster","label":"낯익은 이름의 공연"}}],"spoiler":true,"shortTitle":"귀환의 서","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"world-route","title":"해원의 다섯 문턱 — 배 속에서 하늘까지","summary":"선체, 부엌, 서고, 항구, 태양. 장소를 이동할 때마다 같은 말의 주어가 달라진다.","type":"world","kind":"세계 설정","tags":[],"sections":[{"id":"rib","title":"선체 아래 · 이름보다 먼저 놓인 침대","blocks":[{"type":"paragraph","text":"세 척의 선체가 맞닿는 낮은 곳은 늑골길이다. 침수 방지 칸막이는 투명한 관람 바닥 아래 보존된다. 본편의 전능한 시대에는 안전 위험을 연출하지 않는다. 과거 장면에서만 칸막이가 생사와 직결된다. 지금은 생활을 지탱했던 보통 기술과 그 위에 덧붙은 신화를 함께 읽는 길이다.","terms":["늑골길"],"id":"rib-p1"}]},{"id":"kitchen","title":"등대동 · 오늘의 잼","blocks":[{"type":"paragraph","text":"등대동 부엌은 창건 기념관의 맞은편에 있다. 잼병에는 오늘이라고만 적혀 있다. 다음 승급을 하면 주겠다는 약속의 반대말이다. 공동 부엌에서 일하고 싶은 사람은 일하지만 식사권을 얻기 위해 노동을 증명할 필요는 없다. 식사의 감사와 노동의 보상은 각자 논의하고, 굶김으로 집행하지 않는다.","terms":["등대동"],"id":"kitchen-p1"}]},{"id":"book","title":"디케 서고 · 서로 다른 정전","blocks":[{"type":"paragraph","text":"서고 위층에는 시민들이 공식 기록으로 채택한 정전(正典)이 있다. 아래층에는 항로의 정전(停電) 때 남은 업무 기록이 있다. 한자 표기의 겹침은 이 작품의 언어적 장치이며, 두 단어의 실제 어원이 같다는 주장은 아니다. 두 층을 오가는 엘리베이터에는 정전 중에도 운행한다고 적혀 있다.","terms":["정전"],"id":"book-p1"}]},{"id":"water","title":"미결 항구 · 돌아왔지만 같지는 않은 사람","blocks":[{"type":"paragraph","text":"항구의 바다는 원하는 색으로 보일 수 있지만 배의 접안 위치는 이용자들이 함께 정한 실제 공간이다. 서로 다른 조명을 보고 있어도 같은 사람의 손을 잡을 수 있다. 도착·열람·동의 도장을 따로 쓰는 미결 우체국이 이곳에 있다. 첫 안내문은 집 주소가 바뀌었어도 귀환할 수 있다고 말한다.","terms":["미결 우체국"],"id":"water-p1"}]},{"id":"sky","title":"상층 · 비어 있어도 꺼지지 않는 자리","blocks":[{"type":"paragraph","text":"기후막 위의 전망대에는 창건 기념 조명을 조절하던 좌석이 남아 있다. 도시 운영은 분산되어 이 의자에 누가 앉았는지와 관계없이 계속된다. 왕좌처럼 보이는 좌석이지만 실제로는 교대가 가능했던 작업 의자다. 240년 뒤 에이렌이 일어나는 마지막 장면은 여기와 상담실을 겹쳐 보여준다.","terms":["에이렌"],"id":"sky-p1"}]}],"sources":[],"relations":[],"shortTitle":"해원의 다섯 문턱","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"haewon","title":"해원 — 배 위에 지은 도시","summary":"중앙의 높은 청사와 낮은 식탁이 같은 난파선의 역사를 나눠 가진다.","type":"world","kind":"세계 기록","tags":["지리","생활","이름"],"sections":[{"id":"harbor","title":"세 겹의 항구","blocks":[{"type":"paragraph","text":"해원은 북쪽 만의 방파제를 따라 길게 자란 항구도시다. 오래된 선체 위에 건물을 올렸기 때문에 골목은 배의 복도를 닮았고, 어떤 지하 창고의 벽에는 아직 객실 번호가 남아 있다. 바깥 만에는 다른 정착지로 가는 배가, 안쪽 만에는 만경의 문들이 줄지어 있다.","id":"harbor-p1","terms":["만경","해원"]},{"type":"paragraph","text":"도시의 낮은 곳에는 등대동의 식탁, 중간 층에는 미결 우체국과 시장, 가장 높은 배급선의 함교에는 공헌청 본관이 있다. 사람은 높이 올라갈수록 더 먼 바다를 보지만, 저녁 냄새에서는 멀어진다.","id":"harbor-p2","terms":["미결 우체국","공헌청","등대동"]}]},{"id":"streets","title":"세 길을 걸으면 세계가 보인다","blocks":[{"type":"paragraph","text":"등대길에는 문짝이 없는 가게가 많다. 비가 새서가 아니라 손님을 안에서 심사하지 않겠다는 공동체의 농담이다. 개인 집에는 여전히 잠글 수 있는 문이 있다. 환대와 사생활을 같은 것으로 취급하지 않는다.","id":"streets-p1","terms":[]},{"type":"paragraph","text":"본관 아래 승급거리에는 더 이상 필요 없는 학원 간판이 남아 있다. 일부는 연습실로 바뀌었고, 일부는 경쟁을 좋아하는 사람들이 계속 쓴다. 폐쇄가 정답이 아니라 참가 여부가 삶의 등급을 정하지 않게 된 것이 변화다.","id":"streets-p2","terms":[]},{"type":"paragraph","text":"항구 끝 재회역에서는 열차를 기다리는 시간이 세계마다 다르다. 표에는 ‘오후 여섯 시’만 적지 않는다. 누구의 여섯 시인지, 도착하면 누구를 만나는지도 적는다.","id":"streets-p3","terms":["재회역"]}]},{"id":"food","title":"오늘의 잼","blocks":[{"type":"paragraph","text":"해원의 빵집들은 하루치 잼을 ‘오늘의 잼’이라고 판다. 옛 회복원의 식단판에는 자립 준비가 끝나면 원하는 식사를 고를 수 있다고 쓰여 있었다. 준비가 끝나는 날은 늘 다음 심사 이후였다.","id":"food-p1","terms":["오늘의 잼","회복원","해원"]},{"type":"paragraph","text":"등대동의 식탁은 어느 날부터 빵보다 먼저 잼을 내놓았다. 서안이 농담 삼아 붙인 이름이 남았다. 주문하려는 사람에게는 빵 종류를 묻지만, 오늘 무엇을 이루었는지는 묻지 않는다.","id":"food-p2","terms":["등대동","서안"]}]},{"id":"name","title":"도시 이름의 두 번째 뜻","blocks":[{"type":"paragraph","text":"정착 헌장의 해원은 海垣, 바다의 담이라는 작중 이름이다. 후대 주민들은 원한을 푼다는 다른 단어 해원과 겹쳐 읽는다. 두 한자 표기를 같은 어원이라고 주장하지는 않는다.","id":"name-p1","terms":["해원"]},{"type":"paragraph","text":"라잔에게 도시는 지켜낸 담이었다. 리아에게 도시는 안에서 무슨 일이 있었는지 다시 묻는 자리다. 나래는 어느 쪽 설명보다 국이 식지 않는 시간이 먼저라고 말한다.","id":"name-p2","terms":["나래","라잔","리아"]}]},{"id":"sun","title":"신의 눈 아래의 도시","blocks":[{"type":"paragraph","text":"해원의 기념 조명 삼박등은 옛 조난 신호에서 유래했다. 무명관은 그 빛 아래 세워진 기념관이자 생활 지원 기관이다. 도시 아래의 늑골길을 내려가면 신전의 시와 선박의 정비 기록을 같은 장소에서 읽을 수 있다.","terms":["늑골길","무명관","삼박등","해원"],"id":"sun-p1"}]}],"sources":[],"relations":[{"target":"fleet","label":"도시의 바닥","reason":"세 배 위의 기관들.","evidence":{"entry":"fleet","anchor":"relic","label":"항구의 바닥 아래"}},{"target":"deep-jam","label":"식탁의 농담","reason":"오늘의 잼을 먼저 내는 이유.","evidence":{"entry":"deep-jam","anchor":"meal","label":"작중 연결 · 회복원이 빼앗은 오늘"}}],"spoiler":false,"shortTitle":"해원","preview":"옛 구조선 위에 지어진 항구도시. 본편이 시작되는 곳.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"sun","title":"삼박등 — 신의 눈이라고 불린 조난등","summary":"해원의 태양은 사람을 내려다보지 않는다. 원래는 사람들을 찾아달라고 깜빡였다.","type":"world","kind":"세계 설정","tags":[],"sections":[{"id":"view","title":"아침마다 세 번","blocks":[{"type":"paragraph","text":"해원의 하늘에는 자연광을 모으는 기후막과 도시의 주간 조명이 함께 있다. 시민이 태양이라 부르는 큰 원반은 낮의 표식이다. 조도는 지역별 생활에 맞춰 조절되고, 옛 광원 없이도 도시의 생활은 유지된다. 신전 옥상의 삼박등은 그 원반과 연결된 창건 기념 신호다.","terms":["삼박등","해원"],"id":"view-p1"},{"type":"paragraph","text":"기념일에는 세 번, 간격을 두고 빛난다. 학교에서 아이들은 신이 도시를 세 번 돌아본다는 노래를 배운다. 지금은 누구도 그 빛으로 생각을 읽거나 인격을 심사하지 않는다. 실제 감시 장치를 이름만 신앙으로 포장한 설정이 아니다.","terms":[],"id":"view-p2"}]},{"id":"origin","title":"보는 눈에서 보아달라는 눈으로","blocks":[{"type":"paragraph","text":"삼박등의 첫 용도는 조난 위치 표시였다. 신호의 방향은 위에서 아래가 아니라 아래에서 바깥이었다. 우리가 여기 있다는 알림이, 오랜 기념과 해설을 거쳐 누군가 우리를 지켜본다는 위로가 되었다.","terms":["삼박등"],"id":"origin-p1"},{"type":"paragraph","text":"그 위로가 거짓 삶을 만든 것은 아니다. 재난 뒤 잠들지 못하던 아이는 깜빡이는 빛을 보고 안심할 수 있었다. 그러나 남의 삶을 감독하는 공헌청이 그 상징을 쓰기 시작하자, 지켜본다는 말은 돌봄과 감시 사이를 오갔다.","terms":["공헌청"],"id":"origin-p2"}]},{"id":"relic","title":"유물이 남긴 노동","blocks":[{"type":"paragraph","text":"삼박등의 본체에는 다섯 종류의 나사가 남아 있다. 서로 다른 세 배와 두 구명정에서 부품을 가져왔기 때문이다. 신전에 걸린 정교한 태양 문양에는 그 불균형이 없다. 기록실에서는 다섯 나사를 따로 전시한다.","terms":["삼박등"],"id":"relic-p1"},{"type":"paragraph","text":"에이렌은 진짜 광원을 즉시 복원할 수 있다. 전시하는 까닭은 복원이 불가능해서가 아니라, 누가 무엇을 했는지 함께 볼 수 있는 물건이기 때문이다. 원본에 초자연적 진실 보증을 부여하지 않는다.","terms":["에이렌"],"id":"relic-p2"}]},{"id":"night","title":"마지막 밤에 불을 끈 사람","blocks":[{"type":"paragraph","text":"귀환제 마지막 밤, 주민들은 잠깐 주간 원반만 끄기로 한다. 주거, 의료, 이동과 안전 조명은 그대로다. 어둠을 원치 않는 관객은 밝은 관람 구역을 선택한다. 창건자의 인간적인 과거를 보여주기 위해 다른 사람의 생활을 위험하게 만들지는 않는다.","terms":["귀환제"],"id":"night-p1"},{"type":"paragraph","text":"남은 작은 삼박등이 예전 신호를 보낸다. 여기에 사람들이 있다. 에이렌의 연설을 비추던 빛이 객석의 사람들을 향한 초대가 된다.","terms":["삼박등","에이렌"],"id":"night-p2"}],"reveal":true}],"sources":[],"relations":[{"target":"deep-well","label":"눈의 방향","reason":"하늘의 시선에서 아래의 구조 요청으로.","evidence":{"entry":"deep-well","anchor":"verb","label":"지켜본다는 말의 두 손"}}],"shortTitle":"삼박등","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"festival","title":"귀환제 — 출연하지 않아도 입장할 수 있는 축제","summary":"환대회가 여는 한 달. 사람을 맞이하는 행사가 사람의 결말을 정하는 행사로 바뀌는 순간.","type":"world","kind":"세계 설정","tags":[],"sections":[{"id":"calendar","title":"한 달의 순서","blocks":[{"type":"paragraph","text":"첫 주에는 재회역과 부활 안내소가 손님을 맞는다. 둘째 주에는 도시와 개인 세계를 방문하고, 셋째 주에는 공동 기록과 작품을 공개한다. 마지막 주에는 오래전부터 준비한 시민심판과 별도의 기념 무대가 열린다. 재판을 받거나 증언하는 일이 축제의 참가 조건은 아니다.","terms":["개인 세계","시민심판","재회역"],"id":"calendar-p1"},{"type":"paragraph","text":"환대회는 숙소를 주는 사설 관청이 아니라 공개 행사의 운영자다. 결 로안은 무대와 행사 홍보를 결정할 수 있지만 누구의 개인 세계도 닫을 수 없다. 국가는 이미 개인의 발언권을 기여도에서 분리했다. 새 갈등은 옛 제도가 하나도 고쳐지지 않아 생긴 것이 아니다.","terms":["개인 세계","결 로안","환대회"],"id":"calendar-p2"}]},{"id":"stage","title":"네 개의 자리는 네 개의 권한이 아니다","blocks":[{"type":"paragraph","text":"결의 첫 대본에는 창건자 메이, 창조권의 대표 에이렌, 용서한 생존자 여울, 시민 대표 리아가 있었다. 실제로 네 사람에게 참여를 문의했지만 세부 발언의 범위는 확인하기 전에 홍보에 넣었다. 이 편리한 압축이 문제를 만든다. 대표 인물을 모았다는 이유만으로 모든 시민의 마음이 대표되지는 않는다.","terms":["에이렌","창조권","리아","메이","여울"],"id":"stage-p1"},{"type":"paragraph","text":"리아는 행사를 폭파하지 않는다. 메이는 자신의 출연 조건을, 나래는 자기 이야기를 쓰는 범위를, 여울은 자기 편지를 읽을 권리를 각각 주장한다. 결은 실제의견이 다른 네 사람을 어떻게 한 무대에 놓을지 다시 고민한다.","terms":["나래","리아","메이","여울"],"id":"stage-p2"}]},{"id":"cost","title":"행사 하나가 왜 중요한가","blocks":[{"type":"paragraph","text":"귀환제는 실제 시민들이 함께 보는 첫 대규모 새 시대 기념이다. 다른 세계에서 다른 행사를 만들 수 있어도, 여기 만난 이웃들의 공동 기억을 그것으로 대신할 수는 없다. 반대로 이 행사에 불참한 사람에게 이 무대가 우주의 유일한 역사라고 주장할 수도 없다.","terms":["귀환제"],"id":"cost-p1"},{"type":"paragraph","text":"패배해도 삶이 파괴되지 않는다는 사실이 모든 선택을 무의미하게 만들지는 않는다. 나래는 여기 있는 이웃에게 말하고 싶다. 결은 여기 오는 손님에게 환영을 전하고 싶다. 같은 자리를 선택했으므로 갈등하고, 끝까지 함께하겠다는 선택은 철회할 수 있다.","terms":["나래"],"id":"cost-p2"}]}],"sources":[],"relations":[],"shortTitle":"귀환제","preview":"일반 개원을 기념하며 한 달 동안 열리는 만남의 축제. 이용 자격을 심사하는 행사가 아니다.","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"society","title":"공헌청 — 풍요가 서열을 없애지 못한 이유","summary":"평가는 재능을 발견하는 도구에서, 권력을 물려주는 절차가 됐다.","type":"world","kind":"세계 설정","tags":["사회 구조","권력","경쟁"],"sections":[{"id":"origin","title":"처음에는 필요한 기관이었다","blocks":[{"type":"paragraph","text":"연방의 복구기에는 수리 인력과 장비가 부족했다. 공헌청은 제한된 자원을 어디에 보낼지 정하기 위해 공헌 등급을 만들었다. 라잔의 부모 세대는 실제로 배급과 복구를 이끌었다. 제도는 처음부터 아무 이유 없는 악의로 출발하지 않았다.","id":"origin-p1","terms":["공헌 등급","공헌청","라잔"]}]},{"id":"change","title":"물건은 풍부해졌지만, 결정하는 자리는 그대로였다","blocks":[{"type":"paragraph","text":"자동화 이후 기본 주거와 식량, 치료는 충분해졌다. 그러나 공적인 의제를 올리는 권리, 중앙 전시망에 소개되는 순서, 예산을 정하는 자리는 여전히 공헌 등급에 묶였다. 모두가 먹을 수는 있었지만, 모두가 같은 무게로 말할 수는 없었다.","id":"change-p1","terms":["공헌 등급"]},{"type":"paragraph","text":"평가관은 상위 등급에서 선발됐다. 그들은 자신이 관리하는 자동화 시설의 성과를 기여로 인정하고, 작은 공동체의 돌봄이나 취미 활동은 대체 가능한 일로 분류했다. 높은 점수로 권한을 얻고, 그 권한으로 높은 점수를 정하는 구조였다.","id":"change-p2","terms":[]}]},{"id":"trap","title":"노력이 실패로 돌아오도록 설계된 부분","blocks":[{"type":"paragraph","text":"공헌청이 측정한 것은 사람에게 얼마나 소중한 일인가가 아니라, 더 효율적인 수단으로 얼마나 쉽게 대체할 수 있는가였다. 평범한 시민이 새 기술을 익히는 동안 자동화는 더 나아졌다. 공부한 사실은 남아도 승급 기준은 다시 멀어졌다.","id":"trap-p1","terms":["공헌청"]},{"type":"paragraph","text":"시민의 절반 이상이 낮은 등급에 놓였지만, 그것은 사회가 선택한 분류였다. 이 작품은 그들의 삶이 실제로 무가치해졌다고 단정하지 않는다. 서안의 음악과 나래의 식탁은 처음부터 누군가에게 중요했다.","id":"trap-p2","terms":["나래","서안"]}]},{"id":"consent","title":"왜 시민들도 한동안 지지했나","blocks":[{"type":"paragraph","text":"상위 시민만 이 제도를 지킨 것은 아니다. 자녀의 첫 승급을 기다리는 부모, 재교육 지원으로 실제 새 일을 얻은 시민, 혼란보다 익숙한 기준을 선호하는 사람도 지지했다. 제도는 작은 성공 사례를 대대적으로 알리고, 남은 실패를 개인의 사정으로 돌렸다.","id":"consent-p1","terms":[]},{"type":"paragraph","text":"공헌청은 비공식 모임 자체를 금지하지 않았다. 다만 등급 밖의 삶을 공적인 성취로 인정하지 않았다. 등대동이 문제가 된 것은 사람들이 쉬었기 때문이 아니라, 쉬는 삶도 정식으로 대표받아야 한다고 요구했기 때문이다.","id":"consent-p2","terms":["공헌청","등대동"]}]},{"id":"fall","title":"개혁은 실제로 성공했다","blocks":[{"type":"paragraph","text":"등대동 사건 이후 에이렌은 평가 자료를 공개하고, 리아는 시민 연대를 조직했다. 선거권과 기본 서비스에서 등급을 분리했고, 공헌청의 강제 회복원은 폐쇄됐다. 만경이 생기기 전에 시작한 일이다.","id":"fall-p1","terms":["등대동 사건","공헌청","등대동","에이렌","회복원","리아","만경"]},{"type":"paragraph","text":"그 뒤에도 경쟁을 즐기는 사람, 비교에 지치는 사람, 떠나고 싶은 사람이 함께 남았다. 제도를 고쳤다고 특정한 사람에게 사랑받고 싶다는 욕망까지 서로 양립하게 된 것은 아니었다. 만경은 개혁 대신 주어진 진통제가 아니라, 개혁 뒤에도 남는 선택을 넓힌 장소다.","id":"fall-p2","terms":["만경"]}]},{"id":"ledger","title":"점수는 숫자보다 생활에 오래 남는다","blocks":[{"type":"paragraph","text":"공헌 등급은 별 다섯 개로 표시됐다. 별이 적어도 집과 식량은 받았다. 대신 마을 의제의 발의 순서, 공공 공연의 소개 문구, 학교의 대표 발표자 명단이 달라졌다. 장부의 점수보다 “중요한 의견은 다음 분께”라는 말이 더 자주 사람을 다치게 했다.","id":"ledger-p1","terms":["공헌 등급"]},{"type":"paragraph","text":"공헌청은 모두가 상위권이 될 수 없다는 사실을 알고 있었다. 개인의 작은 승급은 가능하게 두면서 공적 발언 자리는 상대평가로 묶었다. 능력 있는 시민 전부가 공모한 것은 아니다. 평가권을 지닌 일부가 자신들의 결정권을 방어했고, 실제 도움받은 시민의 경험이 그 방어를 오래 지지했다.","id":"ledger-p2","terms":["공헌청"]}]},{"id":"myth","title":"왜 창건 신화가 필요한가","blocks":[{"type":"paragraph","text":"공헌청은 자신이 새로 사람을 차별한다고 설명하지 않았다. 과거 구조에 필요했던 기능과 책임을 이어받는다고 말했다. 위기 때 유효했던 우선권이 어디까지였는지 묻는 순간, 제도의 세습 근거가 흔들렸다. 라잔에게 메이의 귀환이 중요한 이유다.","terms":["공헌청","라잔","메이"],"id":"myth-p1"},{"type":"paragraph","text":"그 신화를 모두 권력자의 조작으로 돌리지는 않는다. 무명관의 돌봄과 시민의 연대에도 같은 명부가 쓰였다. 하나의 원전이 상반된 제도로 이어질 수 있다는 점이 현재의 갈등을 만든다.","terms":["무명관"],"id":"myth-p2"}]},{"id":"inheritances","title":"좋은 개혁 이후에도 남은 서열","blocks":[{"type":"paragraph","text":"요벨은 식량을 공헌의 담보에서 빼냈다. 프로네는 능력 향상의 도구를 공개했다. 그 뒤 공헌청이 지킨 것은 밥솥이 아니라 의제 발의와 결정권의 문이었다. 시민들은 공헌청의 역사를 전부 거짓으로 여기지 않으면서 그 독점을 비판할 수 있다.","id":"inheritances-p1","terms":["공헌청","프로네","요벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"풍요가 온 세 단계","entry":"before-paradise"},{"label":"도시에 남은 일곱 해법","entry":"giants-atlas"}],"id":"inheritances-p2"}]}],"sources":[],"relations":[{"target":"fleet","label":"제도의 시작","reason":"긴급 순서가 신분으로 굳어진다.","evidence":{"entry":"fleet","anchor":"inheritance","label":"승선 순서가 성적표가 되다"}},{"target":"last-shift","label":"생활 속 결과","reason":"퇴직 뒤 남은 명예의 빈자리.","evidence":{"entry":"last-shift","anchor":"morning","label":"그다음 아침"}},{"target":"inheritance-war","label":"이전 세대의 선택","reason":"지금의 제도가 만들어진 이유를 앞선 사건에서 확인한다.","evidence":{"entry":"inheritance-war","anchor":"network","label":"한 줄 계보 대신 충돌하는 연결"}}],"spoiler":false,"shortTitle":"공헌청","preview":"과거 기여도를 기준으로 시민의 발언권과 권한을 나누던 통치기관.","readingMinutes":3,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"fleet","title":"세 척의 배 — 이름은 나중에 쓰시오","summary":"사람을 살렸던 규칙이, 사람의 순서를 정하는 규칙이 되기까지.","type":"history","kind":"과거 기록","tags":["전사","명부","세 배"],"sections":[{"id":"night","title":"개원 172년 전 · 불이 꺼진 항로","blocks":[{"type":"paragraph","text":"해원의 조상들이 살던 궤도 거주지들은 한밤중에 항로와 동력망을 잃었다. 우주 전체가 망한 것은 아니었다. 서로 구조를 요청할 통로를 잃은 이 지역의 재난이었다. 그때에는 창조권도, 무제한 생산도 없었다.","id":"night-p1","terms":["창조권","해원"]},{"type":"paragraph","text":"여섯 수송선 중 돌아온 것은 세 척이었다. 생활 구역을 실은 에이레네호, 의료 기록을 맡은 디케호, 배급과 항로를 통제한 에우노미아호. 이름은 이주민들이 함께 읽던 오래된 신화에서 가져왔다. 수십 개 언어의 사람들이 같은 세 이름을 서로 다르게 발음했다.","id":"night-p2","terms":["에우노미아호","에이레네호","디케호"]}]},{"id":"manifest","title":"명부의 첫 번째 빈칸","blocks":[{"type":"paragraph","text":"당직 접수원 메이 란은 신원을 말하지 못하는 구조자 열일곱 명을 승선시켰다. 항로 관리자는 명부가 완성되어야 출항을 승인할 수 있다고 말했다. 메이는 이름 칸을 비운 채 구조 인원부터 올렸다. 식량과 좌석의 실제 한도는 숨기지 않았다. 적재 목록을 다시 정리해 열일곱 자리를 확보한 것이다.","id":"manifest-p1","terms":["메이 란","메이"]},{"type":"quote","text":"이름은 나중에 쓰시오. 먼저 태우시오.","attribution":"에이레네호 승선 명부의 여백","id":"manifest-p2","terms":[]},{"type":"paragraph","text":"명부는 여전히 중요했다. 나중에 가족을 찾고 환자를 치료하려면 누가 탔는지 알아야 했다. 다만 명부가 사람을 증명해주기 전에 사람을 구할 수 있어야 했다.","id":"manifest-p3","terms":[]}]},{"id":"inheritance","title":"승선 순서가 성적표가 되다","blocks":[{"type":"paragraph","text":"상륙 후에는 전력 수리공, 의료 인력, 어린이와 보호자에게 서로 다른 긴급 우선권이 주어졌다. 누가 선한지를 가린 것이 아니라 그날의 생존을 위한 배치였다. 임무가 끝나면 지워야 할 표식이었다.","id":"inheritance-p1","terms":[]},{"type":"paragraph","text":"그 표식을 지우는 법은 헌장에 들어가지 못했다. 구조 기여 기록은 직책으로, 직책은 발언권으로, 발언권은 자녀의 교육 경로로 이어졌다. 공헌청은 처음에는 사람을 살린 장부를 보관했다. 훗날에는 그 장부에 크게 적힌 집안의 자리를 보관했다.","id":"inheritance-p2","terms":["공헌청"]}]},{"id":"relic","title":"항구의 바닥 아래","blocks":[{"type":"paragraph","text":"세 배의 선체는 항구도시 해원의 기초가 되었다. 주민은 평생 배의 이름을 모르고도 그 위에서 살 수 있다. 공헌청의 본관은 배급선 위에, 공개 기록실은 기록선 위에, 등대동의 부엌은 생활선 위에 세워졌다.","id":"relic-p1","terms":["공헌청","등대동","해원"]},{"type":"paragraph","text":"이것은 유물에 숨겨진 권능이나 비밀 혈통이 아니다. 같은 구조의 역사 위에서 질서, 기록, 돌봄이 서로 다른 권리를 주장하게 된 도시의 지형이다.","id":"relic-p2","terms":[]}]},{"id":"seams","title":"사람이 걸을 수 있게 잇는 세 배","blocks":[{"type":"paragraph","text":"세 배의 접합부는 처음부터 같은 높이가 아니었다. 거주선의 바닥, 의료선의 넓은 통로, 지휘선의 장비 승강구를 연결하며 경사와 문턱이 생겼다. 자동화와 새 승강기 이후 낡은 연결길은 작업용 구역으로 남았다.","id":"seams-p1","terms":[]},{"type":"paragraph","text":"늑골길에는 모든 침상이 지나갈 수 있는 마법 같은 지름길이 있는 것이 아니다. 긴 저녁의 구조에는 실제 폭과 단차 확인, 의료 동행과 옮겨 타는 장비가 필요했다. 배의 역사는 장식 이름뿐 아니라 인물의 이동을 결정한다.","id":"seams-p2","terms":["긴 저녁","늑골길"]}]}],"sources":[],"relations":[{"target":"deep-peace","label":"세 이름","reason":"원전에 나온 세 자매.","evidence":{"entry":"deep-peace","anchor":"word","label":"현실 자료 · 에이레네"}},{"target":"society","label":"후대의 장부","reason":"긴급 배치가 공헌 등급이 된다.","evidence":{"entry":"society","anchor":"origin","label":"처음에는 필요한 기관이었다"}},{"target":"deep-carrier","label":"사물이 잇는 길","reason":"배·식탁·봉투.","evidence":{"entry":"deep-carrier","anchor":"props","label":"작중 사물 · 같은 기능의 네 가지 물건"}}],"spoiler":false,"era":"개원 172년 전","shortTitle":"세 척의 배","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"mei","title":"메이 란 — 집에 가고 싶었던 성녀","summary":"열일곱 사람을 구했다. 평생 그날의 사람이기를 원한 것은 아니다.","type":"character","kind":"인물","tags":[],"sections":[{"id":"ordinary","title":"영웅이 되기 전에는","blocks":[{"type":"paragraph","text":"메이는 에이레네호의 야간 접수원이었다. 화물 적재 위치와 진료 대기표를 조정하는 데 능했다. 넓은 원칙보다 종이 끝에 잘못 들어간 숫자를 먼저 발견했다. 낮은 목소리로 욕을 했고, 배 멀미가 심한 승객에게는 자신의 생강절임을 내주었다.","terms":["에이레네호","메이"],"id":"ordinary-p1"},{"type":"paragraph","text":"재난 전에 그녀가 모은 돈은 더 큰 배의 지휘관 교육비가 아니라 작은 여관의 보증금이었다. 남이 언제 찾아오든 맞아주되, 자기 당직이 끝나면 방으로 돌아갈 수 있는 곳을 원했다. 구조 일은 귀했다. 그렇다고 다른 일을 원하는 마음이 배신은 아니었다.","terms":[],"id":"ordinary-p2"}]},{"id":"rescue","title":"열일곱 명을 태운 이유","blocks":[{"type":"paragraph","text":"항로 재난 때 열일곱 명의 임시 신원표가 젖어 읽히지 않았다. 메이는 신원을 무시한 것이 아니라 구조와 신원 확인의 순서를 바꿨다. 객실이 아니라 짐칸을 비우고, 기존 승객에게 이동 이유를 설명하고, 의료 인력을 배치했다. 승무원 여럿이 위험을 나누어 맡았다.","terms":["메이"],"id":"rescue-p1"},{"type":"paragraph","text":"그녀가 명령을 어긴 것은 사실이다. 그러나 위험을 계산하지 않고 마음씨 하나로 모두 살린 것은 아니다. 그날 살릴 수 없는 사람도 있었고, 구조가 늦어진 이유는 별도 기록에 남았다. 열일곱 사람은 비밀의 왕족이나 미래의 천재여서 구한 사람들이 아니었다.","terms":[],"id":"rescue-p2"}]},{"id":"after","title":"구조 다음의 서른여섯 해","blocks":[{"type":"paragraph","text":"해원에 도착한 메이는 공동 숙소의 접수 일을 맡았다. 집을 얻고, 이웃과 싸우고, 요리를 배우다 그만두었다. 창건 기념식에 몇 번 참석했지만 평생 참석하겠다고 약속하지 않았다. 노년에 죽었을 때 지인들은 구조 장면보다 그녀가 손님에게 방 열쇠를 두 번 확인하던 버릇을 더 오래 말했다.","terms":["메이","해원"],"id":"after-p1"},{"type":"paragraph","text":"현재로 돌아온 뒤 그녀는 성녀 역할을 거부하지만, 그 시대의 모든 일을 자기가 최종 판결할 수 있다고 생각하지도 않는다. 자신이 모르는 승객의 삶은 그들에게 묻는다. 목격자는 교황이 아니고, 살아 있는 원전도 해석을 금지할 수는 없다.","terms":[],"id":"after-p2"}]},{"id":"price","title":"자신의 기적을 덜 아름답게 만드는 비용","blocks":[{"type":"paragraph","text":"메이가 부활한 날 울며 고마워한 사람 중에는 무명관에서 집과 교육을 얻은 사람도 있다. 그녀가 비문을 정정하면 그 사람들이 거짓 인생을 살았다는 뜻은 아니다. 그래서 동상을 없애는 대신, 설명 옆에 일상 기록과 다른 사람들의 서명을 함께 붙이자고 제안한다.","terms":["무명관","메이"],"id":"price-p1"},{"type":"quote","text":"나를 작게 만들자는 게 아니에요. 내가 살린 사람들을 내 이야기 밖에서도 크게 보자는 거예요.","terms":[],"attribution":"메이","id":"price-p2"}]}],"sources":[],"relations":[{"target":"deep-nobody","label":"무명의 뜻","reason":"이름이 없다는 것과 사람이 없다는 것은 다르다.","evidence":{"entry":"deep-nobody","anchor":"manifest","label":"이름을 모른다는 것과 사람이 없다는 것"}}],"motive":{"과거":"실제 구조 뒤에도 일상의 삶을 살았다.","현재 선택":"감사를 받되 성녀의 영구 배역을 거절한다.","치르는 대가":"그 신화로 살아온 이들의 실망을 직접 듣는다."},"shortTitle":"메이 란","preview":"해원의 창건 시기에 사람들을 구조한 접수원. 도시는 그를 성녀로 기억한다.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"gyeol","title":"결 로안 — 좋은 결말을 무대에 올리는 사람","summary":"반대편에도 다정한 사람이 있다. 모든 행사가 끝나지 않은 재판이 될 수는 없다고 믿는 사람.","type":"character","kind":"인물","tags":[],"sections":[{"id":"child","title":"끝이라는 이름","blocks":[{"type":"paragraph","text":"결의 가족은 거처를 여러 번 옮겼다. 부모는 마지막 이주지에서 태어난 아이에게 결이라는 이름을 주었다. 가족이 더는 떠돌지 않기를 바라는 뜻이었다. 결은 훗날 그 이름을 마침표보다 사람 사이의 매듭으로 읽고 싶어 했다. 특정 외국어에서 가져온 숨은 본명은 없다.","terms":[],"id":"child-p1"},{"type":"paragraph","text":"그녀가 처음 들은 공헌청의 설명은 난민 등록 절차를 마치면 편히 살아도 된다는 말이었다. 그 절차는 끝나지 않았다. 그러나 이주민을 위한 무료 숙소 무명관에서는 먼저 침대를 내주었다. 메이의 승선 명부를 벽에 건 그곳에서, 결은 이야기가 실제로 문을 열 수 있다는 것을 배웠다.","terms":["공헌청","무명관","메이"],"id":"child-p2"}]},{"id":"work","title":"서류보다 빨랐던 연극","blocks":[{"type":"paragraph","text":"결은 시민 연극단으로 시작했다. 방황하는 아이에게 임시 보호자를 연결하고, 회복원 밖에서 가족이 서로를 알아볼 수 있도록 공연과 식탁을 열었다. 그녀가 꾸민 이야기 덕분에 만난 가족들이 있다. 공헌청 폐쇄 운동에도 참여했다. 라잔의 부하로 정체가 드러나는 인물은 아니다.","terms":["공헌청","회복원","라잔"],"id":"work-p1"},{"type":"paragraph","text":"환대회가 귀환제를 맡자 결은 하나의 환영 무대를 제안했다. 초대받는 데는 증언도 용서도 필요 없었다. 다만 무대의 마지막 문장은 모든 시민이 함께 새 시대를 시작한다는 뜻으로 쓰고 싶었다. 그녀에게 하나의 문장은 법적 판정이 아니라 함께 기뻐할 약속이었다.","terms":["귀환제","환대회"],"id":"work-p2"}]},{"id":"argument","title":"그녀가 옳은 부분","blocks":[{"type":"quote","text":"모든 식탁에서 과거를 심문할 수는 없어요. 오늘 좋은 일이 생겼다는 사실만 함께 말할 자리도 있어야 하잖아요.","terms":[],"attribution":"결","id":"argument-p1"},{"type":"paragraph","text":"리아는 이에 동의한다. 결이 틀리는 지점은 축제를 여는 일이 아니다. 그 기쁨을 아직 용서하지 않은 사람까지 끝맺었다는 뜻으로 대본에 써넣을 때다. 여울의 편지는 실제 용서이고, 그 편지가 결에게 준 희망도 실제다. 다른 사람을 대표할 허락만 빠졌다.","terms":["리아","여울"],"id":"argument-p2"}]},{"id":"choice","title":"대표자의 자리를 비워주는 선택","blocks":[{"type":"paragraph","text":"결은 메이와 나래의 거절을 받아들이면 가장 아름다운 연출을 잃는다. 생환자들의 감사에 기대어 후원받은 자기 이름도 상처 입는다. 그녀는 결국 행사를 취소하는 대신, 사람들이 직접 자기 장면의 범위를 정하도록 무대를 다시 짠다.","terms":["나래","메이"],"id":"choice-p1"},{"type":"paragraph","text":"말을 더듬는 메이, 먼저 무대를 떠나는 서안, 서로 반대의 말을 하는 두 나래가 한밤의 행사에 함께 나온다. 어떤 관객은 산만하다고 말한다. 결은 그 평가를 지우지 않는다. 사람을 배역보다 먼저 놓는 연출은 실제로 덜 매끈할 수 있다.","terms":["나래","메이","서안"],"id":"choice-p2"}],"reveal":true}],"sources":[],"relations":[{"target":"festival","label":"실제 권한","reason":"결은 무대의 운영자이지 개인 세계의 통치자가 아니다.","evidence":{"entry":"festival","anchor":"cost","label":"행사 하나가 왜 중요한가"}}],"motive":{"과거":"희망의 이야기 덕분에 거처와 사람을 얻었다.","현재 선택":"함께 기뻐할 공동 서사를 지키려 한다.","치르는 대가":"완벽한 연출과 모두의 동의를 동시에 가질 수 없다."},"shortTitle":"결 로안","preview":"귀환제를 준비하는 환대회의 대표. 서로 다른 손님을 한 행사에 맞이하려 한다.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"last-shift","title":"마지막 당직 — 사람이 필요 없어진 아침","summary":"에이렌이 어머니에게 줄 수 없었던 것은 실력이 아니라, 다음 지시가 없는 하루였다.","type":"history","kind":"과거 기록","tags":["에이렌의 과거","미라","자동화"],"sections":[{"id":"success","title":"개원 30년 전 · 완벽한 인수인계","blocks":[{"type":"paragraph","text":"자동 항로망이 마지막 유인 당직을 넘겨받던 날, 미라 베일은 구조 접수소에서 단 한 건도 놓치지 않는 새 체계를 확인했다. 자기보다 잘했다. 질투보다 안도가 먼저였다. 이제 누군가의 피로 때문에 구조선이 늦는 일은 줄어들 것이었다.","id":"success-p1","terms":["미라 베일","미라"]},{"type":"paragraph","text":"스물세 살의 에이렌은 어머니에게 인수인계 기념패를 선물했다. 그때는 이것이 좋은 결말이라고 생각했다. 실제로 좋은 결말이기도 했다. 해원의 공급은 안정되었고, 미라는 더 이상 밤마다 위험한 판단을 하지 않아도 되었다.","id":"success-p2","terms":["에이렌","미라","해원"]}]},{"id":"morning","title":"그다음 아침","blocks":[{"type":"paragraph","text":"미라는 생활비를 잃지 않았다. 친구도 있었고, 요리도 좋아했다. 다만 방문 기록에 찍히던 작은 줄 하나가 사라졌다. 오늘 당신 덕분에 도착한 사람이 있다는 줄이었다. 도시가 그 줄을 명예의 단위로 삼았기에, 충분한 생활 보장만으로 같은 자리를 얻지는 못했다.","id":"morning-p1","terms":["미라"]},{"type":"paragraph","text":"에이렌은 새로운 적성과 배움을 추천했다. 미라는 실제로 몇 가지를 즐겼다. 하지만 그가 찾아올 때마다 다음 목표를 묻기 시작하자, 아들과 저녁 먹는 일까지 상담처럼 느껴졌다.","id":"morning-p2","terms":["에이렌","미라"]},{"type":"dialogue","speaker":"미라","text":"오늘은 개선할 것이 없어도 와주면 안 되니?","id":"morning-p3","terms":[]}]},{"id":"two-lessons","title":"서로 다른 세대의 답","blocks":[{"type":"paragraph","text":"미라는 등대동에서 이름을 외우는 사람이 된다. 누구든 대신 국을 끓일 수 있지만, 오늘 어떤 이야기를 이어가고 싶은지는 앉은 사람과 함께 알아낸다. 자동화가 못 해서 남은 일이 아니라, 그렇게 하고 싶어서 택한 관계다.","id":"two-lessons-p1","terms":["등대동","미라"]},{"type":"paragraph","text":"에이렌은 그 장면을 보고도 한동안 모든 시민에게 맞는 역할을 찾아주는 것이 해법이라고 믿는다. 훗날 회복원 문 앞에 서기 전까지, 역할을 찾지 않은 채 살아도 되는 자리를 제도 안에 만들지 못한다.","id":"two-lessons-p2","terms":["에이렌","회복원"]}]}],"sources":[],"relations":[{"target":"mira","label":"퇴직한 사람","reason":"아들의 신화 밖에서 산다.","evidence":{"entry":"mira","anchor":"person","label":"83세, 전직 구조 접수원"}},{"target":"future-offduty","label":"뒤집혀 돌아오는 장면","reason":"이제 아들이 당직표 앞에 선다.","evidence":{"entry":"future-offduty","anchor":"habit","label":"계속 남아 있는 사람"}}],"spoiler":false,"era":"개원 30년 전","shortTitle":"마지막 당직","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"recovery","title":"회복원 — 좋은 의도가 붙잡는 손이 될 때","summary":"치료를 제공하는 일과, 떠날 수 있는 사람을 심사하는 일이 한 기관에 맡겨졌다.","type":"world","kind":"세계 설정","tags":["제도","에이렌의 책임"],"sections":[{"id":"purpose","title":"오래된 보호시설에 새 상담 과정이 들어오다","blocks":[{"type":"paragraph","text":"회복원의 전신은 사벨의 유예궁과 긴 저녁 뒤의 보호시설이다. 그 안에서 개원 12년 전 에이렌이 설계한 것은 자발적 재교육·상담 과정이었다. 시설 자체를 처음 만든 것이 아니다. 일부 이용자는 스스로 이 과정을 골라 도움을 받았지만, 기관에는 오래전부터 퇴소를 심사하는 관행도 함께 남아 있었다.","id":"purpose-p1","terms":["에이렌","회복원"]}]},{"id":"gate","title":"퇴소 기준이 바뀐 순간","blocks":[{"type":"paragraph","text":"라잔은 집단적인 승급 포기를 사회적 기능 저하로 규정했다. 기존 보호시설의 퇴소 심사를 정치적 집단에도 넓히고, 에이렌의 상담 과정을 강제 체류의 근거에 결합했다. 경쟁에 복귀할 의욕을 확인해야 나갈 수 있었다. 쉬고 싶다는 말은 지원이 더 필요하다는 증거로 읽혔다.","id":"gate-p1","terms":["회복원","라잔"]},{"type":"paragraph","text":"에이렌은 그 변경을 막지 않았다. 전문가가 충분히 개입하면 강제 체류가 더 짧아질 것이라고 믿었고, 자신이 남아 있어야 제도를 덜 가혹하게 만들 수 있다고 생각했다. 그의 서명은 고의가 없었다는 이유로 사라지지 않는다.","id":"gate-p2","terms":["에이렌"]}]},{"id":"experience","title":"회복원 안의 평범한 하루","blocks":[{"type":"paragraph","text":"방은 깨끗했고 식사도 좋았다. 직원 대부분은 친절했다. 하지만 내일도 평가가 있었다. 책을 읽으면 어떤 능력으로 연결할지 질문을 받았고, 연주를 즐기면 복귀 목표를 써야 했다. 아무것도 증명하지 않는 하루는 허용되지 않았다.","id":"experience-p1","terms":[]},{"type":"paragraph","text":"이곳의 폭력은 매 순간 잔혹한 대우만을 뜻하지 않는다. 당사자가 자기 생활을 끝낼 수 없는데, 그 이유가 계속 당사자의 행복을 위한 것이라고 설명되는 상태가 핵심이다.","id":"experience-p2","terms":[]}]},{"id":"difference","title":"이 과거가 모든 강제를 같게 만들지는 않는다","blocks":[{"type":"paragraph","text":"리아가 요구하는 제한된 심판은 회복원의 무기한 체류와 같지 않다. 에이렌도 차이를 안다. 그가 지금 반대하는 것은 과거의 공포 하나 때문만이 아니라, 현재에는 회복과 재발 방지를 강제 출석 없이도 해낼 수 있다는 판단 때문이다.","id":"difference-p1","terms":["에이렌","회복원","리아"]},{"type":"paragraph","text":"과거 사건은 그의 경계심이 생긴 이유다. 현재의 주장을 자동으로 옳게 만들어주는 증명은 아니다.","id":"difference-p2","terms":[]}]},{"id":"tomorrow","title":"내일의 시간표","blocks":[{"type":"paragraph","text":"회복원에는 휴식 시간이 있었다. 오전 아홉 시의 휴식은 긴장을 낮추기 위해, 오후 세 시의 산책은 복귀 의지를 높이기 위해 배정됐다. 쉬는 행위는 허용됐지만, 다음 성과를 준비하기 위해서라는 설명이 따라붙었다.","id":"tomorrow-p1","terms":["회복원"]},{"type":"paragraph","text":"서안은 사유 칸에 “좋아서”라고 썼다. 직원은 악의를 품지 않고 좀 더 구체적으로 적어달라고 했다. 등대동의 ‘오늘의 잼’이라는 농담은 그 한 단어에서 자랐다.","id":"tomorrow-p2","terms":["오늘의 잼","등대동","서안"]}]},{"id":"older-door","title":"처음 문을 잠근 사람은 라잔이 아니었다","blocks":[{"type":"paragraph","text":"긴 저녁을 막은 뒤 시민들은 다시는 쉬고 싶다는 말이 죽음의 명부로 옮겨지지 않기를 바랐다. 사벨의 보호 관행은 실제 구조의 기억을 등에 업고 회복원의 퇴소 심사로 이어졌다. 라잔은 이미 정당한 것으로 받아들여지던 보호 언어를 정치적 반대를 억누르는 데 사용했다.","id":"older-door-p1","terms":["긴 저녁","회복원","라잔","사벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"살인을 막은 다음 날","entry":"long-evening","anchor":"aftermath"},{"label":"서로 다른 후계자들","entry":"inheritance-war"}],"id":"older-door-p2"}]}],"sources":[],"relations":[{"target":"lighthouse","label":"벌어진 사건","reason":"지원이 강제 체류가 된다.","evidence":{"entry":"lighthouse","anchor":"action","label":"라잔의 선택 · 해산 대신 회복"}},{"target":"deep-door","label":"문지기의 원형","reason":"친절해도 닫힌 문.","evidence":{"entry":"deep-door","anchor":"difference","label":"작중 변주 · 환자의 문이 아닌 심사관의 문"}},{"target":"deep-jam","label":"시간표의 숨은 말","reason":"오늘 없는 내일.","evidence":{"entry":"deep-jam","anchor":"meal","label":"작중 연결 · 회복원이 빼앗은 오늘"}},{"target":"inheritance-war","label":"이전 세대의 선택","reason":"지금의 제도가 만들어진 이유를 앞선 사건에서 확인한다.","evidence":{"entry":"inheritance-war","anchor":"network","label":"한 줄 계보 대신 충돌하는 연결"}}],"spoiler":false,"shortTitle":"회복원","preview":"상담과 보호를 제공하던 기관. 강제 체류 제도는 본편 전에 폐지됐다.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lighthouse","title":"등대동 사건 — 두 사람의 출발점","summary":"같은 문 앞에서, 한 사람은 기다리게 했고 다른 한 사람은 서명했다.","type":"history","kind":"과거의 사건","tags":["공동 과거","인과관계","회복원"],"sections":[{"id":"before","title":"만경 개원 9년 전 · 등급 없는 저녁","blocks":[{"type":"paragraph","text":"항구도시 해원의 등대동은 기여 점수를 묻지 않는 저녁 모임을 열었다. 나래는 공동 부엌을 맡았고, 리아는 식탁과 상담 자리를 정리했다. 서안은 잘하지 못하는 피아노를 사람들 앞에서 연주했다. 누구도 그것을 직업으로 만들라고 요구하지 않았다.","id":"before-p1","terms":["등대동","나래","리아","서안","해원"]},{"type":"paragraph","text":"모임이 커지자 리아는 등대동을 정식 시민 협의체로 등록하려 했다. 단순한 위로를 넘어서, 이들의 삶도 도시의 결정을 바꾸게 하고 싶었다.","id":"before-p2","terms":["등대동","리아"]}]},{"id":"action","title":"라잔의 선택 · 해산 대신 회복","blocks":[{"type":"paragraph","text":"라잔은 등대동을 게으른 사람들의 소란으로만 보지 않았다. 등급 밖에서 생활이 잘 유지된다는 사실은 자신의 통치 명분을 흔들었다. 그는 활동가를 죄수로 만들면 동정을 얻을 것이라 판단해, 회복 대상자로 지정했다.","id":"action-p1","terms":["등대동","라잔"]},{"type":"paragraph","text":"에이렌은 대규모 체포를 피하는 절충안이라며 관찰 기간 연장에 동의했다. 리아에게는 내부 검토로 동생을 내보낼 수 있다고 약속했다. 서안은 며칠짜리 평가로 안내받아 들어갔지만, 같은 심사를 반복하며 열한 달을 지냈다.","id":"action-p2","terms":["에이렌","리아","서안"]}]},{"id":"signature","title":"리아의 선택 · 한 사람을 먼저 데려오기","blocks":[{"type":"paragraph","text":"공헌청은 리아에게 개별 조정안을 제안했다. 서안의 퇴소와 생활 지원을 승인하는 대신, 등대동의 문제를 불법적인 강제 격리가 아니라 소통 오류로 정리하는 합의였다.","id":"signature-p1","terms":["공헌청","등대동","리아","서안"]},{"type":"paragraph","text":"리아는 서명했다. 동생을 데려올 수 있는 확실한 길을 버릴 수 없었다. 나래에게는 다른 사람들도 곧 나올 수 있다고 말했다. 그러나 첫 조정 사례가 되자, 다른 가족들에게도 같은 방식의 개별 합의가 요구됐다. 남은 사람들의 공동 요구는 흩어졌다.","id":"signature-p2","terms":["나래","리아"]}]},{"id":"door","title":"에이렌의 선택 · 정당한 절차를 한 번 더","blocks":[{"type":"paragraph","text":"에이렌은 재심사를 통해 문제를 바로잡으려 했다. 하지만 떠나고 싶다는 사람에게 왜 떠날 준비가 됐는지 다시 설명하게 만들었다. 자신이 설계한 문에서 자기 승인만 기다리는 사람들을 보고서야, 심사 항목을 개선하는 것으로는 부족하다는 결론에 도달했다.","id":"door-p1","terms":["에이렌"]},{"type":"paragraph","text":"그는 퇴소 승인권을 회복원에서 빼는 데 찬성했고, 평가 자료와 자신의 서명도 공개했다. 리아는 그 자료를 들고 개별 합의가 아닌 전체 제도 폐지를 요구했다. 두 사람은 이때부터 함께 일했다.","id":"door-p2","terms":["회복원","리아"]}]},{"id":"aftermath","title":"서로를 용서한 것이 아니라, 함께 수습했다","blocks":[{"type":"paragraph","text":"리아는 에이렌을 무죄라고 하지 않았다. 에이렌은 리아가 합의문에 서명했다는 이유로 피해자답지 않다고 하지 않았다. 둘은 서로의 잘못을 알고도 다음 일을 함께할 수 있다는 경험을 얻었다.","id":"aftermath-p1","terms":["에이렌","리아"]},{"type":"paragraph","text":"같은 사건에서 에이렌은 퇴장의 허가권을 경계하게 됐고, 리아는 개인을 구제하는 일로 공적인 책임이 덮이는 것을 경계하게 됐다. 라잔의 입주 신청은 오래된 감정을 임의로 깨우는 장치가 아니라, 이 두 판단을 실제로 충돌시킨 사건이다.","id":"aftermath-p2","terms":["에이렌","라잔","리아"]}]},{"id":"letter","title":"돌아오지 않은 반송 봉투","blocks":[{"type":"paragraph","text":"서안이 나간 뒤, 나래는 남아 있는 가족들의 공동 항의를 다시 보냈다. 접수소는 이미 개별 조정이 시작되었다는 이유로 같은 봉투를 돌려보냈다. 사유란에는 “당사자 회복 진행 중”이라고 적혀 있었다.","id":"letter-p1","terms":["나래","서안","유란"]},{"type":"paragraph","text":"리아는 훗날 그 봉투의 찢어진 모서리를 맞춰 붙였다. 내용은 이미 보존되어 있었다. 원본이 없어서 진실을 몰랐던 것은 아니다. 본인이 손으로 닫았던 절차를 다시 손으로 열고 싶었던 것이다. 봉투는 유일한 증거가 아니라 자신이 한 일을 외면하지 않게 하는 물건이 된다.","id":"letter-p2","terms":["리아"]}]}],"sources":[],"relations":[{"target":"eiren","label":"승인한 사람","reason":"선의로 남아 있었던 대가.","evidence":{"entry":"eiren","anchor":"fault","label":"등대동에서 자신이 한 일"}},{"target":"ria","label":"서명한 사람","reason":"개별 구제와 공동 종결.","evidence":{"entry":"ria","anchor":"fault","label":"구제와 침묵을 맞바꾼 날"}},{"target":"postoffice","label":"현재의 도장","reason":"도착과 동의를 나눈다.","evidence":{"entry":"postoffice","anchor":"stamps","label":"세 가지 도장"}}],"spoiler":false,"shortTitle":"등대동 사건","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"white-room","title":"백지의 발견 — 첫 기적은 빈방이었다","summary":"에이렌이 우주를 혼자 발명한 것은 아니다. 그는 발견된 힘의 첫 사용 규칙을 놓고 싸웠다.","type":"history","kind":"과거 기록","tags":["힘의 기원","공동 연구","백지"],"sections":[{"id":"discovery","title":"개원 3년 전 · 닫힌 방의 두 창문","blocks":[{"type":"paragraph","text":"해원 바깥 여러 정착지의 연구진은 공간을 새로 구성하는 현상을 함께 연구했다. 에이렌은 물리 이론의 유일한 천재가 아니라 참여자의 요청을 현실 조건으로 옮기는 체험 설계자로 합류했다.","terms":["에이렌","합류","해원"],"id":"discovery-p1"},{"type":"paragraph","text":"첫 공개 실험은 빈방이었다. 한쪽 창문에는 여름, 다른 쪽 창문에는 겨울이 보였다. 문을 나가면 각 계절 속에서 살 수 있었고, 방은 한쪽을 닫아 다른 쪽의 연료로 쓰지 않았다. 연구진은 이 바탕을 백지라고 불렀다.","terms":["백지"],"id":"discovery-p2"},{"type":"paragraph","text":"실험실의 첫 방문자는 어느 계절이 더 진짜인지 묻지 않았다. 창문 사이에 의자를 놓아도 되는지 물었다. 보고 싶은 계절은 아직 고르지 않았다고 했다.","terms":[],"id":"discovery-p3"}]},{"id":"tests","title":"이 년 동안 확인한 것","blocks":[{"type":"paragraph","text":"개원 3년 전부터 1년 전까지 두 해 동안, 공동 연구진은 먼저 사람이 없는 환경을 시험했다. 검증 범위가 넓어지면서 동의한 참여자의 단기 체험도 시작했다. 개원 1년 전부터는 생활을 지속하는 시범 거주가 열렸다. 개원일은 힘이 처음 생긴 날이 아니라, 별도 연구 참여 없이 누구나 이용할 수 있게 된 날이다.","id":"tests-p1","terms":[]},{"type":"paragraph","text":"꿈배역에는 겪는 의식이 없고, 새갈래에는 있다는 구별은 이 작품에서 확인 가능한 성질로 둔다. 현실의 인공지능 연구가 이미 의식을 정확히 판별한다는 뜻은 아니다. 이 전제를 흐려 누군가 몰래 고통받는 반전을 만들지 않는다.","id":"tests-p2","terms":["꿈배역","새갈래"]}]},{"id":"first-use","title":"가장 먼저 세계를 받은 사람","blocks":[{"type":"paragraph","text":"초기 시범 거주에는 회복원을 나온 자원자들과 가족도 참여했다. 치료와 생활 복구는 실험의 보상이 아니어서 참여하지 않아도 제공됐다. 개원 1년 전 나래는 두 삶으로 분기하기를 선택했다. 라잔의 본편 신청은 일반 개원 이후의 개인 거주 신청이며, 먼저 살아온 시범 주민들과 모순되지 않는다.","id":"first-use-p1","terms":["회복원","나래","라잔"]},{"type":"paragraph","text":"에이렌이 유명해진 것은 발견의 모든 공로를 소유했기 때문이 아니다. 새 세계를 성과에 따라 배분하려는 초안에 반대하고, 이용자가 운영자의 승인을 기다리지 않고 떠나는 조건을 공개적으로 밀었기 때문이다. 공동 연구진의 이름은 지금도 창조권 기록 첫 장에 나란히 남는다.","id":"first-use-p2","terms":["에이렌","창조권"]}]},{"id":"inheritance","title":"신의 권한을 물려주는 대신","blocks":[{"type":"paragraph","text":"만경의 주민은 자기 삶을 구성할 권능을 얻는다. 다른 사람을 일방적으로 고칠 권능까지 갖지는 않는다. 충돌하면 개인 세계를 나누고, 함께하기로 한 사건만 연결한다. 이 기준은 자연의 비밀이 아니라 만경이 채택한 공개된 공존 원칙이다.","id":"inheritance-p1","terms":["개인 세계","만경"]},{"type":"paragraph","text":"주민이 에이렌을 비판하거나 다른 운영 공동체를 선택해도 집은 사라지지 않는다. 에이렌은 논쟁의 대표자이지 모든 문에 손을 올린 유일한 관리자는 아니다. 그의 퇴근이 가능한 이유다.","id":"inheritance-p2","terms":["에이렌"]}]},{"id":"two-windows","title":"죄수의 노트와 연구자의 실험","blocks":[{"type":"paragraph","text":"아벨은 여름과 겨울의 창을 그렸지만, 그 그림은 작동하는 설계도가 아니었다. 수십 년 뒤 백지의 공동 연구가 현실을 나누는 길을 열었다. 학살이 발견의 재료나 필수 단계였던 것도 아니다.","id":"two-windows-p1","terms":["백지","아벨"]},{"type":"paragraph","text":"에이렌이 백지에서 두 계절을 보았을 때 떠올린 것은 스승이 옳았다는 승리가 아니라, 그때 살아남았어야 할 사람들이었다.","id":"two-windows-p2","terms":["에이렌","백지"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"종이 위의 창문","entry":"prison-window","anchor":"window"}],"id":"two-windows-p3"}]}],"sources":[],"relations":[{"target":"rules","label":"권능과 기준","reason":"가능한 것과 하기로 한 것.","evidence":{"entry":"rules","anchor":"power","label":"가능한 일"}},{"target":"clocks","label":"시범 운영의 편지","reason":"나래는 어떻게 이백 년을 더 살았나.","evidence":{"entry":"clocks","anchor":"nara","label":"나래와 여울의 경우"}},{"target":"inheritance-war","label":"이전 세대의 선택","reason":"지금의 제도가 만들어진 이유를 앞선 사건에서 확인한다.","evidence":{"entry":"inheritance-war","anchor":"network","label":"한 줄 계보 대신 충돌하는 연결"}}],"spoiler":false,"era":"개원 3년 전부터","shortTitle":"백지의 발견","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"timeline","title":"연표 — 구조선에서 신의 퇴근까지","summary":"도시의 공통력을 따라 읽는다. 여울의 이백 년은 별도의 살아온 시간이다.","type":"history","kind":"과거 기록","tags":["연표","세 시대"],"sections":[{"id":"fleet","title":"개원 172년 전 · 세 척의 구조선","blocks":[{"type":"paragraph","text":"지역 항로 재난 뒤 세 척의 배가 해원의 기초가 된다. 구조를 위한 임시 우선권이 이후 공헌청의 직책과 발언권으로 굳어진다.","id":"fleet-p1","terms":["공헌청","해원"]}]},{"id":"founder-death","title":"개원 136년 전 · 구조 다음의 생애","blocks":[{"type":"paragraph","text":"메이는 창건 뒤 서른여섯 해를 살고 노년에 죽었다. 도시가 안정된 뒤 세워진 기념관은 이후 무명관이라는 생활 지원 기관으로도 쓰인다. 결이 자란 시대의 신전은 선행과 시민의 생활을 함께 품었지만, 메이 개인의 일상은 점차 옅어진다.","terms":["무명관","메이"],"id":"founder-death-p1"}]},{"id":"rights-age","title":"개원 129년 전 · 요벨의 생활권","blocks":[{"type":"paragraph","text":"살려준 비용을 평생 갚던 구조 채무를 공적으로 정산한다. 기여를 못 해도 식량과 거처를 끊을 수 없는 법이 남는다.","id":"rights-age-p1","terms":[]}]},{"id":"abundance-age","title":"개원 88년 전 · 기초 생산의 풍요","blocks":[{"type":"paragraph","text":"기본 식량·주거·에너지가 넉넉해진다. 그러나 의사 결정권과 높은 평가는 계속 희소하게 배분된다.","id":"abundance-age-p1","terms":[]}]},{"id":"ability-age","title":"개원 76년 전 · 프로네의 기술 공개","blocks":[{"type":"paragraph","text":"많은 시민의 실제 능력이 높아진다. 공헌청은 열린 기술 위에 다시 상대 순위를 매긴다.","id":"ability-age-p1","terms":["공헌청"]}]},{"id":"prediction-age","title":"개원 67년 전 · 카산의 정답원","blocks":[{"type":"paragraph","text":"도움이 되던 예측이 지원과 진로 배정의 기준으로 사용된다. 지원받지 못한 결과를 다시 실패 예측의 정확도로 센다.","id":"prediction-age-p1","terms":[]}]},{"id":"mind-age","title":"개원 58년 전 · 레테의 마음 조정","blocks":[{"type":"paragraph","text":"자발적 치료는 실제로 사람을 돕는다. 이후 일부 거부자에게도 적용한 시범이 논쟁과 책임 심판을 낳는다.","id":"mind-age-p1","terms":[]}]},{"id":"shelter-age","title":"개원 50년 전 · 사벨의 유예궁","blocks":[{"type":"paragraph","text":"안정된 역할과 하루를 제공하는 질서의 낙원. 도움이 된 사람도 있고, 떠날 허가를 기다리는 사람도 있다.","id":"shelter-age-p1","terms":[]}]},{"id":"address-age","title":"개원 46년 전 · 리브의 주소망","blocks":[{"type":"paragraph","text":"어떤 성과를 낼지 모르는 사람도 내일 만나러 갈 수 있는 생활 지원망이 생긴다.","id":"address-age-p1","terms":[]}]},{"id":"evening-age","title":"개원 42년 전 · 긴 저녁","blocks":[{"type":"paragraph","text":"아벨의 대안식안 선집행으로 312명이 죽고, 전 도시 확대는 시민 연합이 막는다. 이후 강제 보호의 논리가 힘을 얻는다.","id":"evening-age-p1","terms":["대안식안","아벨"]}]},{"id":"mentor-age","title":"개원 32년 전 · 청년과 죄수","blocks":[{"type":"paragraph","text":"에이렌이 의료·교육 기록을 읽기 위해 아벨을 처음 면회한다. 그는 낙원의 구상을 듣지만 사람을 없애는 해법은 거절한다.","id":"mentor-age-p1","terms":["에이렌","아벨"]}]},{"id":"past","title":"개원 30년 전 · 마지막 당직","blocks":[{"type":"paragraph","text":"기초 생산은 이미 오래전 풍요 단계에 들어섰다. 미라의 마지막 당직은 남아 있던 해상 구조 업무의 마지막 유인 세대가 물러나는 날이다. 스물세 살의 에이렌은 새 역할을 찾아주는 교육을 자신의 일로 삼는다.","id":"past-p1","terms":["에이렌","미라"]}]},{"id":"second-visit","title":"개원 29년 전 · 두 번째 면회","blocks":[{"type":"paragraph","text":"어머니에게 새 일을 찾아주려던 에이렌이 다시 아벨을 만난다. 같은 진단에 도달한 둘은 반대의 처방을 택한다.","id":"second-visit-p1","terms":["에이렌","아벨"]}]},{"id":"mentor-death","title":"개원 24년 전 · 감옥의 유언","blocks":[{"type":"paragraph","text":"아벨은 감옥에서 죽는다. 안전한 귀환이 가능하다면 스스로 설명을 듣고 다시 답할 기회를 원한다는 의사를 남긴다.","id":"mentor-death-p1","terms":["아벨"]}]},{"id":"support","title":"개원 12년 전 · 회복원의 확대","blocks":[{"type":"paragraph","text":"사벨의 보호시설 안에서 에이렌의 자발적 재교육·상담 과정이 확대된다. 이후 라잔은 오래된 퇴소 심사 관행을 정치적 집단에도 적용하고, 상담 과정의 성공을 강제 체류의 근거로 삼는다.","id":"support-p1","terms":["라잔"]}]},{"id":"incident","title":"개원 9년 전 · 등대동 사건","blocks":[{"type":"paragraph","text":"시민 대표권 요구, 회복 대상 지정, 에이렌의 연장 승인, 리아의 개별 합의가 차례로 일어난다. 서안은 열한 달 만에 나오고, 나래는 남은 가족의 연락망을 유지한다.","id":"incident-p1","terms":["에이렌","나래","리아","서안"]}]},{"id":"reform","title":"개원 7년 전부터 5년 전까지 · 실제 개혁","blocks":[{"type":"paragraph","text":"자료 공개와 시민 연대가 강제 회복원 폐쇄로 이어진다. 기본 권리와 공헌 등급이 분리되고 라잔은 정치적 권한을 잃는다. 창조권을 얻기 전에도 현실을 바꾼다.","id":"reform-p1","terms":["공헌 등급","창조권","회복원","라잔"]}]},{"id":"power","title":"개원 3년 전 · 백지의 공개 실험","blocks":[{"type":"paragraph","text":"공동 연구진이 독립적으로 지속되는 현실 구성에 성공한다. 에이렌은 사용 조건을 설계하고, 치료와 생활 복구를 먼저 보장한다.","id":"power-p1","terms":["에이렌"]}]},{"id":"pilot","title":"개원 1년 전 · 한 사람이 두 삶을 택하다","blocks":[{"type":"paragraph","text":"나래가 자발적으로 분기한다. 남은 나래에게 일 년, 떠난 여울에게 이백 년이 흐른다. 둘의 재회는 과거를 바꾸는 시간 여행이 아니다.","id":"pilot-p1","terms":["나래","분기","여울"]}]},{"id":"present","title":"개원일 이후 · 귀환의 서","blocks":[{"type":"paragraph","text":"귀환제가 열리며 여울의 용서장, 라잔의 입주 신청, 부활한 메이의 서약 취소 요청이 도착한다. 도시의 기념 서사와 실제 당사자의 말이 충돌한다. 시민심판은 라잔의 책임을 판단하지만 강제 응답을 얻지는 못한다. 마지막 무대에는 서로 다른 결말을 함께 놓는다.","terms":["시민심판","귀환제","라잔","메이","여울"],"id":"present-p1"}]},{"id":"giants-return","title":"개원 1개월 뒤 · 거인들의 유언","blocks":[{"type":"paragraph","text":"아벨과 이사가 각자 동의한 삶으로 돌아와 만난다. 학살을 구원의 전사로 바꾸려는 해석 앞에서 에이렌은 자기 사상의 계보를 공개한다.","id":"giants-return-p1","terms":["에이렌","아벨","이사"]}]},{"id":"future","title":"공통력 80년 뒤와 240년 뒤","blocks":[{"type":"paragraph","text":"80년 뒤에는 후대가 다툼을 하나의 영웅담으로 줄이는 문제가 생긴다. 240년 뒤 에이렌은 상시 구조자의 역할에서 물러난다. 주민의 세계와 권리는 어느 경우에도 그의 근무 여부에 매이지 않는다.","id":"future-p1","terms":["에이렌"]}]},{"id":"visits","title":"개원 37년·63년·2,400년 뒤","blocks":[{"type":"paragraph","text":"37년 뒤 나래와 여울이 공동 감각을 나누는 합창을 방문한다. 63년 뒤 부활한 항해사가 이미 달라진 가족에게 새 주소를 받는다. 2,400년 뒤의 만경은 에이렌의 이름을 모르는 주민도 안전하게 살아갈 수 있다. 이 미래들은 서로 다른 시계의 편지를 현재의 예언으로 쓰지 않고, 독자에게 제시하는 후일담이다.","terms":["에이렌","나래","만경","여울"],"id":"visits-p1"}]},{"id":"giants-future","title":"개원 8년과 120년 뒤","blocks":[{"type":"paragraph","text":"아벨은 낙원에 찬성하며 과거의 범죄 판단을 지우지 않는 서문을 낸다. 120년 뒤 박물관은 일곱 위인보다 그들의 정책 아래 살았던 사람들의 목소리를 앞에 놓는다.","id":"giants-future-p1","terms":["아벨"]}]},{"id":"routes","title":"외투를 따라 확인하는 세 시점","blocks":[{"type":"paragraph","text":"개원 42년 전: 이사의 지도 전달 → 강제 이송과 구조 요청 → 선집행 사망 312명 → 리브·미라와 여러 집단의 대피 및 확대 집행 중단. 기록의 주체와 행정의 명령은 서로 구별한다.","id":"routes-p1","terms":["이사","미라","리브"]},{"type":"paragraph","text":"긴 저녁 직후: 위험 확인을 위한 단기 보호가 끝난 뒤에도 사벨의 생활 준비 심사가 남는다. 훗날 그 양식이 공헌청의 회복원으로 이어지고, 라잔과 에이렌은 각자의 권한으로 그것을 적용한다.","id":"routes-p2","terms":["긴 저녁","회복원","에이렌","공헌청","사벨","라잔"]},{"type":"paragraph","text":"개원 1개월 뒤: 귀환한 이사가 공개 구조 기록과 외투의 전시 문안을 함께 읽는다. 과거를 소급해 바꾸는 시간 여행이 아니라, 생존자와 귀환자가 현재에 다시 만나는 사건이다.","id":"routes-p3","terms":["이사"]}]}],"sources":[],"relations":[{"target":"fleet","label":"더 과거로","reason":"해원의 시작.","evidence":{"entry":"fleet","anchor":"night","label":"개원 172년 전 · 불이 꺼진 항로"}},{"target":"clocks","label":"시간을 읽는 법","reason":"공통력과 살아온 시간.","evidence":{"entry":"clocks","anchor":"simple","label":"한 줄의 규칙"}},{"target":"future-offduty","label":"더 미래로","reason":"구원자도 퇴근한다.","evidence":{"entry":"future-offduty","anchor":"door","label":"한 사람만 통과하지 못한 출구"}}],"spoiler":false,"shortTitle":"연표","preview":"","readingMinutes":3,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"mangyeong","title":"만경 — 각자의 삶이 만나는 곳","summary":"세계는 나뉘지만, 사람은 외딴 방에 갇히지 않는다.","type":"world","kind":"세계 설정","tags":["분기","합류","개인 세계"],"sections":[{"id":"place","title":"집 하나로 먼저 이해하기","blocks":[{"type":"paragraph","text":"만경에 입주한 사람은 자신이 살 환경을 고른다. 익숙한 집이어도 되고, 상상한 행성이어도 된다. 실제 사람과 만나는 날에는 서로의 동의를 받아 공간을 겹친다. 각자 다른 집에서 살다가 같은 부엌에서 저녁을 만드는 식이다.","id":"place-p1","terms":["만경"]}]},{"id":"split","title":"분기 · 싫은 결과를 강요하지 않기","blocks":[{"type":"paragraph","text":"두 사람이 다른 결말을 원하면 그 장면을 나눌 수 있다. 자동 분기는 본인이 미리 선택했을 때만 작동한다. 말다툼이 불편하다고 만경이 몰래 관계를 끝내거나 말을 바꾸지는 않는다.","id":"split-p1","terms":["만경","분기"]},{"type":"paragraph","text":"각 장면에서 필요해진 상대 역할은 보통 꿈배역이 맡는다. 따로 느끼고 고통받는 의식은 없다. 실제 사람을 원하는 역할에 붙잡아두지 않고도 그 사람과 함께하는 듯한 삶을 경험할 수 있다.","id":"split-p2","terms":["꿈배역"]}]},{"id":"meet","title":"합류 · 같은 과거 없이도 함께하기","blocks":[{"type":"paragraph","text":"분기 이후 다시 만나고 싶어지면 실제 사람끼리 같은 자리를 연다. 서로의 기억을 하나로 고칠 필요는 없다. 각자가 어떤 삶을 살았는지 말하고, 그 순간부터 새 일을 함께 한다.","id":"meet-p1","terms":["분기"]},{"type":"paragraph","text":"같은 대회의 서로 다른 우승자가 카페에서 만나도 모순은 없다. 각자 다른 결말의 경기를 치렀기 때문이다. 카페에서 이어지는 대화는 지금 두 사람이 함께하는 사건이다.","id":"meet-p2","terms":[]}]},{"id":"truth","title":"무엇을 선택했는지는 알 수 있다","blocks":[{"type":"paragraph","text":"입주할 때 실제 만남, 인격 분기, 꿈배역의 차이를 이해할 수 있게 설명한다. 매 순간 안내문을 보지 않아도 되지만, 원할 때 상대의 종류와 함께한 범위를 확인할 수 있다. 모른 채 속는 것을 기본값으로 삼지 않는다.","id":"truth-p1","terms":["꿈배역","분기"]},{"type":"paragraph","text":"완전히 몰입하는 환상을 선택할 수도 있다. 안내를 잠시 가리는 선택과, 운영자가 거짓말하는 것은 다르다. 도움과 설명으로 돌아오는 길은 남는다.","id":"truth-p2","terms":[]}]},{"id":"everyday","title":"원래 세계도 버려지지 않는다","blocks":[{"type":"paragraph","text":"입주하지 않은 시민에게도 생활과 안전이 보장된다. 남는 사람을 희생시켜 낙원을 유지하지 않는다. 누구도 이주를 거절했다는 이유로 열등한 시민이 되지 않는다.","id":"everyday-p1","terms":[]},{"type":"paragraph","text":"만경은 점수판을 지우고 그 자리에 더 높은 깨달음의 점수판을 놓지 않는다. 경쟁을 즐기는 삶, 서툴게 배우는 삶, 완성된 재능을 얻는 삶, 아무것도 생산하지 않는 삶을 모두 허용한다.","id":"everyday-p2","terms":["만경"]}]}],"sources":[],"relations":[{"target":"identity","label":"만나는 상대","reason":"꿈배역과 실제 인격.","evidence":{"entry":"identity","anchor":"real","label":"실제 상대"}},{"target":"customs","label":"살아보기","reason":"식사·휴식·경기.","evidence":{"entry":"customs","anchor":"visit","label":"방문 예절"}},{"target":"clocks","label":"시간과 재회","reason":"누구의 여섯 시인가.","evidence":{"entry":"clocks","anchor":"simple","label":"한 줄의 규칙"}}],"spoiler":false,"shortTitle":"만경","preview":"각자 원하는 현실을 살고, 서로 원할 때 실제로 만나는 낙원.","readingMinutes":1,"requires":[]},{"id":"rules","title":"창조권 — 가능한 일과 선택하지 않는 일","summary":"전능을 약하게 만들지 않고, 힘의 사용에 관한 판단을 분리한다.","type":"world","kind":"세계 설정","tags":["전능","동의","사용 원칙"],"sections":[{"id":"power","title":"현실을 만드는 힘","blocks":[{"type":"paragraph","text":"백지의 현실 구성 능력은 물질, 신체, 환경, 시간 경험, 기억과 마음의 상태를 바꿀 수 있다. 치료·능력 향상·귀환도 가능하다. 주민이 받는 창조권은 이 힘을 자기 삶에 쓰는 권한이다. 만경은 연료 부족, 수용 인원, 운영자의 죽음 때문에 무너지지 않는다.","id":"power-p1","terms":["창조권","만경"]},{"type":"paragraph","text":"이는 작품의 판타지 전제다. 실제 과학으로 검증된 기술인 것처럼 설명하지 않는다. 편리한 순간에만 전능하고, 논쟁이 시작되면 갑자기 무력해지는 힘으로 쓰지 않는다.","id":"power-p2","terms":[]}]},{"id":"consent","title":"할 수 있지만, 기본적으로 하지 않는 일","blocks":[{"type":"paragraph","text":"사람의 마음을 바꿔 자신의 정책에 동의하게 하는 일은 가능하다. 에이렌은 그것을 설득으로 부르지 않는다. 본인이 이해하고 요청한 변화는 제공하지만, 다투는 상대의 반대를 몰래 지우는 방식은 쓰지 않는다.","id":"consent-p1","terms":["에이렌"]},{"type":"paragraph","text":"리아도 동의 없는 기억 조작에는 반대한다. 신체를 옮기는 능력이 없어서 출석이 안 되는 것은 아니다. 시민심판의 요청이 실제 당사자의 보호 경계를 넘어설 정당한 권한을 만드는지 두 사람이 다툰다. 에이렌 혼자 경계를 끄면 해결되는 구조는 아니다.","id":"consent-p2","terms":["라잔","리아"]}]},{"id":"past","title":"과거를 바꾸는 일도 숨은 정답이 아니다","blocks":[{"type":"paragraph","text":"다른 과거를 살아온 갈래를 열어주는 것은 가능하다. 그 삶을 선택한 사람도 존중받는다. 그러나 지금의 기억과 판단을 지키겠다는 당사자까지 바꾸지 않았다면, 그 사람이 요구하는 책임은 여전히 남을 수 있다.","id":"past-p1","terms":[]},{"type":"paragraph","text":"다른 갈래에서 라잔이 좋은 지도자였다는 사실로 지금 갈래의 명령 기록을 거짓이라고 만들지 않는다. 모든 갈래가 똑같이 중요하기 때문에, 한 갈래의 좋은 결과가 다른 갈래의 사건을 대신하지도 않는다.","id":"past-p2","terms":["라잔"]}],"readerLayer":"commentary","reveal":true},{"id":"boundary","title":"개인 세계의 경계","blocks":[{"type":"paragraph","text":"만경은 실제 타인에게 해를 끼치는 접촉을 차단한다. 해치려는 사람이 원하는 장면은 꿈배역과 개인 환경으로 돌릴 수 있다. 이 보호는 피해자, 가해자, 반대자에게 같은 방식으로 적용된다.","id":"boundary-p1","terms":["꿈배역","만경"]},{"type":"paragraph","text":"백지의 능력과 주민에게 보장되는 사용 권한은 다르다. 자기 세계를 만들 권한이 다른 실제 인격의 몸·기억·행동을 덮어쓸 권한까지 포함하지는 않는다. 에이렌도 이 규칙을 우회하는 관리자 열쇠가 없다. 공동 공간의 운영을 바꾸는 것과, 동의하지 않은 타인의 개인 세계에 강제로 개입하는 것은 별개의 일이다.","id":"boundary-p2","terms":["창조권","만경"]}]},{"id":"debate","title":"그 경계도 토론의 대상이다","blocks":[{"type":"paragraph","text":"공적 책임을 위한 강제 출석을 보호의 예외로 둘지는 정치적·윤리적 판단이다. 에이렌은 예외 없이 거절을 보호하려 하고, 리아는 범위가 제한된 공적 심판에는 예외가 가능하다고 본다.","id":"debate-p1","terms":["공적 책임","에이렌","리아"]},{"type":"paragraph","text":"에이렌은 이 선택을 우주의 불변 법칙인 척하지 않는다. 더 나은 원칙이 제안되면 검토할 수 있다. 다만 다수의 찬성만으로 특정 당사자의 거절을 무시할 권한이 생긴다고 보지는 않는다. 리아는 그 판단에도 반대할 수 있다.","id":"debate-p2","terms":["에이렌","리아"]}]},{"id":"autonomy","title":"창조자를 죽여도 끝나지 않는다","blocks":[{"type":"paragraph","text":"개인 세계는 한 사람의 집중이나 생명에 매여 있지 않다. 에이렌은 주민을 추방하거나 운영을 중단하는 비밀 권한을 남기지 않는다. 이야기의 해결책은 창조자를 죽이는 스위치를 찾는 일이 아니다.","id":"autonomy-p1","terms":["개인 세계","에이렌"]}]}],"sources":[],"relations":[{"target":"white-room","label":"힘을 얻은 경위","reason":"공동 연구와 첫 사용 규칙.","evidence":{"entry":"white-room","anchor":"discovery","label":"개원 3년 전 · 닫힌 방의 두 창문"}},{"target":"conflict","label":"남은 이견","reason":"힘보다 허용 범위의 문제.","evidence":{"entry":"conflict","anchor":"request","label":"단 하나의 구체적인 요청"}}],"spoiler":false,"shortTitle":"창조권","preview":"현실을 만드는 힘을 자기 삶에 사용하는 권한. 실제 타인의 선택까지 대신하는 권한은 아니다.","readingMinutes":2,"requires":[]},{"id":"identity","title":"실제 상대·새갈래·꿈배역","summary":"가치의 등급이 아니라, 함께한 상대가 누구인지 구분하는 말이다.","type":"world","kind":"세계 설정","tags":["인격","환상","관계"],"sections":[{"id":"real","title":"실제 상대","blocks":[{"type":"paragraph","text":"지금 자기 의식으로 그 만남에 참여하는 사람이다. 몸이 가상으로 보이거나 물질이 아니라는 이유로 덜 실제적이지 않다. 무엇을 느끼고 원하는 당사자가 있으면 인격으로 대한다.","id":"real-p1","terms":[]}]},{"id":"branch","title":"새갈래","blocks":[{"type":"paragraph","text":"한 사람이 여러 삶을 이어가기로 선택해 분기한 뒤의 각 인격이다. 어느 갈래도 불량 복제본이 아니다. 분기 전의 기억을 함께 갖지만, 그 이후에는 자기 의사를 가질 수 있다.","id":"branch-p1","terms":["분기"]},{"type":"paragraph","text":"함께 살기를 원하는 갈래와 떠나려는 갈래가 생겼다면 각각 그 삶을 잇는다. 관계에서 빠져나온 쪽을 진짜가 아니라며 지우지 않는다. 일반적인 장면 분기마다 의식 있는 사람을 새로 만들어야 하는 것도 아니다.","id":"branch-p2","terms":["분기"]}]},{"id":"dream","title":"꿈배역","blocks":[{"type":"paragraph","text":"상대 역할을 완벽하게 구현하지만 따로 경험하는 의식은 없는 구성물이다. 이 세계에서는 창조권으로 의식이 생기지 않는 구현을 확실히 구분할 수 있다고 정한다. 의식이 있는지 애매한 존재를 편의상 도구로 분류하지 않는다.","id":"dream-p1","terms":["창조권"]},{"type":"paragraph","text":"꿈배역과의 삶에서 느끼는 사랑이나 위안은 실제 경험이다. 다만 그 경험을 실제 상대가 동의하고 행동했다는 공적인 사실로 바꾸어 말하지 않는다.","id":"dream-p2","terms":["꿈배역"]}]},{"id":"claim","title":"선택이 다를 때","blocks":[{"type":"paragraph","text":"아린이 벨과 함께하는 꿈의 삶을 선택하고, 벨은 혼자 살 수 있다. 서로 다시 만나기를 원하면 재회한다. 아린의 삶을 거짓 행복으로 만들 이유도, 벨이 함께 살았다는 기억을 강제로 심을 이유도 없다.","id":"claim-p1","terms":[]},{"type":"paragraph","text":"라잔의 다른 갈래가 자발적으로 출석할 수도 있다. 그 갈래의 책임 이행은 실제 행동이다. 그러나 떠나려는 갈래의 거절을 무시할 권한까지 자동으로 생기지는 않는다. 쟁점은 원본 영혼의 신비가 아니라, 서로 다른 당사자를 서로 대신 강제할 수 있느냐에 있다.","id":"claim-p2","terms":["라잔"]}],"readerLayer":"commentary","reveal":true}],"sources":[],"relations":[{"target":"yeoul","label":"실제 갈래","reason":"자신의 이름과 선택.","evidence":{"entry":"yeoul","anchor":"beginning","label":"같은 부엌에서 갈라지다"}},{"target":"deep-copies","label":"함께 읽을 작품","reason":"인격은 장면의 소품이 아니다.","evidence":{"entry":"deep-copies","anchor":"reference","label":"현실 자료 · Permutation City"}}],"spoiler":false,"shortTitle":"갈래와 꿈배역","preview":"스스로 분기한 새갈래는 각자의 의식을 갖는다. 꿈배역은 따로 경험하는 의식 없이 역할을 구현한다.","readingMinutes":1,"requires":[]},{"id":"return","title":"귀환 — 되살리는 일과 돌아오는 일","summary":"부활이 가능해지자 장례가 무의미해진 것이 아니다. 초대와 방문을 구별할 일이 생겼다.","type":"world","kind":"세계 설정","tags":[],"sections":[{"id":"life","title":"살릴 힘과 살게 할 권한","blocks":[{"type":"paragraph","text":"창조권은 죽은 사람의 생을 다시 이어줄 수 있다. 이 작품에서는 당사자의 의식과 삶의 연속성이 실제로 이어지는 부활을 전제로 한다. 기록으로 닮은 인물을 만든 새갈래와 구별해서 안내한다. 인격을 평가할 권한이 가족에게 자동으로 생기지는 않는다.","terms":["새갈래","창조권"],"id":"life-p1"},{"type":"paragraph","text":"부활한 사람에게 고통 없는 첫 자리를 보장하고, 현재 상황과 선택지를 설명한다. 돌아온 즉시 가족의 집이나 연인의 침대로 보내지 않는다. 별개의 삶을 시작할 수도 있고, 다시 살아가기를 원하지 않는다는 의사도 존중한다. 이미 존재하지 않던 사람의 사전 동의를 어떻게 다루는가는 해결됐다고 숨기지 않는 경계 문제다. 최초의 접촉을 최소화하고 그 다음을 당사자에게 돌려주는 방식으로 운영한다.","terms":[],"id":"life-p2"}]},{"id":"address","title":"죽은 사람에게도 새 주소가 필요하다","blocks":[{"type":"paragraph","text":"가족이 열어준 집에 영원히 살 의무는 없다. 생전 미성년자였던 자녀가 현재에는 자신보다 나이가 많을 수도 있다. 재회역에는 이름표뿐 아니라 호칭표가 따로 있다. 아버지라고 불리기를 원하면서도 아버지의 옛 권한을 요구하지 않는 사람도 있다.","terms":["재회역"],"id":"address-p1"},{"type":"paragraph","text":"귀환제는 이러한 만남을 돕는 선택 행사다. 부활을 받으려면 축제에 출연해야 하는 것은 아니다. 메이, 나래, 여울의 사정이 같은 무대에서 충돌하는 것은 환대회가 가족 재회와 창건 기념을 함께 기획했기 때문이다.","terms":["귀환제","환대회"
