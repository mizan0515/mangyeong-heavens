[]},{"type":"paragraph","text":"두 사람 모두 완성된 답을 가지고 있지는 않았다. 그렇다고 그 상태가 이미 시행한 살인을 판단하지 못하게 만들지는 않았다.","id":"window-p5","terms":[]}]},{"id":"testament","title":"유언의 앞뒤","blocks":[{"type":"paragraph","text":"아벨은 재판 말기에 이렇게 썼다. “그대들의 낙원이 더 많은 이를 구할 수 있다면, 직접 내 앞길을 끊어내라.” 그는 반대하는 이들에게 자기 정책 대신 당장의 고통을 맡으라고 요구했다. 그것은 진심이었지만, 대안을 완성하지 못한 사람에게도 살인을 거절할 권리가 있다는 점을 회피하는 말이기도 했다.","id":"testament-p1","terms":["아벨"]},{"type":"paragraph","text":"에이렌은 그 문장을 기억한다. 훗날 자기 입으로 같은 말을 할 때, 그는 심판을 피하려고 떠나지 않고 자기 증언석에 앉는다. 문장의 품격은 누가 더 멋있게 말했는지가 아니라, 말한 뒤 자기 판단을 검토할 자리에 남는지로 달라진다.","id":"testament-p2","terms":["에이렌"]},{"type":"paragraph","text":"아벨의 유언과 에이렌의 마지막 선언은 동일한 정치적 결론이 아니다. 되풀이된 문장을 인물의 행동으로 다시 읽게 하는 장치다.","id":"testament-p3","terms":["에이렌","아벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"그 문장이 돌아오는 본편의 끝","entry":"last-scene","anchor":"line"},{"label":"두 창문이 실제가 된 날","entry":"white-room"}],"id":"testament-p4"}]}],"sources":[],"relations":[],"spoiler":false,"era":"개원 32년 전 첫 면회 · 29년 전 두 번째 면회","shortTitle":"개원 29년 전","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"inheritance-war","title":"같은 자비의 다른 후계자들","summary":"살인을 막은 공포가 회복원을 만들고, 회복원의 반대자들이 만경을 연다.","type":"history","kind":"연결된 역사","tags":["인물 연결","제도의 역사","동기"],"sections":[{"id":"network","title":"한 줄 계보 대신 충돌하는 연결","blocks":[{"type":"paragraph","text":"요벨의 생활권은 프로네의 무료 배움터를 지탱했다. 프로네의 도구는 카산의 배정 체계와 레테의 마음 연구에 쓰였다. 아벨과 사벨은 회복 뒤의 삶을 함께 돌봤지만, 긴 저녁에서 서로를 막았다. 리브는 아벨의 집행을 막은 뒤 사벨의 퇴장 심사에도 반대했다.","id":"network-p1","terms":["긴 저녁","생활권","프로네","레테","리브","사벨","아벨","요벨","카산"]},{"type":"paragraph","text":"이들은 누가 진짜 후계자인지 정할 혈통이 없다. 서로의 좋은 기술을 쓰면서 상대의 정치적 결론을 거절한 사람들이다.","id":"network-p2","terms":[]}]},{"id":"recovery","title":"왜 시민들이 회복원을 쉽게 악으로 보지 않았는가","blocks":[{"type":"paragraph","text":"긴 저녁 이후, “이제 충분하다”는 말을 행정이 잘못 듣는 공포가 남았다. 사람들을 죽게 두어서는 안 된다는 원칙이, 스스로 괜찮아질 때까지 전문기관이 퇴장을 관리해야 한다는 원칙으로 넓어졌다. 회복원에는 사벨의 보호 관행, 카산의 예측 서식, 프로네의 교육 도구가 함께 들어갔다.","id":"recovery-p1","terms":["긴 저녁","프로네","회복원","사벨","카산"]},{"type":"paragraph","text":"몇십 년 뒤 라잔은 이 관행을 등대동의 정치적 요구를 누르는 데 썼다. 승급을 포기한 시민 대표를 위험군으로 분류하면서, 생명을 보호하는 것과 기존 서열을 보호하는 것을 섞었다. 모든 직원이 같은 의도로 참여한 것은 아니었다.","id":"recovery-p2","terms":["등대동","라잔"]}]},{"id":"eiren","title":"에이렌에게 생긴 모순","blocks":[{"type":"paragraph","text":"에이렌은 아벨의 살인에 반대했으므로, 사람을 교육하고 살려두는 회복원은 근본적으로 다른 일이라고 생각했다. 그러나 동의하지 않는 상대를 자기 판단이 맞을 때까지 붙잡는 구조에서는 사벨의 문제를 반복했다.","id":"eiren-p1","terms":["에이렌","회복원","사벨","아벨"]},{"type":"paragraph","text":"등대동에서 연장 승인에 서명한 뒤에야 그는 사람을 죽이지 않는 것만으로 충분한 권한을 가진 것이 아니라는 사실을 인정한다. 그의 현재 원칙은 책 한 권의 깨달음이 아니라 자기 실패까지 통과한 선택이다.","id":"eiren-p2","terms":["등대동"]}]},{"id":"ria","title":"리아에게 넘어온 장부","blocks":[{"type":"paragraph","text":"리브가 남긴 주소망은 누가 도움받았는지뿐 아니라, 어떤 제안을 거절했고 어떤 자료 공개를 원치 않았는지도 기록했다. 리아는 그 방식으로 강제 회복원 피해 기록을 모았다. 서안을 먼저 데려오기 위해 접었던 공동 기록을 다시 여는 데도 쓰였다.","id":"ria-p1","terms":["주소망","회복원","리브","리아","서안"]},{"type":"paragraph","text":"그러나 리아 역시 동생과 나래, 여울의 말이 자기 주장에 불리할 때 그 말을 줄이고 싶은 유혹을 겪는다. 좋은 역사의 후계자도 같은 시험에서 자동으로 면제되지는 않는다.","id":"ria-p2","terms":["나래","리아","여울"]}]},{"id":"inherit","title":"만경은 유산을 어떻게 받았나","blocks":[{"type":"paragraph","text":"만경은 능력 향상도, 마음의 변화도, 안정된 공동체도 금지하지 않는다. 이전 해법이 잘 작동한 사람에게서는 남기고, 한 사람의 해법을 모두에게 강제하는 권한은 넘겨받지 않는다. 기술이 발전해서 과거 전체가 무가치해진 것은 아니다.","id":"inherit-p1","terms":["만경"]},{"type":"paragraph","text":"백지의 공동 연구진이 물리적 가능성을 열었다. 요벨과 프로네와 리브의 성취, 아벨과 카산과 레테와 사벨의 잘못을 읽은 사람들이 그 힘의 사용 조건을 다퉜다. 에이렌은 이 대화의 대표자이지 모든 발명을 혼자 해낸 신이 아니다.","id":"inherit-p2","terms":["에이렌","프로네","레테","리브","백지","사벨","아벨","요벨","카산"]}]}],"sources":[],"relations":[],"spoiler":false,"shortTitle":"같은 자비의 다른 후계자들","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"giants-synopsis","title":"거인들의 유언 — 연결된 여섯 장면","summary":"처음에는 빵을 공짜로 주려 했다. 마지막에는 사람이 내일을 선택해도 되는지를 다투게 됐다.","type":"story","kind":"장면","tags":["전체 줄거리","두 번째 이야기","결말"],"sections":[{"id":"one","title":"1 · 살아 돌아온 범죄자","blocks":[{"type":"paragraph","text":"귀환제 다음 달. 아벨이 안전한 설명을 듣고 다시 살아갈 것을 선택한다. 이사는 그의 첫 공개 면담에 참석한다. 만경이 그의 옛 꿈과 닮았다는 소식에 추종자들은 긴 저녁을 인류의 진보가 치른 값으로 다시 부르려 한다. 에이렌은 자기 낙원을 그 주장과 분리해야 하고, 리아는 좋은 결과가 과거를 고쳐 쓰는 현장을 마주한다.","id":"one-p1","terms":["긴 저녁","귀환제","에이렌","리아","만경","아벨","이사"]}]},{"id":"two","title":"2 · 같은 도시가 한때 훨씬 나아졌던 날","blocks":[{"type":"paragraph","text":"요벨이 생활권을 만들고 프로네가 기술을 공개하는 과거가 이어진다. 독자는 시민들이 왜 제도를 지지했고, 왜 또 다른 해법을 원했는지 본다. 이들이 실제로 도왔다는 사실을 지우지 않은 상태에서 카산·레테·사벨의 선택이 등장한다.","id":"two-p1","terms":["생활권","프로네","레테","사벨","요벨","카산"]}]},{"id":"three","title":"3 · 마지막 저녁 전의 저녁","blocks":[{"type":"paragraph","text":"아벨과 사벨이 병동 식탁에서 갈라진다. 리브는 미래를 보장할 수 없지만 오늘 죽지 않겠다는 사람의 대피를 돕는다. 선집행 312명의 죽음을 막지는 못했고, 전 도시로 확대되는 것은 막는다. 승리한 보호 체계 안에서 다시 퇴소를 거절당하는 사람이 생기는 장면으로 과거의 막이 닫힌다.","id":"three-p1","terms":["리브","사벨","아벨"]}]},{"id":"four","title":"4 · 제자는 다른 죽음을 선택하지 않았다","blocks":[{"type":"paragraph","text":"청년 에이렌이 감옥의 아벨을 만난다. 같은 진단에 공감해도 같은 처방에 동의할 필요는 없다는 것을 배운다. 그러나 교육자가 된 에이렌도 회복원에서 자신의 판단으로 남을 기다리게 한다. 이 연결은 귀환의 서에서 그가 왜 스스로 피고석에 앉는지에 새로운 무게를 준다.","id":"four-p1","terms":["에이렌","회복원","아벨"]}]},{"id":"five","title":"5 · 내 귀환을 네 계획의 마지막 장으로 쓰지 마","blocks":[{"type":"paragraph","text":"현재의 추종자들은 희생자들이 부활했고 일부는 행복하다는 사실로 긴 저녁의 사망 분류를 되돌리자고 요구한다. 그들이 원하는 개인적 환상까지 금지하지는 않는다. 그러나 공적 사건의 당사자를 대신해 그들이 처음부터 죽음을 원했다고 말할 수는 없다. 이사는 자기 삶이 아벨의 계획을 완성한 것이 아니라고 말한다.","id":"five-p1","terms":["긴 저녁","아벨","이사"]}]},{"id":"six","title":"6 · 찬성문과 판결문은 같은 종이가 아니다","blocks":[{"type":"paragraph","text":"아벨은 만경을 지지하는 수정 서문을 발표하고, 범죄 기록을 장기 수면으로 바꾸는 청원에 반대한다. 리아는 그 문서를 받아들이되 공적 유죄 판단과 분리한다. 에이렌은 아벨의 이름을 역사에서 지우지 않고, 원하지 않는 피해자에게 그의 기념관을 통과해야만 낙원에 들어가게 하지 않는다.","id":"six-p1","terms":["에이렌","리아","만경","아벨"]},{"type":"paragraph","text":"마지막 장면은 화해의 단체 사진이 아니다. 이사는 가게로, 사벨은 자발적 생활 안내소로, 에이렌은 예정된 추가 심문으로 간다. 아벨은 면담실에 남아 다음 사람이 자기를 만나겠다고 할지 기다린다. 이번에는 그 기다림을 끝내기 위해 상대의 결정을 지우지 않는다.","id":"six-p2","terms":["에이렌","사벨","아벨","이사"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"장면으로 다시 시작","entry":"giants-opening"},{"label":"8년 뒤의 수정 서문","entry":"future-abel"},{"label":"먼 미래의 작은 박물관","entry":"future-countermonument"}],"id":"six-p3"}]}],"sources":[],"relations":[{"target":"giants-opening","label":"첫 장면","reason":"판정이 아니라 대면에서 이야기를 시작한다.","evidence":{"entry":"giants-opening","anchor":"arrival","label":"귀환제 다음 달 · 대기실의 남자"}}],"spoiler":true,"shortTitle":"거인들의 유언","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"future-abel","title":"8년 뒤 — 학살자가 쓴 찬성문","summary":"자신이 원했던 더 좋은 세상이 왔을 때, 그 도착을 자기 과거의 정당화로 쓰지 않는 일.","type":"future","kind":"후일담","tags":["아벨","책임","후일담"],"sections":[{"id":"new","title":"새 책의 서문","blocks":[{"type":"paragraph","text":"아벨은 《모두를 위한 마지막 저녁》을 절판하지 않는다. 과거의 주장과 바뀐 판단을 같은 판본에 싣고, 범죄를 가리는 표지를 붙이지 않는다. 책의 판매 성과가 누군가의 생활권을 결정할 이유도 없지만, 그 이름으로 열리는 강연에 피해자가 참석할 의무도 없다.","id":"new-p1","terms":["모두를 위한 마지막 저녁","생활권","아벨"]},{"type":"paragraph","text":"새 서문은 만경을 지지한다. 사람이 버텨야만 존중받는 조건을 없앤 점, 하나의 질서를 강제하지 않은 점, 자신 같은 사람도 더 이상 남을 해칠 수 없게 한 점에 찬성한다.","id":"new-p2","terms":["만경"]}]},{"id":"without","title":"용서 없이도 바뀔 수 있는가","blocks":[{"type":"paragraph","text":"한 독자가 그에게 물었다. 아무도 용서하지 않는다면 왜 계속 설명하고 고치려 하느냐고.","id":"without-p1","terms":[]},{"type":"dialogue","speaker":"아벨","text":"그들이 나를 용서하게 만드는 일이 목적이었다면, 여전히 그 사람들을 내 결말의 도구로 삼는 셈이겠지.","id":"without-p2","terms":[]},{"type":"paragraph","text":"그는 자기 변화가 새로운 명예가 되는 일을 경계한다. 그 경계마저 훌륭한 악당의 인기 있는 인용문이 되어버리는 것을 완전히 통제할 수는 없다.","id":"without-p3","terms":[]}]},{"id":"letter","title":"답장하지 않은 사람","blocks":[{"type":"paragraph","text":"이사는 책을 받았다는 확인만 보냈다. 읽었는지, 동의했는지, 용서했는지는 쓰지 않았다. 아벨은 세 칸이 따로 있는 이유를 이제 안다. 답을 채워달라는 두 번째 편지는 보내지 않았다.","id":"letter-p1","terms":["아벨","이사"]}]}],"sources":[],"relations":[{"target":"deep-lethe","label":"빈 동의 칸","reason":"도착과 동의는 다른 사건이다.","evidence":{"entry":"deep-lethe","anchor":"source","label":"원전 · 잊음의 이름"}}],"spoiler":true,"era":"개원 8년 뒤","shortTitle":"8년 뒤","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"future-countermonument","title":"120년 뒤 — 거인이 아닌 사람들의 박물관","summary":"유명한 일곱 사람 아래, 그들에게 불려갔다가 이름을 돌려받은 사람들의 기록이 열린다.","type":"future","kind":"후일담","tags":["거인","교과서","박물관"],"sections":[{"id":"hall","title":"예전의 일곱 초상화","blocks":[{"type":"paragraph","text":"교과서는 요벨에서 리브까지를 일곱 거인이라 불렀다. 박물관의 한 방에는 그 이름과 업적이 여전히 있다. 그들을 전부 악당이나 전부 현자로 바꾸는 것은 어느 쪽이든 쉽다.","id":"hall-p1","terms":["리브","요벨"]}]},{"id":"new","title":"이름 없는 계단은 누가 걸었는가","blocks":[{"type":"paragraph","text":"새 전시는 낮은 방에서 시작한다. 프로네의 도구를 받고도 음악 대신 정원을 선택한 사람, 레테의 치료를 유지하면서 강제 적용에 항의한 사람, 사벨에게 구조받고 사벨에게 퇴소를 요구한 사람의 말이 나온다.","id":"new-p1","terms":["프로네","레테","사벨"]},{"type":"paragraph","text":"아벨의 면회록보다 이사의 가게 영업 시간이 먼저 적혀 있다. 방문자는 이사가 누구에게 어떤 의미였는지, 그를 죽인 사람의 철학을 먼저 읽지 않고도 알 수 있다.","id":"new-p2","terms":["아벨","이사"]}]},{"id":"ending","title":"박물관이 가르치지 않기로 한 마지막 수업","blocks":[{"type":"paragraph","text":"출구에는 투표기가 없다. 일곱 중 누가 가장 옳았는지 고르라고 하지 않는다. 대신 오늘 문을 닫는 시간을 안내한다. 직원도 집에 가기 때문이다.","id":"ending-p1","terms":[]},{"type":"paragraph","text":"관람을 마친 어린아이가 묻는다. “그런데 저 사람들을 왜 다 거인이라고 불러?”","id":"ending-p2","terms":[]},{"type":"dialogue","speaker":"안내자","text":"멀리서 보면, 밑에 있던 사람들이 잘 안 보였거든.","id":"ending-p3","terms":[]}]},{"id":"not-heroes","title":"312명 전부에게 공적을 찾지 않는 전시","blocks":[{"type":"paragraph","text":"개원 120년 뒤, 학생 하나가 이사의 지도 앞에서 묻는다. 그럼 길을 그려줘서 살아야 했던 사람이냐고. 안내자는 옆의 기록들을 보여준다. 그날 다른 사람을 구하지 못했던 이름도, 끝내 아무 말도 남기지 못한 이름도 있다.","id":"not-heroes-p1","terms":["이사"]},{"type":"paragraph","text":"전시에서는 그 이름마다 숨겨진 선행을 만들어 붙이지 않는다. 누군가를 살렸다고 알아봐야만 그를 살해한 일을 잘못이라고 말할 수 있는 것은 아니다. 회복원에서 빠져나온 뒤까지 다시 기여도를 제출하게 하지 않는다.","id":"not-heroes-p2","terms":["회복원"]},{"type":"paragraph","text":"옆방에는 이름을 공개하지 않기로 한 귀환자들의 빈 전시대가 있다. 당사자의 기록을 삭제한 것이 아니라, 지금 이곳에서 생애를 전시하지 않겠다는 선택이다. 관람객은 모두의 삶을 끝까지 읽어야 나갈 수 있는 미로에 들어온 것이 아니다.","id":"not-heroes-p3","terms":[]}]}],"sources":[],"relations":[{"target":"names-of-giants","label":"이름의 높이","reason":"거인으로 묶는 말이 누구를 가리는지 본다.","evidence":{"entry":"names-of-giants","anchor":"how","label":"같은 언어에서 나온 일곱 이름은 아니다"}}],"spoiler":true,"era":"개원 120년 뒤","shortTitle":"120년 뒤","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"names-of-giants","title":"이름을 읽으면 아직 오지 않은 장면이 보인다","summary":"나팔, 불, 예언, 망각, 쉼, 방주, 생명. 이름을 정답이 아니라 나중에 뒤집히는 첫인상으로 쓴다.","type":"guide","kind":"읽기 길잡이","tags":["이름 사전","단어 놀이","원전 안내"],"sections":[{"id":"how","title":"같은 언어에서 나온 일곱 이름은 아니다","blocks":[{"type":"paragraph","text":"해원은 구조선 시대부터 서로 다른 언어권의 이름을 받아왔다. 인물의 성격을 이름의 뜻으로 증명하지 않는다. 이곳의 이름은 독자에게 주는 연상이며, 성씨와 세부 생애는 별도로 만든 이야기다. 원전의 사건이 실제 해원의 역사였다는 설정도 아니다.","id":"how-p1","terms":["해원"]}]},{"id":"list","title":"한 단어에서 한 장면으로","blocks":[{"type":"paragraph","text":"요벨 세라: 희년의 뿔나팔에서 시작해 빚을 갚지 않아도 되는 배급구로 간다. 프로네 다엔: 불을 나누는 신화의 소리를 변주해, 선물을 받아도 쓰지 않을 자유를 묻는다. 카산 로: 믿지 않는 예언자를 너무 많이 믿는 배정관으로 뒤집는다.","id":"list-p1","terms":["프로네 다엔","요벨 세라","카산 로","프로네","요벨","카산"]},{"type":"paragraph","text":"레테 미르: 망각의 강에서 출발하지만, 실제 핵심 소품은 지우지 않은 거절서다. 사벨 오르: 안식과 질서의 소리를 연상시키는 창작 이름이며, 히브리어의 정확한 합성어라고 주장하지 않는다. 아벨 노에: 살해된 사람의 이름과 위로를 기대하며 붙인 이름을 가해자에게 겹친다. 리브 아렌: 재난 뒤 살아남는 생명의 이름을, 재난 전에 사람을 남겨두지 않는 인물에게 준다.","id":"list-p2","terms":["레테 미르","리브 아렌","사벨 오르","아벨 노에","레테","리브","사벨","아벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"요벨: 빚과 나팔","entry":"deep-jubilee"},{"label":"프로네: 불과 사다리","entry":"deep-open-fire"},{"label":"카산: 너무 믿은 예언","entry":"deep-cassan"},{"label":"레테: 망각과 원본","entry":"deep-lethe"},{"label":"사벨: 쉬는 날과 질서","entry":"deep-order-rest"},{"label":"아벨: 방주와 빈자리","entry":"deep-abel"},{"label":"리브: 생명과 주소","entry":"deep-liv"}],"id":"list-p3"}]},{"id":"reader","title":"모르면 장면, 알면 두 번째 장면","blocks":[{"type":"paragraph","text":"원전을 몰라도 배급표를 넣어두는 노인, 두 칸으로 나뉜 동의서, 창문 두 개를 그리는 죄수를 이해할 수 있다. 원전을 알면 왜 하필 그 이름과 물건인지 한 번 더 읽을 수 있다. 이름이 반전을 전부 설명하지는 않는다.","id":"reader-p1","terms":[]},{"type":"paragraph","text":"이사 렌의 이름에는 확정된 종교 어원을 붙이지 않았다. 한국어의 “이사”와, 살아 돌아온 사람이 자기 가게의 새 주소를 고르는 장면을 가볍게 겹친다. 그 사람의 모든 말이 학살에 관한 증언일 필요는 없다.","id":"reader-p2","terms":["이사 렌","이사"]}]}],"sources":[],"relations":[],"spoiler":false,"shortTitle":"이름을 읽으면 아직 오지 않은 장면이 보인다","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-jubilee","title":"요벨 — 빚을 지우는 나팔이 울린 뒤","summary":"구조받은 사람이 평생 갚아야 하는 것은 무엇인가.","type":"deep","kind":"원전과 변형","tags":["희년","구조 채무","요벨"],"sections":[{"id":"source","title":"원전 · 희년의 나팔","blocks":[{"type":"paragraph","text":"레위기 25장은 희년의 선포, 집과 땅으로 돌아감, 종속된 동족의 해방을 연결한다. USCCB 역주는 yobel과 숫양의 뿔나팔을 연결한다. 다만 본문의 규정은 고대의 신분 구별을 남기므로 현대의 보편적 권리 선언과 같다고 설명하면 안 된다.","citation":"jubilee","id":"source-p1","terms":[]}]},{"id":"turn","title":"변형 · 도시가 요구하던 목숨값","blocks":[{"type":"paragraph","text":"요벨의 이름에서 가져온 것은 모든 고대 규정이 아니라, 갚는 시간이 끝날 수 있다는 이미지다. 그는 구조선에 진 빚을 개인의 시민권보다 오래 살아남게 하지 않으려 했다. 원전보다 넓은 보편적 생활권은 해원에서 새로 만든 법이다.","id":"turn-p1","terms":["생활권","요벨","해원"]},{"type":"paragraph","text":"그렇다고 구조받은 사람들이 감사하지 않아야 한다고 말하지는 않는다. 감사할 마음이 있는 것과 감사를 행정이 계속 청구하는 것은 다르다.","id":"turn-p2","terms":[]}]},{"id":"payoff","title":"회수 · 안주머니 속 손목표","blocks":[{"type":"paragraph","text":"손목표를 버리지 않은 노인은 새 법을 반대한 것이 아니다. 오래 갚아온 시간이 자기 삶의 일부였기 때문이다. 요벨이 끝내는 것은 그 기억이 아니라 다음 청구다.","id":"payoff-p1","terms":["요벨"]},{"type":"paragraph","text":"만경에서 에이렌을 기억하는 기념관도 같은 질문을 받는다. 그가 실제로 구했다는 사실은 남는다. 그에게 감사하는 의식에 참석해야만 시민이 될 수 있다는 조건은 남지 않는다.","id":"payoff-p2","terms":["에이렌","만경"]}],"reveal":true}],"sources":[{"id":"jubilee","title":"레위기 25장 · 희년과 나팔","url":"https://bible.usccb.org/bible/leviticus/25","locator":"25:8–17과 25:9 역주. yobel과 숫양의 뿔나팔의 연결. 고대 규정의 적용 대상과 창작 속 보편적 생활권은 같지 않다."}],"relations":[],"spoiler":false,"shortTitle":"요벨","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-open-fire","title":"프로네 — 불을 받아도 불을 피우지 않을 권리","summary":"신화의 선물 다음에 오는 사람의 하루.","type":"deep","kind":"원전과 변형","tags":["프로메테우스","선물","능력"],"sections":[{"id":"source","title":"원전 · 도구를 나누는 존재","blocks":[{"type":"paragraph","text":"프로메테우스 전승에는 인간에게 불과 기술을 가져오는 행위와 그에 대한 처벌이 연결되어 있다. 프로네라는 이름은 그 소리를 줄여 만든 변형이다. 같은 어원을 지닌 실제 인명이라고 설명하지 않는다.","citation":"prometheus","id":"source-p1","terms":["프로네"]}]},{"id":"gift","title":"변형 · 사다리가 낮아져도 꼭대기가 넓어지지는 않는다","blocks":[{"type":"paragraph","text":"프로네는 진짜 능력을 나눠준다. 그 기술은 가짜 각성도, 남의 생명을 태우는 대가도 아니다. 그래서 다음 장면이 중요해진다. 모두가 더 높이 올라갔는데, 공헌청은 여전히 꼭대기의 정원을 소수에게만 개방한다.","id":"gift-p1","terms":["공헌청","프로네"]},{"type":"paragraph","text":"그의 실패를 “아무 효과도 없었다”로 줄이면 무료 치료를 받은 사람의 삶이 사라진다. 개선한 것과 남겨둔 것을 함께 본다.","id":"gift-p2","terms":[]}]},{"id":"payoff","title":"회수 · 선물 상자에 붙이지 않은 사용 기한","blocks":[{"type":"paragraph","text":"만경의 배움터에는 프로네의 도구가 계속 있다. 어떤 주민은 그것을 쓰고 어떤 주민은 서툰 상태로 만들기를 즐긴다. 도구를 거절하는 사람은 발명가를 모욕한 것이 아니다.","id":"payoff-p1","terms":["프로네","만경"]},{"type":"paragraph","text":"불을 가져오는 영웅 다음에는, 오늘 불을 피우지 않겠다는 사람의 이야기도 있어야 한다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"prometheus","title":"프로메테우스 · 고전 원문 모음","url":"https://www.theoi.com/Titan/TitanPrometheus.html","locator":"Theoi가 수록한 헤시오도스 등 고전의 불과 기술 전승. 프로네는 그 이름의 소리를 줄인 창작 이름이다."}],"relations":[],"spoiler":false,"shortTitle":"프로네","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-cassan","title":"카산 — 아무도 믿지 않는 예언, 모두가 믿는 예측","summary":"예언이 맞았는가보다, 맞게 만들기 위해 어떤 문을 닫았는가.","type":"deep","kind":"원전과 변형","tags":["카산드라","예측","조건"],"sections":[{"id":"source","title":"원전 · 카산드라의 불신","blocks":[{"type":"paragraph","text":"아폴로도로스의 《도서관》 3.12.5는 카산드라가 예언 능력을 얻지만 그 말을 믿게 하는 힘을 잃는 이야기를 전한다. 카산 로는 그 이름과 불신의 구조를 변주한 인물이다.","citation":"cassandra","id":"source-p1","terms":["카산 로","카산"]}]},{"id":"inverse","title":"변형 · 이번에는 너무 잘 믿는다","blocks":[{"type":"paragraph","text":"카산의 모형은 고장 난 기계가 아니다. 정비 사고를 줄이고 적절한 교육을 권하며 실제로 도움을 준다. 그러나 지원할 사람을 고르는 근거가 된 순간, 지원받지 못한 사람이 실패하는 결과까지 모형의 정확도로 계산된다.","id":"inverse-p1","terms":["카산"]},{"type":"paragraph","text":"여기서 예측은 미래를 보아온 마법이 아니라, 현재 조건으로 다음 가능성을 계산하는 기술이다. 조건을 바꾼 행정이 자기 영향을 빼고 “역시 맞았다”고 말하는 것이 문제다.","id":"inverse-p2","terms":[]}]},{"id":"payoff","title":"회수 · 지워진 접속어","blocks":[{"type":"paragraph","text":"카산의 원문에서 중요한 것은 결론보다 “이 조건에서는”이라는 앞부분이다. 훗날 나래와 여울에게도 비슷한 일이 생긴다. 다른 세계에서 이백 년을 산 사람이 용서했다는 사실에서, 조건을 지우면 “당신은 언젠가 용서한다”라는 명령이 된다.","id":"payoff-p1","terms":["나래","여울","카산"]},{"type":"paragraph","text":"예측표와 용서장은 같은 종이가 아니다. 하지만 둘 다 앞뒤를 잘라서 한 사람의 다음 결정을 대신 쓰는 데 사용될 수 있다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"cassandra","title":"아폴로도로스 · 도서관 3권","url":"https://www.theoi.com/Text/Apollodorus3.html","locator":"3.12.5. 카산드라의 예언을 믿지 않게 되는 이야기. 카산 로의 이름은 이 불신을 과신으로 뒤집는 장치다."}],"relations":[],"spoiler":false,"shortTitle":"카산","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-lethe","title":"레테 — 망각의 강에 띄우지 않은 거절서","summary":"나중에 행복해졌다는 답장과, 먼저 보냈던 거절은 함께 남는다.","type":"deep","kind":"원전과 변형","tags":["레테","기억","동의서"],"sections":[{"id":"source","title":"원전 · 잊음의 이름","blocks":[{"type":"paragraph","text":"레테는 고전에서 망각과 연결되는 이름이며, 저승의 강과도 연결된다. 여기서는 그 이미지를 빌리되 마음을 돕는 일이 반드시 기억을 지우는 일이라는 규칙은 만들지 않았다.","citation":"lethe","id":"source-p1","terms":["레테"]}]},{"id":"forms","title":"변형 · 두 칸의 문서","blocks":[{"type":"paragraph","text":"레테의 치료 뒤 설문에는 처음에 하나의 칸이 있었다. “좋아졌습니까?” 이후에는 두 질문이 된다. “지금 상태를 유지하고 싶습니까?”와 “당시의 강제 적용에 동의하십니까?” 둘의 답이 꼭 같지는 않다.","id":"forms-p1","terms":["레테"]},{"type":"paragraph","text":"그는 두 번째 칸이 자신의 업적을 훼손한다고 느꼈다. 기록을 열어두는 일은 잘못을 인정하는 문장보다 어려웠다. 다른 사람들이 그 기록을 어떻게 말할지 통제할 수 없기 때문이다.","id":"forms-p2","terms":[]}]},{"id":"payoff","title":"회수 · 읽었다고 서명한 사람","blocks":[{"type":"paragraph","text":"아벨이 이사에게 새 서문을 보냈을 때 돌아오는 확인은 도착 한 칸뿐이다. 읽음, 동의, 용서는 비어 있다. 레테의 실패에서 배운 양식이 아벨이 기대할 수 있는 답의 범위를 정한다.","id":"payoff-p1","terms":["레테","아벨","이사"]},{"type":"paragraph","text":"망각의 이름을 가진 인물이 남긴 가장 중요한 유산은, 지우지 않아야 하는 문서가 된다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"lethe","title":"레테 · 망각의 강에 관한 고전 원문 모음","url":"https://www.theoi.com/Daimon/Lethe.html","locator":"Theoi 수록 고전 인용. 이름과 강의 이미지를 가져오되, 기억을 반드시 지워야 행복해진다는 설정으로 옮기지 않는다."}],"relations":[],"spoiler":false,"shortTitle":"레테","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-order-rest","title":"사벨과 선데이 — 쉬게 하는 질서, 놓아주는 낙원","summary":"좋은꿈을 악몽이라고 속여 부르지 않고도 보호의 권한을 물을 수 있다.","type":"deep","kind":"원전과 변형","tags":["선데이","페나코니","질서","사벨"],"sections":[{"id":"source","title":"원전 · 질서의 좋은꿈","blocks":[{"type":"paragraph","text":"선데이의 공식 소개는 「질서」의 좋은꿈을 향한 이상을 언급한다. 여기서 참고하는 것은 전투 분류가 아니라, 약한 사람도 보호받을 수 있는 질서의 낙원을 추구한 인물의 방향이다.","citation":"sunday","id":"source-p1","terms":[]},{"type":"paragraph","text":"페나코니 본편의 꿈과 질서라는 연결은 줄거리 자료로도 교차 확인했다. 사벨의 생애·유예궁·귀환 이후의 제안은 만경에서 새로 만든 사건이며, 선데이의 실제 후일담을 요약한 것이 아니다.","citation":"sunday-story","id":"source-p2","terms":["유예궁","만경","사벨"]}]},{"id":"difference","title":"변형 · 좋은 감독과 여러 개의 무대","blocks":[{"type":"paragraph","text":"사벨은 하나의 질서 안에서 누구에게나 좋은 배역을 주려 했다. 에이렌은 서로 양립하지 않는 결말을 나눌 수 있게 한다. 하지만 단지 선택지가 많다는 사실만으로 지친 사람에게 좋은 첫 경험이 보장되지는 않는다.","id":"difference-p1","terms":["에이렌","사벨"]},{"type":"paragraph","text":"사벨이 돌아와 요청한 것은 다시 독재자가 되는 자리가 아니라, 아무 선택도 하지 않은 사람도 오늘 편히 머물 집이다. 담당자 역시 같은 권리를 가지므로, 남을 돌보는 사람이 새 낙원의 영구적인 조연이 되지는 않는다.","id":"difference-p2","terms":["사벨"]}]},{"id":"name","title":"이름 · 안식과 대안식","blocks":[{"type":"paragraph","text":"사벨의 이름은 쉬는 날과 질서를 연상시키도록 만든 소리다. 사벨에게 안식은 편히 살아 있는 하루였다. 아벨에게 대안식은 더 이상 고통을 느끼지 않는 상태로 미끄러졌다. 비슷한 말을 쓰던 동료들이 같은 밤에 서로를 막는다.","id":"name-p1","terms":["사벨","아벨"]},{"type":"paragraph","text":"두 이름이 닮은 것은 혈연의 증거가 아니다. 한 사람이 틀린 답, 한 사람이 정답이라는 도식도 아니다. 사벨은 생명을 지키면서도 그 생명의 퇴장을 제한하는 다른 잘못을 남긴다.","id":"name-p2","terms":["사벨"]}]},{"id":"payoff","title":"회수 · 가장 먼저 열어야 할 창문","blocks":[{"type":"paragraph","text":"유예궁의 창문은 밖을 보여주되 거주자의 문은 감독자가 관리했다. 만경의 기본 집에서는 안내자가 머물 곳을 준비하고, 손님이 떠나겠다고 하면 인계장을 건넨다. “쉬세요”라는 같은 말 다음의 행동이 바뀐다.","id":"payoff-p1","terms":["유예궁","만경"]}],"reveal":true}],"sources":[{"id":"sunday","title":"붕괴: 스타레일 · 선데이 공식 소개","url":"https://wiki.hoyolab.com/pc/hsr/entry/3150?lang=ko-kr","locator":"HoYoWiki 인물 소개: 「질서」의 좋은꿈과 이상을 버리지 않는 인물. 캐릭터 페이지는 동적 페이지이며 색인된 소개문을 확인했다. 전투 속성 「화합」과 본편에서 추구한 「질서」를 혼동하지 않는다."},{"id":"sunday-story","title":"선데이 · 페나코니 줄거리 교차 확인","url":"https://en.wikipedia.org/wiki/Sunday_(Honkai:_Star_Rail)","locator":"2차 자료. 페나코니에서 질서에 기대어 꿈의 낙원을 추구한 줄거리의 범위만 교차 확인. 원작 대사를 그대로 옮기지 않는다."}],"relations":[],"spoiler":false,"shortTitle":"사벨과 선데이","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-abel","title":"아벨 노에 — 방주에 태우지 않은 사람들","summary":"피해자의 이름을 가진 가해자. 위로의 이름을 가진 마지막 저녁.","type":"deep","kind":"원전과 변형","tags":["아벨","노아","전도서","방주"],"sections":[{"id":"abel","title":"원전 · 살해된 사람의 이름","blocks":[{"type":"paragraph","text":"창세기 4장에서 아벨은 카인에게 살해되는 인물이다. 이 이름을 가해자에게 주면 독자가 처음 품은 피해자의 이미지와 실제 행위가 충돌한다. 그의 이름이 죄를 미리 면제해주지는 않는다.","citation":"abel","id":"abel-p1","terms":["아벨"]}]},{"id":"noe","title":"원전 · 위로를 기대한 명명","blocks":[{"type":"paragraph","text":"창세기 5:29에서 노아의 이름은 고된 수고에서 위로를 기대하는 말과 연결된다. 노에는 이 이름을 변주한 창작 이름이다. 글자 그대로의 새로운 어원을 만들어 붙인 것은 아니다.","citation":"noah","id":"noe-p1","terms":[]},{"type":"paragraph","text":"방주는 사람을 살리는 공간이다. 아벨의 계획은 그 자리에 제한된 생존 명부를 놓는다. 그는 진짜 자원이 모자라서 배에 태울 수 없었던 구조선 세대와, 이미 식량이 넉넉한 자기 시대를 같은 절박함으로 묶으려 한다. 그러나 두 상황은 같지 않다.","id":"noe-p2","terms":["아벨"]}]},{"id":"chapter","title":"원전 · 같은 장의 서로 다른 문장","blocks":[{"type":"paragraph","text":"전도서 4장은 억압받는 이의 눈물과 경쟁을 탄식하며 죽은 자와 아직 태어나지 않은 자를 언급한다. 같은 장 뒤쪽에는 넘어진 사람을 동료가 일으키는 장면이 나온다. 이것을 타인의 생을 끝내도 된다는 지시로 읽지는 않는다.","citation":"eccl","id":"chapter-p1","terms":[]}]},{"id":"two","title":"변형 · 앞장을 읽은 의사와 뒷장을 실천한 연락망","blocks":[{"type":"paragraph","text":"해원의 오래된 번역문을 읽은 아벨은 누구도 위로하지 않는 고통에 밑줄을 긋는다. 리브는 서로 일으킬 사람이 있다는 쪽에 표시한다. 두 사람이 같은 책의 다른 대목을 읽었다는 설정은, 책 한 권이 악당을 만들었다는 뜻이 아니다. 각자가 오래 해온 일과 선택이 독서의 무게중심을 만든다.","id":"two-p1","terms":["리브","아벨","해원"]},{"type":"paragraph","text":"리브는 아벨의 책갈피를 뽑지 않는다. 고통이 있다는 사실을 덮으면 그의 반론도 약해지기 때문이다. 대신 기다리는 동안 할 수 있는 일을 조직한다.","id":"two-p2","terms":["리브","아벨"]}]},{"id":"payoff","title":"회수 · 배에 남은 자리는 누구의 것인가","blocks":[{"type":"paragraph","text":"첫 구조선은 이름을 몰라도 먼저 태웠다. 아벨은 이름과 위험 분류를 너무 잘 안다고 믿으며 내렸다. 만경에서는 귀환한 범죄자도 안전한 자리를 얻지만, 그에게 자기 기념관을 세워줄 실제 관객까지 배정하지는 않는다.","id":"payoff-p1","terms":["만경","아벨"]},{"type":"paragraph","text":"그가 돌아와 앉는 의자는 한 사람분이다. 마지막 저녁의 명부보다 작지만, 이번에는 다른 사람의 내일을 없애서 마련한 자리가 아니다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"abel","title":"창세기 4장 · 아벨과 카인","url":"https://www.biblegateway.com/passage/?search=Genesis%204%3A1-16&version=NIV","locator":"4:1–16. 아벨이 살해되는 이야기에서 이름을 빌리고, 창작에서는 피해자의 이름을 지닌 인물이 가해자가 되는 역전을 쓴다."},{"id":"noah","title":"창세기 5장 · 노아의 이름을 붙이는 말","url":"https://bible.usccb.org/bible/genesis/5","locator":"5:29. 고된 일로부터 위로를 가져오리라는 명명 장면. 노에라는 창작 이름은 노아/Noah를 변주한 것이며, 새로운 히브리어 어원을 주장하지 않는다."},{"id":"eccl","title":"전도서 4장 · 탄식과 동행","url":"https://bible.usccb.org/bible/ecclesiastes/4","locator":"USCCB 본문 1–4절과 9–12절. 억압과 경쟁에 대한 탄식 옆에 함께 일어나고 서로 돕는 장면이 있다. 현실의 죽음을 권고하는 자료가 아니라 문학적 병치의 원전으로 읽는다."}],"relations":[],"spoiler":false,"shortTitle":"아벨 노에","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-liv","title":"리브 — 마지막 두 사람을 고르지 않은 생명","summary":"재난 뒤의 새 인류 대신, 재난 전의 옆집을 바라본다.","type":"deep","kind":"원전과 변형","tags":["북유럽 신화","생명","리브"],"sections":[{"id":"source","title":"원전 · 큰 겨울 뒤의 이름","blocks":[{"type":"paragraph","text":"고 에다의 「바프스루드니르가 말하기를」 44–45연에는 큰 겨울 뒤 살아남는 리브와 리브트라시르가 등장한다. 번역의 주석은 Líf를 생명과 연결한다. 리브 아렌은 그 이름과 생존의 이미지를 가져왔다.","citation":"lif","id":"source-p1","terms":["리브 아렌","리브"]}]},{"id":"inverse","title":"변형 · 누가 남을지를 묻기 전에","blocks":[{"type":"paragraph","text":"리브에게 중요한 문제는 새로운 시대를 시작할 가장 적합한 사람을 고르는 것이 아니다. 아직 살아 있는 사람들이, 자기 생존 자격을 입증하려면 다른 사람의 이름을 지워야 하는 상황을 막는 것이다.","id":"inverse-p1","terms":["리브"]},{"type":"paragraph","text":"그래서 그의 물건은 검이나 예언의 씨앗이 아니라 주소록이다. 그 주소록에는 이 사람을 왜 살려야 하는지 쓰는 칸이 없다. 오늘 찾아가도 되는지, 누구와 만나고 싶은지 묻는다.","id":"inverse-p2","terms":[]}]},{"id":"payoff","title":"회수 · 주소와 주인","blocks":[{"type":"paragraph","text":"주인 없는 죽음을 막기 위해 쓴 장부가, 남의 삶에 주인을 만들어서는 안 된다. 리브 자신도 돌봄 노동자들에게 끝없는 헌신을 요구했다가 교대와 거절의 규칙을 배운다.","id":"payoff-p1","terms":["리브"]},{"type":"paragraph","text":"마지막 박물관에서는 리브가 얼마나 많은 사람을 구했는지보다 직원이 언제 퇴근하는지가 먼저 보인다. 이름에 어울리는 업적을 세우느라 이름 있는 사람들이 다시 자기 삶을 잃지 않도록.","id":"payoff-p2","terms":["리브"]}],"reveal":true}],"sources":[{"id":"lif","title":"고 에다 · 바프스루드니르가 말하기를","url":"https://sacred-texts.com/book/the-poetic-edda/vafthruthnismol","locator":"44–45연. 리브는 큰 겨울 뒤 살아남는 Líf의 이름을 변주했다. 작품의 리브는 소수만 남는 결말 자체를 바꾸려 한다."}],"relations":[],"spoiler":false,"shortTitle":"리브","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-lastwords","title":"같은 마지막 대사를 두 사람이 말했을 때","summary":"말이 숭고해서 사람이 옳은가, 그 말 뒤에 남는 행동이 다른가.","type":"deep","kind":"원전과 변형","tags":["마지막 대사","계승","주인공 2"],"sections":[{"id":"line","title":"문장 그대로","blocks":[{"type":"quote","text":"그대들의 낙원이 더 많은 이를 구할 수 있다면, 직접 내 앞길을 끊어내라.","attribution":"아벨의 재판 진술 · 훗날 에이렌의 선언","id":"line-p1","terms":[]}]},{"id":"before","title":"첫 번째 사람은 무엇을 요구했나","blocks":[{"type":"paragraph","text":"아벨이 이 말을 남길 때는 시대가 자신보다 나은 대안을 보여야 자신의 길을 막을 자격이 생긴다는 뜻이 섞여 있었다. 그러나 완성된 낙원을 제시하지 못해도, 살고 싶다는 사람을 죽이지 말라고 요구할 수 있다. 문장의 웅장함이 그 빈틈을 메우지는 못한다.","id":"before-p1","terms":["아벨"]}]},{"id":"after","title":"두 번째 사람은 어디에 앉았나","blocks":[{"type":"paragraph","text":"에이렌이 같은 말을 할 때 그는 자신의 낙원을 변호하지만, 이어서 자기를 심문하는 자리에 앉는다. 반대자의 말이 끝나기 전에 상대를 더 행복한 신념으로 바꿔놓지 않는다. 이미 입주한 사람들의 집을 자기 목숨이나 명예에 매달지도 않는다.","id":"after-p1","terms":["에이렌"]},{"type":"paragraph","text":"이 계승은 스승이 사실 옳았다는 반전이 아니다. 같은 문장을 써도 그 말로 요구하는 권한과 허용하는 반대가 다를 수 있다는 장면이다.","id":"after-p2","terms":[]}],"reveal":true},{"id":"more","title":"더 많은 이는 복사본 수의 경쟁이 아니다","blocks":[{"type":"paragraph","text":"만경에서는 행복한 갈래를 많이 만드는 숫자놀이로 논쟁을 끝내지 않는다. 이 대사에서 더 많은 이는 지금의 제도 밖에서 응답받지 못한 사람들을 뜻한다. 다수의 만족을 위해 소수의 의사를 지워도 된다는 계산은 아니다.","id":"more-p1","terms":["만경"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"감옥의 원래 문장","entry":"prison-window","anchor":"testament"},{"label":"에이렌이 앉는 자리","entry":"last-scene","anchor":"line"}],"id":"more-p2"}]}],"sources":[],"relations":[],"spoiler":false,"shortTitle":"같은 마지막 대사를 두 사람이 말했을 때","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-opening","title":"서장 — 구원자의 외투를 뒤집으면","summary":"귀환한 재봉사가 박물관의 복제품 주문을 받는다. 사람들을 구한 외투인데, 이름표와 소맷단이 서로 다른 주인을 말한다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","귀환 이후"],"sections":[{"id":"commission","title":"문 여는 시간","blocks":[{"type":"paragraph","text":"이사 렌의 가게에 첫 단체 주문이 들어왔다. 박물관에서 귀환제를 마친 뒤 열 전시에 쓸 외투 열두 벌이었다. 만경은 원본과 똑같이 만들 수 있었다. 담당자는 원래 수선한 사람과 이야기를 나누며 만들고 싶다고 했다. 이사는 그 이유가 좋았다.","id":"commission-p1","terms":["이사 렌","귀환제","이사","만경"]},{"type":"paragraph","text":"사진 속 흰 외투는 너무 잘 복원되어 있었다. 오른쪽 소매가 왼쪽과 길이가 같았고, 옷자락에는 찢어진 데가 없었다. 가슴에는 사벨 오르의 휘장이 반짝였다.","id":"commission-p2","terms":["사벨 오르","흰 외투","사벨"]},{"type":"dialogue","text":"아이들이 한 번씩 입어볼 거예요. 긴 저녁에 섭정이 시민들을 데리고 걸었던 길도 따라가고요.","speaker":"담당자","id":"commission-p3","terms":["긴 저녁"]},{"type":"paragraph","text":"이사는 사진을 확대했다. 깔끔하게 복원한 안감에, 자기가 그은 비뚤어진 선은 없었다.","id":"commission-p4","terms":["이사","안감"]},{"type":"dialogue","text":"이대로 만들면 그날 입었던 옷하고 달라요.","speaker":"이사","id":"commission-p5","terms":[]},{"type":"dialogue","text":"세월에 닳기 전 모습을 복원한 건데요.","speaker":"담당자","id":"commission-p6","terms":[]},{"type":"dialogue","text":"닳아서 짧아진 소매가 아니에요. 그 옷을 입은 사람한테 맞춘 거예요.","speaker":"이사","id":"commission-p7","terms":[]}]},{"id":"inside","title":"이름은 가슴에, 길은 안쪽에","blocks":[{"type":"paragraph","text":"원본을 확인하러 간 날, 이사는 에이렌을 동행자로 불렀다. 열람실 탁자에는 요청해둔 배차 기록과 증언 사본이 놓여 있었다. 에이렌은 유리 앞에서 손을 멈추고, 직원이 외투를 펼칠 받침을 가져올 때까지 기다렸다.","id":"inside-p1","terms":["에이렌","이사"]},{"type":"paragraph","text":"외투 아래의 설명은 한 줄이었다. 사벨 오르가 긴 저녁에 시민들을 구할 때 사용한 외투. 틀린 문장은 아니었다. 충분한 문장도 아니었다.","id":"inside-p2","terms":["사벨 오르","긴 저녁","사벨"]},{"type":"paragraph","text":"보존 담당자가 외투를 펼쳤다. 세 장으로 이은 안감에 오래된 길들이 남아 있었다. 이사는 어느 문 앞에 계단이 생겼고 어느 승강기에 침상이 들어가지 않는지 적어놓았다. 글씨는 작은 사람부터 읽으라는 듯 아래쪽에 몰려 있었다.","id":"inside-p3","terms":["이사","안감"]},{"type":"dialogue","text":"왜 소매를 끝까지 고치지 않았습니까?","speaker":"에이렌","id":"inside-p4","terms":[]},{"type":"dialogue","text":"입을 사람이 급했거든요. 아직 돌아가야 할 곳이 많았고요.","speaker":"이사","id":"inside-p5","terms":[]},{"type":"paragraph","text":"에이렌은 안주머니 옆의 짧은 줄을 보았다. 다른 글씨보다 세게 눌러 쓴 메모였다.","id":"inside-p6","terms":["에이렌"]},{"type":"quote","text":"회송 말고, 우리 집으로.","attribution":"안감의 메모","id":"inside-p7","terms":["회송"]},{"type":"paragraph","text":"이사는 죽기 전에 그 집으로 돌아가지 못했다.","id":"inside-p8","terms":["이사"]}]},{"id":"entry","title":"외투가 새것이었던 날","blocks":[{"type":"paragraph","text":"구조 기록의 날짜는 오래전이었다. 이사는 자기 이름으로 등록된 증언을 골랐다. 담당자가 당시 통신 기록도 틀어줄지 물었다. 이사는 잠시 생각한 뒤 고개를 저었다. “그날 소리는 지금 틀지 말아주세요. 제가 이야기할게요.”","id":"entry-p1","terms":["이사"]},{"type":"paragraph","text":"기록을 넘기면 마흔두 해 전의 오전이 나온다. 이사는 아직 죽지 않았고, 리브의 왼쪽 소매는 아직 길었다.","id":"entry-p2","terms":["이사","리브"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"그날 아침으로","entry":"lining-map"},{"label":"장면보다 세계 규칙부터","entry":"route-system"},{"label":"처음부터 결말과 인과 확인","entry":"causal-ledger"}],"id":"entry-p3","terms":[]}],"readerLayer":"commentary"}],"sources":[],"relations":[{"target":"isa","label":"이 사람의 평소 생활","reason":"죽음과 공적 이외에 그가 살던 가게를 읽는다.","evidence":{"entry":"isa","anchor":"life","label":"긴 저녁 이전에 하던 일"}}],"spoiler":false,"scene":{"누구를 따라가나":"이사 렌","지금 원하는 것":"자기가 고친 옷을 그날 모습대로 설명하기","눈여겨볼 것":"짧은 왼쪽 소매, 세 장의 안감"},"era":"공통력 개원 1개월 뒤 · 이사의 가게","shortTitle":"서장","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-map","title":"1장 — 지도에는 없고, 발에는 있는 길","summary":"재봉사가 그리는 것은 비밀 지도가 아니다. 도시가 안다고 생각해 더는 살피지 않은 길이다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","낙원 이전"],"sections":[{"id":"morning","title":"긴 저녁의 아침","blocks":[{"type":"paragraph","text":"안내 방송은 오늘도 같은 순서로 흘렀다. 식사실, 진료실, 산책실, 상담실. 유예궁의 환상선은 어느 정거장에서 타든 다음 쉴 곳으로 데려다주었다. 여기에 들어온 뒤 처음으로 잠을 푹 잤다는 사람도 많았다.","id":"morning-p1","terms":["환상선","유예궁"]},{"type":"paragraph","text":"이사는 정거장 하나 전에 내렸다. 오늘은 납품할 옷보다 바닥의 단차를 보러 왔다. 세 구조선이 만나는 접합부에는 낮은 경사길이 있었고, 옆으로 새 승강기가 생긴 뒤에는 장비 운반용으로만 쓰였다.","id":"morning-p2","terms":["이사"]},{"type":"paragraph","text":"그는 석 달 전 그 길을 생활구로 이어달라고 신청했다. 답장은 정중했다. 예상 이용 인원이 적으므로 정식 생활 노선의 확대는 보류한다. 노선이 없어서 나갈 수 없는 사람들은 이용 인원으로 계산되지 않았다.","id":"morning-p3","terms":[]},{"type":"paragraph","text":"이사는 답장을 버리지 않고 수선 장부에 끼워두었다. 그 장부에는 손님들 집의 문턱 높이도 적혀 있었다. 바지를 찾아가는 사람이 혼자 옷을 입을 수 있는지 알면, 단추를 어느 쪽에 달지도 달라졌다.","id":"morning-p4","terms":["이사"]}]},{"id":"pattern","title":"세 장을 이어야 보이는 도시","blocks":[{"type":"paragraph","text":"오후, 리브가 사벨의 흰 외투를 들고 왔다. 대안식안에 반대하는 이들을 위한 임시 보호 연락을 맡기로 했다고 했다. 공개 명령은 아직 나오지 않았지만 외투를 빌려주겠다는 말은 먼저 받았다. 리브에게는 소매가 길었다. 이사는 한쪽을 접다가 손을 멈췄다.","id":"pattern-p1","terms":["흰 외투","이사","사벨","리브"]},{"type":"dialogue","text":"어디까지 데려갈 수 있대요?","speaker":"이사","id":"pattern-p2","terms":[]},{"type":"dialogue","text":"일단 유예궁으로. 집에 가겠다는 사람은 내가 아는 주소들로 나눠 보내려고.","speaker":"리브","id":"pattern-p3","terms":["유예궁"]},{"type":"paragraph","text":"이사는 안감의 시침질을 풀었다. 왼쪽 면에는 진료선, 등을 덮는 가운데에는 거주선, 오른쪽에는 지휘선의 옛 보행 구역을 옮겨 그렸다. 방수 지도도 두 장 더 만들었다. 한 장이 젖거나 누군가 다른 쪽으로 가더라도, 나머지 사람이 길을 계속 볼 수 있게 했다.","id":"pattern-p4","terms":["이사","안감"]},{"type":"dialogue","text":"내가 그림을 보고 알아볼 수 있을까?","speaker":"리브","id":"pattern-p5","terms":[]},{"type":"dialogue","text":"숫자 대신 네가 아는 집을 적었어. 여기 잼 만드는 집. 그 아래가 밤에도 불 켜두는 약방.","speaker":"이사","id":"pattern-p6","terms":[]},{"type":"paragraph","text":"리브는 주머니에 주소록을 넣었다. 이사는 왼쪽 소매를 짧게 박고 오른쪽은 서둘러 접기만 했다. 나중에 다시 고치러 오라고 했다.","id":"pattern-p7","terms":["이사","리브"]}]},{"id":"receipt","title":"값을 매기지 않은 수선표","blocks":[{"type":"paragraph","text":"퇴근할 무렵 도착한 공헌청 통지에는 이사가 보호 이송 대상이라고 적혀 있었다. 일 년 전 가게를 오래 닫았던 기록, 치료를 중단한 기록, 줄어든 납품량이 근거였다. 이사는 동의하지 않는다고 답했고, 리브에게도 그 사실을 알렸다.","id":"receipt-p1","terms":["공헌청","이사","리브"]},{"type":"dialogue","text":"내일 치마 찾으러 올 사람이 있어. 난 내일도 여기 있을 거야.","speaker":"이사","id":"receipt-p2","terms":[]},{"type":"paragraph","text":"리브는 먼저 외투와 지도를 전달한 뒤 다시 데리러 오겠다고 했다. 그때까지는 건물의 문이 열려 있었다. 두 사람은 저녁에도 열려 있을 것으로 생각했다.","id":"receipt-p3","terms":["리브"]},{"type":"paragraph","text":"이사는 평소처럼 수선표를 접었다. 안주머니 확장, 소매 수선, 안감 연결. 세 번째 항목 옆에는 나중에 덧쓴 말이 있었다.","id":"receipt-p4","terms":["이사","안감"]},{"type":"quote","text":"도착한 곳과, 돌아갈 곳을 따로 적을 것.","attribution":"이사의 작업 장부","id":"receipt-p5","terms":[]}]}],"sources":[],"relations":[{"target":"fleet","label":"세 배가 만든 문턱","reason":"종이 위 선을 실제 몸으로 걸을 때 생기는 제약.","evidence":{"entry":"fleet","anchor":"night","label":"개원 172년 전 · 불이 꺼진 항로"}}],"spoiler":false,"scene":{"누구를 따라가나":"이사와 리브","지금 원하는 것":"원하는 집까지 이어지는 대피길 마련","눈여겨볼 것":"두 장의 사본, 정식 노선에서 빠진 연결길"},"era":"개원 42년 전 · 긴 저녁 당일 아침과 오후","shortTitle":"1장","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-supper","title":"2장 — 두 사람이 같은 저녁을 약속했다","summary":"한 사람은 고통 없는 끝을, 다른 사람은 오늘 머물 집을 준비한다. 섭정은 자신의 외투를 먼저 내준다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","낙원 이전"],"sections":[{"id":"table","title":"숟가락이 두 개 놓인 방","blocks":[{"type":"paragraph","text":"아벨과 사벨은 같은 식탁에 앉았다. 문밖에서는 서로 다른 기관의 사람들이 두 사람의 결정을 기다리고 있었다. 아벨의 대안식안은 이미 일부 구역의 집행 절차로 넘어가 있었다. 사벨은 그 사실을 늦게, 내부 반대 의료진의 통보로 알았다.","id":"table-p1","terms":["대안식안","아벨","사벨"]},{"type":"paragraph","text":"아벨은 자기 이름이 포함된 명부를 식탁에 올렸다. 특권층만 살아남게 하려는 것이 아니라는 설명을 먼저 했다. 사벨은 명부를 읽다가 덮었다.","id":"table-p2","terms":["아벨","사벨"]},{"type":"dialogue","text":"내가 묻는 건 당신이 함께 죽을 건지가 아니야. 이 사람들이 지금 뭐라고 말하는지야.","speaker":"사벨","id":"table-p3","terms":[]},{"type":"paragraph","text":"아벨은 이번 제도가 마지막 희망이라던 병동들 이야기를 했다. 좋아졌다가 돌아온 사람들, 다음 교육을 시작할 힘도 없는 사람들. 명부의 한쪽에는 다시 방문한 날짜가 촘촘했고 다른 쪽에는 그 뒤 나간 생활 안내가 적혀 있었다. 그는 안내를 받은 날들보다 돌아온 날들을 오래 짚었다.","id":"table-p4","terms":["아벨"]},{"type":"dialogue","text":"너는 그들에게 영원히 여기 있어도 좋다고 약속할 수 있나?","speaker":"아벨","id":"table-p5","terms":[]},{"type":"dialogue","text":"아니. 오늘 밤 머물 자리는 있어.","speaker":"사벨","id":"table-p6","terms":[]},{"type":"dialogue","text":"결국 내일을 미루는군.","speaker":"아벨","id":"table-p7","terms":[]},{"type":"dialogue","text":"네가 끝내려는 사람에게는, 그 내일이 필요해.","speaker":"사벨","id":"table-p8","terms":[]}]},{"id":"coat","title":"구원자의 옷을 벗기는 일","blocks":[{"type":"paragraph","text":"리브가 외투를 들고 들어왔을 때 사벨은 이미 반대 명령에 서명하고 있었다. 그 서명만으로 도시의 모든 기관이 멈추지는 않았다. 공헌청 내부에서는 누가 먼저 승인했는지 다투었고, 현장에는 서로 다른 명령이 함께 도착했다.","id":"coat-p1","terms":["공헌청","사벨","리브"]},{"type":"paragraph","text":"사벨은 자신의 인장과 공개된 보호 명령을 리브에게 건넸다. 외투도 돌려주었다. 사벨의 이름으로 사람을 보내되, 어느 보호구에 들어갈지는 당사자에게 물으라는 짧은 지시를 붙였다. 그날 밤 그는 실제로 그 자유를 허용했다.","id":"coat-p2","terms":["사벨","리브"]},{"type":"dialogue","text":"몸에 안 맞는 옷인데.","speaker":"리브","id":"coat-p3","terms":[]},{"type":"dialogue","text":"문 앞에서 내 이름부터 찾으면 보여줘. 그다음에는 당신 말을 하게 해.","speaker":"사벨","id":"coat-p4","terms":[]},{"type":"paragraph","text":"리브는 옷을 입었다. 왼손은 나왔고 오른손은 조금 덮였다. 사벨은 그 우스운 모습에 웃으려다 웃지 못했다. 아벨은 책상 위 명부를 다시 펼쳤다. 사벨의 반대 명령을 올려놓느라, 당사자들의 이의 신청이 적힌 맨 뒷장을 덮었다.","id":"coat-p5","terms":["아벨","사벨","리브"]}]},{"id":"order","title":"밤에 먼저 도착한 것","blocks":[{"type":"paragraph","text":"리브가 나오자, 각 구역에서 이송 대상자들을 한곳에 모으고 있다는 소식이 들어왔다. 몇몇 현장 담당자는 집행을 거부했고, 다른 사람들은 승인이 끝난 일이라며 출입을 제한했다. 도시 전체가 이미 하나의 편이 된 것은 아니었다.","id":"order-p1","terms":["리브"]},{"type":"paragraph","text":"이사에게 전화를 걸었지만 첫 연결은 닿지 않았다. 리브는 사본 지도 한 장을 통신소에, 한 장을 현장 운전수들에게 넘겼다. 외투 안의 세 번째 지도를 펴기 전에 손가락이 떨렸다. 이사가 그어놓은 선 위로 전화기의 불빛이 지나갔다.","id":"order-p2","terms":["이사","리브"]}]}],"sources":[],"relations":[{"target":"abel","label":"아벨은 왜 여기까지 왔나","reason":"실제 도움이 된 개혁과 선을 넘은 판단.","evidence":{"entry":"abel","anchor":"life","label":"그가 처음 멈춘 것은 사람의 삶이 아니었다"}}],"spoiler":false,"scene":{"누구를 따라가나":"아벨·사벨·리브","지금 원하는 것":"서로 반대인 두 보호 명령 중 무엇을 실행할지","눈여겨볼 것":"사벨이 외투와 함께 위임한 권한"},"era":"개원 42년 전 · 긴 저녁 해 질 무렵","shortTitle":"2장","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-loop","title":"3장 — 종점에서 다시 출발한 열차","summary":"탈출한 줄 알았던 사람들이 다른 보호구에 도착한다. 문이 열리는 것과 밖으로 이어지는 것은 같은 일이 아니다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","낙원 이전"],"sections":[{"id":"train","title":"정거장은 달라졌다","blocks":[{"type":"paragraph","text":"첫 셔틀에는 침상 둘과 휠체어 넷이 실렸다. 리브는 사람들이 집 주소를 말하는 대로 적었다. 다음 역에서 갈아탈 수 있을 거라고 안내받았다. 다음 역에도 같은 안내가 있었다.","id":"train-p1","terms":["리브"]},{"type":"paragraph","text":"차창 밖에 분수가 지나갔다. 리브는 출발할 때 난간에 묶은 붉은 안내띠를 보았다. 조금 전 추위를 타던 아이에게 외투 자락을 잘라 덮어준 곳이었다. 셔틀은 같은 분수를 반대편에서 다시 지나고 있었다.","id":"train-p2","terms":["리브"]},{"type":"dialogue","text":"다른 역 이름이던데요.","speaker":"승객","id":"train-p3","terms":[]},{"type":"dialogue","text":"다른 역은 맞아요. 다른 곳으로 나간 건 아니고요.","speaker":"리브","id":"train-p4","terms":[]},{"type":"paragraph","text":"환상선의 자동 운행은 고장 나지 않았다. 보호 이송 대상으로 등록된 승객에게는 일곱 보호구 사이의 노선만 제시되었다. 이 기능은 원래 이동 중 돌봄이 끊기지 않도록 쓰였다. 지금은 공헌청의 출입 제한과 겹쳐 다른 목적지를 가렸다. 바깥의 도시와 다른 길은 여전히 있었다. 그곳으로 보내지 않는 결정이 있었다.","id":"train-p5","terms":["환상선","공헌청"]}]},{"id":"three-maps","title":"보이지 않는 선은 미래가 아니었다","blocks":[{"type":"paragraph","text":"리브가 통신소에 연락했다. 미라 베일은 같은 지도를 탁자 위에 펼쳤다. 작업 구역 경사길의 폭을 묻는 호출이 이어졌다. 첫 침상은 모서리에 걸렸다. 기술자가 적재판을 옮기고, 의료진이 사람을 작은 이동 침대로 옮겼다. 미라는 확인을 받은 구간부터 선을 덧그었다.","id":"three-maps-p1","terms":["미라 베일","미라","리브"]},{"type":"paragraph","text":"미라는 공식 안내판을 끄지 않았다. 운행 담당자와 직접 연결하고, 사벨의 보호 명령을 공개한 채 목적지 변경을 요청했다. 협력하는 운전수, 거부하는 책임자, 뒤늦게 동의한 의원이 서로 다른 속도로 움직였다.","id":"three-maps-p2","terms":["미라","사벨"]},{"type":"paragraph","text":"한 배차 담당자는 그 경사길의 이용자가 거의 없었다고 말했다. 미라는 이사가 받아둔 답장을 읽었다. 승인된 노선이 아니라는 이유로 이용 신청을 집계하지 않았다는 주석이 뒤에 붙어 있었다.","id":"three-maps-p3","terms":["이사","미라"]},{"type":"dialogue","text":"그 길로 나간 사람이 없다는 기록으로, 그 길로 나가려는 사람을 세고 있었네요.","speaker":"미라","id":"three-maps-p4","terms":[]},{"type":"paragraph","text":"담당자는 예측 수치를 바꾸지 않았다. 그날의 배차표를 바꾸었다. 검증을 덜 거친 경로를 실제로 확인하러 사람을 보냈다.","id":"three-maps-p5","terms":[]}]},{"id":"light","title":"빛이 돌아보는 쪽","blocks":[{"type":"paragraph","text":"늑골길 입구에서 작업자가 손전등을 세 번 끊어 켰다. 하늘의 삼박등을 흉내 낸 것이 아니라 같은 구조 신호를 쓴 것이었다. 여기에 사람이 있다는 뜻. 아이들은 보호자의 손에서 들리던 빛이, 누군가를 찾는 사람의 손에서도 켜지는 것을 보았다.","id":"light-p1","terms":["늑골길","삼박등"]},{"type":"paragraph","text":"첫 침상이 거주선 쪽 경사길로 넘어갔다. 셔틀의 목적지 표시에는 처음으로 보호구 번호가 아닌 거리 이름이 떴다.","id":"light-p2","terms":[]},{"type":"paragraph","text":"그때 이사의 전화가 연결되었다.","id":"light-p3","terms":["이사"]}]}],"sources":[],"relations":[{"target":"route-system","label":"열차는 고장 나지 않았다","reason":"꿈과 이동 제한, 실제 도시를 구별한다.","evidence":{"entry":"route-system","anchor":"loop","label":"환상은 두 번 읽힌다"}}],"spoiler":false,"scene":{"누구를 따라가나":"리브와 미라","지금 원하는 것":"보호구 사이의 이동을, 원하는 집으로의 이동으로 바꾸기","눈여겨볼 것":"같은 분수, 다른 역 이름, 세 번의 빛"},"era":"개원 42년 전 · 긴 저녁 밤","shortTitle":"3장","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-call","title":"4장 — 대답이 있었다","summary":"구조 요청에는 분명 응답했다. 그래서 미라는 더 오래, 응답과 도착 사이를 기억한다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","낙원 이전"],"sections":[{"id":"voice","title":"집에 있겠다고 말했던 사람","blocks":[{"type":"paragraph","text":"이사는 집에 없었다. 리브가 떠난 뒤 이송 담당자들이 와서 그를 진료선의 대기 구역으로 데려갔다. 다른 목적지를 요청했지만 거절당했다. 자기 단말기는 잠시 뒤 돌려받았고, 이사는 통신소에 위치를 보냈다.","id":"voice-p1","terms":["이사","리브"]},{"type":"dialogue","text":"리브가 제 지도 갖고 갔죠?","speaker":"이사","id":"voice-p2","terms":["리브"]},{"type":"dialogue","text":"네. 여기에도 있어요. 지금 어느 출입구가 보이나요?","speaker":"미라","id":"voice-p3","terms":[]},{"type":"paragraph","text":"미라는 요청을 기록하고 가장 가까운 팀을 보냈다. 첫 팀은 다른 명령을 받은 현장 인력에게 막혔다. 화면에는 출입 승인 요청 중이라는 문장이 떴다. 미라는 두 번째 팀과 의료진을 붙였다. 책임자의 이름을 확인하는 동안, 이사는 전화기 너머에서 같은 출입구의 위치를 다시 말했다.","id":"voice-p4","terms":["미라"]},{"type":"dialogue","text":"내일 찾으러 오는 옷이 있어요. 그 사람한테 문 안 열면 약방에 맡겼다고 말해주세요.","speaker":"이사","id":"voice-p5","terms":[]},{"type":"paragraph","text":"미라는 전할 사람의 이름을 적었다. 치마 주인의 이름을 말하다가 이사가 발음을 고쳤다. “같은 골목에 비슷한 이름이 있어요. 짧은 머리 한 사람이에요.” 내일 잘못 찾아갈까 봐 걱정하는 말투였다.","id":"voice-p6","terms":["이사","미라"]},{"type":"dialogue","text":"그리고 저도요. 다른 사람들 데려다주고 저도 데리러 와요.","speaker":"이사","id":"voice-p7","terms":[]},{"type":"dialogue","text":"당신에게도 팀이 가고 있어요.","speaker":"미라","id":"voice-p8","terms":[]}]},{"id":"later","title":"도착 기록","blocks":[{"type":"paragraph","text":"그 대화는 기록에 남았다. 그다음에는 현장에서 접수한 집행 사실이 남았다. 구조대가 출입을 확보했을 때 이사는 이미 죽어 있었다. 같은 선집행으로 죽은 사람은 모두 312명이었다. 절차를 설명하는 줄보다, 이름을 대조하는 줄이 더 오래 걸렸다.","id":"later-p1","terms":["이사"]},{"type":"paragraph","text":"미라는 이사의 요청 상태를 구조 완료로 바꾸지 않았다. 연락 성공과 구조 성공을 따로 적었다. 유가족과 연결하는 담당자가 화면의 빈칸을 이어받았다.","id":"later-p2","terms":["이사","미라","빈칸"]},{"type":"paragraph","text":"리브는 소식을 들은 뒤에도 잠시 걸었다. 오른쪽 소매가 손을 덮었다. 다음에 오면 고쳐주겠다던 사람이 없었다. 그는 팔을 접어 소매를 걷었다. 사람들이 아직 뒤따라오고 있었다.","id":"later-p3","terms":["리브"]},{"type":"paragraph","text":"지도에는 이사의 집에 동그라미가 쳐져 있었다. 미라는 그 표시를 구분해 다시 그리지 못하고, 그 옆에 도착 시간을 적었다.","id":"later-p4","terms":["이사"]}]},{"id":"room","title":"그날 집에 가지 못한 또 한 사람","blocks":[{"type":"paragraph","text":"미라는 밤새 근무했다. 열한 살 에이렌은 이웃집에서 어머니의 연락을 기다렸다. 그는 그날의 일을 나중에 들었다. 자기 집으로 돌아오지 못한 어머니와, 다른 집으로 돌아가지 못한 사람의 목소리가 한 사건 안에 있다는 것을 이해하는 데는 더 오래 걸렸다.","id":"room-p1","terms":["에이렌","미라"]},{"type":"paragraph","text":"몇십 년 뒤 에이렌이 아벨에게 배운 것은 돌아갈 방을 더 많이 만들자는 생각이었다. 어머니에게 배워야 했던 것은 조금 달랐다. 돌아갈 방이 있다고 말하는 것과, 그 사람을 실제로 데려오는 일 사이에는 아직 일이 남는다는 것.","id":"room-p2","terms":["에이렌","아벨"]}]}],"sources":[],"relations":[{"target":"mira","label":"어머니의 마지막 당직","reason":"한 번의 실패로만 결정되지 않은 83년의 삶.","evidence":{"entry":"mira","anchor":"person","label":"83세, 전직 구조 접수원"}}],"spoiler":false,"scene":{"누구를 따라가나":"이사·미라·리브","지금 원하는 것":"대피 경로를 알려준 사람 자신도 구하기","눈여겨볼 것":"연락 성공과 구조 성공은 다른 칸이다"},"era":"개원 42년 전 · 긴 저녁 후반","shortTitle":"4장","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-crossing","title":"5장 — 승리의 행렬은 서로 다른 곳으로 갔다","summary":"몇몇 사람은 명령을 멈추고, 몇몇은 길을 열고, 몇몇은 저녁을 차린다. 누구도 이 일 전체를 혼자 끝내지 못한다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","낙원 이전"],"sections":[{"id":"convoy","title":"각자의 기술이 돌아오는 장면","blocks":[{"type":"paragraph","text":"옛 기관실에 불이 들어왔다. 자동 배식기는 여전히 충분한 식사를 만들 수 있었다. 부족한 것은 음식이 아니라 사람들이 원하는 곳까지 함께 옮겨갈 손과 안전한 통행이었다. 리브의 연락망이 약방과 가게의 문을 열었다.","id":"convoy-p1","terms":["리브"]},{"type":"paragraph","text":"프로네가 공개했던 보조 장치를 쓰는 작업자들이 경사길의 적재 장비를 바꾸었다. 손을 떨던 의료진이 동료에게 연결 부위를 잡아달라고 했다. 상담 기록에서 서로 다른 치료를 골랐던 두 사람이 침상 한쪽씩을 맡았다. 이동을 마치자 약방에서 사람 수를 물었다. 음식이 식기 전에 다음 주소를 정해야 했다.","id":"convoy-p2","terms":["프로네"]},{"type":"paragraph","text":"정답원 출신 배차 담당자는 검증이 끝난 목록만 따라가지 않았다. 현장 확인을 받은 경로부터 운행을 내보냈다. 사벨의 반대 명령은 처음에 망설이던 부서의 집행 중단으로 이어졌다. 내부 고발자들의 기록이 법적 책임자를 특정했고, 경비 인력도 일부 집행부의 명령을 더는 따르지 않았다.","id":"convoy-p3","terms":["정답원","사벨"]},{"type":"paragraph","text":"도시 전역으로 번질 예정이던 확대 집행은 막혔다. 아벨은 체포되었다. 그를 진료실에서 데리고 나온 사람 가운데는 오래전 그 병동에서 치료받았던 사람도 있었다.","id":"convoy-p4","terms":["아벨"]}]},{"id":"arrest","title":"좋은 방이 오기 전에도","blocks":[{"type":"dialogue","text":"그 사람들을 데려가서, 무엇을 약속했습니까?","speaker":"아벨","id":"arrest-p1","terms":[]},{"type":"dialogue","text":"오늘 밤 주소를요.","speaker":"리브","id":"arrest-p2","terms":[]},{"type":"dialogue","text":"그다음에는?","speaker":"아벨","id":"arrest-p3","terms":[]},{"type":"paragraph","text":"리브는 대답 대신 다음 차량의 문을 열었다. 주소를 받아든 사람이 물었다. 이 집에서도 잠을 못 자면 어떻게 하느냐고. 리브는 다음 연락 시간을 적었다. 아벨은 그 종이를 보았다. 거기에는 완치를 보장하는 말도, 영원히 머물 수 있다는 말도 없었다.","id":"arrest-p4","terms":["리브"]},{"type":"paragraph","text":"리브는 자신의 장부에서 이사의 줄을 지우지 않았다. 오늘은 찾지 못했음을 적었다. 살아남은 다른 사람의 수를 늘려 그 줄을 상쇄하지 않았다.","id":"arrest-p5","terms":["이사","리브"]}]},{"id":"split","title":"갈라진 행렬","blocks":[{"type":"paragraph","text":"구조선 사이의 통로를 나온 사람들은 한곳에 모이지 않았다. 어떤 사람은 가족에게, 어떤 사람은 조용한 보호구에, 어떤 사람은 아무도 자기를 모르는 숙소로 갔다. 유예궁을 고른 사람도 많았다. 사벨이 만든 안정된 하루가 그들에게는 정말 필요했다.","id":"split-p1","terms":["유예궁","사벨"]},{"type":"paragraph","text":"경비들은 행렬을 세 갈래로 나누었다. 훗날 기념화에서는 그 세 줄을 같은 궁전으로 향하도록 그렸다. 실제 기록에서는 한 줄이 화가의 시야 바깥으로 빠져나간다.","id":"split-p2","terms":[]},{"type":"paragraph","text":"리브는 사벨에게 외투를 돌려주었다. 자락은 잘려 있었고 소매는 서로 달랐다. 사벨은 그것을 새 옷처럼 정리하지 말라고 했다. 그날 그가 지킨 약속도 기록에 남는다.","id":"split-p3","terms":["사벨","리브"]}]}],"sources":[],"relations":[{"target":"prone","label":"누군가의 손에 남은 발명","reason":"전능 전에 이미 실제로 성공한 기술.","evidence":{"entry":"prone","anchor":"life","label":"문제의 원인을 사람 안에서 본 발명가"}}],"spoiler":false,"scene":{"누구를 따라가나":"서로 다른 선택을 한 구조자들","지금 원하는 것":"학살 중단과 실제 대피를 함께 끝내기","눈여겨볼 것":"한 궁전이 아니라 세 방향으로 가는 행렬"},"era":"개원 42년 전 · 긴 저녁이 끝나갈 무렵","shortTitle":"5장","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-morning","title":"6장 — 열린 문 앞의 대기표","summary":"사람을 구한 밤이 끝났는데, 보호를 끝내는 날짜는 정해지지 않았다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","낙원 이전"],"sections":[{"id":"temporary","title":"첫날에는 이유가 있었다","blocks":[{"type":"paragraph","text":"다음 날 아침 사벨은 일부 보호구의 퇴장을 잠시 멈췄다. 아직 집행부와 연결된 구역이 있었고, 귀가할 집의 안전을 확인해야 했다. 리브도 지도에 남은 경고 표시를 보며 기다렸다. 약방 주인은 안전 확인이 끝나면 다시 연락하겠다고 했다.","id":"temporary-p1","terms":["사벨","리브"]},{"type":"paragraph","text":"그런데 대기표에는 다음 검토일이 없었다. 며칠 뒤 통행이 안전해진 거리로 가겠다는 요청에도 같은 답이 돌아왔다. 생활 계획을 검토한 뒤 안내하겠습니다. 사벨이 원래 보호하던 것은 길 위의 위험이었지만, 이제는 그 길 끝에서 다시 겪을 절망까지 심사했다.","id":"temporary-p2","terms":["사벨"]},{"type":"dialogue","text":"어제는 집이 위험해서 못 간다고 했지. 오늘은 내가 내 집에서 행복할 수 있는지 네가 결정하겠다는 거야?","speaker":"리브","id":"temporary-p3","terms":[]},{"type":"dialogue","text":"그날 살린 사람들이 다시 같은 곳에서 무너지는 걸 보면서도 내보내야 하나?","speaker":"사벨","id":"temporary-p4","terms":[]},{"type":"paragraph","text":"리브는 단번에 답하지 못했다. 자신이 적어준 주소에서 누군가 다시 불행해질까 두려운 것은 그도 같았다. 그 두려움을 상대의 삶에 대한 최종 결정권으로 바꿀 수 있는지가 달랐다.","id":"temporary-p5","terms":["리브"]}]},{"id":"form","title":"살려두겠다는 서명","blocks":[{"type":"paragraph","text":"사벨의 명령은 영원한 감금을 선언하지 않았다. 준비가 될 때까지라는 말을 썼다. 그 말을 실제 퇴장으로 끝내는 사람도 있었고, 매번 다른 기준을 받고 남는 사람도 있었다.","id":"form-p1","terms":["사벨"]},{"type":"paragraph","text":"삼십 년 뒤 공헌청은 보호기관 변경 심사에 같은 양식을 사용했다. 등대동 사건에서는 반대 의견을 적응의 어려움으로 해석하는 조항이 붙었다. 문장을 처음 쓴 사벨과 정치적 억압에 적용한 라잔, 체류 연장을 승인한 에이렌의 책임은 서로 같지 않지만 끊겨 있지도 않다.","id":"form-p2","terms":["등대동 사건","등대동","에이렌","공헌청","사벨","라잔"]},{"type":"paragraph","text":"에이렌은 자신이 스승 아벨과 다르다고 생각했다. 그는 누구도 죽게 두려 하지 않았다. 그래서 더 늦게 알아보았다. 끝내 살리겠다는 자신의 약속에도, 상대가 지금 떠나겠다는 말이 들어갈 자리는 없었다는 것을.","id":"form-p3","terms":["에이렌","아벨"]}]},{"id":"not-final","title":"두 개의 문을 여는 일","blocks":[{"type":"paragraph","text":"리브는 한밤의 구조를 부정하지 않은 채 그다음 문을 열기 위한 일을 시작했다. 안전 확인 기한을 명시하고, 보호구 밖의 주소와 이동 지원을 함께 제공하고, 퇴장을 요청했다는 이유로 돌봄을 끊지 못하게 했다. 일부 조항은 통과되었다. 일부는 후대에 약해졌다.","id":"not-final-p1","terms":["리브"]},{"type":"paragraph","text":"기한이 적힌 첫 대기표를 받아든 사람이 리브에게 물었다. 이 날짜에는 정말 나갈 수 있느냐고. 리브는 동행할 담당자의 이름을 적었다. 후대의 기록실에는 실제로 나간 사람의 서명과, 더 기다려야 했던 사람의 이의 신청이 함께 남았다.","id":"not-final-p2","terms":[]},{"type":"paragraph","text":"마흔두 해 뒤, 그 밤에 끝났던 이사의 시간도 다시 이어진다.","id":"not-final-p3","terms":["이사"]}],"readerLayer":"commentary"}],"sources":[],"relations":[{"target":"recovery","label":"회복원으로 이어진 양식","reason":"비상조치가 생활의 심사로 굳는 역사.","evidence":{"entry":"recovery","anchor":"purpose","label":"에이렌이 처음 설계한 것"}}],"spoiler":false,"scene":{"누구를 따라가나":"리브와 사벨, 그 양식을 물려받는 사람들","지금 원하는 것":"긴급 보호가 끝나는 조건을 정하기","눈여겨볼 것":"기간 대신 준비 상태가 적힌 대기표"},"era":"개원 42년 전 이후 · 보호가 제도로 남는 시간","shortTitle":"6장","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lining-return","title":"종장 — 이번에는 몇 시에 만날까요","summary":"누구도 학살의 이유를 낙원의 성공으로 바꾸지 못한다. 돌아온 사람에게는 증언 다음 일정도 있다.","type":"story","kind":"연속 장면","tags":["안감의 지도","연속 장면","귀환 이후"],"sections":[{"id":"coat-return","title":"그 옷을 입을 사람","blocks":[{"type":"paragraph","text":"현재의 열람실에서 이사는 외투를 다시 접었다. 전시 담당자는 기존 보존 기록을 펼쳐놓았다. 짧은 소매의 주인, 찢은 자락의 용도, 세 장의 지도를 함께 설명하는 새 문안이 그 옆에 있었다.","id":"coat-return-p1","terms":["이사"]},{"type":"dialogue","text":"그러면 주인공을 사벨이 아니라 이사 씨로 바꿀까요?","speaker":"담당자","id":"coat-return-p2","terms":["이사","사벨"]},{"type":"dialogue","text":"한 사람만 들어갈 자리를 그대로 두고 이름만 바꾸지 말아주세요.","speaker":"이사","id":"coat-return-p3","terms":[]},{"type":"paragraph","text":"실제 외투는 보존대 위에 펼쳐두기로 했다. 아이들이 입을 복제품은 걸어 다닌 리브에게 맞춘 모양으로, 지도는 길을 확인한 사람들의 기록과 나란히 두었다. 사벨이 자기 권한을 내준 사실도 지우지 않았다.","id":"coat-return-p4","terms":["사벨","리브"]},{"type":"paragraph","text":"이사는 모든 희생자의 선행을 찾아 설명해야 하는 건 아니라고 덧붙였다. 그날 지도를 그리지 못한 사람도, 무서워서 자기 이름만 겨우 말한 사람도 살아 있어야 했다.","id":"coat-return-p5","terms":["이사"]}]},{"id":"voice-again","title":"돌아온 목소리","blocks":[{"type":"paragraph","text":"미라는 여든세 살이었다. 통신 기록 속 목소리는 마흔한 살의 것이었다. 이사는 가게 문을 열며 두 목소리를 잠시 함께 떠올렸다.","id":"voice-again-p1","terms":["이사","미라"]},{"type":"dialogue","text":"당신 전화에는 대답했어요.","speaker":"미라","id":"voice-again-p2","terms":[]},{"type":"paragraph","text":"미라는 준비해온 설명을 멈췄다. 대답했으니 할 일을 다했다는 말처럼 들릴까 봐서였다.","id":"voice-again-p3","terms":["미라"]},{"type":"dialogue","text":"도착하지는 못했어요.","speaker":"미라","id":"voice-again-p4","terms":[]},{"type":"dialogue","text":"알아요. 오려고 한 것도, 늦은 것도요.","speaker":"이사","id":"voice-again-p5","terms":[]},{"type":"paragraph","text":"이사는 작업대 옆 의자를 꺼냈다. 미라를 용서해야만 그 의자에 앉힐 수 있는 것은 아니었다. 미라는 학살을 명령한 사람도, 구조의 실패를 혼자 떠맡아야 하는 사람도 아니었다. 두 사람은 같은 사건에서 서로 만나지 못했던 사람들이었다.","id":"voice-again-p6","terms":["이사","미라"]},{"type":"dialogue","text":"이사는 작업대 옆 의자를 꺼냈다. 미라는 앉기 전에 의자를 조금 당겼다. 전화기 너머에서 들었던 목소리와 눈앞에 있는 사람을 함께 놓는 데 시간이 걸렸다. 이사는 물을 따르고, 오늘 맡은 옷의 주머니에 손을 넣어 남은 핀을 꺼냈다.","speaker":"이사","id":"voice-again-p7","terms":[]},{"type":"dialogue","text":"오늘은 근무가 없어요.","speaker":"미라","id":"voice-again-p8","terms":[]},{"type":"dialogue","text":"그럼 저 끝날 때 같이 밥 먹어요. 이번에는 시간을 정해놓고.","speaker":"이사","id":"voice-again-p9","terms":[]}]},{"id":"not-inheritance","title":"가운을 가져오지 않은 사람","blocks":[{"type":"paragraph","text":"그 뒤 아벨은 이사의 공개 증언을 읽었다. 자신의 옛 책을 다시 펴는 모임이 긴 저녁의 죽음을 만경을 향한 불가피한 단계라고 쓰려 한다는 것도 알게 되었다. 그는 그 문장에 동의하지 않는다고 공개 답변했다.","id":"not-inheritance-p1","terms":["긴 저녁","이사","아벨","만경"]},{"type":"quote","text":"그날 그들이 가진 길은 만경으로 가는 길이 아니었습니다. 내가 내린 명령에서 벗어나 자기 집으로 돌아가려는 길이었습니다.","attribution":"아벨 노에의 공개 답변","id":"not-inheritance-p2","terms":["만경"]},{"type":"paragraph","text":"이사는 답변을 공개 기록에 함께 보관해달라고 요청했다. 그리고 장부를 덮었다. 다음에는 새로 만든 옷의 값을 적을 차례였다.","id":"not-inheritance-p3","terms":["이사"]},{"type":"paragraph","text":"에이렌은 박물관 출입문 앞에서 기다리고 있었다. 이사가 나오자 먼저 손을 내밀려다가, 다음 일정이 있는지 물었다. 이사는 작업이 남았다며 가게 쪽을 가리켰다. 그는 길을 비켜주었다.","id":"not-inheritance-p4","terms":["에이렌"]}]},{"id":"next-day","title":"마지막의 작은 주문","blocks":[{"type":"paragraph","text":"이사는 기념 외투 열두 벌 대신, 세 가지 크기의 외투를 네 벌씩 만들기로 했다. 모두에게 똑같은 옷을 입혀야 하는 전시는 아니었다.","id":"next-day-p1","terms":["이사"]},{"type":"paragraph","text":"에이렌이 값은 자신이 부담하겠다고 했다. 이사는 전시 예산으로 해결할 수 있다고 답했다. 내일 같이 차를 마시러 오는 건 다른 일이라고 했다.","id":"next-day-p2","terms":["에이렌","이사"]},{"type":"paragraph","text":"가게 문에 적힌 글은 길지 않았다. 오후 여섯 시에 닫습니다. 그 밑에 미라와 저녁을 먹기로 한 시간을 적은 메모가 붙었다.","id":"next-day-p3","terms":["미라"]},{"type":"paragraph","text":"이번에는 내일의 손님이 아니라, 오늘 저녁의 약속 때문에 문을 닫았다.","id":"next-day-p4","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"현재 본편: 나래의 용서장","entry":"prologue"},{"label":"옛 구원자들이 돌아온 자리","entry":"giants-opening"},{"label":"단서와 원전을 다시 읽기","entry":"deep-lining"},{"label":"인과와 설정 점검","entry":"causal-ledger"}],"id":"next-day-p5","terms":[]}]}],"sources":[],"relations":[{"target":"future-countermonument","label":"모든 희생자를 영웅으로 만들지 않기","reason":"공로를 증명하지 않아도 살아야 했던 사람들.","evidence":{"entry":"future-countermonument","anchor":"hall","label":"예전의 일곱 초상화"}}],"spoiler":false,"scene":{"누구를 따라가나":"돌아온 이사와 지금의 미라","지금 원하는 것":"자기 이름으로 다음 일정을 정하기","눈여겨볼 것":"영웅이 한 명만 서던 전시대"},"era":"공통력 개원 1개월 뒤 · 기록실과 이사의 가게","shortTitle":"종장","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"route-system","title":"환상선 — 문이 모두 열려 있는 미로","summary":"의료·돌봄을 잇던 교통망이 출입 제한과 결합한다. 도시는 처음부터 감옥으로 설계되지 않았다.","type":"world","kind":"세계의 작동","tags":[],"sections":[{"id":"loop","title":"환상은 두 번 읽힌다","blocks":[{"type":"paragraph","text":"작중 환상선의 공식 한자는 環狀線이다. 일곱 보호구를 돌아오는 순환 교통망이라는 뜻이다. 독자가 幻想이라는 같은 소리를 떠올릴 수 있지만, 이 노선은 꿈이나 가상현실이 아니다. 긴 저녁에는 아직 만경이 없다.","id":"loop-p1","terms":["긴 저녁","환상선","만경"]},{"type":"paragraph","text":"일곱 정거장은 쉬기·씻기·식사·진료·산책·상담·방문을 중심으로 운영된다. 좋은 날에는 어디서 타도 돌봄이 이어진다. 걷기 어렵거나 매번 복잡한 결정을 내리기 지친 사람에게 특히 유용하다. 이를 선택하는 사람이 자유를 덜 이해하는 것은 아니다.","id":"loop-p2","terms":[]}]},{"id":"boundary","title":"세 겹의 지도를 구별한다","blocks":[{"type":"paragraph","text":"첫째는 실제 도시다. 세 구조선과 그 위의 생활구, 기관실, 작업 통로와 연결 경사길이 있다. 도시 바깥과 14개 이웃 정착지도 존재한다. 일곱 보호구가 우주의 전부라는 반전은 없다.","id":"boundary-p1","terms":[]},{"type":"paragraph","text":"둘째는 승인된 안내 지도다. 자주 쓰는 안전 노선이 크게 표시된다. 카산의 정답원을 계승한 배치 체계가 수요를 예측해 지원한다. 예측에서 빠진 경로는 점점 유지·안내가 줄고, 실제 사용이 줄어드는 순환이 생긴다.","id":"boundary-p2","terms":["정답원","카산"]},{"type":"paragraph","text":"셋째는 그날의 출입 권한이다. 긴 저녁의 이송 제한이 둘째 지도와 겹치면서, 특정 사람에게 일곱 보호구 바깥의 목적지를 제시하지 않거나 이동을 강제로 막는다. 열차가 공간을 접는 것도, 승객이 길을 몰라서만 갇히는 것도 아니다.","id":"boundary-p3","terms":["긴 저녁"]},{"type":"paragraph","text":"안감의 지도는 첫째 지도를 바탕으로, 둘째 지도에서 빠진 생활 경로를 보완한다. 셋째의 제한을 풀기 위해서는 실제 운전수와 의료진, 기술자, 행정 반대자와 사벨의 권한이 필요했다. 지도를 발견했다고 모든 문이 자동으로 열리지는 않는다.","id":"boundary-p4","terms":["안감의 지도","안감","사벨"]}]},{"id":"after","title":"만경에서는 어떻게 달라졌나","blocks":[{"type":"paragraph","text":"만경에도 하루를 대신 정해주는 집과 반복 운행하는 길이 있다. 주민이 원하면 그 삶은 계속된다. 다른 삶을 원할 때 행정이 준비 상태를 심사하지 않는다는 점이 다르다.","id":"after-p1","terms":["만경"]},{"type":"paragraph","text":"만경의 개인 세계에서 꿈배역이 맡는 역할과, 긴 저녁의 실제 승객·운전수는 구별된다. 과거의 강제 이동은 나중에 행복한 갈래가 생겨도 없던 일이 되지 않는다. 돌아온 이사가 과거의 자기 대신 죽어줄 환영을 보내 역사를 지운 것도 아니다.","id":"after-p2","terms":["개인 세계","긴 저녁","꿈배역","이사","만경"]}]}],"sources":[],"relations":[],"spoiler":false,"shortTitle":"환상선","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"causal-ledger","title":"인과 확인 — 외투 한 벌이 바꾸지 못하는 것","summary":"연표, 정보의 출처, 실제 권한을 구분해 읽는다. 낙원의 힘을 잠깐 잊어야만 성립하는 사건은 두지 않는다.","type":"guide","kind":"읽기 지도","tags":[],"sections":[{"id":"time","title":"시간과 나이","blocks":[{"type":"paragraph","text":"개원 172년 전: 세 구조선과 도시 해원의 기원. 개원 88년 전: 기본 생활의 풍요가 정착한다. 빈곤이 사라진 뒤에도 기여도와 명예, 권한의 차이는 남는다.","id":"time-p1","terms":["해원"]},{"type":"paragraph","text":"개원 50년 전: 사벨의 유예궁이 시작된다. 개원 46년 전: 리브의 생활 연락망이 조직된다. 개원 42년 전: 긴 저녁, 선집행 사망자 312명, 확대 집행 중단. 당시 미라는 41세, 에이렌은 11세다.","id":"time-p2","terms":["긴 저녁","에이렌","유예궁","미라","사벨","리브"]},{"type":"paragraph","text":"개원 32년 전과 29년 전: 성인이 된 에이렌이 아벨을 면회한다. 개원 30년 전: 미라의 마지막 인간 당직. 개원 24년 전: 아벨이 수감 중 사망한다.","id":"time-p3","terms":["에이렌","미라","아벨"]},{"type":"paragraph","text":"개원 12년 전: 회복원의 체류 강제가 확대된다. 개원 9년 전: 등대동 사건과 에이렌의 체류 연장 서명. 개원 7~5년 전: 강제 제도 해체와 권리 개혁. 이 모두는 만경의 힘을 얻기 전이다.","id":"time-p4","terms":["등대동 사건","등대동","회복원","에이렌","만경"]},{"type":"paragraph","text":"개원 3년 전: 여러 정착지의 공동 연구로 백지의 현실 구성 능력을 확보한다. 개원 1년 전: 제한된 자발적 시범과 나래의 분기. 개원: 귀환제와 현재 본편. 개원 1개월 뒤: 아벨·이사의 면담, 외투 열람. 현재 미라는 83세, 에이렌은 53세다.","id":"time-p5","terms":["귀환제","에이렌","이사","미라","나래","아벨","분기","백지"]}]},{"id":"knowledge","title":"지도를 왜 신이 바로 밝혀내지 않는가","blocks":[{"type":"paragraph","text":"현재에는 바로 읽을 수 있다. 비밀을 유지하려고 에이렌의 힘을 없애지 않는다. 외투와 구조 기록은 공개 자료이며, 개인 기억의 재현에는 당사자의 허락이 필요하다. 이사는 자신이 겪은 일을 설명하는 데 동의하고 일부 감각의 재현은 거절한다.","id":"knowledge-p1","terms":["에이렌","이사"]},{"type":"paragraph","text":"긴박한 대피 장면의 시점은 42년 전이다. 그때는 외투 한 벌이 마법으로 사람을 옮겨주지 않았고, 죽은 사람을 되살릴 수 없었다. 사실의 발견은 독자에게 새롭지만 현재의 모든 인물에게 비밀일 필요는 없다.","id":"knowledge-p2","terms":[]},{"type":"paragraph","text":"낙원의 능력과, 타인의 정신에 마음대로 접근하지 않기로 한 권리 규칙은 구별한다. 연출을 위해 증거를 못 읽는 척하지 않고, 읽은 증거를 어떻게 공개하고 누구의 행동으로 표현할지에서 현재의 선택이 생긴다.","id":"knowledge-p3","terms":[]}]},{"id":"cause","title":"312명과 지도 사이의 인과","blocks":[{"type":"paragraph","text":"이사는 죽기 전에 두 장의 독립 지도와 외투 안의 사본을 넘겼다. 그 뒤 강제 이송되었고 구조가 도착하기 전에 살해되었다. 지도 전달이 그를 죽여야만 가능한 행위는 아니었다. 다른 사람이 죽음을 이용해 특별한 힘을 얻은 것도 아니다.","id":"cause-p1","terms":["이사"]},{"type":"paragraph","text":"지도는 일부 경로를 연결하는 데 기여했다. 집행 중단에는 의료진·행정 내부의 반대와 사벨의 명령, 현장 인력의 결정이 함께 필요했다. 한 재봉사가 혼자 전 도시를 구했다는 새 신화도 만들지 않는다.","id":"cause-p2","terms":["사벨"]},{"type":"paragraph","text":"이사에게 공로가 없어도 그를 살해한 일은 정당해지지 않는다. 311명의 나머지 희생자에게도 각각 구원 공적을 발굴해 붙여야 할 의무는 없다. 살아갈 권리를 유용함으로 증명하던 체제를 같은 방법으로 반박하지 않는다.","id":"cause-p3","terms":["이사"]}]},{"id":"motives","title":"서로에게 유리한 해석을 어디서 거절하는가","blocks":[{"type":"paragraph","text":"아벨: 자신도 죽으려 했다는 사실을 타인의 동의 대신 쓰지 못한다. 귀환과 만경의 성공을 자기 범죄의 필수 단계로 주장하지 않는다. 부활이 가능하다는 것을 당시 알았던 것도 아니다.","id":"motives-p1","terms":["아벨","만경"]},{"type":"paragraph","text":"사벨: 실제로 학살을 막았다는 공적과, 안전이 확인된 뒤에도 준비 상태를 심사하며 붙잡은 책임이 함께 남는다. 긴급 대피 제한과 무기한 생활 심사를 같은 조치로 섞지 않는다.","id":"motives-p2","terms":["사벨"]},{"type":"paragraph","text":"에이렌: 스승의 학살에 반대한 과거가 자기 회복원 서명을 면책하지 않는다. 자기 계획에 유리한 행복한 갈래를 현재의 거절을 지우는 증거로 고르지 않는다.","id":"motives-p3","terms":["회복원","에이렌"]},{"type":"paragraph","text":"리아: 이사의 공로를 알리는 일 때문에 그를 끝없는 증언자로 붙잡아두지 않는다. 그가 이야기를 공개한 뒤 새 가게에서 쉬거나 일할 권리도 남긴다.","id":"motives-p4","terms":["이사","리아"]}]},{"id":"fixed","title":"무너지지 않는 낙원의 조건","blocks":[{"type":"paragraph","text":"만경은 영혼을 연료로 쓰지 않는다. 유지에 희생자나 영원히 당직을 서는 신이 필요하지 않다. 연구팀이 확보한 힘은 긴 저녁의 죽음 때문에 발생하지 않았다.","id":"fixed-p1","terms":["긴 저녁","만경"]},{"type":"paragraph","text":"꿈의 삶도, 향상 기술도, 규칙적인 생활도, 충분히 알고 선택한 공동 의식도 실제로 좋은 선택이 될 수 있다. 이를 원하는 사람을 철없는 시민으로 만들지 않는다.","id":"fixed-p2","terms":[]},{"type":"paragraph","text":"환상선의 통제와 만경의 갈래는 같은 기능이 아니다. 옛 제도의 답이 하나뿐이었던 이유를, 새 우주에서도 답이 하나뿐인 것처럼 설명하지 않는다.","id":"fixed-p3","terms":["환상선","만경"]}]}],"sources":[],"relations":[],"spoiler":false,"shortTitle":"인과 확인","preview":"","readingMinutes":3,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-lining","title":"복선 — 숨겨둔 선에서, 함께 달릴 선으로","summary":"실을 따라 미로를 나온 이야기가, 남의 옷 안에 돌아갈 길을 남기는 이야기로 달라진다.","type":"deep","kind":"깊게 읽기","tags":[],"sections":[{"id":"word","title":"伏線과 複線","blocks":[{"type":"paragraph","text":"이 글은 한국어의 같은 소리를 두 번 읽는다. 복선(伏線)은 뒤에 드러날 단서를 미리 심는 것, 복선(複線)은 선로가 둘인 것을 가리킨다. 두 단어가 같은 어원에서 나왔다고 주장하는 이야기는 아니다.","id":"word-p1","terms":[]},{"type":"paragraph","text":"첫 번째 독서에서 이사의 선은 뒤늦게 알아보는 단서다. 두 번째 독서에서는 구원자가 정한 한 길 말고 실제 다른 길도 놓을 수 있는지에 관한 질문이 된다. 옷 안쪽에 그렸다는 사실보다, 그 선을 누가 걸을 수 있게 했는지가 중요하다.","id":"word-p2","terms":["이사"]}]},{"id":"reading","title":"아리아드네와 페넬로페","blocks":[{"type":"paragraph","text":"아폴로도로스의 전승에서 아리아드네는 다이달로스에게 길을 알아내고, 테세우스가 미로를 나올 수 있도록 실을 건넨다. 같은 신화의 여러 판본을 하나의 유일한 정답처럼 합치지는 않는다.","citation":"myth-thread","id":"reading-p1","terms":["리아"]},{"type":"paragraph","text":"《오디세이아》에서 페넬로페는 낮에 짠 직물을 밤에 풀며 선택을 강요받는 시간을 늦춘다. 여기서 직조는 장식뿐 아니라 누가 결말의 시점을 정하는지와 연결된다.","citation":"odyssey","id":"reading-p2","terms":[]},{"type":"paragraph","text":"이사는 영웅을 보내고 기다리는 배역에 머물지 않는다. 자신도 그 길로 나가려 했다. 옷의 시침을 푸는 행위는 비밀스러운 마법이 아니라, 자기 기술을 다른 용도로 쓰는 선택이다. 구원을 받으려면 남을 먼저 구해야 한다는 조건을 붙이지 않는다.","id":"reading-p3","terms":["이사"]}]},{"id":"payoff","title":"외투에서 빠진 마지막 도착지","blocks":[{"type":"paragraph","text":"안감에 적힌 집 주소는 문학적 저승이나 영원한 안식처가 아니다. 이사가 정말 돌아가려고 했던 가게다. 회송 말고 우리 집으로라는 메모를 유언처럼 읽는 순간, 다음 날 납품할 옷을 걱정하던 사람을 놓친다.","id":"payoff-p1","terms":["이사","안감","회송"]},{"type":"paragraph","text":"짧은 소매는 누가 입었는지, 잘린 자락은 누구에게 건넸는지, 안감은 누구의 길이 빠졌는지를 말한다. 비밀을 푼 보상은 새 왕을 찾는 일이 아니라, 한 벌의 옷에 실제로 여러 손이 닿았음을 보는 일이다.","id":"payoff-p2","terms":["안감"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"처음의 주문 다시 보기","entry":"lining-opening"},{"label":"도시의 실제 길 확인","entry":"route-system"}],"id":"payoff-p3","terms":[]}],"reveal":true}],"sources":[{"id":"myth-thread","title":"아폴로도로스 《도서관》 요약편 E.1.8–9 · 고전 번역","url":"https://www.theoi.com/Text/ApollodorusE.html","locator":"아리아드네·다이달로스와 돌아 나오는 실"},{"id":"odyssey","title":"호메로스 《오디세이아》 · 버틀러 영역, 제2·9·23권","url":"https://www.gutenberg.org/files/1727/1727-h/1727-h.htm","locator":"페넬로페의 직조, Nobody, 침상의 확인"}],"relations":[{"target":"lining-opening","label":"외투를 다시 읽기","reason":"첫 장면의 흠집이 실제 사용 기록이 된다.","evidence":{"entry":"lining-opening","anchor":"commission","label":"문 여는 시간"}}],"spoiler":false,"shortTitle":"복선","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night","lining-opening","lining-map","lining-supper","lining-loop","lining-call","lining-crossing","lining-morning","lining-return"]},{"id":"deep-city-seam","title":"도시의 안감 — 배경 지도가 사건이 될 때","summary":"수상한 지형을 발견하는 쾌감을, 사람을 소모하는 마법진이 아니라 길을 배분한 결정으로 옮긴다.","type":"deep","kind":"깊게 읽기","tags":[],"sections":[{"id":"shape","title":"지하로 내려가면 규모가 달라진다","blocks":[{"type":"paragraph","text":"《강철의 연금술사 FULLMETAL ALCHEMIST》 공식 35화 소개는 터널에서 대화하던 인물들이 국가 형성의 이상함을 알아차리는 사건을 다룬다. 한 공간을 조사하다 더 큰 구조를 읽게 되는 전환을 참고했다.","citation":"fma-shape","id":"shape-p1","terms":[]},{"type":"paragraph","text":"《진격의 거인》 21권의 출판사 소개도 지하실에 다가가며 벽 안의 세계가 숨긴 문제를 묻는다. 여기서는 원전의 비밀 정체를 복제하기보다, 한 방의 자료가 앞서 본 세상의 범위를 바꾸는 읽기 구조를 사용한다.","citation":"aot-room","id":"shape-p2","terms":[]},{"type":"paragraph","text":"만경의 과거에서 거대한 마법진이나 숨겨진 전 인류를 새로 만들지는 않는다. 세 구조선의 통로가 배경으로 먼저 보이고, 나중에는 어떤 사람에게 지원되는 목적지가 잘려 있었는지 보여주는 지도가 된다.","id":"shape-p3","terms":["만경"]}]},{"id":"ecology","title":"빛 아래의 학교가 도시를 설명하는 방식","blocks":[{"type":"paragraph","text":"라하이로이의 공개 세계관 소개 전재본은 스타토치 아카데미의 빛 에너지 연구, 생태 보전, 부품을 활용한 생태 연결을 함께 설명한다. 같은 문서가 공식 원문 주소를 제시하지만, 원문 동적 페이지의 전체 내용을 직접 대조하지 못한 범위는 남아 있다. 따라서 본편 반전이나 명명 의도를 여기서 확정하지 않는다.","citation":"lahai-notes","id":"ecology-p1","terms":[]},{"type":"paragraph","text":"이 설정에서 가져온 것은 특정 기관명이나 인공 태양의 비밀이 아니라, 환경·기술·생활이 서로 영향을 주도록 설계하는 방식이다. 해원의 배 구조는 경사길의 위치를, 경사길은 이동 보조의 필요를, 보조 비용과 권한의 배분은 어떤 지도가 공적인 지도가 되는지를 바꾼다.","id":"ecology-p2","terms":["해원"]},{"type":"paragraph","text":"삼박등은 도시를 먹여 살리는 마법 장치가 아니다. 낮의 조명·생산 시설과 다른 구조 신호다. 비슷한 하늘의 빛이라는 이유로 서로 다른 기능을 섞지 않는다.","id":"ecology-p3","terms":["삼박등"]}]},{"id":"reveal","title":"없던 길이 아니라, 지원하지 않은 길","blocks":[{"type":"paragraph","text":"독자는 지도에서 빠진 선을 보고 지배자가 처음부터 완벽한 감옥을 만들었다고 추측할 수 있다. 실제로는 편의를 위해 만든 교통망, 수요를 기준으로 한 투자, 강제 보호라는 서로 다른 결정이 겹쳤다.","id":"reveal-p1","terms":[]},{"type":"paragraph","text":"그래서 해결도 비밀 지도 한 장을 태우거나 중앙 장치를 폭파하는 일이 아니다. 기술자가 길을 확인하고, 의료진이 이동을 돕고, 행정의 제한을 실제로 중단해야 한다. 한 선의 발견이 여러 인물에게 서로 다른 행동을 요구한다.","id":"reveal-p2","terms":[]}],"reveal":true}],"sources":[{"id":"fma-shape","title":"《강철의 연금술사 FA》 공식 35화 「이 나라의 형태」","url":"https://www.hagaren.jp/fa/about/story03.html","locator":"공식 회차 소개 · 터널에서 국가 형성의 이상함을 발견한다"},{"id":"aot-room","title":"Kodansha 《진격의 거인》 21권 · 출판사 소개","url":"https://kodansha.us/series/attack-on-titan/volume-21/","locator":"지하실에 접근하며 벽 안의 비밀을 묻는 단계까지"},{"id":"lahai-notes","title":"Wutherium Geographic: Lahai-Roi Vol.1 · 공개 설정문 전재본","url":"https://wutheringwaves.notion.site/Wutherium-Geographic-Lands-and-Waters-Lahai-Roi-Vol-1-2efef7f91e4b8081ade3fb50131e1d44","locator":"2차 전재 · 원문 주소를 명시한 학교·빛 에너지·생태 연구 설정. 제작진 명명 의도를 증명하지 않음"},{"id":"lahai-official","title":"명조 공식: Wutherium Geographic, Lahai-Roi Vol.1 · 원문 위치","url":"https://wutheringwaves.kurogames.com/en/main/news/detail/3986","locator":"전재본이 제시한 공식 원문 주소. 동적 페이지의 전체 본문 직접 확인은 제한됨"}],"relations":[],"spoiler":false,"shortTitle":"도시의 안감","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night","lining-opening","lining-map","lining-supper","lining-loop","lining-call","lining-crossing","lining-morning","lining-return"]},{"id":"deep-circular-paradise","title":"환상선 — 돌아오는 꿈과 돌아갈 권리","summary":"선데이의 질서, 영웅 주변의 제도, 역사를 고르는 장치를 교통망의 선택으로 바꾸어 읽는다.","type":"deep","kind":"깊게 읽기","tags":[],"sections":[{"id":"order","title":"좋은 일정도 누군가에게는 구원이다","blocks":[{"type":"paragraph","text":"페나코니 본편의 선데이는 질서의 힘으로 꿈과 현실을 잇는 구원을 추진한다. 이 글은 2.2 본편에 해당하는 2차 줄거리 정리를 보조 자료로 사용한다. 게임상의 전투 운명의 길과 서사에서 선택한 질서를 같은 것으로 적지 않는다.","citation":"sunday","id":"order-p1","terms":[]},{"type":"paragraph","text":"사벨의 일과표는 선데이의 대사나 새 우화를 옮긴 것이 아니다. 선택을 줄이는 것이 실제로 도움이 되는 사람을 인정한 뒤, 그 생활에서 떠나고 싶어진 사람에게 누가 최종 결정을 내리는지 묻는다. 반복되는 좋은 하루를 좋아한다는 이유만으로 시민을 미성숙하게 만들지 않는다.","id":"order-p2","terms":["사벨"]}]},{"id":"institutions","title":"영웅을 바꾸어도 양식이 남는 이유","blocks":[{"type":"paragraph","text":"허버트는 「Dune Genesis」에서 영웅 개인뿐 아니라 영웅 주위에 형성되는 권력 구조를 경계했다고 설명한다. 여기서 빌린 것은 성녀가 사실 가짜라는 반전이 아니라, 실제 구원의 공적이 이후의 권한에 쓰이는 과정이다.","citation":"dune-author","id":"institutions-p1","terms":[]},{"type":"paragraph","text":"긴 저녁의 사벨은 실제로 사람들을 살렸다. 그 성공 덕분에 준비 여부를 판단하는 권한이 더 신뢰받는다. 에이렌은 아벨의 살인을 거절하고도, 사벨의 보호 언어를 자기 회복원에서 반복한다. 적의 악함보다 동료의 성공이 물려주는 습관이 더 알아보기 어려울 수 있다.","id":"institutions-p2","terms":["긴 저녁","회복원","에이렌","아벨","사벨"]}]},{"id":"branches","title":"운명에 없는 길인가, 허락하지 않은 길인가","blocks":[{"type":"paragraph","text":"《로키》 시즌 2의 시간 직조기와 가지치기에 관한 에피소드 정리는, 모든 갈래를 동등하게 보존하는 것처럼 보인 장치의 선택 문제를 드러낸다. 이 설명은 2차 자료에 근거하며 별도의 물리학 주장으로 쓰지 않는다.","citation":"loki-summary","id":"branches-p1","terms":[]},{"type":"paragraph","text":"해원에서는 실제 우주 갈래를 잘라내지 않는다. 안내가 허용된 길만 보여주면, 지원되지 않은 길의 부재가 당사자의 운명처럼 읽힐 수 있다는 구조로 바꾼다. 그래서 미라는 운명을 거스른 천재가 아니라 잘못 묶여 있던 배차와 지원을 분리하는 사람이다.","id":"branches-p2","terms":["미라","해원"]}]},{"id":"recurrence","title":"엠포리어스에서 가져온 기대의 무게","blocks":[{"type":"paragraph","text":"스타레일 3.4 공식 소개는 파이논의 차분한 태도 뒤에 많은 사람의 기대가 놓여 있고, 그의 과거를 따라 그 무게가 어떻게 생겼는지 보게 된다고 설명한다. 이 자료가 전체 엠포리어스 결말까지 증명하는 것은 아니다.","citation":"amphoreus","id":"recurrence-p1","terms":[]},{"type":"paragraph","text":"만경에서는 후속 게임 반전의 반복 횟수나 인물을 복사하지 않는다. 대신 아벨을 막은 사벨, 사벨의 제도를 계승한 에이렌, 그 뒤를 사는 사람에게 다른 이름의 구원이 같은 의무를 물려주는 역사적 반복을 둔다. 문자 그대로 시간이 초기화되는 현상은 없다.","id":"recurrence-p2","terms":["에이렌","아벨","사벨","만경"]},{"type":"paragraph","text":"에이렌의 먼 미래에서 당직표를 비우는 일은 반복을 혼자 더 오래 버텨내는 영웅의 승리가 아니다. 다음 사람에게 같은 영원한 의무를 넘기지 않아도 세계가 계속된다는 확인이다.","id":"recurrence-p3","terms":["에이렌"]}]},{"id":"payoff","title":"분수는 왜 두 번 보였나","blocks":[{"type":"paragraph","text":"서로 다른 역 이름은 모든 이동이 거짓이었다는 증거가 아니다. 실제로 움직였지만 원하는 곳으로는 가지 못했다는 증거다. 이 차이를 놓치지 않으면, 유예궁을 사랑하는 주민과 떠나려는 주민을 동시에 존중할 수 있다.","id":"payoff-p1","terms":["유예궁"]}],"reveal":true}],"sources":[{"id":"sunday","title":"Sunday (Honkai: Star Rail) · 위키백과 줄거리 정리","url":"https://en.wikipedia.org/wiki/Sunday_(Honkai:_Star_Rail)","locator":"2차 자료 · 페나코니 2.2 본편의 질서와 공유된 꿈에 한정. 후속 팬 해석과 최신 인물 행보는 사용하지 않음"},{"id":"dune-author","title":"Frank Herbert, Dune Genesis (1980) · 작가 에세이 재수록","url":"https://vasil.ludost.net/dunegenesis.pdf","locator":"4쪽 자료 · 영웅 주변의 권력 구조와 반복 주제"},{"id":"loki-summary","title":"Loki season 2 · 위키백과 에피소드 정리","url":"https://en.wikipedia.org/wiki/Loki_season_2","locator":"2차 자료 · 시간 직조기가 보존하는 역사와 가지치기 구조"},{"id":"amphoreus","title":"HoYoverse · PlayStation Blog: HSR Version 3.4 (2025-06-20)","url":"https://blog.playstation.com/2025/06/20/honkai-star-rail-version-3-4-arrives-july-2/","locator":"개발사 소개 · 파이논의 과거, 타인의 기대와 영웅의 부담. 전체 결말을 설명하는 출처는 아님"}],"relations":[],"spoiler":false,"shortTitle":"환상선","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night","lining-opening","lining-map","lining-supper","lining-loop","lining-call","lining-crossing","lining-morning","lining-return"]},{"id":"deep-small-proof","title":"한쪽 소매 — 물건이 먼저 알고 있는 이야기","summary":"처음에는 흠집, 다음에는 사용 기록. 설명을 추가하기보다 관찰한 사실의 의미를 바꾼다.","type":"deep","kind":"깊게 읽기","tags":[],"sections":[{"id":"names","title":"거꾸로 읽기보다 안쪽으로 읽기","blocks":[{"type":"paragraph","text":"해리 포터 공식 자료는 Erised를 뒤집으면 Desire가 된다는 이름의 장치를 설명한다. 먼저 본 표기가 나중에 다른 의미로 읽히는 구조다.","citation":"harry","id":"names-p1","terms":[]},{"type":"paragraph","text":"놀런은 인터뷰에서 아리아드네의 미로 모티프와, 감정을 붙잡는 물건을 이야기한다. 이 글은 그 장치의 복제보다 반복해서 보이는 사물이 어떻게 다른 감정으로 읽히는지에 주목한다.","citation":"nolan","id":"names-p2","terms":["리아"]},{"type":"paragraph","text":"이사의 소매에는 암호를 숨기지 않았다. 옷을 입은 사람의 팔 길이가 남았을 뿐이다. 사건의 새 설명은 처음 본 외형을 부정하지 않는다. 오히려 왜 그 흠집이 있어야 했는지 설명한다.","id":"names-p3","terms":["이사"]}]},{"id":"three","title":"세 번 보이는 외투","blocks":[{"type":"paragraph","text":"첫 번째: 가슴의 사벨 이름이 외투의 주인을 정하는 것처럼 보인다. 두 번째: 리브에게 맞춘 소매가 실제로 걸은 사람을 가리킨다. 세 번째: 안감과 잘린 자락이 그 옷을 만든 사람과 받은 사람을 더한다.","id":"three-p1","terms":["안감","사벨","리브"]},{"type":"paragraph","text":"어느 발견도 앞선 사람의 공을 전부 삭제하지 않는다. 사벨의 권한 없이는 몇몇 문이 더 늦게 열렸을 것이고, 리브가 걷지 않았으면 서명은 종이에 남았을 것이다. 이사가 기록한 길도 누군가 확인하고 장비를 옮기지 않았다면 안전하지 않았다.","id":"three-p2","terms":["이사","사벨","리브"]}]},{"id":"payoff","title":"새 전시에서도 반복될 뻔한 일","blocks":[{"type":"paragraph","text":"전시 담당자가 영웅의 이름을 이사로 바꿔주겠다고 할 때, 같은 전시 방식이 돌아온다. 주인공을 올바른 사람으로 교체하는 것과 한 사람만 주인공일 수 있게 정리하는 방식을 바꾸는 것은 다르다.","id":"payoff-p1","terms":["이사"]},{"type":"paragraph","text":"만경의 꿈배역을 좋아하는 사람에게까지 이 전시 방식을 강요하지 않는다. 꿈의 배역은 원하는 이야기를 위해 존재할 수 있다. 실제 역사 속 사람은 누구의 결말을 위해 존재했던 배역이 아니다.","id":"payoff-p2","terms":["꿈배역","만경"]}],"reveal":true}],"sources":[{"id":"harry","title":"HarryPotter.com · The Mirror of Erised wordsearch","url":"https://www.harrypotter.com/features/the-mirror-of-erised-wordsearch","locator":"Erised와 Desire의 역순 관계"},{"id":"nolan","title":"WIRED, Inception: Christopher Nolan Interview (2010) · 감독 인터뷰","url":"https://www.wired.com/2010/11/pl-inception-nolan/","locator":"미로·아리아드네·감정을 붙잡는 물건에 관한 답변"}],"relations":[],"spoiler":false,"shortTitle":"한쪽 소매","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night","lining-opening","lining-map","lining-supper","lining-loop","lining-call","lining-crossing","lining-morning","lining-return"]},{"id":"deep-arrivals","title":"합류 — 모두 모였는데 행렬은 갈라진다","summary":"앞선 장면에서 익힌 도움들이 함께 작동하는 순간을 만들되, 한 왕에게 모이는 결말로 끝내지 않는다.","type":"deep","kind":"깊게 읽기","tags":[],"sections":[{"id":"reference","title":"돌아온 인물은 장식이 아니다","blocks":[{"type":"paragraph","text":"《어벤져스: 엔드게임》의 포털 합류 장면은 앞선 작품에 나온 인물들이 다시 모이는 장면으로 정리된다. 여기서는 2019년 영화의 해당 장면과 그 제작 정리만 참고한다.","citation":"avengers","id":"reference-p1","terms":["합류"]},{"type":"paragraph","text":"긴 저녁에서는 구원의 기술들이 합류한다. 공개된 보조 장치, 의료 지식, 주소록, 배차 권한, 실제로 남에게 건넨 외투가 각각 앞 장면에서 소개된 일을 끝낸다. 등장 이름을 많이 부르는 대신, 누구의 어떤 행동이 다음 사람을 움직이게 했는지 보여준다.","id":"reference-p2","terms":["긴 저녁","합류"]}]},{"id":"carrier","title":"불을 받았다는 것과 불을 전달하는 일","blocks":[{"type":"paragraph","text":"헤시오도스의 전승에서 프로메테우스는 회향 줄기에 불을 감춰 옮긴다. 여기서 떠올린 것은 불의 소유자뿐 아니라 구체적인 운반 도구가 있다는 점이다.","citation":"hesiod","id":"carrier-p1","terms":[]},{"type":"paragraph","text":"프로네의 기술은 사제가 허락한 사람만 쓰는 유물이 아니라 공개된 도구다. 그래서 대피 때 그의 새 발명 한 번으로 해결하지 않는다. 오래전 배운 기술을 서로 다른 사람들이 스스로 사용한다. 불을 가져온 사람과 오늘 옮긴 사람의 이름이 같을 필요가 없다.","id":"carrier-p2","terms":["프로네"]}]},{"id":"pledge","title":"맹세의 값을 누가 내는가","blocks":[{"type":"paragraph","text":"《신 에다》의 펜리르 결박 전승에서 티르의 손은 신들의 약속에 대한 담보로 놓인다. 그 장면을 만경의 인물에게 똑같은 신체 희생으로 옮기지 않았다.","citation":"norse","id":"pledge-p1","terms":["만경"]},{"type":"paragraph","text":"사벨은 자기 이름이 곧 돌봄의 보증이 된다고 생각한다. 리브는 그 이름을 실제 문을 여는 데 쓰지만, 그 보증 때문에 피난민의 남은 삶까지 사벨에게 맡길 수는 없다고 말한다. 자기 명예를 건 약속이 다른 사람의 동의까지 대신하지 못한다.","id":"pledge-p2","terms":["사벨","리브"]}]},{"id":"payoff","title":"같은 목적지를 향하지 않는 피날레","blocks":[{"type":"paragraph","text":"승리의 행렬은 세 갈래로 나간다. 하나는 실제로 유예궁으로 간다. 그 선택도 좋은 결말이다. 다른 둘이 다른 집으로 간다는 사실을 실패나 배신으로 읽지 않는다.","id":"payoff-p1","terms":["유예궁"]},{"type":"paragraph","text":"만경 이전에도 모두를 하나의 정답으로 모으지 않고 함께 한 일을 할 수 있었다. 낙원은 과거에 없던 모든 선을 처음 발명하는 것이 아니라, 이미 어렵게 열었던 선택을 훨씬 넓게 가능하게 한다.","id":"payoff-p2","terms":["만경"]}],"reveal":true}],"sources":[{"id":"avengers","title":"Avengers assemble scene · 위키백과 장면·제작 정리","url":"https://en.wikipedia.org/wiki/Avengers_assemble_scene","locator":"2차 자료 · 2019년 영화의 포털 합류 장면. 2026년 재개봉 추가 장면은 사용하지 않음"},{"id":"hesiod","title":"헤시오도스 《신통기》 · 고전 번역","url":"https://www.theoi.com/Text/HesiodTheogony.html","locator":"불을 담은 회향 줄기, 에우노미아·디케·에이레네"},{"id":"norse","title":"《신 에다》 · Gutenberg 공개 번역","url":"https://www.gutenberg.org/files/18947/18947-h/18947-h.htm","locator":"길피의 속임수 · 펜리르를 묶는 약속과 티르의 보증"}],"relations":[],"spoiler":false,"shortTitle":"합류","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night","lining-opening","lining-map","lining-supper","lining-loop","lining-call","lining-crossing","lining-morning","lining-return"]},{"id":"deep-names-thread","title":"이름의 안감 — 에이렌·리브·이사를 두 번 읽기","summary":"확인 가능한 어원과 작가가 만든 말장난을 나눈다. 이름이 반전을 명령하지 않고, 장면 뒤에서 더 길게 울리게 한다.","type":"deep","kind":"깊게 읽기","tags":[],"sections":[{"id":"peace","title":"에이렌 — 평화가 정의의 방으로 들어갈 때","blocks":[{"type":"paragraph","text":"헤시오도스의 《신통기》에서 에우노미아·디케·에이레네는 질서·정의·평화와 연결된다. 에이렌은 에이레네를 연상하도록 지은 창작 이름이며 고전 인물 본인이라는 설정은 아니다.","citation":"hesiod","id":"peace-p1","terms":["에이렌"]},{"type":"paragraph","text":"해원의 세 배 이름에도 이 연관을 남겼다. 평화라는 이름의 사람이 정의의 공간에서 자기 행위를 답한다. 서명한 사람이 좋은 이름을 가졌다는 이유로 심판을 면하지 않는다. 삼자매 중 하나가 나머지를 이기면 완성되는 구조도 아니다.","id":"peace-p2","terms":["해원"]}]},{"id":"life","title":"리브 — 살아남을 두 사람을 고르지 않는 생명","blocks":[{"type":"paragraph","text":"고 에다의 리브와 리브트라시르 전승은 종말 이후의 생존을 다룬다. Líf를 생명과 연결하는 이름을 참고했다.","citation":"lif","id":"life-p1","terms":["리브"]},{"type":"paragraph","text":"리브는 훌륭한 소수만 남기는 명부 대신 지금 연락할 주소를 적는다. 다만 다른 사람의 삶을 돌봄의 역할로 붙잡지 않도록, 도움을 주는 동료의 쉬는 시간도 함께 확보해야 한다. 생명을 지키는 이름이 남에게 영원한 근무를 요구하는 면허는 아니다.","id":"life-p2","terms":["리브"]}]},{"id":"move","title":"이사 — 거창한 어원 대신 실제 이삿날","blocks":[{"type":"paragraph","text":"이사 렌이라는 이름을 이사야나 특정 외국어의 숨은 진짜 어원이라고 설명하지 않는다. 여기서는 한국어 독자가 이사라는 소리에서 집을 옮기는 일을 떠올리도록 쓰는 창작상의 겹침이다.","id":"move-p1","terms":["이사 렌","이사"]},{"type":"paragraph","text":"그는 남의 출발을 돕는 일을 하고, 자신의 출발도 원한다. 귀환 뒤에는 예전 가게를 그대로 재현하는 대신 새로운 가게로 옮긴다. 이름의 뜻을 알아맞혀야 사건을 이해할 수 있는 장치는 아니다. 알고 다시 읽으면 집으로 가자는 평범한 말이 한 번 더 들린다.","id":"move-p2","terms":[]}]},{"id":"reference","title":"닮은 사람, 다른 시간의 답","blocks":[{"type":"paragraph","text":"Fate/stay night UBW의 공식 회차 소개는 아처의 정체와 시로가 마주한 이상의 결과를 다룬다. 자기 이상이 시간이 지난 뒤 어떤 사람을 만드는지 대면하는 구조를 참고한다.","citation":"fate","id":"reference-p1","terms":[]},{"type":"paragraph","text":"STEINS;GATE ELITE의 공식 소개는 과거에 보내는 메일이 결과를 바꾸는 장치를 제시한다. 만경의 편지는 과거를 덮어쓰는 메일이 아니라 서로 다른 현재 사이에 도착하는 소식이다.","citation":"steins","id":"reference-p2","terms":["만경"]},{"type":"paragraph","text":"여울은 실패해서 돌아온 경고도, 나래가 반드시 되어야 하는 답도 아니다. 행복한 다른 갈래가 존재해도 이쪽 사람의 이름과 선택이 사라지지 않는다. 이름·기억이 이어진다는 것과 대표권이 넘어간다는 것은 다르다.","id":"reference-p3","terms":["여울","나래"]}]},{"id":"payoff","title":"외투의 이름표는 틀리지 않았다","blocks":[{"type":"paragraph","text":"사벨의 이름을 가짜로 밝혀내는 반전은 아니다. 그 이름으로 문이 열린 사실이 있다. 다만 그 이름 하나만 읽으면, 입은 사람·길을 적은 사람·기다리던 사람의 이름이 지워진다. 이름표를 떼는 대신 안감까지 펼치는 이유다.","id":"payoff-p1","terms":["안감","사벨"]}],"reveal":true}],"sources":[{"id":"hesiod","title":"헤시오도스 《신통기》 · 고전 번역","url":"https://www.theoi.com/Text/HesiodTheogony.html","locator":"불을 담은 회향 줄기, 에우노미아·디케·에이레네"},{"id":"lif","title":"《고 에다》 Vafthruthnismol · 벨로스 번역","url":"https://sacred-texts.com/book/the-poetic-edda/vafthruthnismol","locator":"리브·리브트라시르와 종말 이후의 생존"},{"id":"fate","title":"Fate/stay night UBW 공식 제19화 「이상의 끝」","url":"https://www.fate-sn.com/ubw/story/20.html","locator":"아처의 정체와 영웅의 이상이 도달한 결과"},{"id":"steins","title":"Spike Chunsoft · STEINS;GATE ELITE 공식 게임 소개","url":"https://www.spike-chunsoft.com/games/steinsgate-elite/","locator":"과거로 보내는 메일과 변화하는 결과의 기본 장치"}],"relations":[],"spoiler":false,"shortTitle":"이름의 안감","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night","lining-opening","lining-map","lining-supper","lining-loop","lining-call","lining-crossing","lining-morning","lining-return"]},{"id":"reference-workshop","title":"레퍼런스 작업실 — 18개의 장치를 한 역사로","summary":"어디서 참고했고 무엇을 바꾸었는지, 설명이 아닌 실제 장면으로 이어진다.","type":"guide","kind":"읽기 지도","tags":[],"sections":[{"id":"method","title":"장치 → 행동 → 돌아오는 장면","blocks":[{"type":"paragraph","text":"아래는 해당 작품의 모든 줄거리를 요약한 표가 아니다. 확인한 대목, 만경에서 다른 결말로 바꾼 이유, 실제 읽을 장면을 연결한 지도다. 참고작과 이 자료집의 결말이 일부 드러난다. 최신 게임은 본문을 확인한 범위와 전재·2차 설명을 구별한다. 확인 기준일은 2026년 10월 12일이다.","id":"method-p1","terms":["만경"]}]},{"id":"dune","title":"듄","blocks":[{"type":"paragraph","text":"영웅이 아니라 영웅 주변에 남는 권한도 읽는다.","citation":"dune-author","id":"dune-p1","terms":[]},{"type":"paragraph","text":"사벨의 구조 공적이 준비 상태를 심사할 권위로 굳는 과정. 메이의 인계장은 예정된 후계자의 예언이 아니다.","id":"dune-p2","terms":["메이","사벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"lining-morning"}],"id":"dune-p3","terms":[]}]},{"id":"bible","title":"성경","blocks":[{"type":"paragraph","text":"한 장 안에서도 억압의 탄식과 서로를 일으키는 행동이 이어진다.","citation":"bible","id":"bible-p1","terms":[]},{"type":"paragraph","text":"아벨과 리브가 같은 전도서의 서로 다른 대목에 머문다. 작품의 범죄를 경전의 결론으로 제시하지 않는다.","id":"bible-p2","terms":["아벨","리브"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"deep-abel"}],"id":"bible-p3","terms":[]}]},{"id":"evangelion","title":"에반게리온","blocks":[{"type":"paragraph","text":"인간 마음의 완성과 경계에 관한 질문을 공식 결말 소개에서 출발해 비교한다.","citation":"eva","id":"evangelion-p1","terms":[]},{"type":"paragraph","text":"공동 의식이 실제로 잘 작동해도 서로 이해하는 것과 같은 판단을 하는 것은 다를 수 있다.","id":"evangelion-p2","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"future-choir"}],"id":"evangelion-p3","terms":[]}]},{"id":"sunday","title":"페나코니 · 선데이","blocks":[{"type":"paragraph","text":"질서에 의해 모두를 보호하려는 공유된 꿈. 2.2 본편의 2차 정리 범위다.","citation":"sunday","id":"sunday-p1","terms":[]},{"type":"paragraph","text":"사벨의 일정은 실제로 도움이 된다. 누군가 그 일정을 떠날 때도 준비 여부를 대신 심사하는지가 쟁점이다.","id":"sunday-p2","terms":["사벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"deep-circular-paradise"}],"id":"sunday-p3","terms":[]}]},{"id":"amphoreus","title":"엠포리어스 · 파이논","blocks":[{"type":"paragraph","text":"3.4 공식 소개에서 영웅의 과거와 쌓인 기대를 확인한다. 전체 결말을 확인한 것으로 확대하지 않는다.","citation":"amphoreus","id":"amphoreus-p1","terms":[]},{"type":"paragraph","text":"사벨과 에이렌에게 이어지는 구원의 당직. 시간 초기화 대신 제도와 기대가 반복된다.","id":"amphoreus-p2","terms":["에이렌","사벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"future-offduty"}],"id":"amphoreus-p3","terms":[]}]},{"id":"lahai","title":"명조 · 라하이로이","blocks":[{"type":"paragraph","text":"원문 주소를 포함한 공개 설정문 전재에서 빛·생태·학술 도시의 연결을 읽는다. 전재는 2차 자료다.","citation":"lahai-notes","id":"lahai-p1","terms":[]},{"type":"paragraph","text":"해원의 지형·통로·돌봄 교통을 하나의 생활 체계로 설계한다. 어원의 일치나 후속 게임 반전을 확정하지 않는다.","id":"lahai-p2","terms":["해원"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"deep-city-seam"}],"id":"lahai-p3","terms":[]}]},{"id":"fma","title":"강철의 연금술사","blocks":[{"type":"paragraph","text":"35화 공식 소개의 공간 조사에서 국가 구조로 넘어가는 발견.","citation":"fma-shape","id":"fma-p1","terms":[]},{"type":"paragraph","text":"안감의 실제 지도와 승인된 지도를 겹쳐, 없는 길이 아니라 빼놓은 길을 발견한다. 인간 연료·국토 마법진은 넣지 않는다.","id":"fma-p2","terms":["안감"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"lining-loop"}],"id":"fma-p3","terms":[]}]},{"id":"titan","title":"진격의 거인","blocks":[{"type":"paragraph","text":"21권 출판사 소개의 지하실과 세계의 비밀이라는 전환.","citation":"aot-room","id":"titan-p1","terms":[]},{"type":"paragraph","text":"박물관 한 벌의 옷에서 통신소·경사길·집행기관의 서로 다른 시간이 열린다. 기존 세계가 전부 거짓이었다고 뒤집지는 않는다.","id":"titan-p2","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"lining-opening"}],"id":"titan-p3","terms":[]}]},{"id":"potter","title":"해리 포터","blocks":[{"type":"paragraph","text":"Erised / Desire의 역순 이름 장치.","citation":"harry","id":"potter-p1","terms":[]},{"type":"paragraph","text":"萬景과 萬鏡, 環狀과 幻想, 짧은 소매를 다시 읽는다. 표기와 사물이 거짓말을 하는 대신 독자의 해석이 달라진다.","id":"potter-p2","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"deep-small-proof"}],"id":"potter-p3","terms":[]}]},{"id":"olympus","title":"올림포스 · 아리아드네","blocks":[{"type":"paragraph","text":"미로 안으로 들어간 사람이 되돌아 나오도록 건네진 실의 전승.","citation":"myth-thread","id":"olympus-p1","terms":[]},{"type":"paragraph","text":"세 배와 외
