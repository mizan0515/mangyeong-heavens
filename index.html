,"나래","메이","여울"],"id":"address-p2"}],"readerLayer":"commentary","reveal":true},{"id":"privacy","title":"귀환으로 지워지지 않는 것","blocks":[{"type":"paragraph","text":"피해자의 부활은 가해자가 행위를 하지 않았다는 뜻이 아니다. 당사자들은 회복된 몸을 사랑하면서도 과거 기록의 정정을 요구할 수 있다. 어떤 사람은 과거를 더 다루지 않고 싶어 한다. 그 사람을 사건의 영구 증인으로 붙들지 않는다.","terms":[],"id":"privacy-p1"},{"type":"paragraph","text":"모든 사실을 알아낼 힘이 있다는 이유로 모든 사람의 사적 기억을 공개하지 않는다. 공개 행위는 관련자의 동의 범위와 이미 공적인 자료로 확인한다. 작품의 수수께끼는 신이 단서 하나를 읽을 능력이 없어서 생기는 것이 아니다. 아는 사실을 누구의 목소리로 어떻게 공적으로 말할지를 두고 생긴다.","terms":[],"id":"privacy-p2"}]}],"sources":[],"relations":[],"shortTitle":"귀환","preview":"죽은 사람의 삶을 다시 잇는 일. 옛 관계나 역할을 그대로 맡아야 한다는 뜻은 아니다.","readingMinutes":1,"requires":[]},{"id":"clocks","title":"두 개의 날짜 — 미래처럼 보이는 옆집","summary":"이백 년 뒤의 편지는 예언이 아니다. 누군가 먼저 이백 년을 살았다는 뜻이다.","type":"world","kind":"세계 기록","tags":["분기","시간","편지"],"sections":[{"id":"simple","title":"한 줄의 규칙","blocks":[{"type":"quote","text":"공통력은 언제 만났는지 적고, 살아온 시간은 얼마나 살았는지 적는다.","attribution":"만경의 날짜 표기","id":"simple-p1","terms":["살아온 시간","공통력"]},{"type":"paragraph","text":"두 사람은 같은 날 입주하고도 서로 다른 길이의 삶을 경험할 수 있다. 재회할 때 기억을 지우거나 나이를 맞출 필요는 없다. 과거로 돌아가 상대의 결정을 취소한 것도 아니다.","id":"simple-p2","terms":[]}]},{"id":"nara","title":"나래와 여울의 경우","blocks":[{"type":"paragraph","text":"일반 개원 1년 전, 48세의 나래는 시범 거주에 참여했다. 원래 생활을 이어갈 자신과 다른 세계를 살아볼 자신으로 자발적으로 나뉘었다. 분기 이전의 기억은 같다. 그 뒤 남은 나래에게는 1년, 떠난 여울에게는 현지 시간으로 200년이 흘렀다.","id":"nara-p1","terms":["나래","분기"]},{"type":"paragraph","text":"개원일의 나래는 49세다. 여울은 분기 전후의 삶을 합하면 248년을 살았다. 두 사람의 몸이 그 숫자만큼 늙어 있어야 하는 것은 아니다. 여울은 자신의 얼굴을 골랐고, 이백 년을 오래 산 사실을 발언권으로 환전할 수는 없다.","id":"nara-p2","terms":["나래","분기","여울"]},{"type":"paragraph","text":"여울의 편지는 모든 나래가 결국 용서한다는 예언이 아니다. 나래는 용서하지 않고도 이백 년을 잘 살 수 있다. 독자에게 보여주는 것은 실제로 이어진 두 삶뿐이다.","id":"nara-p3","terms":["나래","여울"]}],"readerLayer":"commentary","reveal":true},{"id":"mail","title":"배달에 시간이 걸리는 이유","blocks":[{"type":"paragraph","text":"편지는 즉시 보낼 수 있다. 미결 우체국에서 지연되는 것은 전송이 아니라 수신 허락이나 답장이다. 상대가 문을 열지 않는 동안 그 상대를 흉내 내는 꿈배역에게 전달하고 배달 완료로 치지 않는다.","id":"mail-p1","terms":["미결 우체국","꿈배역"]},{"type":"paragraph","text":"일부 주민은 손편지를 쓰고 일부는 생각만으로 전송한다. 느리다는 이유로 더 진실한 편지는 아니다. 모든 방식에서 중요한 것은 어느 인격이 언제 어떤 말에 서명했는지다.","id":"mail-p2","terms":[]}]},{"id":"future","title":"이 자료집의 먼 훗날","blocks":[{"type":"paragraph","text":"먼 훗날에 적힌 개원 80년 뒤와 240년 뒤는 공통력을 기준으로 이어지는 후일담이다. 여울의 이백 년과 혼동하지 않는다. 다른 가능성을 전부 예고하는 계시가 아니라, 이 이야기에서 실제로 따라가는 길이다.","id":"future-p1","terms":["공통력","여울"]}],"readerLayer":"commentary","reveal":true}],"sources":[],"relations":[{"target":"prologue","label":"편지로 돌아가기","reason":"두 날짜가 적힌 봉투.","evidence":{"entry":"prologue","anchor":"envelope","label":"첫 문장"}},{"target":"yeoul","label":"살아온 시간","reason":"이백 년의 내용.","evidence":{"entry":"yeoul","anchor":"years","label":"이백 년을 한 문장으로 줄이지 않기"}}],"spoiler":false,"shortTitle":"두 개의 시간","preview":"공통력은 서로 만나는 날짜, 살아온 시간은 각자가 경험한 삶의 길이. 다른 속도로 흘러도 만날 수 있다.","readingMinutes":1,"requires":[]},{"id":"postoffice","title":"미결 우체국 — 배달 완료가 아닌 것들","summary":"주소는 얼마든지 만들 수 있다. 그 사람이 읽었다는 사실은 대신 만들지 않는다.","type":"world","kind":"세계 기록","tags":["편지","도장","생활"],"sections":[{"id":"work","title":"무한한 세계에 우체국이 필요한 이유","blocks":[{"type":"paragraph","text":"미결 우체국은 느린 전송 기술이 아니다. 서로 다른 세계와 이름 사이에서, 어떤 인격에게 어떤 말이 닿았는지 확인하는 공적인 약속이다. 자동으로 전달할 수 있는 일은 자동으로 처리한다. 리아와 자원자들은 전달 분쟁과 공개 범위의 조정을 맡는다.","id":"work-p1","terms":["미결 우체국","리아"]},{"type":"paragraph","text":"받는 사람은 수신을 거절할 수 있다. 보내는 사람도 자기 편지를 철회하거나 보관 기간을 정할 수 있다. 누군가 대답할 때까지 영원히 노크하는 것을 성실함이라고 부르지 않는다.","id":"work-p2","terms":[]}]},{"id":"stamps","title":"세 가지 도장","blocks":[{"type":"paragraph","text":"도착은 주소에 닿았다는 뜻이다. 열람은 당사자가 읽었다는 뜻이다. 동의는 별도의 서명이다. 세 도장은 합쳐 찍을 수 없다. 침묵이나 열람을 승낙으로 자동 변경하지 않는다.","id":"stamps-p1","terms":[]},{"type":"paragraph","text":"옛 공헌청은 개별 구제 서류를 받으면 공동 민원도 종결된 것으로 처리했다. 리아는 한 번 그 서류에 서명했다. 그래서 미결 우체국의 가장 단순한 규칙에 자신의 가장 아픈 과거가 들어 있다.","id":"stamps-p2","terms":["미결 우체국","공헌청","리아"]}]},{"id":"privacy","title":"편지는 피해자의 몸을 빌리지 않는다","blocks":[{"type":"paragraph","text":"공적인 명령 기록은 별도 절차로 확인할 수 있다. 하지만 사적인 편지는 수신인이 궁금해한다고 전부 공개되지 않는다. 나래는 심판에 가족의 모든 대화를 내놓지 않는다. 여울도 용서장을 공개하되 자신의 이백 년을 모두 전시할 의무는 없다.","id":"privacy-p1","terms":["나래","여울"]},{"type":"paragraph","text":"범죄 사실의 확인과 당사자의 친밀한 경험을 구분한다. 흥미로운 장면을 얻기 위해 증언자를 다시 채집하지 않는다는 것이 이 기록실의 기준이다.","id":"privacy-p2","terms":[]}],"readerLayer":"commentary","reveal":true},{"id":"word","title":"미결은 미완성이 아니다","blocks":[{"type":"paragraph","text":"우체국에는 답장이 없어도 닫을 수 있는 서랍이 있다. 보낸 사람은 끝내 답을 얻지 못했다고 적고 다른 삶으로 간다. 미결은 누가 무엇을 하지 않았다는 기록이지, 그 사람의 남은 인생에 붙인 평가가 아니다.","id":"word-p1","terms":[]},{"type":"quote","text":"답장 없음.\n발신인, 저녁 식사 중.","attribution":"우체국의 마지막 일지에 남는 문장","id":"word-p2","terms":[]}]}],"sources":[],"relations":[{"target":"lighthouse","label":"원인이 된 봉투","reason":"구제가 종결로 바뀌었다.","evidence":{"entry":"lighthouse","anchor":"letter","label":"돌아오지 않은 반송 봉투"}},{"target":"deep-forgive","label":"말을 분리하기","reason":"세 도장의 뜻.","evidence":{"entry":"deep-forgive","anchor":"three","label":"이야기 속 세 단어"}},{"target":"future-letter","label":"나중의 반송","reason":"자기 서랍만 닫는다.","evidence":{"entry":"future-letter","anchor":"record","label":"닫히는 것은 사건이 아니다"}}],"spoiler":false,"shortTitle":"미결 우체국","preview":"사람 사이의 초대와 편지를 연결한다. 받았다는 것, 읽었다는 것, 동의했다는 것을 따로 기록한다.","readingMinutes":1,"requires":[]},{"id":"places","title":"만경의 풍경 — 네 곳에서 살아보기","summary":"규칙보다 먼저 일상의 장면으로 세계를 만난다.","type":"world","kind":"세계 설정","tags":["생활","장면","만남"],"sections":[{"id":"cafe","title":"우승자들의 찻집","blocks":[{"type":"paragraph","text":"입구에는 모든 우승컵을 환영한다는 문장이 걸려 있다. 같은 대회의 다른 우승자들이 결승 이야기를 나눈다. 주인은 누가 진짜 이겼는지 판정하지 않는다. 가끔은 함께 승패를 받아들이는 친선전을 열고, 가끔은 각자 이기는 경기를 한다.","id":"cafe-p1","terms":[]}]},{"id":"station","title":"재회역","blocks":[{"type":"paragraph","text":"만나고 싶은 사람에게 초대를 남겨두고, 자기 삶을 계속 살 수 있는 역이다. 상대도 만나기를 원할 때 연결된다. 누군가의 응답을 얻기 위해 하루하루를 기다림에만 바칠 필요는 없다.","id":"station-p1","terms":[]},{"type":"quote","text":"기다렸어?\n응. 기다리는 동안에도 잘 살았어.","attribution":"재회역의 대화","id":"station-p2","terms":[]}]},{"id":"workshop","title":"미완성의 거리","blocks":[{"type":"paragraph","text":"덜 다듬은 의자와 끝내지 않은 소설이 있는 거리다. 바로 옆에는 원하는 결과를 즉시 완성하는 공방이 있다. 느리게 만드는 사람에게 더 깊은 사람이라는 훈장은 주지 않는다. 서로 왜 그 방식이 좋은지 물을 수 있을 뿐이다.","id":"workshop-p1","terms":[]}]},{"id":"kitchen","title":"등대동의 긴 식탁","blocks":[{"type":"paragraph","text":"현실의 등대동과 만경 안의 여러 부엌이 겹치는 자리다. 나래는 찾아오는 사람에게 점수 대신 먹지 못하는 재료를 묻는다. 이 식탁은 만경 이전에도 있었고, 만경이 생긴 뒤에도 남아 있다.","id":"kitchen-p1","terms":["등대동","나래","만경"]},{"type":"paragraph","text":"서안은 여기서 연주하지만, 라잔 사건을 다루는 날에는 오지 않는다. 부엌은 그가 돌아올 자리를 남겨둔다. 좋은 공동체라는 이유로 자기 일정까지 공동체에 바치라고 요구하지 않는다.","id":"kitchen-p2","terms":["라잔","서안"]}]}],"sources":[],"relations":[{"target":"haewon","label":"도시의 위치","reason":"항구를 따라 걸어보기.","evidence":{"entry":"haewon","anchor":"harbor","label":"세 겹의 항구"}},{"target":"customs","label":"이웃의 예절","reason":"서로 다른 결말의 생활.","evidence":{"entry":"customs","anchor":"competition","label":"둘 다 우승한 뒤"}}],"spoiler":false,"shortTitle":"만경의 풍경","preview":"","readingMinutes":1,"requires":[]},{"id":"customs","title":"낙원의 생활 — 다음 목표가 없는 휴일","summary":"일하지 않는 날이 아니라, 쉬는 이유를 쓰지 않는 날.","type":"world","kind":"세계 기록","tags":["풍습","휴식","놀이"],"sections":[{"id":"visit","title":"방문 예절","blocks":[{"type":"paragraph","text":"만경에서 “어디 살아?”는 주소만 묻는 말이 아니다. 어떤 세계에, 누구와, 어느 정도 연결되어 살고 싶은지 묻는다. 상대가 꿈배역과 산다고 답하면 진짜 친구는 언제 사귈 거냐고 묻지 않는 것이 기본 예절이다.","id":"visit-p1","terms":["꿈배역","만경"]},{"type":"paragraph","text":"손님을 초대할 때에는 실제로 함께할 사건과 각자 조정할 배경을 정한다. 한 식탁에서 서로 다른 맛을 먹을 수 있지만, 같은 사람의 발언이 각자 듣고 싶은 대사로 바뀌지는 않는다. 그렇게 각색된 체험을 원하면 그때부터 실제 대화가 아니라는 설명을 받는다.","id":"visit-p2","terms":[]}]},{"id":"competition","title":"둘 다 우승한 뒤","blocks":[{"type":"paragraph","text":"우승자들의 찻집에는 우승컵 크기 규정이 없다. 컵을 크게 만들어 자랑하는 사람도 있고, 세 번 진 이야기를 들려주고 싶은 사람도 있다. 분기 없는 경기는 따로 선택한다. 경기 방식은 시작 전에 참가자들이 정한다.","id":"competition-p1","terms":["분기"]},{"type":"paragraph","text":"결과가 다르다고 만나지 못하지는 않는다. 오히려 같은 순간에 서로 무엇을 보았는지 듣는 일이 새로운 관전 문화가 된다. 정답을 하나로 줄여야만 흥미가 생기는 사회가 아니다.","id":"competition-p2","terms":[]}]},{"id":"rest","title":"무기한 휴일","blocks":[{"type":"paragraph","text":"휴일 신청에는 복귀 예정일 칸이 없다. 돌아올지 아직 모르기 때문이다. 돌아오면 반갑게 맞고, 돌아오지 않으면 다른 삶을 택한 것으로 남긴다. 공동체가 유지할 작업은 처음부터 떠난 사람 없이도 이어갈 수 있게 마련한다.","id":"rest-p1","terms":[]},{"type":"paragraph","text":"떠나는 사람이 직접 해준 약속의 의미가 전부 없어지는 것은 아니다. 다만 식량과 돌봄의 공급을 그 약속에 인질로 걸지 않는다. 관계의 서운함은 실제로 느낄 수 있고, 원하면 도움받을 수 있다.","id":"rest-p2","terms":[]}]},{"id":"holiday","title":"이름 없는 날","blocks":[{"type":"paragraph","text":"해원에는 업적과 추모를 내거는 축제 외에 이름 없는 날이 생긴다. 이날 모인 사람들은 서로를 소개할 때 직업과 과거의 피해를 먼저 말하지 않는다. 스스로 말하고 싶은 사람까지 막지는 않는다.","id":"holiday-p1","terms":["해원"]},{"type":"paragraph","text":"서안은 이날 피아노를 연주하고도 다음 차례를 잡지 않는다. 나래는 국을 끓이고 손님이 없으면 그냥 냉장고에 넣는다. 아무도 구하지 않은 저녁도 살아낸 저녁으로 남는다.","id":"holiday-p2","terms":["나래","서안"]}]}],"sources":[],"relations":[{"target":"deep-jam","label":"음식에서 문학으로","reason":"오늘을 미루지 않기.","evidence":{"entry":"deep-jam","anchor":"reference","label":"현실 자료 · 두 여왕의 다른 말"}},{"target":"guests","label":"낯선 손님","reason":"다른 속도의 삶.","evidence":{"entry":"guests","anchor":"forest","label":"섬숲의 손님"}}],"spoiler":false,"shortTitle":"낙원의 생활","preview":"","readingMinutes":1,"requires":[]},{"id":"guests","title":"낯선 이웃 — 인간의 크기로 세지 않는 삶","summary":"몸 하나와 인격 하나가 같은 단위가 아닌 이웃들도 만경을 방문한다.","type":"world","kind":"세계 기록","tags":["다른 유기체","규모","이웃"],"sections":[{"id":"reach","title":"우주 전체를 한 도시로 쓰지 않기","blocks":[{"type":"paragraph","text":"본편은 해원과 그 주변 공동 세계를 따라간다. 다른 정착지와 다른 유기체 문명도 창조권을 나눠 받아 자기 방식의 거주지를 만든다. 해원의 언어와 공헌청 역사를 모든 생명체의 과거로 일반화하지 않는다.","id":"reach-p1","terms":["공헌청","창조권","해원"]},{"type":"paragraph","text":"만경의 기본 단위는 인간 모양의 몸이 아니라 선택하고 경험하는 인격이다. 번역과 설명은 형태에 맞추되, 누군가를 행복한 풍경의 소품으로 만들지 않는 기준은 같다.","id":"reach-p2","terms":["만경"]}]},{"id":"forest","title":"섬숲의 손님","blocks":[{"type":"paragraph","text":"섬숲은 여러 줄기와 뿌리를 한 의식으로 쓰는 유기체 주민이 스스로 택한 이름이다. 대화에 며칠이 걸리는 삶을 좋아하지만 원하면 사람의 속도에 맞출 수 있다. 느려서 뒤처진 생명이라는 설명은 틀렸다.","id":"forest-p1","terms":["섬숲"]},{"type":"paragraph","text":"섬숲은 미결 우체국에 처음 와서 대기 번호를 보고 웃는다. 자기에게는 아직 같은 문장인데 인간들은 벌써 답이 늦다고 느꼈기 때문이다. 이후 접수표에는 상대가 약속한 응답 시간만 적고, 종족의 기본 속도를 무례함으로 분류하지 않는다.","id":"forest-p2","terms":["미결 우체국","섬숲"]}]},{"id":"many","title":"여러 몸의 방문자","blocks":[{"type":"paragraph","text":"한 인격이 여러 몸으로 찻집에 들어온 날, 직원은 커피를 여섯 잔 가져왔다. 손님은 전부 마시겠다고 했지만 그것이 여섯 표를 행사할 권리까지 뜻하지는 않는다고 덧붙였다.","id":"many-p1","terms":[]},{"type":"paragraph","text":"이 장면은 만경의 정치가 사람 수를 늘리는 복제로 끝나지 않음을 보여준다. 공동체의 대표와 결정 방식은 영향을 받는 관계를 정해 합의한다. 무한히 몸을 만들면 무한한 권위를 얻는 구조를 두지 않는다.","id":"many-p2","terms":["만경"]}]},{"id":"question","title":"같은 도덕을 모든 곳에 수출하지 않기","blocks":[{"type":"paragraph","text":"리아의 시민심판은 공헌청의 권한을 행사했던 사람들을 다룬다. 낯선 주민에게도 해원의 사법 관습을 강제로 적용하는 우주 법정이 아니다. 서로의 세계가 접촉할 때 필요한 약속은 별도로 설명하고 맺는다.","id":"question-p1","terms":["시민심판","공헌청","리아","해원"]},{"type":"paragraph","text":"에이렌도 구세주라는 호칭을 모든 언어에 번역해 달라고 하지 않는다. 어떤 곳에서는 문지기, 어떤 곳에서는 처음 초대한 손님, 어떤 곳에서는 논쟁이 많은 이웃으로 기록된다.","id":"question-p2","terms":["에이렌"]}]}],"sources":[],"relations":[{"target":"postoffice","label":"대화의 약속","reason":"수신과 응답을 분리한다.","evidence":{"entry":"postoffice","anchor":"work","label":"무한한 세계에 우체국이 필요한 이유"}},{"target":"rules","label":"공존의 기준","reason":"몸이 아니라 인격의 선택.","evidence":{"entry":"rules","anchor":"boundary","label":"개인 세계의 경계"}}],"spoiler":false,"shortTitle":"낯선 이웃","preview":"","readingMinutes":1,"requires":[]},{"id":"eiren","title":"에이렌 베일 — 문을 열었던 사람","summary":"자신이 만든 절차에 갇힌 사람들을 보고, 더 좋은 심사보다 심사받지 않을 권리를 택했다.","type":"character","kind":"인물 기록","tags":["동기","책임","퇴장권"],"sections":[{"id":"life","title":"구조를 고치는 일에 능했던 사람","blocks":[{"type":"paragraph","text":"에이렌은 53세의 교육 설계자다. 재능을 발견해 적합한 배움을 연결하는 일로 명성을 얻었다. 가족을 잃어서 갑자기 세상을 미워한 사람이 아니라, 실제로 남을 도우면서 자신의 방식에 자신감을 얻은 사람이다.","id":"life-p1","terms":["에이렌"]},{"type":"paragraph","text":"그는 능력을 분석하는 일에는 섬세했지만, 상대가 더는 분석받고 싶지 않을 수 있다는 사실에는 둔했다. 상담 기록에는 다음 단계가 늘 있었고, 그만둔 채 괜찮게 사는 항목은 없었다.","id":"life-p2","terms":[]}]},{"id":"fault","title":"등대동에서 자신이 한 일","blocks":[{"type":"paragraph","text":"라잔이 기존 보호시설의 강제 체류를 정치적 집단에 확대할 때 에이렌은 이탈하지 않았다. 자신의 상담 과정이 강제 체류를 정당화하는 데 쓰이는 것을 알면서도, 남아서 피해를 줄일 수 있다고 생각했다. 실제로 줄인 피해와 그의 서명이 보탠 책임은 함께 남는다.","id":"fault-p1","terms":["에이렌","회복원","라잔"]},{"type":"paragraph","text":"그가 가장 오래 기억하는 것은 자신을 향한 욕설이 아니다. 퇴소를 바라는 시민이 그를 믿고 서류를 다시 작성하던 모습이다. 그 사람은 에이렌이 돕고 있다는 것을 알면서도 에이렌 때문에 나가지 못했다.","id":"fault-p2","terms":["에이렌"]}]},{"id":"attempt","title":"곧바로 낙원을 만든 것은 아니다","blocks":[{"type":"paragraph","text":"처음에는 심사 항목을 줄였다. 다음에는 재교육 선택지를 늘렸다. 두 조치는 일부를 도왔지만, 떠나기를 심사받아야 한다는 구조는 남았다. 그는 퇴소 승인권을 없애는 개혁에 나섰고 자신의 자료도 공개했다.","id":"attempt-p1","terms":[]},{"type":"paragraph","text":"창조권을 얻은 뒤에는 질병과 빈곤부터 해결했다. 능력 개선을 원하는 사람도 도왔다. 그러나 더 유능해지는 대신 지금 상태로 쉬고 싶다는 사람까지 같은 처방을 원하지는 않았다. 만경은 이 과정을 거친 뒤 선택한 해법이다.","id":"attempt-p2","terms":["창조권","만경"]}]},{"id":"motive","title":"라잔에게도 문을 여는 이유","blocks":[{"type":"paragraph","text":"에이렌은 라잔이 좋은 사람이 되었다고 믿지 않는다. 라잔의 명령이 잘못이었다는 점에도 동의한다. 다만 이제 피해를 복구하고 타인에 대한 강제를 막을 수 있는데, 그 이상으로 사람의 움직임을 지배할 필요가 있는지 묻는다.","id":"motive-p1","terms":["에이렌","라잔"]},{"type":"paragraph","text":"자격 없는 자에게도 적용되지 않으면 안전한 퇴장권은 심사관이 내려주는 혜택이 된다. 그는 자신의 원칙이 가장 불편한 사람에게 적용되는 순간을 피하지 않겠다고 결정한다.","id":"motive-p2","terms":["퇴장권"]}]},{"id":"price","title":"그가 실제로 잃는 것","blocks":[{"type":"paragraph","text":"회복원 생존자 일부가 만경의 공동 행사에서 그의 이름을 빼달라고 요청한다. 그는 항의를 막지 않는다. 리아가 독립적인 심판을 운영하도록 돕지만, 그 심판이 자신에게도 유죄를 선언할 수 있다는 조건을 받아들인다.","id":"price-p1","terms":["회복원","리아","만경"]},{"type":"paragraph","text":"그가 두려워하는 것은 왕좌를 잃는 일이 아니다. 보호하겠다고 했던 사람들이 자신의 보호를 버림받음으로 경험할 수 있다는 사실이다. 그 감정을 고쳐 감사하게 만들 수 있지만, 그렇게 하지 않는다.","id":"price-p2","terms":[]}]},{"id":"human","title":"친절함에도 어려운 부분이 있다","blocks":[{"type":"paragraph","text":"에이렌은 상대를 설명하려는 습관이 남아 있다. 듣는 사람이 판결을 요구하는데 환경을 고치는 답부터 내놓을 때가 있다. 리아는 그에게 치료할 수 있다는 말이 언제나 먼저 필요한 말은 아니라고 지적한다.","id":"human-p1","terms":["에이렌","리아"]},{"type":"quote","text":"나를 용서하지 않아도 됩니다.\n하지만 나를 용서해야 이곳에 머물 수 있는 사람은, 한 명도 없을 겁니다.","attribution":"에이렌 베일","id":"human-p2","terms":[]}]},{"id":"name","title":"평화라고 불린 아이","blocks":[{"type":"paragraph","text":"어머니 미라는 옛 구조선 에이레네호의 이름을 줄여 아들을 에이렌이라 불렀다. 누구나 자기 몫을 증명하기 전에 실려 왔다는 구조 이야기를 자주 들려주었다. 에이렌은 그 이야기에서 좋은 구조자가 되는 법을 먼저 배웠고, 구조를 거절당하지 않을 권리는 늦게 배웠다.","id":"name-p1","terms":["에이레네호","에이렌","미라"]},{"type":"paragraph","text":"베일은 가문의 성이다. 외국어 veil과 겹쳐 읽는 것은 작품 바깥의 의도적 말장난이지, 모든 베일 가문 사람이 무언가를 숨긴다는 예언은 아니다. 그는 문을 여는 사람인 동시에, 너무 빨리 덮어주고 싶어 하는 사람이기도 하다.","id":"name-p2","terms":[]}]},{"id":"letter","title":"용서장이 그에게 던지는 질문","blocks":[{"type":"paragraph","text":"여울의 편지가 왔을 때 에이렌은 먼저 기뻐한다. 오랫동안 고통받은 사람이 다른 삶을 찾았다는 소식이다. 하지만 나래가 “나도 당신이 구한 사람인데요”라고 묻자, 회복을 한 가지 표정으로 확인하려는 자신의 습관을 발견한다.","id":"letter-p1","terms":["에이렌","나래","여울"]},{"type":"paragraph","text":"그는 여울의 편지를 보호하고 나래의 항의도 보호한다. 그 선택이 실제 통치자의 강제 출석까지 막을 때에는 자신에게 불리한 비용을 피하지 않는다. 모든 사람이 자신에게 감사하는 꿈배역 세계로 물러나지 않고, 항의가 있는 실제 광장에 남는다.","id":"letter-p2","terms":["꿈배역","나래","여울"]}]},{"id":"saint","title":"자기를 예언으로 부르는 사람 앞에서","blocks":[{"type":"paragraph","text":"귀환제의 비문은 메이 다음에 올 사람으로 에이렌을 읽는다. 그는 그 해석을 만들지는 않았다. 다만 자신을 믿는 사람이 늘면 회복원 피해자를 더 쉽게 안심시킬 수 있다는 생각으로, 신화가 해주는 일을 너무 오래 내버려두었다.","terms":["귀환제","에이렌","회복원","메이"],"id":"saint-p1"},{"type":"paragraph","text":"메이가 비문의 뒷문장을 읽는 자리에서 그는 초상화를 내리는 데 동의한다. 자신이 단독 발견자도 예언의 완성자도 아니라는 설명을 붙인다. 사람들이 그를 덜 신뢰하게 될 수 있지만, 그 신뢰를 지키려고 당사자의 말을 줄이지 않는다. 신화를 잃어도 실제 구원 능력과 시민의 권능은 남는다.","terms":["메이"],"id":"saint-p2"}]},{"id":"mentor","title":"사람을 살리는 교육자가 왜 학살자의 책을 읽었나","blocks":[{"type":"paragraph","text":"에이렌은 스물한 살에 아벨을 처음 면회했다. 더는 나아지지 못하는 사람도 충분히 돌봐야 한다는 의료 개혁을 연구하고 있었다. 아벨이 실제로 옳았던 문장과 실제로 저지른 살해를 분리해서 판단해야 했다.","id":"mentor-p1","terms":["에이렌","아벨"]},{"type":"paragraph","text":"서로 다른 삶을 보장하는 낙원의 상상을 그에게서 배웠지만, 사람을 줄이는 계획은 처음부터 거절했다. 이후 회복원에서 자신도 남을 놓아주지 못하는 사람이 된 것이 더 아픈 이유다. 스승의 가장 큰 잘못에 반대했다고 해서 자기 방식의 강제까지 보이지 않게 되는 것은 아니었다.","id":"mentor-p2","terms":["회복원"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"두 번째 면회의 창문","entry":"prison-window"},{"label":"현재의 재회","entry":"giants-opening"}],"id":"mentor-p3"}]},{"id":"two-lessons","title":"스승의 두 창문, 어머니의 두 기록","blocks":[{"type":"paragraph","text":"에이렌은 열한 살에 긴 저녁을 겪었다. 당시 구조 업무를 맡은 어머니에게서 나중에 구조 성공과 연락 성공을 나누어 적는 이유를 들었다. 성인이 된 뒤에는 아벨에게서 각자 다른 삶을 살 방이라는 발상을 배웠다.","id":"two-lessons-p1","terms":["긴 저녁","에이렌","아벨"]},{"type":"paragraph","text":"그 두 경험이 그를 곧바로 옳게 만들지는 않았다. 스승의 학살을 반대하면서도 자기 도움을 받아들일 때까지 사람을 붙잡는 회복원 설계에 가담했다. 만경의 핵심 규칙은 처음부터 선한 소년의 필연적 답이 아니라, 실제로 자기 손으로 잘못 승인한 일을 고치며 정한 것이다.","id":"two-lessons-p2","terms":["회복원","만경"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"스승과 섭정의 갈림길","entry":"lining-supper"},{"label":"같은 보호 양식이 돌아온다","entry":"lining-morning"}],"id":"two-lessons-p3","terms":[]}]}],"sources":[],"relations":[{"target":"last-shift","label":"아들의 처음 질문","reason":"모든 사람에게 역할을 주려 했다.","evidence":{"entry":"last-shift","anchor":"morning","label":"그다음 아침"}},{"target":"deep-peace","label":"이름 속의 자매","reason":"평화는 정의의 적으로 태어나지 않았다.","evidence":{"entry":"deep-peace","anchor":"word","label":"현실 자료 · 에이레네"}},{"target":"future-offduty","label":"가장 먼 시험","reason":"본인도 그만둘 수 있는가.","evidence":{"entry":"future-offduty","anchor":"door","label":"한 사람만 통과하지 못한 출구"}},{"target":"inheritance-war","label":"이전 세대의 선택","reason":"지금의 제도가 만들어진 이유를 앞선 사건에서 확인한다.","evidence":{"entry":"inheritance-war","anchor":"network","label":"한 줄 계보 대신 충돌하는 연결"}}],"spoiler":false,"motive":{"과거":"내가 만든 지원 절차가 퇴소를 막았다.","현재 선택":"미워하는 사람에게도 같은 출구를 준다.","치르는 대가":"구했던 사람들의 신뢰와 자신의 면책을 잃는다."},"shortTitle":"에이렌 베일","preview":"만경의 사용 원칙을 함께 세운 교육 설계자. 리아와 개혁을 이뤄낸 동료다.","readingMinutes":4,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"ria","title":"리아 센 — 기록을 접었던 사람","summary":"동생을 구하려고 포기한 한 문장이, 다른 사람들의 침묵을 사는 값이 됐다.","type":"character","kind":"인물 기록","tags":["동기","공적 책임","자기 선택"],"sections":[{"id":"life","title":"원래 원했던 삶","blocks":[{"type":"paragraph","text":"리아는 32세의 시민 조정자다. 처음부터 재판을 꿈꾼 사람은 아니다. 등대동에서 누구나 한 번은 말을 끝까지 들을 수 있는 상담소를 만들고 싶었다. 그녀는 상대의 이야기를 종이에 짧게 정리해 돌려주는 일을 잘했다.","id":"life-p1","terms":["등대동","리아"]},{"type":"paragraph","text":"동생 서안을 돌본 사실은 그녀에게 자부심이지만, 무엇이 서안에게 좋은지 자신이 더 잘 안다고 여기는 버릇의 시작이기도 했다.","id":"life-p2","terms":["서안"]}]},{"id":"fault","title":"구제와 침묵을 맞바꾼 날","blocks":[{"type":"paragraph","text":"등대동 사건 당시 리아는 서안의 퇴소를 얻기 위해 공동 문제를 소통 오류로 정리하는 합의에 서명했다. 그 선택을 단순한 비겁함으로 볼 수는 없다. 서안에게는 그날 밖으로 나오는 것이 실제 구원이었다.","id":"fault-p1","terms":["등대동 사건","등대동","리아","서안"]},{"type":"paragraph","text":"하지만 같은 합의가 나래와 다른 가족들에게도 요구됐다. 리아가 수긍한 문장은 개별 구제가 있었으니 구조적 문제는 없었다는 근거로 인용됐다. 그녀는 자신이 구한 사람의 숫자로 이 결과를 지울 수 없다는 것을 배웠다.","id":"fault-p2","terms":["나래","리아"]}]},{"id":"attempt","title":"직접 바꿔본 것","blocks":[{"type":"paragraph","text":"리아는 합의의 경위를 공개하고, 흩어진 피해 기록을 연결했다. 지원을 받은 사람도 문제를 제기할 수 있도록 절차를 분리했다. 에이렌의 자료 공개와 이 작업이 만나 강제 회복원 폐쇄로 이어졌다.","id":"attempt-p1","terms":["에이렌","회복원","리아"]},{"type":"paragraph","text":"그녀는 만경에도 먼저 참여했다. 환상에서 회복한 사람을 실제로 보았고 서안의 선택을 도왔다. 낙원이 쓸모없어서 반대하는 사람이 아니라, 낙원의 큰 효용을 알고도 한 가지 권한을 더 요구하는 사람이다.","id":"attempt-p2","terms":["만경","서안"]}]},{"id":"motive","title":"왜 기록만으로는 충분하지 않다고 보나","blocks":[{"type":"paragraph","text":"리아가 원하는 것은 고통받는 라잔을 보는 일이 아니다. 공적 권한으로 타인의 생활을 결정했던 사람에게도, 시민이 정한 제한된 요구에 응할 의무가 있어야 한다고 본다. 증거가 완벽해도 그 의무 자체의 의미는 남는다는 판단이다.","id":"motive-p1","terms":["라잔","리아"]},{"type":"paragraph","text":"그녀는 재발을 막으려면 출석이 필요하다고 거짓말하지 않는다. 만경은 재발을 막을 수 있다. 자기 주장에 남는 근거가 현재의 안전이 아니라 공적인 책임과 상호 의무라는 점을 알고 있다.","id":"motive-p2","terms":["만경"]}]},{"id":"price","title":"그녀가 받아들여야 하는 부담","blocks":[{"type":"paragraph","text":"출석을 강제한다면 지금 거절하는 당사자를 제한하는 것은 사실이다. 짧은 절차이고 고통을 주지 않더라도 그 사실은 없어지지 않는다. 리아는 이를 피해자의 당연한 권리라는 말만으로 덮을 수 없다.","id":"price-p1","terms":["리아"]},{"type":"paragraph","text":"또 모든 피해자가 그녀의 싸움을 원하지는 않는다. 서안은 증언을 원치 않고 나래는 참석하되 자기 사생활을 전부 공개하지 않겠다고 한다. 리아는 사람들을 위해 싸운다는 이유로 그 사람들을 증거로 소유하지 않는 법을 배워야 한다.","id":"price-p2","terms":["나래","리아","서안"]}]},{"id":"human","title":"정리되지 않는 사람과 함께 살기","blocks":[{"type":"paragraph","text":"리아는 이야기를 완결하려는 습관이 있다. 서안이 아직 악보를 끝내지 않았다고 하면 공연 날짜부터 잡아주려 한다. 서안은 이번에는 다음 목표가 없다고 말한다. 그녀가 동생을 사랑하는 일에는 그 말을 고치지 않는 것도 포함된다.","id":"human-p1","terms":["리아","서안"]},{"type":"quote","text":"다시 행복해졌다는 사실이,\n당신이 원래 잘못한 일이 없었다는 뜻은 아니에요.","attribution":"리아 센","id":"human-p2","terms":[]}]},{"id":"letter","title":"어떤 증인도 내 편으로 완성하지 않기","blocks":[{"type":"paragraph","text":"리아는 처음에 여울의 편지를 공개 행사에서 빼달라고 요구한다. 조작 가능성을 의심해서가 아니라 라잔에게 유리하게 쓰일까 두려워서다. 그러나 여울은 실제 피해자였으며 자신의 경험을 말할 권리가 있다. 그녀를 무대에서 지우는 것은 보호와 다르다.","id":"letter-p1","terms":["라잔","리아","여울"]},{"type":"paragraph","text":"리아의 변화는 정의를 포기하는 것이 아니다. 자신이 원하는 결론과 다른 증언도 지우지 않은 채, 공적인 명령의 책임을 묻는 법을 배우는 것이다. 라잔이 오지 않아도, 나래들이 한목소리가 아니어도 심판은 가능해야 한다.","id":"letter-p2","terms":["나래","라잔","리아"]}]},{"id":"saint","title":"살아 있는 원전도 남을 대신하지 않는다","blocks":[{"type":"paragraph","text":"리아는 메이의 증언으로 공헌청의 자기 정당화를 단번에 무너뜨릴 수 있다고 기대한다. 그러나 메이는 자기가 겪지 않은 등대동 사건을 판정하러 나오지 않는다. 자기 말이 권력의 근거로 잘못 쓰인 부분만 고쳐달라고 한다.","terms":["등대동 사건","공헌청","등대동","리아","메이"],"id":"saint-p1"},{"type":"paragraph","text":"리아는 창건자가 자기 편이라고 새로운 신탁을 만들지 않기로 한다. 원전의 주인을 데려오는 것과 모든 시민의 판단을 끝내는 것은 다르다. 과거의 사람에게도 지금 정치의 배역을 강요하지 않는 것이 그녀의 이번 비용이다.","terms":["리아"],"id":"saint-p2"}]},{"id":"liv-record","title":"리브의 주소록을 받은 사람","blocks":[{"type":"paragraph","text":"회복원 기록을 다시 열던 시기에 리아는 노년의 리브를 만났다. 이름 옆에 거절한 도움과 원하지 않는 공개 범위까지 남겨둔 주소록을 넘겨받았다. 피해를 기록하는 일이 기록자의 주장에 사람을 영원히 묶어두어서는 안 된다는 방식이었다.","id":"liv-record-p1","terms":["회복원","리브","리아"]},{"type":"paragraph","text":"리아는 그 방식을 배웠어도 매번 쉽게 지키지는 못한다. 서안이 증언을 거부할 때, 여울이 용서할 때, 자신이 원한 말과 다른 답을 받아들여야 한다.","id":"liv-record-p2","terms":["리아","서안","여울"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"리브가 스스로 수정한 약속","entry":"liv"}],"id":"liv-record-p3"}]}],"sources":[],"relations":[{"target":"lighthouse","label":"돌아온 서명","reason":"동생을 먼저 데려온 대가.","evidence":{"entry":"lighthouse","anchor":"signature","label":"리아의 선택 · 한 사람을 먼저 데려오기"}},{"target":"postoffice","label":"만든 일터","reason":"서류를 같은 칸에 넣지 않는다.","evidence":{"entry":"postoffice","anchor":"stamps","label":"세 가지 도장"}},{"target":"future-museum","label":"후대의 오독","reason":"낙원을 반대한 사람이 되어버리다.","evidence":{"entry":"future-museum","anchor":"poster","label":"낯익은 이름의 공연"}},{"target":"inheritance-war","label":"이전 세대의 선택","reason":"지금의 제도가 만들어진 이유를 앞선 사건에서 확인한다.","evidence":{"entry":"inheritance-war","anchor":"network","label":"한 줄 계보 대신 충돌하는 연결"}}],"spoiler":false,"motive":{"과거":"동생의 퇴소를 얻으며 공동 피해 기록을 접었다.","현재 선택":"구제와 별개로 권력자에게 답할 의무를 묻는다.","치르는 대가":"피해자의 삶을 자기 싸움에 묶지 않고도 싸워야 한다."},"shortTitle":"리아 센","preview":"이주와 시민의 요청을 돕는 조정자. 서안의 누나다.","readingMinutes":3,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"nara","title":"나래 운 — 식탁을 남겨둔 사람","summary":"회복도 원하고 심판도 원하지만, 자신의 삶 전부를 내놓고 싶지는 않다.","type":"character","kind":"인물 기록","tags":["주변 인물","인정","회복"],"sections":[{"id":"life","title":"의미가 없어진 사람이 아니었다","blocks":[{"type":"paragraph","text":"49세의 나래는 등대동 공동 부엌의 운영자였다. 그녀의 일은 다른 방식으로도 대체할 수 있다는 이유로 낮게 평가됐다. 그러나 사람들이 찾아온 것은 가장 효율적인 식사 때문이 아니라, 자신을 기억하는 사람과 함께 먹기 위해서였다.","id":"life-p1","terms":["등대동","나래"]}]},{"id":"past","title":"남아 있던 가족들의 기록","blocks":[{"type":"paragraph","text":"나래도 처음 여섯 주 동안 회복원에 강제 체류했다. 자신이 나온 뒤에는 아직 돌아오지 못한 사람들의 가족 연락망을 유지했다. 서안이 열한 달 만에 나왔을 때 리아의 합의에 배신감을 느꼈지만, 리아에게 동생을 계속 남겨두었어야 한다고 말하지는 못했다. 개인을 구하는 일과 함께 남는 일이 정말로 충돌한 경험이다.","id":"past-p1","terms":["회복원","나래","리아","서안"]}]},{"id":"desire","title":"심판에서 원하는 것","blocks":[{"type":"paragraph","text":"나래는 실제 라잔이 자신의 질문을 듣기를 원한다. 그것이 추가 치료를 얻기 위해 필요한 것은 아니다. 그는 자신의 삶을 일방적으로 판단했고, 나래는 이제 그에게 답을 요구하는 위치에 서고 싶다.","id":"desire-p1","terms":["나래","라잔"]},{"type":"paragraph","text":"동시에 그녀는 꿈배역의 사과를 통해 잠을 되찾았다. 가상에서 도움받았다는 사실과 실제 당사자의 응답을 원한다는 마음은 함께 존재한다.","id":"desire-p2","terms":["꿈배역"]}]},{"id":"boundary","title":"자기 삶을 증거로 전부 내놓지는 않는다","blocks":[{"type":"paragraph","text":"나래는 심판에 참석하지만 가족 사이의 사적인 대화는 공개하지 않는다. 공적인 명령을 판단하는 데 필요하지 않기 때문이다. 리아가 더 극적인 자료를 원하더라도, 나래는 자기 경계를 유지한다.","id":"boundary-p1","terms":["나래","리아"]},{"type":"paragraph","text":"결말에서 나래는 빈 피고석이 충분하다고 말하지 않는다. 얻지 못한 것이 있다고 말한 뒤 저녁 준비를 하러 간다. 해결되지 않은 불만과 계속되는 일상이 동시에 남는다.","id":"boundary-p2","terms":["나래"]}]},{"id":"split","title":"내가 허락한 또 다른 나","blocks":[{"type":"paragraph","text":"시범 운영 때 나래는 삶을 둘로 나누는 데 자발적으로 동의했다. 공동 부엌을 이어가고 싶었고, 그 사건을 하루의 중심에 두지 않는 시간을 살아보고도 싶었다. 어느 쪽 마음도 거짓이 아니었다. 다른 갈래가 여울이 되었다.","id":"split-p1","terms":["나래","여울"]},{"type":"paragraph","text":"편지를 받고 난 뒤에도 나래는 그 결정을 후회한다고 단정하지 않는다. 여울이 정말 잘 살았다는 사실은 기쁘다. 다만 그 기쁨이 자신의 남은 분노를 철회하는 서명이 되어서는 안 된다.","id":"split-p2","terms":["나래","여울"]}]}],"sources":[],"relations":[{"target":"yeoul","label":"다른 삶의 자신","reason":"나래의 정답지는 아니다.","evidence":{"entry":"yeoul","anchor":"forgiveness","label":"용서의 정확한 범위"}},{"target":"future-letter","label":"기다림의 다음","reason":"용서 없이도 대기를 마친다.","evidence":{"entry":"future-letter","anchor":"record","label":"닫히는 것은 사건이 아니다"}}],"spoiler":false,"shortTitle":"나래 운","preview":"등대동의 공동 부엌을 맡는 사람. 본편 첫 장면의 편지를 받는다.","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"yeoul","title":"여울 — 용서장을 보낸 또 한 사람","summary":"나래의 더 나은 판본이 아니다. 같은 출발점에서 다른 삶을 살아온 사람이다.","type":"character","kind":"인물 기록","tags":["두 나래","용서","이백 년"],"sections":[{"id":"beginning","title":"같은 부엌에서 갈라지다","blocks":[{"type":"paragraph","text":"여울은 48세의 나래에서 분기했다. 실험 뒤 남은 나래에게 일 년이 지나는 동안, 여울은 다른 세계에서 이백 년을 살았다. 분기 이전 회복원 사건과 공동 부엌의 기억은 둘 다 자신의 기억이다. 분기 이후에는 서로가 모르는 사랑, 다툼, 취향이 쌓였다.","id":"beginning-p1","terms":["회복원","나래","분기","여울"]},{"type":"paragraph","text":"그녀가 고른 새 이름은 여울이다. 강물이 갈라졌다가 다시 만나는 풍경을 좋아해서다. 원래 이름을 버려 과거의 자신을 부정한 것도, 나래라는 이름을 독점할 권리를 포기한 것도 아니다.","id":"beginning-p2","terms":["나래","여울"]}]},{"id":"years","title":"이백 년을 한 문장으로 줄이지 않기","blocks":[{"type":"paragraph","text":"처음에는 자신을 믿어주는 법정과 사과하는 라잔이 있는 세계에서 살았다. 그 시간은 실제로 도움이 됐다. 환상이어서 결국 실패해야 하는 치료는 아니었다. 충분히 머문 뒤 다른 일을 하고 싶어졌다.","id":"years-p1","terms":["라잔"]},{"type":"paragraph","text":"여울은 물길을 따라 이동하는 집을 만들었고, 같은 바다를 좋아하는 사람들과 합류했다. 오래 만난 친구와 헤어지기도 했고, 다시 만났을 때 상대의 다른 이름을 외우기도 했다. 잘된 날뿐 아니라 자신이 무례하게 말해 사과한 날도 있었다. 그 사건들은 라잔에게서 얻어낸 교훈이 아니라 여울 자신의 생애다.","id":"years-p2","terms":["라잔","여울","합류"]},{"type":"paragraph","text":"편지를 쓴 날도 엄청난 깨달음이 있었던 날은 아니었다. 해원의 개원 초대장을 읽다가, 자신이 이제 라잔의 불행을 바라지 않는다는 사실을 확인했다. 그 마음을 본인의 말로 남기고 싶었다.","id":"years-p3","terms":["라잔","해원"]}]},{"id":"forgiveness","title":"용서의 정확한 범위","blocks":[{"type":"paragraph","text":"여울은 옛 명령이 잘못이었다고 증언할 수 있다. 라잔에게 유죄가 선언되어도 자기 용서가 취소된다고 생각하지 않는다. 다만 지금의 라잔을 끌어와 자신 앞에 세우고 싶지는 않다. 그의 판단을 옳다고 승인하는 것과, 그를 붙잡을 요구를 내려놓는 것을 구분한다.","id":"forgiveness-p1","terms":["라잔","여울"]},{"type":"paragraph","text":"그녀는 자신의 선택이 나래에게 어떤 압력으로 돌아갈지 처음에는 충분히 생각하지 못했다. 그 책임 때문에 편지를 거짓이라고 철회하지는 않는다. 대신 공개 행사에 직접 와서 자기 말의 범위를 자신이 설명한다.","id":"forgiveness-p2","terms":["나래"]}]},{"id":"price","title":"더 오래 산 사람이 더 옳지는 않다","blocks":[{"type":"dialogue","speaker":"리아","text":"당신의 편지가 라잔을 돕게 될 수도 있어요.","id":"price-p1","terms":["라잔"]},{"type":"dialogue","speaker":"여울","text":"알아요. 그래도 내가 실제로 느끼는 말을 그 사람에게 유리하다는 이유로 없애진 말아주세요.","id":"price-p2","terms":[]},{"type":"paragraph","text":"나래가 만나기를 거절해도 여울은 기다릴 수 있다. 기다림을 나래가 아직 덜 성장했다는 증거로 부르지 않는다. 두 사람이 같은 결론에 도달하는 결말은 예정되어 있지 않다.","id":"price-p3","terms":["나래","여울"]}]}],"sources":[],"relations":[{"target":"clocks","label":"분기의 날짜","reason":"248년을 산 이유.","evidence":{"entry":"clocks","anchor":"nara","label":"나래와 여울의 경우"}},{"target":"act-two","label":"재회 장면","reason":"국의 간이 달라진 두 사람.","evidence":{"entry":"act-two","anchor":"nara","label":"소금 한 숟갈"}},{"target":"deep-copies","label":"해석의 뒷면","reason":"다른 나는 판사가 아니다.","evidence":{"entry":"deep-copies","anchor":"difference","label":"작중 차이 · 오래 산 나를 판사로 세우지 않는다"}}],"spoiler":false,"motive":{"과거":"분기 이전의 상처와 이후 이백 년을 모두 살았다.","현재 선택":"자신의 용서를 말하되 나래를 대신하지 않는다.","치르는 대가":"자기 말이 원치 않은 정치적 결말에 쓰이는 것을 바로잡아야 한다."},"shortTitle":"여울","preview":"나래가 스스로 삶을 나누었을 때 다른 세계로 떠난 인격. 이후의 삶과 판단은 자기 것이다.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"seoan","title":"서안 센 — 다음 목표가 없는 연주자","summary":"구원받은 사람이 구원자의 싸움까지 이어받을 의무는 없다.","type":"character","kind":"인물 기록","tags":["관계","경쟁에서의 회복","선택"],"sections":[{"id":"before","title":"잘하지 않아도 그만두고 싶지는 않았다","blocks":[{"type":"paragraph","text":"28세의 서안은 피아노를 좋아한다. 전문 연주자로 생계를 책임질 필요는 없었지만, 계속 음악을 해도 된다는 말을 듣기 위해 실력을 증명하곤 했다. 등대동에서는 처음으로 공연 뒤에 다음 오디션을 권하지 않는 사람들을 만났다.","id":"before-p1","terms":["등대동","서안"]}]},{"id":"experience","title":"퇴소가 남긴 두 가지 사실","blocks":[{"type":"paragraph","text":"서안은 회복원에서 열한 달을 지냈다. 리아의 합의로 밖에 나왔고 그 일에 감사한다. 동시에 그 합의가 다른 사람들의 기록을 덮는 데 쓰였다는 것도 안다. 누나를 무조건 용서하거나 비난하는 한 가지 역할로 살지 않는다.","id":"experience-p1","terms":["회복원","리아","서안"]}]},{"id":"desire","title":"만경에서 원하는 것","blocks":[{"type":"paragraph","text":"서안은 기억을 지우거나 천재 연주자가 되는 대신, 당장 자기 일정을 결정하는 삶을 택한다. 다른 사람이 기억 조정이나 즉각적인 재능을 선택해도 비웃지 않는다. 지금 자신에게는 이 방식이 좋을 뿐이다.","id":"desire-p1","terms":["서안"]}]},{"id":"decision","title":"증언하지 않기로 하는 선택","blocks":[{"type":"paragraph","text":"리아가 심판을 준비할 때 서안은 자기 이름이 들어간 기존 명령 기록의 공개에는 동의한다. 다만 무대처럼 꾸민 증언석에서 자신의 회복을 보여주고 싶지는 않다. 공개를 허용한 사실과 직접 등장하기를 원하는 것은 다르다.","id":"decision-p1","terms":["리아","서안"]},{"type":"paragraph","text":"그날 그는 작은 연주 모임을 연다. 이것은 라잔을 용서하는 선언도, 리아의 일이 의미 없다는 평가도 아니다. 자기 하루의 우선순위를 자신이 정하는 행동이다.","id":"decision-p2","terms":["라잔","리아"]},{"type":"quote","text":"누나가 날 데리고 나왔어.\n그러니까 이제 내가 어디로 갈지도 믿어줘.","attribution":"서안 센","id":"decision-p3","terms":[]}]},{"id":"music","title":"쉼표 다음에는 반드시 연주해야 할까","blocks":[{"type":"paragraph","text":"서안의 곡에는 길게 비어 있는 마디가 있다. 그는 쉼표를 회복원의 복귀 준비 시간과 다르게 써보고 싶어 했다. 들으러 온 사람은 그동안 차를 마시거나 먼저 나가도 된다. 기다려준 청중에게 빚진 것처럼 마지막을 서둘러 채우지 않는다.","id":"music-p1","terms":["회복원","서안"]},{"type":"paragraph","text":"곡의 제목은 ‘오늘’이다. 첫 공연에서는 이름을 정하지 않았고, 나래가 잼 병의 뚜껑에 적힌 말을 보고 붙였다. 수십 년 뒤 더 능숙해진 서안도 제목은 바꾸지 않는다. 서툴러야만 자유로운 사람인 것은 아니다.","id":"music-p2","terms":["나래","서안"]}]}],"sources":[],"relations":[{"target":"deep-jam","label":"곡의 제목","reason":"잼 병에 적힌 오늘.","evidence":{"entry":"deep-jam","anchor":"payoff","label":"떡밥의 뒷면 · 쉼표를 듣는 사람들"}},{"target":"deep-names","label":"이름과 소품","reason":"서안과 낮은 책상.","evidence":{"entry":"deep-names","anchor":"desk","label":"서안 · 이름과 책상"}}],"spoiler":false,"shortTitle":"서안 센","preview":"리아의 동생. 음악을 좋아한다. 잘해야만 계속할 수 있다는 말을 더는 듣고 싶지 않다.","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"mira","title":"미라 베일 — 이름을 먼저 묻는 사람","summary":"영웅의 어머니보다, 아들의 도움을 거절해본 사람.","type":"character","kind":"인물 기록","tags":["가족","저녁","독립된 욕망"],"sections":[{"id":"person","title":"83세, 전직 구조 접수원","blocks":[{"type":"paragraph","text":"미라는 에이렌의 어머니다. 구조 접수소에서 일했고, 자동 항로망이 완성된 뒤 퇴직했다. 아들이 만경을 만들었을 때 사람들이 그녀에게 어떤 교육을 시켰는지 물었다. 미라는 대개 음식이 타겠다며 화제를 돌린다.","id":"person-p1","terms":["에이렌","만경","미라"]},{"type":"paragraph","text":"자기 아들이 신처럼 불리는 것은 기쁘고 불편하다. 사람을 구한 일을 자랑스러워하지만, 아들이 모든 저녁을 자기 책임처럼 세는 모습은 걱정한다.","id":"person-p2","terms":[]}]},{"id":"choice","title":"아들이 고칠 수 없는 고장이 아니다","blocks":[{"type":"paragraph","text":"미라는 나이가 드는 속도를 조절할 수 있지만 지금의 얼굴을 유지한다. 변화를 선택한 친구를 덜 진실하다고 생각하지 않는다. 남은 얼굴이 자신의 선택이듯, 바꾼 얼굴도 친구의 선택이다.","id":"choice-p1","terms":["미라"]},{"type":"paragraph","text":"그녀는 만경 개원식의 ‘창조자를 길러낸 어머니’ 소개를 거절한다. 일어나서 박수받는 일보다 참석자의 이름을 하나씩 묻고 싶기 때문이다. 아들의 신념을 설명하기 위해서만 등장하지 않는 사람이다.","id":"choice-p2","terms":["만경"]}]},{"id":"dinner","title":"끝까지 고치지 않는 질문","blocks":[{"type":"dialogue","speaker":"미라","text":"오늘은 누구를 구했니?","id":"dinner-p1","terms":[]},{"type":"paragraph","text":"에이렌이 대답하려 하자 미라는 고개를 저었다. 옛 습관이었다.","id":"dinner-p2","terms":["에이렌","미라"]},{"type":"dialogue","speaker":"미라","text":"아니. 오늘은 뭘 먹고 싶니?","id":"dinner-p3","terms":[]},{"type":"paragraph","text":"먼 훗날 에이렌이 우편 창구를 떠나는 장면에서 같은 질문이 돌아온다. 그때에는 누구도 실수라고 정정하지 않는다.","id":"dinner-p4","terms":["에이렌"]}]},{"id":"first-call","title":"마지막 당직보다 먼저 있던 전화","blocks":[{"type":"paragraph","text":"긴 저녁 당시 미라는 41세의 구조 통신 담당자였다. 이사의 구조 요청을 받았고 팀을 보냈지만 강제 출입 제한을 넘는 동안 늦었다. 연락에 성공했다는 기록을 구조에 성공했다고 고치지 않았다.","id":"first-call-p1","terms":["긴 저녁","이사","미라"]},{"type":"paragraph","text":"30년 전의 마지막 당직은 이 실패를 뒤늦게 처음 아는 날이 아니다. 오랫동안 알고도 일하던 사람이, 자동화 뒤 자기 일이 없어질 때 어떤 삶을 살 수 있는지 묻는 날이다. 미라에게서 일이 사라진 것을 실패나 가치 상실로 정하지 않는다.","id":"first-call-p2","terms":["미라"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"대답과 도착 사이","entry":"lining-call"},{"label":"83세의 미라가 만난 사람","entry":"lining-return"}],"id":"first-call-p3","terms":[]}]}],"sources":[],"relations":[{"target":"last-shift","label":"마지막 당직","reason":"완벽한 인수인계 뒤.","evidence":{"entry":"last-shift","anchor":"success","label":"개원 30년 전 · 완벽한 인수인계"}},{"target":"future-offduty","label":"되돌아오는 식탁","reason":"아들의 새 역할을 찾지 않는다.","evidence":{"entry":"future-offduty","anchor":"supper","label":"내일의 용건"}}],"spoiler":false,"motive":{"과거":"당직이 끝났지만 삶은 끝나지 않았다.","현재 선택":"아들의 성과가 아닌 자기 저녁을 정한다.","치르는 대가":"창조자의 가족에게 기대되는 대표 역할을 거절한다."},"shortTitle":"미라 베일","preview":"에이렌의 어머니. 오래전 구조 요청을 접수하는 일을 했다.","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"rajan","title":"라잔 세르 — 사랑받는 통치자","summary":"질서를 선이라고 믿었고, 그 질서를 판단받는 일은 끝내 원하지 않는다.","type":"character","kind":"인물 기록","tags":["통치","책임 회피","입주 신청"],"sections":[{"id":"origin","title":"그가 물려받은 나라","blocks":[{"type":"paragraph","text":"66세의 라잔은 복구기를 통과한 공헌청 지도자의 후계자다. 어릴 때 들은 영웅담은 역할을 정해 혼란을 끝낸 사람들의 이야기였다. 누구나 소중하다는 말보다, 각자 맡은 몫을 하는 사회가 실제로 사람을 살린다고 배웠다.","id":"origin-p1","terms":["공헌청","라잔"]}]},{"id":"choice","title":"등대동을 그대로 둘 수 없었던 이유","blocks":[{"type":"paragraph","text":"등대동은 라잔의 체제가 없어도 사람들이 서로를 돌볼 수 있다는 증거였다. 그는 이를 아름다운 예외로 남겨둘 수는 있었지만, 등급 없이 공적인 결정에 참여하게 만들고 싶지는 않았다.","id":"choice-p1","terms":["등대동","라잔"]},{"type":"paragraph","text":"그는 등대동의 공동체가 즉시 사회를 무너뜨릴 위험은 크지 않다는 보고를 받았다. 그런데도 회복 대상 지정을 승인했다. 권력을 유지하려는 동기와 자신의 질서가 선하다는 확신이 함께 작용했다. 좋은 과거가 이 선택을 정당화하지 않는다.","id":"choice-p2","terms":["등대동"]}]},{"id":"turn","title":"왜 도망치지 않고 만경에 오나","blocks":[{"type":"paragraph","text":"개혁 이후 그는 집과 생활을 보장받았지만 실제 시민을 지배할 권한을 잃었다. 만경의 시범 운영에서 환영 시민과 지내보고, 그들의 사랑이 실제 시민의 동의가 아니어도 자신에게 충분하다는 사실을 발견했다.","id":"turn-p1","terms":["만경"]},{"type":"paragraph","text":"그는 여전히 실제 시민이 자신의 통치를 평가할 권리를 인정하고 싶지 않다. 하지만 그들의 마음을 빼앗는 대신, 자신이 사랑받는 개인 세계를 선택한다. 이 선택 자체로 새 피해를 일으키지는 않는다.","id":"turn-p2","terms":["개인 세계"]}]},{"id":"refusal","title":"왜 심판에 나오지 않나","blocks":[{"type":"paragraph","text":"그는 형량이나 생활 박탈을 두려워해서만 출석을 거부하는 것이 아니다. 출석은 자신이 훈육 대상이라고 생각했던 시민들의 요구에 응하는 행동이다. 그는 자신의 결정은 설명할 수 있어도 그들 앞에서 답해야 할 의무는 없다고 본다.","id":"refusal-p1","terms":[]},{"type":"paragraph","text":"라잔은 환영의 박수 뒤에서 몰래 절망하지 않는다. 만경에서 정말 행복해질 수 있다. 그것이 현재의 피해를 막았다는 증거는 될 수 있지만, 과거의 통치가 옳았다는 증거는 아니다.","id":"refusal-p2","terms":["라잔","만경"]}]},{"id":"role","title":"그를 납작하게 만들지 않기","blocks":[{"type":"paragraph","text":"라잔에게도 자신이 보호했던 가족과 실제로 해낸 복구 사업이 있다. 그는 이 사실들을 진심으로 기억한다. 하지만 자신이 잘한 일을 인정받아야 한다는 요구를, 잘못한 일을 묻지 말라는 요구와 반복해서 섞는다.","id":"role-p1","terms":["라잔"]},{"type":"paragraph","text":"라잔의 존재는 에이렌의 위선을 폭로하는 비밀 장치가 아니다. 에이렌은 그가 어떤 사람인지 알고도 보호하며, 리아 역시 그에게 지금 새로운 해를 끼칠 권한이 없다는 것을 알고 심판을 요구한다.","id":"role-p2","terms":["에이렌","라잔","리아"]}]},{"id":"saved","title":"그가 외우고 있는 이름들","blocks":[{"type":"paragraph","text":"라잔은 젊은 시절 방파제 사고 때 구조선을 돌려보냈고 여러 가족을 구했다. 구한 사람들의 이름과 이후 진학까지 기억한다. 진심으로 자랑스러워한다. 이 기억 때문에 자신의 지도 없이는 사람들의 삶이 나아지지 않는다는 믿음을 버리기 더 어려워졌다.","id":"saved-p1","terms":["라잔"]},{"type":"paragraph","text":"등대동 보고서는 주민들이 도시를 파괴할 위험이 낮다고 적었다. 그는 그 보고를 읽었다. 그런데도 권리를 요구하는 사람을 다시 훈련받아야 할 사람으로 분류했다. 개인적 애정과 공적인 지배 욕구가 모순 없이 함께 작동한 순간이다.","id":"saved-p2","terms":["등대동"]}]},{"id":"letter","title":"그가 좋아한 진짜 문장","blocks":[{"type":"paragraph","text":"여울의 용서장은 꿈배역의 박수와 달랐다. 자신이 골라준 대사가 아니었다. 라잔은 편지 전체를 몇 번 읽었다. 마지막의 “당신이 옳았다는 뜻은 아닙니다”도 보았다. 그 문장을 지운 복사본으로 바꾸지는 않았다.","id":"letter-p1","terms":["꿈배역","라잔","여울"]},{"type":"paragraph","text":"그러나 공개석상에서는 첫 문장에 더 오래 머문다. 자신이 원한 의미를 강조할 자유와, 다른 생존자의 결론까지 대표한다고 말할 권리는 다르다. 리아와 에이렌은 바로 그 지점을 각자의 방식으로 막는다.","id":"letter-p2","terms":["에이렌","리아"]}]},{"id":"saint","title":"구원의 계보를 원하는 이유","blocks":[{"type":"paragraph","text":"라잔에게 귀환제는 단순한 인기 회복 무대가 아니다. 비상 배급의 후손으로서 자신이 했던 통제가 결국 행복한 문명으로 이어졌다는 해석을 얻을 기회다. 행복이 사실이면 과정의 강제도 역사 속 필요였다고 읽고 싶어 한다.","terms":["귀환제","라잔"],"id":"saint-p1"},{"type":"paragraph","text":"메이는 이 연결을 끊는다. 그가 나쁜 사람이라서 172년 전의 구조까지 오염되었다고 말하지 않는다. 긴급한 우선권에는 끝나는 시점이 있었고, 훗날 같은 제한을 다시 행사하려면 새 근거가 필요하다고 말한다. 과거의 성공을 영구 면허로 삼을 수는 없다.","terms":["메이"],"id":"saint-p2"}]}],"sources":[],"relations":[{"target":"society","label":"그의 질서","reason":"도움의 기억이 권리가 된다.","evidence":{"entry":"society","anchor":"consent","label":"왜 시민들도 한동안 지지했나"}},{"target":"yeoul","label":"진짜 용서장","reason":"그가 선택하지 않은 문장.","evidence":{"entry":"yeoul","anchor":"forgiveness","label":"용서의 정확한 범위"}},{"target":"act-two","label":"요구한 무대","reason":"피고가 아닌 지도자의 좌석.","evidence":{"entry":"act-two","anchor":"deal","label":"한 번 더 서명하면"}}],"spoiler":false,"motive":{"과거":"역할을 배분한 지도자가 사람들을 구했다는 믿음으로 자랐다.","현재 선택":"시민의 심판보다 자신을 사랑하는 개인 세계를 택한다.","치르는 대가":"실제 공동체가 자신의 통치를 인정하지 않는 것을 받아들인다."},"shortTitle":"라잔 세르","preview":"공헌청의 옛 통치자. 지금은 다른 시민을 지배할 공권력을 잃었다.","readingMinutes":3,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"relationships","title":"서로를 움직이는 사람들","summary":"인물은 자기 신념만으로 행동하지 않는다. 관계가 그 신념의 값을 드러낸다.","type":"guide","kind":"읽기 길잡이","tags":["동기 연결","관계","대가"],"sections":[{"id":"leads","title":"에이렌 ↔ 리아 · 면책 없는 신뢰","blocks":[{"type":"paragraph","text":"리아는 에이렌의 자료로 제도를 무너뜨렸고, 에이렌은 리아를 통해 퇴소 이후의 삶을 배웠다. 둘은 서로가 얼마나 많은 사람을 구했는지 직접 안다. 그래서 상대를 위선자라고 부르면 자신의 역사 일부도 거짓으로 만들어야 한다.","id":"leads-p1","terms":["에이렌","리아"]},{"type":"paragraph","text":"리아가 에이렌을 심판할 수 있는 이유는 그를 증오해서가 아니다. 둘의 협력이 과거 책임을 지워주는 거래가 아니었다고 지키기 위해서다. 에이렌도 그녀에게 감사의 대가로 면책을 요구하지 않는다.","id":"leads-p2","terms":["에이렌","리아"]}]},{"id":"siblings","title":"리아 ↔ 서안 · 돌봄에서 신뢰로","blocks":[{"type":"paragraph","text":"리아에게 서안을 구한 기억은 오래된 죄책감과 가장 큰 자부심이 함께 있는 자리다. 서안이 그녀의 싸움에 참여하지 않으면 자신의 구원이 부정되는 듯 느낄 수 있다. 그녀가 견뎌야 할 것은 동생의 배신이 아니라, 동생이 자기와 다른 하루를 택한다는 사실이다.","id":"siblings-p1","terms":["리아","서안"]}]},{"id":"survivors","title":"리아 ↔ 나래 · 편을 들어도 대신 말할 수는 없다","blocks":[{"type":"paragraph","text":"나래는 심판을 원하지만 언제나 리아의 방식에 동의하지 않는다. 두 사람은 공동체에서 서로 책임을 요구할 수 있다고 믿으면서도, 그 책임이 어디까지인지 매번 협의해야 한다.","id":"survivors-p1","terms":["나래","리아"]}]},{"id":"architects","title":"에이렌 ↔ 라잔 · 같은 말, 다른 권한","blocks":[{"type":"paragraph","text":"두 사람 모두 사람을 더 잘 살게 하겠다고 말한 적이 있다. 차이는 어떤 사람이 그 도움을 거절할 때 드러난다. 라잔은 거절을 고칠 문제로 다뤘고, 에이렌은 거절할 출구를 남기려 한다.","id":"architects-p1","terms":["에이렌","라잔"]},{"type":"paragraph","text":"그렇다고 에이렌에게 권력 문제가 없는 것은 아니다. 그가 선택한 기본 경계는 모두의 삶에 영향을 준다. 리아의 비판은 바로 이 점에 닿는다. 사람의 마음을 강제하지 않는다고 해서, 세계의 기본 원칙을 정한 책임까지 사라지지는 않는다.","id":"architects-p2","terms":["에이렌","리아"]}]},{"id":"shared","title":"같은 사람을 두 번 구하려는 갈등","blocks":[{"type":"paragraph","text":"에이렌은 나래가 심판의 결말을 기다리지 않고도 행복해질 수 있게 한다. 리아는 나래가 이미 행복해졌더라도 라잔에게 질문할 수 있게 하려 한다. 두 사람은 서로 다른 피해자 집단을 놓고 경쟁하는 것이 아니라, 한 사람이 품은 서로 다른 요구를 우선한다.","id":"shared-p1","terms":["에이렌","나래","라잔","리아"]}]},{"id":"two-nara","title":"나래 ↔ 여울 · 너는 나를 대표하지 않는다","blocks":[{"type":"paragraph","text":"처음 둘을 만나는 사람은 어느 쪽이 원본인지 묻는다. 두 사람 모두 그 질문에 답할 필요가 없다. 분기 이전의 삶에 대해서는 둘 다 당사자이고, 지금의 결론은 각자에게 속한다.","id":"two-nara-p1","terms":["분기"]},{"type":"paragraph","text":"리아는 여울의 증언이 나래에게 불리하다고 막을 수 없다. 에이렌은 여울의 회복이 자신의 해법을 지지한다고 나래에게 기다리라고 할 수 없다. 두 나래가 함께 있는 것만으로도 두 주인공의 선의가 심사를 받는다.","id":"two-nara-p2","terms":["에이렌","나래","리아","여울"]}]},{"id":"founder","title":"메이와 결 — 위로가 된 이야기의 두 주인","blocks":[{"type":"paragraph","text":"결은 메이를 만나 감사하고 싶었고, 메이는 결에게 자기 입을 돌려달라고 한다. 어느 쪽도 상대를 만나지 않았다면 덜 복잡하게 살 수 있었다. 그러나 실제로 만난 뒤에는 좋은 이야기의 기준이 바뀐다. 메이는 위로를 빼앗지 않으면서 자기 말을 찾고, 결은 장면을 덜 완벽하게 만드는 비용을 감수한다.","terms":["메이"],"id":"founder-p1"}]},{"id":"giants","title":"에이렌과 리아가 읽은 다른 장부","blocks":[{"type":"paragraph","text":"에이렌은 아벨에게서 끝없는 개선 요구를 의심하는 법을 배웠고, 리아는 리브에게서 다른 사람의 거절까지 남기는 기록을 받았다. 둘의 스승은 긴 저녁에서 맞섰다. 제자들은 스승의 진영을 그대로 재연하지 않는다. 에이렌도 학살에 반대했고, 리아도 만경을 지지한다.","id":"giants-p1","terms":["긴 저녁","에이렌","리브","리아","만경","아벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"아벨의 문장을 거절한 제자","entry":"prison-window"},{"label":"리브의 장부를 고친 계승자","entry":"liv"},{"label":"같은 자비의 다른 후계자","entry":"inheritance-war"}],"id":"giants-p2"}]}],"sources":[],"relations":[{"target":"act-two","label":"실제로 만나다","reason":"관계를 장면으로 읽는다.","evidence":{"entry":"act-two","anchor":"nara","label":"소금 한 숟갈"}},{"target":"future-offduty","label":"리아와 에이렌","reason":"상대의 퇴장을 돕는다.","evidence":{"entry":"future-offduty","anchor":"petition","label":"그만둘 수 없는 선한 이유"}}],"spoiler":false,"shortTitle":"서로를 움직이는 사람들","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"conflict","title":"대척점 — 같은 사건을 누가 끝내는가","summary":"에이렌은 원하는 결말을 살 권리를, 리아는 그 결말로 남의 기록까지 끝내지 않을 권리를 지킨다. 강제 출석 문제에서는 실제로 갈라진다.","type":"world","kind":"세계 설정","tags":["두 주인공","정당한 강제","구체적 쟁점"],"sections":[{"id":"agree","title":"둘이 이미 동의한 것","blocks":[{"type":"paragraph","text":"라잔의 옛 명령은 잘못이었다. 피해자는 먼저 회복을 받을 수 있다. 라잔에게도 기본 생활과 행복한 개인 세계가 보장된다. 범죄 기록은 공개할 수 있고, 실제 공동체는 그를 지도자로 받아들이지 않을 수 있다.","id":"agree-p1","terms":["개인 세계","라잔"]},{"type":"paragraph","text":"가짜 낙원, 에너지 부족, 피해자를 연료로 쓰는 비밀은 없다. 이러한 공통점을 흔들어 상대를 쉽게 나쁜 사람으로 만들지 않는다.","id":"agree-p2","terms":[]}]},{"id":"request","title":"단 하나의 구체적인 요청","blocks":[{"type":"paragraph","text":"리아의 시민심판은 라잔에게 공적으로 확인된 자신의 명령을 듣고, 응답할 기회를 갖는 제한된 심판 절차에 출석하라고 요구한다. 강제 자백, 마음 수정, 고문, 영구 감금은 요구하지 않는다.","id":"request-p1","terms":["시민심판","라잔","리아"]},{"type":"paragraph","text":"라잔은 거부한다. 리아는 그 거부에도 불구하고 출석을 집행할 수 있는 좁은 예외를 요청한다. 에이렌은 공개적으로 반대한다. 다른 만경 공동체들도 의견을 내지만 이번 사건의 보호 원칙은 변경되지 않는다. 그를 죽이면 문이 열리는 단독 관리자 구조가 아니라, 어떤 강제를 공적으로 허용할지의 충돌이다.","id":"request-p2","terms":["에이렌","라잔","리아","만경"]}]},{"id":"eiren-case","title":"에이렌의 판단","blocks":[{"type":"paragraph","text":"증거는 확보할 수 있고, 피해는 회복시킬 수 있으며, 다시 타인에게 해를 끼치는 일도 막을 수 있다. 에이렌은 그런 조건에서 출석을 강제하는 일이 누구의 어떤 필요를 위해 정당화되는지 묻는다.","id":"eiren-case-p1","terms":["에이렌"]},{"type":"paragraph","text":"그는 책임을 기억하거나 비판하는 일을 막지 않는다. 다만 그 책임이 곧 당사자의 몸과 관심을 강제할 권한으로 이어진다는 데 동의하지 않는다.","id":"eiren-case-p2","terms":[]}]},{"id":"ria-case","title":"리아의 판단","blocks":[{"type":"paragraph","text":"리아는 단지 피해를 줄이는 것 이상으로, 사람들 사이에 정당하게 요구하고 응답하는 관계가 있어야 한다고 본다. 공적 권한으로 남의 삶을 결정한 사람은 그 결정을 시민 앞에 내놓을 의무가 있다는 입장이다.","id":"ria-case-p1","terms":["리아"]},{"type":"paragraph","text":"그녀는 거절을 무시한다는 부담을 인정한다. 그래서 제한의 범위와 기간, 독립적인 판단과 재검토를 요구한다. 과거의 회복원과 다르다는 말만으로 모든 위험이 사라진다고 주장하지 않는다.","id":"ria-case-p2","terms":["회복원"]}]},{"id":"limits","title":"이것은 어느 쪽의 사실 오류도 아니다","blocks":[{"type":"paragraph","text":"에이렌은 피해자가 왜 응답을 원하는지 이해한다. 리아는 직접 출석 없이도 사실과 안전을 확보할 수 있음을 이해한다. 서로를 무지하거나 냉정한 사람으로 만들지 않아도, 강제할 권한에 대한 다른 판단은 남는다.","id":"limits-p1","terms":["에이렌","리아"]},{"type":"paragraph","text":"두 사람의 입장이 끝까지 양립할 수 없다면 어느 실제 조치를 할지 정해야 한다. 그러나 그것이 전 우주를 파괴할 결전을 필요로 한다는 뜻은 아니다. 이 작품은 한정된 사건에서 선택한 원칙의 대가를 다루는 이야기다.","id":"limits-p2","terms":[]}]},{"id":"letter","title":"행복의 개인화와 사건의 공적인 기록","blocks":[{"type":"paragraph","text":"여울의 용서와 나래의 분노는 각자의 삶에서 존중받는다. 두 주인공은 이 점에 동의한다. 또한 공적인 명령 기록은 누군가의 행복에 맞춰 수정하지 않는다. 같은 사건을 함께 논하려면 어디까지가 사실이고 누가 무엇에 서명했는지 알아야 하기 때문이다.","id":"letter-p1","terms":["나래","여울"]},{"type":"paragraph","text":"이 합의만으로 라잔의 출석 문제까지 해결되지는 않는다. 리아는 실제 당사자의 의무를 집행할 수 있어야 한다고 본다. 에이렌은 회복과 재발 방지가 이미 가능한 상황에서 그 추가 강제를 거부한다. 작품은 모두가 동의할 숨은 정답을 뒤늦게 꺼내지 않는다.","id":"letter-p2","terms":["에이렌","라잔","리아"]}]}],"sources":[],"relations":[{"target":"hearing","label":"실제 절차","reason":"요구와 판단과 집행.","evidence":{"entry":"hearing","anchor":"enforcement","label":"판결과 집행은 다른 단계다"}},{"target":"deep-forgive","label":"말의 구조","reason":"용서가 무죄는 아니다.","evidence":{"entry":"deep-forgive","anchor":"three","label":"이야기 속 세 단어"}},{"target":"act-three","label":"선택의 결과","reason":"무엇을 얻지 못했는가.","evidence":{"entry":"act-three","anchor":"boundary","label":"열리지 않는 경계"}}],"spoiler":false,"shortTitle":"대척점","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"hearing","title":"시민심판 — 증거가 완전해도 남는 일","summary":"범인을 찾는 절차가 아니라, 이미 드러난 권한 행사에 책임을 묻는 자리다.","type":"world","kind":"세계 설정","tags":["증거","판결","운영"],"sections":[{"id":"body","title":"누가 판단하는가","blocks":[{"type":"paragraph","text":"시민심판은 개혁 후 만들어진 공공 기구다. 강제 회복원을 폐쇄하고 피해를 복구하는 일은 이미 이루어졌다. 여기서는 당사자의 참여 범위와 공개할 기록을 따로 확인하며 공적인 명령의 책임을 판단한다. 그 과정은 피해자의 기억을 강제로 공개해 자동 완성하지 않는다. 리아는 요청을 정리하는 제안자이고, 사건에 관여하지 않은 심판관들이 판단한다. 라잔에게도 반론 통로와 대리인을 둘 권리가 있다.","id":"body-p1","terms":["시민심판","회복원","라잔","리아"]},{"type":"paragraph","text":"이것은 창작 세계 안의 제도다. 현실의 특정 국가에서 같은 절차가 적법하다는 설명이 아니다.","id":"body-p2","terms":[]}]},{"id":"evidence","title":"전능한 힘으로 찾을 수 있는 증거","blocks":[{"type":"paragraph","text":"기록이 파괴되어 진실을 영원히 모르는 상황을 인위적으로 만들지 않는다. 창조권으로 명령과 사건을 확인할 수 있다. 사건에 필요하지 않은 사생활까지 보여줄 이유는 없다. 공적 명령과 공개를 허용한 증언을 분리한다.","id":"evidence-p1","terms":["창조권"]},{"type":"paragraph","text":"기록은 무엇이 일어났는지를 밝힌다. 그 사실에서 누가 어느 책임을 져야 하는지, 어떤 강제가 정당한지는 여전히 판단할 문제다. 전능한 증거를 절대적인 도덕적 판결로 혼동하지 않는다.","id":"evidence-p2","terms":[]}]},{"id":"fairness","title":"라잔이 침묵해도 판결할 수 있다","blocks":[{"type":"paragraph","text":"라잔의 불출석 때문에 피해 사실이 사라지지는 않는다. 직접 출석을 요청하되, 출석을 회복 지원의 조건으로 삼지 않는다. 반론 기회를 보장한 뒤 확인된 행위를 판단할 수 있다.","id":"fairness-p1","terms":["라잔"]},{"type":"paragraph","text":"불출석 자체를 숨은 유죄 증거로 사용하지 않는다. 그의 책임은 옛 명령과 그 결과에 근거한다. 나오지 않은 이유는 심판에 대한 거부로 별도로 기록한다.","id":"fairness-p2","terms":[]}]},{"id":"enforcement","title":"판결과 집행은 다른 단계다","blocks":[{"type":"paragraph","text":"시민심판은 책임을 판단하고 공동체의 공식 기록을 고칠 수 있다. 그러나 판정문이 만경 주민의 개인 경계를 자동으로 해제하지는 않는다. 이 보호는 에이렌의 개인 허가가 아니라 주민에게 보장된 공존 규칙이다. 리아는 공적 심판을 위한 제한적 예외를 요구하고, 에이렌은 그 예외에 반대하는 대표자로 선다.","id":"enforcement-p1","terms":["개인 세계","시민심판","에이렌","라잔"]},{"type":"paragraph","text":"리아는 라잔의 집이나 식량을 빼앗는 방식으로 출석을 압박하지 않는다. 행복할 자격을 다시 심사하는 체제를 세우려는 것이 아니기 때문이다.","id":"enforcement-p2","terms":["라잔","리아"]}]},{"id":"cost","title":"완전한 만족을 약속하지 않는다","blocks":[{"type":"paragraph","text":"불출석 심판은 실제 당사자의 응답을 얻지 못한다. 어떤 피해자는 공식 판단으로 충분한 회복을 얻고, 어떤 피해자는 여전히 부족하다고 느낀다. 절차가 끝났다는 이유로 그 감정을 고치라고 요구하지 않는다.","id":"cost-p1","terms":[]}]},{"id":"branches","title":"두 나래의 증언은 두 사건의 표가 아니다","blocks":[{"type":"paragraph","text":"나래와 여울은 분기 이전의 사건에 관해 모두 당사자다. 그러나 분기 전의 동일한 경험을 가진 증언이 둘이라고 사건이 두 번 일어난 것이 되지는 않는다. 사실 확인에서는 공유된 근거임을 표시한다. 용서와 출석 요구처럼 분기 뒤의 판단은 각자의 것으로 적는다.","id":"branches-p1","terms":["나래","분기","여울"]},{"type":"paragraph","text":"심판은 더 많은 인격을 만들어 찬성표를 늘리는 방식이 아니다. 미리 정한 공동체의 절차에 따라 공적인 행위를 판단한다. 용서한 생존자를 증인에서 제외하거나, 용서하지 않은 생존자를 아직 회복되지 않은 증거로 쓰지 않는다.","id":"branches-p2","terms":[]}]}],"sources":[],"relations":[{"target":"conflict","label":"남은 이견","reason":"강제 출석의 요청.","evidence":{"entry":"conflict","anchor":"request","label":"단 하나의 구체적인 요청"}},{"target":"act-three","label":"실제 장면","reason":"두 증언자와 빈 피고석.","evidence":{"entry":"act-three","anchor":"empty","label":"세 개의 의자"}}],"spoiler":false,"shortTitle":"시민심판","preview":"공적 행위의 책임을 따지는 기구. 리아가 요청을 정리하지만 판단은 별도의 심판관들이 맡는다.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"act-one","title":"1장 — 세 개의 도장","summary":"한 칸에 묶여 있던 선택들을 리아가 다시 나눈다.","type":"story","kind":"이야기","tags":["본편","도입","문서"],"sections":[{"id":"cafe","title":"두 개의 우승컵","blocks":[{"type":"paragraph","text":"찻집 주인은 같은 경기를 이긴 선수들에게 같은 크기의 케이크를 내놓았다. 서로 어느 쪽이 먼저 자를지 묻다가 둘 다 웃었다. 이번에는 한 케이크를 함께 먹고 싶었다. 둘에게는 나눌 힘도, 나누지 않을 선택도 있었다.","id":"cafe-p1","terms":[]},{"type":"paragraph","text":"리아는 찻집 문 앞에서 잠시 멈췄다. 서안을 기다리는 동안, 아침에 접수한 두 봉투의 사본을 다시 읽었다. 사람들을 이런 삶에서 끌어내고 싶었던 적은 없었다.","id":"cafe-p2","terms":["리아"]}]},{"id":"music","title":"오늘이라는 제목","blocks":[{"type":"paragraph","text":"서안의 악보에는 긴 쉼표가 있었다. 리아가 몇 마디나 비울 것인지 묻자 서안은 아직 모른다고 했다. 그녀는 공연 시간을 먼저 계산하려다 말을 삼켰다. 식탁 위 잼 병에는 오늘이라고 적혀 있었다.","id":"music-p1","terms":["리아","서안"]},{"type":"paragraph","text":"나래는 서안에게 자신의 다른 갈래가 편지를 보냈다고 말했다. 서안은 내용보다 먼저 물었다. 잘 산대요? 나래는 그렇다고 답했다. 그 대답만큼은 기뻤다.","id":"music-p2","terms":["나래","서안"]}]},{"id":"arrival","title":"세 도장","blocks":[{"type":"paragraph","text":"미결 우체국의 서류에는 도착, 열람, 동의가 따로 있었다. 리아는 아침에 받은 라잔의 서류를 다시 펼쳤다. 입주 신청서에는 접수 도장만 찍혀 있었다. 심판 거부서는 별도 기록으로 남겼다. 받았다는 말이 승인이나 동의까지 뜻하지는 않았다.","id":"arrival-p1","terms":["미결 우체국","라잔","리아"]},{"type":"paragraph","text":"기록실에서 가져온 옛 합의문에는 그 구별이 없었다. 서안의 지원금 수령과 등대동 공동 민원 종결이 한 칸에 묶여 있었다. 리아의 서명이 그 아래 있었다. 나래는 그것을 처음 보는 사람처럼 놀라지 않았다. 두 사람이 아는 과거가 다시 현재의 책상에 놓인 것이다.","id":"arrival-p2","terms":["등대동","나래","리아","서안"]}]},{"id":"decision","title":"축제의 문장","blocks":[{"type":"dialogue","speaker":"환대회 담당자","text":"모두가 고생했잖아요. 이제 기뻐해도 된다는 말을 하고 싶었어요.","id":"decision-p1","terms":[]},{"type":"dialogue","speaker":"나래","text":"기뻐하세요. 다만 내 이름으로 끝났다고 말하지는 말아주세요.","id":"decision-p2","terms":[]},{"type":"paragraph","text":"담당자는 악의를 들킨 사람이 아니었다. 좋은 축제가 누구의 동의까지 대신하게 되었는지 처음 명확히 보았다. 무대 문구는 재검토에 들어갔다. 하지만 라잔은 이미 그 문구가 들어간 개원 초청장을 받아두고 있었다.","id":"decision-p3","terms":["라잔"]}]},{"id":"new-guest","title":"성녀와 생존자가 같은 창구에 오다","blocks":[{"type":"paragraph","text":"아침에 메이가 남긴 요청은 한 줄이었다. 읽기로 동의하지 않은 서약을 대본에서 빼달라는 것. 리아는 그것을 나래의 요청 옆에 놓았다. 누구도 축제를 취소해달라고 하지는 않았다.","terms":["나래","리아","메이","여울"],"id":"new-guest-p1"},{"type":"paragraph","text":"에이렌은 두 요청에 이의를 달지 않았다. 결에게 연락해 네 사람의 말을 미리 정리하지 말아달라고 부탁했다. 자기 이름 아래에서 열릴 행사를 고치는 첫 전화였다.","terms":["에이렌","메이","여울"],"id":"new-guest-p2"}]}],"sources":[],"relations":[{"target":"deep-forgive","label":"도장의 뒷면","reason":"서명 칸을 나누는 이유.","evidence":{"entry":"deep-forgive","anchor":"three","label":"이야기 속 세 단어"}},{"target":"act-two","label":"다음 막","reason":"두 나래가 만난다.","evidence":{"entry":"act-two","anchor":"nara","label":"소금 한 숟갈"}}],"spoiler":false,"era":"개원일 낮 · 등대동과 접수소","shortTitle":"1장","preview":"","readingMinutes":2,"requires":[],"readerCue":{"지금 따라가는 사람":"리아 · 이주와 요청을 돕는 조정자","이 장면에서 원하는 것":"입주 신청과 심판 거부를 별개로 다루려 한다."}},{"id":"future-letter","title":"11년 뒤 — 마지막 반송","summary":"나래는 답장을 받지 못했다. 그래도 자기 서랍을 닫을 수 있었다.","type":"future","kind":"먼 훗날의 이야기","tags":["후일담","나래","반송"],"sections":[{"id":"drawer","title":"답이 없는 서랍","blocks":[{"type":"paragraph","text":"개원 열한 해째, 나래는 미결 우체국에 편지 보관을 끝내달라고 요청한다. 라잔에게 공개 질문을 보낸 뒤 가끔 답을 기다렸지만 수신 허락을 거듭 요구하지는 않았다. 설정해둔 갱신일이 왔을 뿐이다.","id":"drawer-p1","terms":["미결 우체국","나래","라잔"]},{"type":"paragraph","text":"리아는 보관 중단 사유를 적으려다가 멈춘다. 나래는 용서했다는 말을 하지 않았다. 잊었다고도 하지 않았다. 그저 이 편지를 기다리는 일을 더는 오늘의 일정으로 삼지 않겠다고 했다.","id":"drawer-p2","terms":["나래","리아"]}]},{"id":"record","title":"닫히는 것은 사건이 아니다","blocks":[{"type":"dialogue","speaker":"리아","text":"공개 기록은 그대로 남아요.","id":"record-p1","terms":[]},{"type":"dialogue","speaker":"나래","text":"알아요. 내 서랍만 닫아줘요.","id":"record-p2","terms":[]},{"type":"paragraph","text":"등대동의 사건 기록과 라잔의 책임은 남는다. 나래의 청문 기록도 남는다. 끝난 것은 한 편지를 활성 대기 목록에 두는 일이다. 어떤 사람의 회복을 사건의 무죄로 환전하지 않았듯, 대기를 끝내는 일을 용서로 자동 번역하지 않는다.","id":"record-p3","terms":["등대동","나래","라잔"]}]},{"id":"new","title":"새 봉투","blocks":[{"type":"paragraph","text":"나래가 다음으로 보낸 편지에는 사건 번호가 없었다. 여울에게 보내는 식사 초대였다. 이번에는 자신도 새 물길을 보고 싶다고 썼다. 편지는 즉시 도착했고 답장은 사흘 뒤에 왔다. 여울이 오랜만에 제대로 쉬고 있었기 때문이다.","id":"new-p1","terms":["나래","여울"]},{"type":"quote","text":"답장 없음. 발신인, 저녁 식사 중.","attribution":"리아가 남긴 옛 대기 기록의 마지막 줄","id":"new-p2","terms":[]},{"type":"paragraph","text":"그 줄은 라잔을 위한 좋은 결말이 아니었다. 나래의 하루가 라잔의 답장 없이도 다음 줄로 넘어갔다는 기록이었다.","id":"new-p3","terms":["나래","라잔"]}]}],"sources":[],"relations":[{"target":"postoffice","label":"서랍의 원칙","reason":"대기가 삶 전체를 뜻하지 않는다.","evidence":{"entry":"postoffice","anchor":"word","label":"미결은 미완성이 아니다"}},{"target":"deep-forgive","label":"닫힌 것은 무엇인가","reason":"사건과 대기 상태.","evidence":{"entry":"deep-forgive","anchor":"payoff","label":"떡밥의 뒷면 · 대표를 정하지 않는 두 의자"}}],"spoiler":true,"era":"공통력 · 개원 11년 뒤","shortTitle":"11년 뒤","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"future-choir","title":"37년 뒤 — 합창은 나를 혼자 부르지 못했다","summary":"사람들의 마음이 이어진 낙원은 정말 평화롭다. 그러나 하나가 되는 일만이 사랑의 완료는 아니다.","type":"future","kind":"먼 훗날","tags":[],"sections":[{"id":"arrival","title":"잘 작동하는 합창","blocks":[{"type":"paragraph","text":"나래와 여울은 서른일곱 해 뒤 살아 있는 합창을 방문한다. 동의한 사람들이 감각과 생각 일부를 함께 경험하는 공동체다. 환영 시민도 아니고, 원치 않는 이들이 녹아 갇힌 바다도 아니다. 들어오기 전에도, 안에서도, 나올 때도 각각의 의사를 확인한다. 서로의 배고픔을 느끼면 돌봄을 설명하기가 쉬워진다.","terms":["살아 있는 합창","나래","여울"],"id":"arrival-p1"},{"type":"paragraph","text":"이곳에서는 외로움이 실제로 줄었다. 참가자는 자기 경험이 남에게 전해졌다고 느끼며, 말하지 못한 감정도 함께 다룬다. 두 사람은 그것을 부러워한다. 합창은 자신들의 방식이 모든 인격의 완성이라고 선언하지 않는다.","terms":[],"id":"arrival-p2"}]},{"id":"pronoun","title":"나의 용서가 우리의 감각이 될 때","blocks":[{"type":"paragraph","text":"여울은 짧은 체험에 참여해 자기 용서에 이르기까지의 시간을 공유한다. 나래도 합의한 범위의 감각을 받는다. 처음으로 여울에게 용서가 단순한 결론이 아니라 지나온 생활의 감촉이라는 것을 안다. 이해가 늘어도 나래 자신의 판단이 저절로 같은 것이 되지는 않는다.","terms":["나래","여울"],"id":"pronoun-p1"},{"type":"paragraph","text":"합창의 한 구성원이 무심코 이제 우리도 용서했네라고 말한다. 다른 구성원이 고친다. 우리가 한 사람의 용서를 함께 느꼈다고 하자. 정정은 누군가의 처벌이 아니라 공동체가 스스로 익힌 정확함이었다.","terms":[],"id":"pronoun-p2"}]},{"id":"outside","title":"바깥 의자를 남겨두는 사랑","blocks":[{"type":"paragraph","text":"여울은 한 계절 더 머물기로 하고, 나래는 나온다. 저녁의 약속은 취소하지 않는다. 합창이 저녁 식탁 전체를 차지하지 않도록 바깥 의자를 하나 둔다. 나래는 무수한 목소리로 환영받지만 자기 앞의 컵을 건네는 손은 여울이 고른 손이다.","terms":["나래","여울"],"id":"outside-p1"},{"type":"paragraph","text":"한 번 함께 느낀 마음을 영원히 소유할 필요는 없다. 문턱을 유지하는 것이 사랑의 실패가 아니라 방문을 가능하게 하는 방식일 수도 있다.","terms":[],"id":"outside-p2"}]}],"sources":[],"relations":[{"target":"deep-chorus","label":"우리라는 말","reason":"함께 느낀 것과 함께 결정한 것을 나눈다.","evidence":{"entry":"deep-chorus","anchor":"plural","label":"한 사람을 위한 낙원과 함께 느끼는 낙원"}}],"era":"개원 37년 뒤","spoiler":true,"shortTitle":"37년 뒤","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"future-home","title":"63년 뒤 — 돌아온 사람은 문턱에서 이름을 바꾸었다","summary":"부활한 항해사가 찾은 것은 잃어버린 집이 아니라, 그 집에서 자기 삶을 계속 살아온 사람들이다.","type":"future","kind":"먼 훗날","tags":[],"sections":[{"id":"invitation","title":"두 번의 귀환","blocks":[{"type":"paragraph","text":"잃어버린 구조선의 항해사 다온은 초대를 받아 다시 산다. 처음에는 가족과 만날지 결정할 수 있는 조용한 방에서 오늘의 날짜를 듣는다. 살아 돌아온 몸은 익숙하지만 그 방에서 보이는 항구는 낯설다. 그의 자녀는 이미 자기보다 나이가 많다.","terms":["다온"],"id":"invitation-p1"},{"type":"paragraph","text":"낡은 집을 그대로 재현한 세계도 있다. 꿈배역의 가족과 그때의 저녁으로 돌아갈 수도 있다. 다온은 그 경험을 잠시 누리고, 그것을 거짓이라고 미워하지 않는다. 다만 실제 자녀가 오늘 어떻게 사는지 궁금해져 약속을 잡는다.","terms":["꿈배역","다온"],"id":"invitation-p2"}]},{"id":"threshold","title":"집을 알아보는 물건","blocks":[{"type":"paragraph","text":"집에는 옛 식탁이 남아 있었다. 그러나 자녀는 방의 배치를 바꾸었고, 배우자는 새로운 사람과 함께 살았다. 다온은 식탁을 알아보았다는 이유로 집의 주인 자리를 되찾았다고 선언하지 않는다. 그동안의 삶을 죽은 자의 자리 앞에서 모두 멈춰두라고 부탁한 적도 없었다.","terms":["다온"],"id":"threshold-p1"},{"type":"paragraph","text":"그는 현관의 이름표에 옛 호칭 대신 지금 부르고 싶은 이름을 적어달라고 한다. 가족은 그를 남으로 취급하지 않지만, 귀환이 곧 이전 질서의 복원은 아니라는 데 동의한다.","terms":[],"id":"threshold-p2"}]},{"id":"table","title":"식탁 하나가 두 집에","blocks":[{"type":"paragraph","text":"그들은 식탁을 어느 집에 둘지 다투지 않는다. 만경에서는 같은 식탁이 두 집의 방문 약속을 연결할 수 있다. 공유하는 날은 한 식탁에서 만나고, 쉬고 싶은 날은 각자의 식탁으로 남는다.","terms":["만경"],"id":"table-p1"},{"type":"paragraph","text":"다온에게 귀환은 원래 자리를 되찾는 승리가 아니라, 자신이 없던 동안 살아준 사람에게 새 주소를 받는 사건이 된다. 그는 다음 방문 때 무엇을 가져올지 묻는다. 가족은 이제 그가 잘하는 일을 요구하지 않고, 요즘 좋아하는 음식을 가져오라고 한다.","terms":["다온"],"id":"table-p2"}]}],"sources":[],"relations":[{"target":"deep-homecoming","label":"식탁의 귀환","reason":"물건을 알아보아도 다른 이의 현재를 되돌릴 수는 없다.","evidence":{"entry":"deep-homecoming","anchor":"table","label":"이번에는 식탁이 두 집으로 간다"}}],"era":"개원 63년 뒤","spoiler":true,"shortTitle":"63년 뒤","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"future-museum","title":"80년 뒤 — 천국을 반대한 여인","summary":"리아는 자신을 악당으로 만든 연극을 보러 간다. 문제가 되는 것은 악당 배역 자체가 아니다.","type":"future","kind":"먼 훗날의 이야기","tags":["후일담","기억","영웅담"],"sections":[{"id":"poster","title":"낯익은 이름의 공연","blocks":[{"type":"paragraph","text":"개원 여든 돌, 기록실의 옆 거리에 기념극이 올라온다. 극 속 리아는 사람들을 고통스러운 현실로 끌어내려는 인물이고, 에이렌은 그녀를 깨우쳐 모든 다툼을 끝낸다. 실제로는 일어나지 않은 결말이다.","id":"poster-p1","terms":["에이렌","리아"]},{"type":"paragraph","text":"연출가는 창작극이라는 표기를 붙였다. 리아는 배우가 자신을 나쁘게 연기했다는 이유로 공연을 막지 않는다. 관객도 한눈에 이해할 수 있는 이야기를 원할 자유가 있다. 다만 기념관 안내문이 그 줄거리를 사건의 사실 요약으로 옮겨 적으면서 다른 일이 된다.","id":"poster-p2","terms":["리아"]}]},{"id":"rehearsal","title":"배우에게서 듣는 자기 대사","blocks":[{"type":"paragraph","text":"연습실에서 젊은 배우는 리아를 알아보지 못한다. 그는 등장인물의 마음을 이해하려고 오래 연습했다고 말한다. “행복이 무서웠던 거죠?” 리아는 그 질문에 화내기 전에 웃음이 난다. 살아 있는 사람에게도 이런 소개가 붙을 수 있다는 것이 이상했다.","id":"rehearsal-p1","terms":["리아"]},{"type":"dialogue","speaker":"리아","text":"나는 이사도 도왔어요. 그 천국으로.","id":"rehearsal-p2","terms":["이사"]},{"type":"paragraph","text":"그녀는 배우에게 용서나 사과를 요구하지 않는다. 공연은 해석으로 남기고, 사실 안내에는 실제 행위를 적자고 제안한다. 배우는 악당 역할을 더 못된 표정으로 만드는 대신, 낙원을 좋아하면서도 반대하는 대목을 새로 연습한다.","id":"rehearsal-p3","terms":[]}]},{"id":"two-plaques","title":"설명문 두 장","blocks":[{"type":"paragraph","text":"기념관에는 두 장의 설명이 붙는다. 하나는 본편의 기록, 하나는 극의 각색 방향이다. 모든 작품이 기록과 일치해야 하는 것은 아니다. 다만 관객이 어느 종류의 이야기를 보고 있는지 알 수 있어야 한다.","id":"two-plaques-p1","terms":[]},{"type":"paragraph","text":"라잔도 자기 왕국에서 보고 싶은 버전의 공연을 본다. 그 세계에서 행복하다는 사실과 해원의 실제 기록이 다른 결론이라는 사실은 여전히 함께 남는다. 시간이 흐른다고 자동으로 하나가 되지 않는다.","id":"two-plaques-p2","terms":["라잔","해원"]}]}],"sources":[],"relations":[{"target":"synopsis","label":"실제로 있었던 이야기","reason":"무엇이 바뀌었는지 비교한다.","evidence":{"entry":"synopsis","anchor":"ending","label":"6장 · 종결하지 않은 개원식"}},{"target":"notes","label":"기록과 각색","reason":"연결이지 정답은 아니다.","evidence":{"entry":"notes","anchor":"scope","label":"본문과 자료의 범위"}}],"spoiler":true,"era":"공통력 · 개원 80년 뒤","shortTitle":"80년 뒤","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"future-offduty","title":"240년 뒤 — 신이 퇴근한 날","summary":"남에게 필요하지 않아도 괜찮은 세계를 만든 사람이, 자기 자신에게도 같은 조건을 허락할 수 있을까.","type":"future","kind":"먼 훗날의 이야기","tags":["먼 미래","에이렌","퇴근","귀환의 서"],"sections":[{"id":"habit","title":"계속 남아 있는 사람","blocks":[{"type":"paragraph","text":"만경은 오래전부터 에이렌 없이도 운영되었다. 주민은 자기 세계를 만들고, 도움이 필요하면 자율적인 여러 공동체를 택했다. 세계가 꺼지지 않게 하기 위해 그가 밤마다 주문을 외울 필요는 없었다.","id":"habit-p1","terms":["에이렌","만경"]},{"type":"paragraph","text":"그런데도 에이렌은 해원의 공개 상담 창구에 이름을 걸었다. 어떤 이는 도움을 받고, 어떤 이는 항의하고, 어떤 이는 그가 직접 들어주었다는 사실에 안심했다. 그는 쓸모를 증명할 필요 없다는 말을 남에게 건네면서, 자신이 필요 없는 날에는 조금 불안했다.","id":"habit-p2","terms":["에이렌","해원"]}]},{"id":"petition","title":"그만둘 수 없는 선한 이유","blocks":[{"type":"paragraph","text":"그가 상시 창구에서 물러나겠다고 알리자 일부 시민이 서명서를 보냈다. 강제로 남으라는 내용은 아니었다. 당신이 듣고 있다는 사실이 우리에게 큰 힘이라는 말이었다. 사실인 말이었다. 그래서 거절하기가 어려웠다.","id":"petition-p1","terms":[]},{"type":"paragraph","text":"리아는 그들의 요청을 전달하되 에이렌이 응할 의무가 있다고 적지 않았다. 그녀가 공적인 권한 행사에 대한 책임을 묻는 것과, 누군가를 영원히 쓸모 있는 사람으로 붙잡는 것은 다르기 때문이다. 아직 진행 중인 개별 책임 절차는 별도로 남는다.","id":"petition-p2","terms":["에이렌","리아"]}]},{"id":"door","title":"한 사람만 통과하지 못한 출구","blocks":[{"type":"dialogue","speaker":"리아","text":"계속하고 싶으면 해. 다만 네가 사라지면 이들이 살 수 없다고 말하지는 마.","id":"door-p1","terms":[]},{"type":"paragraph","text":"에이렌은 창구 뒤를 보았다. 다른 안내원도, 자동 응답도, 자유롭게 열 수 있는 세계도 있었다. 기다리는 사람을 버리는 것과 자신만이 기다려줄 수 있다는 자리를 내려놓는 것은 달랐다.","id":"door-p2","terms":["에이렌"]},{"type":"paragraph","text":"그는 반지를 깨뜨리지 않고 지팡이도 부러뜨리지 않았다. 권능은 모든 주민에게 남았다. 창구의 당직표에서 자기 이름만 지웠다.","id":"door-p3","terms":[]}]},{"id":"supper","title":"내일의 용건","blocks":[{"type":"paragraph","text":"저녁에 미라의 집으로 갔다. 두 사람은 원하면 몸의 나이를 조절할 수 있었고, 실제로 살아온 세월을 서로에게 설명할 필요는 없었다. 미라는 자기 얼굴보다 훨씬 오래된 냄비로 국을 데웠다.","id":"supper-p1","terms":["미라"]},{"type":"dialogue","speaker":"에이렌","text":"내일도 아무도 안 구하고 와도 돼?","id":"supper-p2","terms":[]},{"type":"dialogue","speaker":"미라","text":"응. 밥은 먹어야지.","id":"supper-p3","terms":[]},{"type":"paragraph","text":"그의 퇴근 때문에 문을 잃은 사람은 없었다. 그날 에이렌은 자신이 만든 낙원에 손님으로 들어갔다.","id":"supper-p4","terms":["에이렌"]}]},{"id":"handover","title":"인계장의 앞뒤가 바뀐다","blocks":[{"type":"paragraph","text":"에이렌은 당직 인계장에 먼저 썼다. 나는 집에 가겠소. 다음 줄에 필요한 연락처를 적었다. 메이는 오래전에 같은 문장을 맨 끝에 썼고, 도시는 그 끝을 잘라 예언으로 읽었다.","terms":["당직 인계장","에이렌","메이"],"id":"handover-p1"},{"type":"paragraph","text":"이번에는 종이를 접어도 앞문장이 보이도록 놓았다. 누가 다음에 오든 그 사람도 돌아갈 집이 있으리라는 뜻이었다. 민원함은 닫히지 않았고 주민의 세계도 꺼지지 않았다. 오늘의 당직 담당자가 바뀌었을 뿐이다.","terms":[],"id":"handover-p2"}]}],"sources":[],"relations":[{"target":"last-shift","label":"첫 번째 당직 종료","reason":"어머니와 아들이 바뀐 자리.","evidence":{"entry":"last-shift","anchor":"morning","label":"그다음 아침"}},{"target":"deep-stage","label":"소품의 변주","reason":"지팡이 대신 당직표.","evidence":{"entry":"deep-stage","anchor":"payoff","label":"떡밥의 뒷면 · 어머니의 질문"}},{"target":"deep-door","label":"문지기의 출구","reason":"나도 나갈 수 있을까.","evidence":{"entry":"deep-door","anchor":"payoff","label":"떡밥의 뒷면 · 신의 퇴근"}},{"target":"deep-fetter","label":"눈에 보이지 않는 속박","reason":"요청하지 않은 약속도 자신을 붙잡을 수 있다.","evidence":{"entry":"deep-fetter","anchor":"thread","label":"존재하지 않는 의무의 재료"}}],"spoiler":true,"era":"공통력 · 개원 240년 뒤","shortTitle":"240년 뒤","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"future-lastname","title":"2,400년 뒤 — 신의 이름을 아는 마지막 식당","summary":"만경은 창조자의 이름을 외우지 않아도 작동한다. 신화가 끝난 뒤에도 남는 것은 생활이다.","type":"future","kind":"먼 훗날","tags":[],"sections":[{"id":"guest","title":"어디서 들어본 이름","blocks":[{"type":"paragraph","text":"접수원이 손님의 이름을 한 번 되묻는다. 에이렌 베일. 듣기는 했는데 무엇을 한 사람인지 곧 떠오르지 않는다. 오래 사는 이가 많은 세계에서 옛 인물을 만나는 일 자체는 드물지 않았다. 모든 사람의 이름을 매번 역사 시험처럼 외울 수는 없었다.","terms":["에이렌 베일","에이렌"],"id":"guest-p1"},{"type":"paragraph","text":"손님은 먼저 알아보라고 요구하지 않는다. 그의 가족과 친구들은 여전히 이름을 안다. 역사에서 지워졌거나 모든 관계를 잃은 것도 아니다. 이 식당에서 그를 알아보는 것이 중요한 일이 아닐 뿐이다.","terms":[],"id":"guest-p2"}]},{"id":"menu","title":"그가 만들지 않은 낙원","blocks":[{"type":"paragraph","text":"식당 주인은 어떤 세계를 원하는지 묻고, 손님은 현재의 전망이면 좋다고 한다. 이 구역은 에이렌이 직접 설계한 적 없는 공동체다. 주민들은 다른 운영 원칙을 쓰고, 그의 옛 논쟁을 비판하는 책도 판다. 그러나 손님은 자신을 반대하는 사람들이 자신 없이 잘 살고 있다는 사실을 불쾌해하지 않는다.","terms":["에이렌"],"id":"menu-p1"},{"type":"paragraph","text":"메뉴의 잼 이름은 여전히 오늘이다. 기원을 아는 종업원도 있고 모르는 종업원도 있다. 뜻을 몰라도 음식은 먼저 나온다. 기념이 없어도 생활의 규칙으로 남은 말이다.","terms":[],"id":"menu-p2"}]},{"id":"receipt","title":"구원의 마지막 영수증","blocks":[{"type":"paragraph","text":"계산대에서 직원이 오늘 한 일이 무엇이냐고 묻지 않는다. 에이렌은 처음으로 그 질문을 자기 자신에게도 하지 않는다. 식당을 나서며 내일은 친구를 데려와도 되느냐고 묻는다.","terms":["에이렌"],"id":"receipt-p1"},{"type":"paragraph","text":"그가 남긴 가장 오래가는 업적은 우주 전체에 박힌 자신의 이름이 아니다. 자기 이름을 몰라도 누군가 편히 앉아 음식을 먹는 일이었다.","terms":[],"id":"receipt-p2"}]}],"sources":[],"relations":[{"target":"deep-nobody","label":"이름의 마지막 자리","reason":"구조 명부의 빈칸이 낯선 손님의 자리로 돌아온다.","evidence":{"entry":"deep-nobody","anchor":"payoff","label":"돌아오려면 아무도 아니어도 된다"}}],"era":"개원 2,400년 뒤","spoiler":true,"shortTitle":"2,400년 뒤","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"reference-atlas","title":"레퍼런스 지도 — 닮은 장면에서 다른 결말로","summary":"원전의 장치, 만경에서 바꾼 지점, 다시 볼 장면을 함께 읽는다. 각 방의 뒷부분에는 결말이 있다.","type":"guide","kind":"길잡이","tags":[],"sections":[{"id":"promise","title":"원전을 모르면 못 읽는 이야기는 만들지 않는다","blocks":[{"type":"paragraph","text":"이 자료집의 인물과 도시, 사건은 독립 창작이다. 참고작의 인물명·대사·기관·종말 장치를 한데 옮겨놓지 않았다. 먼저 만경의 장면을 읽고, 더 궁금할 때 그 장면을 다른 작품과 나란히 놓는 방식이다.","terms":["만경"],"id":"promise-p1"},{"type":"paragraph","text":"원전의 사실은 출처가 붙은 문단, 우리 작품의 적용은 그 다음 문단, 결말 회수는 접힌 구역으로 구별한다. 유사한 단어의 소리와 한자 겹침을 실제 어원이라고 속이지 않는다. 계속 업데이트되는 게임은 확인한 공개 버전을 적고 후속 반전까지 확인한 척하지 않는다.","terms":[],"id":"promise-p2"}]},{"id":"savior","title":"첫째 방 · 진짜 구원자와 그 주변의 신화","blocks":[{"type":"paragraph","text":"듄 → 메이의 당직 인계장과 영웅 주변의 권한. 스타레일의 페나코니·선데이 → 질서가 약한 사람을 실제로 돌보는 방식과 떠날 권리. 엠포리어스 → 영웅보다 먼저 도착한 기대와 구원의 당직을 읽는다.","terms":["당직 인계장","메이"],"id":"savior-p1"},{"type":"choice","text":"","terms":[],"label":"이 이름들이 한 사람에게 요구하는 것","options":[{"label":"예언에서 잘린 한 문장","entry":"deep-messiah"},{"label":"쉬는 날과 오늘의 잼","entry":"deep-sabbath"}],"id":"savior-p2"}]},{"id":"myth","title":"둘째 방 · 이름이 생기기 전의 신화","blocks":[{"type":"paragraph","text":"성경의 우물·바벨·만나, 프로메테우스의 불, 올림포스의 평화·질서·정의, 북유럽의 몸으로 된 세계를 서로 다른 층에 둔다. 같은 종교가 사실 모두 하나였다는 비밀 설정으로 합치지 않는다.","terms":[],"id":"myth-p1"},{"type":"choice","text":"","terms":[],"label":"사물의 뜻이 뒤집히는 곳","options":[{"label":"라하이 로이와 보는 눈","entry":"deep-well"},{"label":"불을 감싼 통신관","entry":"deep-fire"},{"label":"거인의 갈비뼈","entry":"deep-ribs"},{"label":"에이렌과 세 자매","entry":"deep-peace"}],"id":"myth-p2"}]},{"id":"self","title":"셋째 방 · 다른 나와 원하는 나","blocks":[{"type":"paragraph","text":"에반게리온 → 공동 마음이 실제로 잘 작동하는 방문기. Fate/stay night → 성공한 다른 내가 지금의 나를 대신할 수 있는가. 슈타인즈 게이트 → 편지와 시계라는 일상 물건으로 다른 삶을 읽는다.","terms":[],"id":"self-p1"},{"type":"choice","text":"","terms":[],"label":"여울의 편지 다음으로","options":[{"label":"미래의 정답지","entry":"deep-answer"},{"label":"우리라는 말의 범위","entry":"deep-chorus"}],"id":"self-p2"}]},{"id":"objects","title":"넷째 방 · 거울·서고·영수증","blocks":[{"type":"paragraph","text":"해리 포터의 거꾸로 읽는 이름, 인셉션의 감정을 붙잡는 상징, 진격의 거인의 지하 기록, 강철의 연금술사의 회복을 향한 탐색을 비교한다. 우리 장면의 물건은 국그릇·인계장·승선 명부다.","terms":[],"id":"objects-p1"},{"type":"choice","text":"","terms":[],"label":"단서를 따라 아래로","options":[{"label":"만경과 만경, 두 거울","entry":"deep-mirror"},{"label":"정전 중에도 운행합니다","entry":"deep-canon"},{"label":"등가교환 뒤의 영수증","entry":"deep-exchange"}],"id":"objects-p2"}]},{"id":"end","title":"다섯째 방 · 돌아오는 영웅, 퇴근하는 신","blocks":[{"type":"paragraph","text":"오디세우스의 귀환은 집의 의미로, 로키와 TVA의 주체성 문제는 교대 가능한 구원자로 변형한다. 처음 어벤져스에서 출발한 질문도 남는다. 더 많은 선택이 가능한 힘을 주었다면, 굳이 파괴만 가능한 척해서는 안 된다.","terms":[],"id":"end-p1"},{"type":"paragraph","text":"어벤져스의 합류 장면은 긴 저녁의 분산된 구조로 이어진다. 확인한 공개 소개와 인터뷰, 줄거리 정리의 범위는 레퍼런스 작업실에 모았다. 게임의 후속 전개와 명명 의도는 확인 범위를 넘어 확정하지 않는다.","terms":["긴 저녁","합류"],"id":"end-p2"},{"type":"choice","text":"","terms":[],"label":"끝난 뒤에도 남는 생활","options":[{"label":"아무도 아니므로 먼저 태우시오","entry":"deep-nobody"},{"label":"식탁이 두 집에 놓일 때","entry":"deep-homecoming"},{"label":"신을 묶는 실","entry":"deep-fetter"}],"id":"end-p3"}]},{"id":"giants-room","title":"여섯째 방 · 구원보다 오래 살아남은 양식","blocks":[{"type":"paragraph","text":"일곱 거인의 이름은 일곱 원전의 정답을 배정한 표가 아니다. 희년의 나팔은 배급표로, 망각의 강은 지워지지 않은 동의서로, 재난 뒤의 생명은 대피 주소록으로 바뀐다. 인물의 성공과 실패가 같은 물건의 뜻을 두 번 바꾼다.","id":"giants-room-p1","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"새 인물들의 이름 지도","entry":"names-of-giants"},{"label":"질서의 낙원과 선데이","entry":"deep-order-rest"},{"label":"아벨과 전도서의 서로 다른 구절","entry":"deep-abel"},{"label":"같은 대사가 다른 선언이 되는 이유","entry":"deep-lastwords"}],"id":"giants-room-p2"}]},{"id":"lining-room","title":"일곱째 방 · 한밤의 행동으로 읽기","blocks":[{"type":"paragraph","text":"외투 안감의 지도, 서로 다른 역에서 보이는 같은 분수, 도착하지 못한 구조 요청이 하나의 밤으로 이어진다. 여기서는 레퍼런스를 알아맞히는 대신 인물이 어떤 선택을 하는지 먼저 읽는다.","id":"lining-room-p1","terms":["안감의 지도","안감"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"소설 장면부터","entry":"lining-opening"},{"label":"18개 레퍼런스의 확인 범위","entry":"reference-workshop"},{"label":"복선·복선, 두 가지 선","entry":"deep-lining"}],"id":"lining-room-p2","terms":[]}]}],"sources":[],"relations":[{"target":"synopsis","label":"전체 결말 보기","reason":"이 연결들이 실제 사건에서 어떻게 만나는지 읽는다.","evidence":{"entry":"synopsis","anchor":"ending","label":"종장 · 성녀가 먼저 집에 간 밤"}}],"shortTitle":"레퍼런스 지도","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-peace","title":"에이렌 — 평화의 이름에는 자매가 있다","summary":"이름 하나를 열면, 도시 밑의 세 척의 배가 같이 보인다.","type":"deep","kind":"겹쳐 읽기","tags":["이름","그리스 신화","세 배"],"sections":[{"id":"word","title":"현실 자료 · 에이레네","blocks":[{"type":"paragraph","text":"헤시오도스의 『신통기』에는 에우노미아, 디케, 에이레네가 함께 나온다. 해당 번역은 이들을 각각 질서, 정의, 평화로 풀이한다. 에이렌이라는 창작 이름은 그중 Eirene를 연상하도록 정했다.","citation":"hesiod","id":"word-p1","terms":["에이렌"]}]},{"id":"story","title":"작중 유래 · 구조선의 이름을 받은 아이","blocks":[{"type":"paragraph","text":"해원의 구조선 셋은 그 이름을 따랐고, 미라는 생활선을 기억하며 아들의 이름을 에이렌으로 줄여 불렀다. 에이렌의 신념이 이름 때문에 운명으로 정해진 것은 아니다. 먼저 이름이 있었고, 사람이 어떤 삶을 살아 그 이름을 다시 읽게 하는지가 이야기다.","id":"story-p1","terms":["에이렌","미라","해원"]},{"type":"paragraph","text":"리듬은 도시의 배치에도 남는다. 질서의 배 위에는 공헌청, 정의의 배 위에는 기록실, 평화의 배 위에는 등대동 식탁이 있다. 평화만 있으면 질문이 사라지고, 정의만 있으면 삶이 재판으로 남고, 질서만 있으면 순서가 신분이 될 수 있다. 이는 신화 원전의 교훈이라는 주장이 아니라 이 작품이 붙인 독법이다.","id":"story-p2","terms":["공헌청","등대동"]}]},{"id":"payoff","title":"떡밥의 뒷면 · 마지막 선언의 상대","blocks":[{"type":"paragraph","text":"에이렌이 리아를 악의 편이라고 부르지 않는 이유를 세 배의 이름이 미리 예고한다. 평화가 정의를 제거해서 이기는 구도가 아니라, 같은 구조의 역사에서 갈라진 요구들이 서로의 앞길을 검토한다.","id":"payoff-p1","terms":["에이렌","리아"]},{"type":"paragraph","text":"이 연결을 몰라도 본편은 읽힌다. 알고 다시 보면 기록실로 걸어가는 에이렌이 평화의 배에서 정의의 배로 건너가는 장면이 된다.","id":"payoff-p2","terms":["에이렌"]}],"reveal":true}],"sources":[{"id":"hesiod","title":"헤시오도스 · 신통기, 901행 부근","url":"https://www.theoi.com/Text/HesiodTheogony.html","locator":"Theoi에 수록된 원전 번역. Eunomia·Dike·Eirene의 이름과 병렬 관계 확인. 도시와 인물의 대응은 본 작품의 창작이다."}],"relations":[{"target":"fleet","label":"처음 심은 곳","reason":"세 배의 이름.","evidence":{"entry":"fleet","anchor":"night","label":"개원 172년 전 · 불이 꺼진 항로"}},{"target":"last-scene","label":"다시 돌아오는 곳","reason":"평화가 정의 앞에 앉다.","evidence":{"entry":"last-scene","anchor":"line","label":"마지막 선언"}}],"spoiler":false,"shortTitle":"에이렌","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-names","title":"만경·서안·베일 — 이름을 뒤집어 읽기","summary":"확인되는 낱말, 작중 작명, 독자의 연상을 따로 적는다.","type":"deep","kind":"겹쳐 읽기","tags":["이름","한자","소품"],"sections":[{"id":"mirrors","title":"만경 · 萬景와 萬鏡","blocks":[{"type":"paragraph","text":"만경의 공식 작중 표기는 萬景, 수많은 풍경이다. 사람들은 거울처럼 갈라진 삶을 보며 萬鏡이라고도 쓴다. 둘은 작가가 부여한 동음 표기다. 실제 지명의 어원이나 고전의 정설을 가져온 것은 아니다.","id":"mirrors-p1","terms":["만경"]},{"type":"paragraph","text":"풍경은 내가 바라보는 것이고, 거울은 나를 되돌아보게 하는 것이다. 나래가 여울의 편지를 읽는 순간 낙원은 아름다운 풍경만이 아니라 자기와 닮았지만 자기 뜻대로 움직이지 않는 거울이 된다.","id":"mirrors-p2","terms":["나래","여울"]}]},{"id":"desk","title":"서안 · 이름과 책상","blocks":[{"type":"paragraph","text":"서안(書案)은 책을 읽거나 글씨를 쓰는 데 쓰인 전통 책상이다. 문화포털의 유물 설명에서 이 용례를 확인할 수 있다. 인물 서안의 이름을 반드시 그 한자로 짓고 태어났다는 설정은 아니다. 소리의 겹침을 소품으로 옮겼다.","citation":"desk","id":"desk-p1","terms":["서안(書案)","서안"]},{"type":"paragraph","text":"본편에서 리아가 문서를 쓰는 낮은 책상과 서안이 악보를 두는 작은 책상은 닮아 있다. 누나의 문서는 사건을 끝내려 하고, 동생의 악보는 아직 다음 마디가 없어도 놓일 자리가 있다. 같은 이름의 가구가 둘의 다른 시간을 담는다.","id":"desk-p2","terms":["리아","서안"]}]},{"id":"veil","title":"베일 · 덮어주기와 가리기","blocks":[{"type":"paragraph","text":"베일이라는 성에는 몸을 덮는 천과 사실을 가린다는 한국어 표현의 겹침을 의도했다. 이것은 성씨의 실제 어원이 확인되었다는 주장이 아니다. 에이렌의 배려는 추위를 막아주기도 하지만, 누군가 아직 말하고 싶은 상처를 너무 빨리 덮기도 한다.","id":"veil-p1","terms":["에이렌"]},{"type":"paragraph","text":"리아 센의 이름 전체는 창작명이다. 센 사람이라는 한국어 연상을 덧붙여 읽을 수는 있어도, 철학자나 특정 언어에서 비롯됐다는 숨은 전기를 꾸며내지는 않는다.","id":"veil-p2","terms":["리아 센","리아"]}]},{"id":"payoff","title":"떡밥의 뒷면 · 같은 이름에서 다른 이름으로","blocks":[{"type":"paragraph","text":"여울이 자기 이름을 고르는 순간, 나래의 다른 판본이라는 소개만으로 살지 않겠다는 뜻이 생긴다. 물길의 이미지는 분기와 재회를 연결하지만 용서하는 것이 반드시 더 멀리 흘러간 상태라는 서열은 아니다.","id":"payoff-p1","terms":["나래","분기","여울"]},{"type":"paragraph","text":"한 이름에 하나의 운명을 배정하지 않는 것이 이 작명의 핵심이다. 숨은 뜻을 찾는 재미가 인물을 가두는 열쇠가 되지는 않아야 한다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"desk","title":"문화포털 · 서안(書案), 3D 프린팅 콘텐츠","url":"https://www.culture.go.kr/portal/cltKnw/trd3dData/userView.do?menuNo=200062&seq=3001096","locator":"서안의 용도에 대한 공공기관 유물 설명. 인물 이름과 책상에 대한 연결은 본 작품의 언어유희."}],"relations":[{"target":"seoan","label":"이름의 사람","reason":"완성을 요구하지 않는 악보.","evidence":{"entry":"seoan","anchor":"music","label":"쉼표 다음에는 반드시 연주해야 할까"}},{"target":"prologue","label":"거울이 된 풍경","reason":"자기 글씨의 편지.","evidence":{"entry":"prologue","anchor":"envelope","label":"첫 문장"}}],"spoiler":false,"shortTitle":"만경·서안·베일","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-jam","title":"오늘의 잼 — 내일만 주는 친절에 대하여","summary":"잼 병 하나가 회복원의 시간표와 서안의 악보를 연결한다.","type":"deep","kind":"겹쳐 읽기","tags":["말장난","앨리스","잼","음악"],"sections":[{"id":"reference","title":"현실 자료 · 두 여왕의 다른 말","blocks":[{"type":"paragraph","text":"루이스 캐럴의 『거울 나라의 앨리스』에서 흰 여왕은 어제와 내일의 잼은 있지만 오늘의 잼은 없다고 말한다. 같은 책의 붉은 여왕 장면에서는 열심히 달려도 같은 자리에 머무는 상황이 나온다. 잼을 말한 여왕과 달리기를 말한 여왕은 다르다.","citation":"carroll","id":"reference-p1","terms":["오늘의 잼"]}]},{"id":"meal","title":"작중 연결 · 회복원이 빼앗은 오늘","blocks":[{"type":"paragraph","text":"해원의 시민은 승급하려고 계속 달리고, 회복원에서는 잘 쉰 뒤 미래의 역할로 돌아가야 한다. 그러나 현재의 휴식 자체는 목적이 되기 어렵다. 그래서 등대동의 식탁은 잼을 먼저 낸다. 오늘 무언가를 이루었는지 확인한 뒤 주지 않는다.","id":"meal-p1","terms":["등대동","회복원","해원"]},{"type":"paragraph","text":"원작에 있던 잼을 그대로 숨겨놓는 데서 멈추지 않는다. 병의 이름이 서안의 곡 제목 ‘오늘’로 이어지고, 미래에는 에이렌이 당직 없는 하루를 먹는 식탁으로 돌아온다.","id":"meal-p2","terms":["에이렌","서안"]}]},{"id":"payoff","title":"떡밥의 뒷면 · 쉼표를 듣는 사람들","blocks":[{"type":"paragraph","text":"마지막 장면의 긴 쉼표에서 청중은 서안에게 빨리 다음 음을 내놓으라고 요구하지 않는다. 쉼을 다음 성과의 준비 시간으로만 듣지 않게 된 것이다. 이것은 곡이 영원히 미완성이어야 한다는 뜻이 아니다. 다음 음을 낼지, 언제 낼지는 연주자가 정한다.","id":"payoff-p1","terms":["서안"]},{"type":"paragraph","text":"첫 장면의 잼, 중반의 휴식 사유 “좋아서”, 마지막의 쉼표를 함께 읽으면 논쟁의 결론이 음식과 음악 속에 작게 남아 있다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"carroll","title":"Lewis Carroll · Through the Looking-Glass","url":"https://www.gutenberg.org/files/12/12-h/12-h.htm","locator":"Project Gutenberg 원문. 2장 붉은 여왕의 달리기, 5장 흰 여왕의 잼. 본편의 식탁과 음악은 별도의 창작."}],"relations":[{"target":"haewon","label":"처음 심은 곳","reason":"잼을 먼저 내는 식탁.","evidence":{"entry":"haewon","anchor":"food","label":"오늘의 잼"}},{"target":"last-scene","label":"다시 돌아오는 곳","reason":"청중이 들은 쉼표.","evidence":{"entry":"last-scene","anchor":"line","label":"마지막 선언"}}],"spoiler":false,"shortTitle":"오늘의 잼","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-door","title":"문지기 — 누구를 위해 문이 열려 있는가","summary":"친절한 사람이 문을 막고 있다는 점에서 시작해, 그 사람도 문을 나설 수 있는가로 돌아온다.","type":"deep","kind":"겹쳐 읽기","tags":["카프카","문","퇴근"],"sections":[{"id":"reference","title":"현실 자료 · 법 앞에서","blocks":[{"type":"paragraph","text":"카프카의 『소송』 9장에는 법으로 들어가려는 사람과 문지기의 이야기가 들어 있다. 문은 열려 있지만 허락은 계속 미뤄진다. 마지막에는 그 입구가 그 사람만을 위한 것이었다는 말이 나온다.","citation":"kafka","id":"reference-p1","terms":[]}]},{"id":"difference","title":"작중 변주 · 환자의 문이 아닌 심사관의 문","blocks":[{"type":"paragraph","text":"회복원의 문이 무서운 것은 쇠문이어서만이 아니다. 친절한 에이렌이 “다음 심사에서는”이라고 말하고, 시민이 그 말을 믿기 때문이다. 만경은 문지기가 더 착해지는 해법보다 떠나기 위한 허가를 없애는 해법을 택한다.","id":"difference-p1","terms":["에이렌","회복원","만경"]},{"type":"paragraph","text":"하지만 에이렌 자신은 모두의 말을 계속 들어야 한다는 자리에 오래 남는다. 남을 위한 문을 연 사람이, 자기 역할을 내려놓는 문 앞에서는 허락을 구한다.","id":"difference-p2","terms":["에이렌"]}]},{"id":"payoff","title":"떡밥의 뒷면 · 신의 퇴근","blocks":[{"type":"paragraph","text":"240년 뒤 그는 세계를 파괴하지 않고 당직표에서 이름을 뺀다. 문을 지키는 일이 그의 의무이자 자아였다는 점에서, 오래전 문지기 이야기를 반대 방향으로 이어 쓰는 장면이다.","id":"payoff-p1","terms":[]},{"type":"paragraph","text":"카프카의 원작이 이런 결말을 뜻한다는 주장은 아니다. 원작의 질문을 빌려 이 작품의 인물에게 다른 출구를 열어보는 변주다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"kafka","title":"Franz Kafka · The Trial, Chapter Nine","url":"https://www.gutenberg.org/cache/epub/7849/pg7849-images.html","locator":"Project Gutenberg 영어 번역. 문지기 우화 확인. 해석을 원작의 단일한 정답으로 제시하지 않는다."}],"relations":[{"target":"recovery","label":"처음 심은 곳","reason":"다음 심사의 문.","evidence":{"entry":"recovery","anchor":"gate","label":"퇴소 기준이 바뀐 순간"}},{"target":"future-offduty","label":"다시 돌아오는 곳","reason":"자기 출구를 통과한다.","evidence":{"entry":"future-offduty","anchor":"door","label":"한 사람만 통과하지 못한 출구"}}],"spoiler":false,"shortTitle":"문지기","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-forgive","title":"용서·무죄·동의 — 같은 도장을 찍지 않는 이유","summary":"편지의 첫 문장과 마지막 서명을 함께 읽어야 한다.","type":"deep","kind":"겹쳐 읽기","tags":["대명사","서명","편지"],"sections":[{"id":"three","title":"이야기 속 세 단어","blocks":[{"type":"paragraph","text":"여울은 용서한다고 말한다. 심판관들은 라잔의 책임을 인정한다. 라잔은 심판의 권한에 동의하지 않는다. 세 문장은 동시에 참일 수 있다. 한 단어가 다른 단어를 자동으로 지우는 구조가 아니다.","id":"three-p1","terms":["라잔","여울"]},{"type":"paragraph","text":"등대동의 개별 구제에서는 이 구별이 무너졌다. 도움을 받았다는 사실이 제도를 문제 삼지 않겠다는 서명으로 바뀌었다. 미결 우체국은 그래서 도착, 열람, 동의의 도장을 나눠둔다.","id":"three-p2","terms":["미결 우체국","등대동"]}]},{"id":"pronoun","title":"누가 말한 우리인가","blocks":[{"type":"paragraph","text":"“나는 용서합니다”에서 “우리는 용서했습니다”로 바뀌면 단어 하나만 달라진 것 같지만 화자가 늘어난다. 여울의 편지는 자신의 감정을 말할 권리만 가진다. 자기와 같은 과거를 가진 나래까지 대표하지는 않는다.","id":"pronoun-p1","terms":["나래","여울"]},{"type":"paragraph","text":"반대로 리아가 모든 피해자의 정의를 말한다며 여울을 제외해도 같은 문제가 생긴다. “우리”를 지키는 일은 모두를 같은 말로 묶는 일이 아니라, 누가 그 우리에 어떤 범위로 동의했는지 살피는 일이 된다.","id":"pronoun-p2","terms":["리아","여울"]}]},{"id":"payoff","title":"떡밥의 뒷면 · 대표를 정하지 않는 두 의자","blocks":[{"type":"paragraph","text":"끝의 증언석이 두 개인 이유는 하나가 가짜라서 검증하려는 것이 아니다. 같은 과거에서 갈라진 두 사람이 지금은 서로의 말에 서명할 수 없기 때문이다.","id":"payoff-p1","terms":[]},{"type":"paragraph","text":"이후 나래가 대기 서랍을 닫아도 라잔의 무죄가 되지 않는다. 한 통의 편지로 시작한 이야기는 끝까지 그 편지가 할 수 있는 일의 범위를 지킨다.","id":"payoff-p2","terms":["나래","라잔"]}],"reveal":true}],"sources":[],"relations":[{"target":"act-one","label":"첫 등장","reason":"세 도장.","evidence":{"entry":"act-one","anchor":"arrival","label":"세 도장"}},{"target":"act-three","label":"회수 장면","reason":"세 의자.","evidence":{"entry":"act-three","anchor":"empty","label":"세 개의 의자"}}],"spoiler":false,"shortTitle":"용서·무죄·동의","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-carrier","title":"식탁과 봉투 — 칼 없이 이야기를 들고 가기","summary":"반송 봉투가 무기보다 오래 남는 이유.","type":"deep","kind":"겹쳐 읽기","tags":["르 귄","소품","식탁"],"sections":[{"id":"reference","title":"현실 자료 · 이야기를 담는 그릇","blocks":[{"type":"paragraph","text":"르 귄의 『The Carrier Bag Theory of Fiction』 공식 소개는 문명의 도구를 무기만으로 보지 않고, 채집과 운반을 위한 용기에서 이야기를 생각하는 관점을 설명한다. 이 작품에서는 사람과 기억을 함께 담는 사물을 설계하는 참고점으로 삼았다.","citation":"leguin","id":"reference-p1","terms":[]}]},{"id":"props","title":"작중 사물 · 같은 기능의 네 가지 물건","blocks":[{"type":"paragraph","text":"구조선은 사람을 담고, 식탁은 함께 있을 시간을 담고, 봉투는 아직 도착하지 않은 말을 담고, 낮은 책상은 완성되지 않은 글을 담는다. 모두 무언가를 한 방향으로 찌르는 도구보다 남겨두고 운반하는 물건이다.","id":"props-p1","terms":[]},{"type":"paragraph","text":"그렇다고 이 물건들이 자동으로 선한 것은 아니다. 배는 승선 순서를 신분으로 만들 수 있고, 식탁의 주인은 누가 앉을지 고를 수 있으며, 봉투는 접수되지 않은 채 되돌아올 수 있다. 담는 사람이 무엇을 밖에 남겼는지가 사건을 만든다.","id":"props-p2","terms":[]}]},{"id":"payoff","title":"떡밥의 뒷면 · 찢어진 봉투의 역할","blocks":[{"type":"paragraph","text":"리아가 반송 봉투를 붙이는 이유는 물건이 유일한 진실의 증거라서가 아니다. 자기 서명으로 닫힌 절차를 손으로 다시 여는 모습이 필요하기 때문이다. 전능한 세계에서도 사람은 어떤 동작을 통해 자기 선택을 감당하고 싶은지 고를 수 있다.","id":"payoff-p1","terms":["반송 봉투","리아"]},{"type":"paragraph","text":"마지막에 그녀가 판정문보다 도장을 먼저 정리하는 장면은, 이긴 말을 보관하는 것만큼 다음 사람의 말을 어떻게 받을지 중요해졌다는 작은 신호다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"leguin","title":"Ursula K. Le Guin · The Carrier Bag Theory of Fiction","url":"https://www.ursulakleguin.com/the-carrier-bag-theory-of-fiction","locator":"작가 공식 사이트의 소개. 본문의 식탁·봉투·도장 연결은 만경의 독자적인 창작."}],"relations":[{"target":"fleet","label":"구조선","reason":"이름보다 먼저 사람을 담는다.","evidence":{"entry":"fleet","anchor":"manifest","label":"명부의 첫 번째 빈칸"}},{"target":"postoffice","label":"봉투","reason":"답하지 않은 말도 담는다.","evidence":{"entry":"postoffice","anchor":"word","label":"미결은 미완성이 아니다"}}],"spoiler":false,"shortTitle":"식탁과 봉투","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-copies","title":"나중의 나는 정답지가 아니다","summary":"갈라진 인격을 복사본이라고 부를 때 무엇을 놓치는가.","type":"deep","kind":"겹쳐 읽기","tags":["그렉 이건","분기","자아"],"sections":[{"id":"reference","title":"현실 자료 · Permutation City","blocks":[{"type":"paragraph","text":"그렉 이건의 『Permutation City』 공식 시놉시스에는 실험에 참여하는 복사 인격들이 등장하며, 그들이 실험에서 빠져나가고 싶어 하는 문제가 제시된다. 복사된 존재에게도 자신의 의사가 있다는 설정을 생각할 수 있는 비교점이다.","citation":"egan","id":"reference-p1","terms":[]}]},{"id":"difference","title":"작중 차이 · 오래 산 나를 판사로 세우지 않는다","blocks":[{"type":"paragraph","text":"여울은 나래의 정답지가 아니다. 이백 년은 더 많은 경험이지 나래의 현재 의사를 무효로 만드는 자격증이 아니다. 라잔을 용서한 미래가 실제로 존재한다는 사실로, 용서하지 않는 삶이 실패라고 결론 낼 수 없다.","id":"difference-p1","terms":["나래","라잔","여울"]},{"type":"paragraph","text":"한편 꿈배역은 독립된 의식이 없는 체험 속 배역이다. 나래와 여울처럼 경험하고 판단하는 새갈래와 혼동하면 핵심 장면이 무너진다. 본편의 두 의자는 둘 다 실제 당사자에게 주어진다.","id":"difference-p2","terms":["꿈배역","새갈래","나래","여울"]}]},{"id":"payoff","title":"떡밥의 뒷면 · 소금이 알려주는 것","blocks":[{"type":"paragraph","text":"두 사람이 같은 국의 간을 다르게 느끼는 장면은 더 현명한 나와 덜 현명한 나의 대결을 잠깐 멈춘다. 같은 기억에서 출발해도 지금의 감각과 선호는 다를 수 있다.","id":"payoff-p1","terms":[]},{"type":"paragraph","text":"이 작은 차이를 받아들이는 방식이 큰 차이를 대하는 방식을 예고한다. 상대가 틀린 증인이 아니어도 자신과
