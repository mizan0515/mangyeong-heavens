투의 세 안감이 연결된다. 이사는 영웅을 기다리는 배역이 아니라 자기도 돌아가려던 사람이다.","id":"olympus-p2","terms":["이사","안감"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"deep-lining"}],"id":"olympus-p3","terms":[]}]},{"id":"odyssey","title":"오디세우스 이야기","blocks":[{"type":"paragraph","text":"직조로 강요된 결말을 늦추는 페넬로페와 귀환을 확인하는 사물.","citation":"odyssey","id":"odyssey-p1","terms":[]},{"type":"paragraph","text":"이사의 시침과 다온의 식탁. 과거를 알아본다고 지금 가족의 자리를 되찾을 권리까지 생기지는 않는다.","id":"odyssey-p2","terms":["이사","다온"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"future-home"}],"id":"odyssey-p3","terms":[]}]},{"id":"prometheus","title":"프로메테우스","blocks":[{"type":"paragraph","text":"불과 그것을 운반한 구체적인 물건을 함께 본다.","citation":"hesiod","id":"prometheus-p1","terms":[]},{"type":"paragraph","text":"프로네의 공개 기술은 이후 다른 작업자의 손으로 구조에 쓰인다. 한 발명가의 이름만 결승 장면에 남지 않는다.","id":"prometheus-p2","terms":["프로네"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"lining-crossing"}],"id":"prometheus-p3","terms":[]}]},{"id":"norse","title":"북유럽 신화","blocks":[{"type":"paragraph","text":"펜리르를 묶기 위해 보증을 내놓는 티르의 전승.","citation":"norse","id":"norse-p1","terms":[]},{"type":"paragraph","text":"리브의 주소록, 사벨의 위임된 외투. 자기 명예를 담보로 한 약속이 남의 의사까지 대신하지는 않는다.","id":"norse-p2","terms":["사벨","리브"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"deep-arrivals"}],"id":"norse-p3","terms":[]}]},{"id":"avengers","title":"어벤져스","blocks":[{"type":"paragraph","text":"2019년 엔드게임의 합류 장면에 관한 2차 제작 정리.","citation":"avengers","id":"avengers-p1","terms":["합류"]},{"type":"paragraph","text":"앞서 알던 기술·손·주소가 실제 대피를 완성한다. 행렬은 합류한 다음 각자 원하는 집으로 갈라진다.","id":"avengers-p2","terms":["합류"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"연결된 장면 / 해설","entry":"lining-crossing"}],"id":"avengers-p3","terms":[]}]},{"id":"loki","title":"로키 · TVA","blocks":[{"type":"paragraph","text":"보존한다고 말하는 체계가 어떤 갈래를 고르는지 본다. 시즌2 정리와 배우 인터뷰의 범위를 구별한다.","ci function help(){$('#main').innerHTML=`<div class="page">${pageHeading('읽기 안내','길을 잃지 않고, 깊이 읽기.')}<div class="faq"><details open><summary>어디서 시작하나요?</summary><p>처음이라면 「귀환의 서」의 서장부터 시작합니다. 본편은 8개 장면입니다. 「안감의 지도」는 외전, 「거인들의 유언」은 장면과 역사 기록을 함께 읽는 인물 연작, 「낙원 이후」는 독립된 후일담입니다.</p></details><details><summary>단어를 누른 뒤 어떻게 돌아오나요?</summary><p>짧은 설명창을 닫거나 Escape를 누르면 같은 단어로 돌아갑니다. 자세한 기록으로 이동해도 상단의 ‘읽던 장면’에서 이어 읽을 수 있습니다. 뒤로 가기 역시 지원합니다.</p></details><details><summary>스포일러 보호는 어떤 방식인가요?</summary><p>처음에는 기본 뜻과 본편만 공개합니다. 상세 생애·다른 이야기·해설은 읽기 전에 안내합니다. 본편의 모든 장면에 읽음 표시를 하면 연결된 일반 기록을 열 수 있습니다. 먼저 읽고 싶다면 기록 하나 또는 이야기 하나만 따로 공개해도 됩니다. 설정에서 전체 공개를 선택할 수도 있습니다. 이는 비밀 정보의 보안 장치가 아니라 독서를 위한 안내입니다.</p></details><details><summary>§는 무엇인가요?</summary><p>문서 안의 구역입니다. 문단을 읽다가 ‘구역 주소’를 복사하면 그 근처 구역으로 다시 올 수 있습니다. 로컬 파일의 주소는 공개 인터넷 주소가 아니며, 다른 기기에서는 같은 파일이 있어야 열립니다.</p></details><details><summary>읽기 기록은 어디에 저장되나요?</summary><p>이 브라우저의 저장 공간에만 남습니다. 로그인이나 서버 전송은 없습니다. 저장이 막힌 환경에서도 읽기는 가능하지만 창을 닫은 뒤 기록이 사라질 수 있습니다. ‘내 기록’에서 JSON으로 옮길 수 있습니다.</p></details><details><summary>이야기에 포함된 내용</summary><p>과거의 강제 수용, 강제 치료, 집단 살해와 상실을 다룹니다. 낙원의 삶이나 환상의 행복을 열등하게 취급하지 않습니다. 편안한 하루를 선택하는 인물도, 함께 책임을 묻는 인물도 나옵니다.</p></details><details><summary>기록과 해설은 어떻게 구분하나요?</summary><p>장면은 인물이 사는 이야기입니다. 세계·인물 기록은 그 배경 설명입니다. 깊게 읽기는 이름·소품·원전과의 연결을 해석하는 별도 글입니다. 원전에서 확인한 내용과 이 작품의 변형은 구별하고, 문서 끝에 출처를 남깁니다.</p></details></div><div class="warning">${link('처음 만나는 세계',entryHref('start'),'text-link')} · ${link('본편 목차',href('book',{path:'main'}),'text-link')} · ${link('설정 기준과 질문',entryHref('questions'),'text-link')}</div></div>`;}

async function importNotes(file){
 if(!file||file.size>2_000_000)return toast('2MB 이하의 읽기 기록 JSON을 골라 주세요.');
 try{
  const d=JSON.parse(await file.text());
  if(d.format!=='mangyeong-reading'||d.version!==1||!d.preferences||typeof d.preferences!=='object'||Array.isArray(d.preferences))throw Error('format');
  const s=d.preferences;
  for(const k of ['done','bookmarks','opened'])if(Array.isArray(s[k]))prefs[k]=[...new Set([...prefs[k],...s[k].filter(x=>typeof x==='string'&&entries.has(x))])];
  if(Array.isArray(s.pathAccess))prefs.pathAccess=[...new Set([...prefs.pathAccess,...s.pathAccess.filter(x=>paths.has(x))])];
  if(s.positions&&typeof s.positions==='object'&&!Array.isArray(s.positions)){
   for(const [k,pos] of Object.entries(s.positions)){
    const [id,path,...extra]=k.split('|');
    if(extra.length||!entries.has(id)||(path&&!P(path)?.entries.includes(id))||!pos||typeof pos!=='object')continue;
    const number=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)?Math.min(max,Math.max(min,v)):0;
    prefs.positions[k]={anchor:typeof pos.anchor==='string'?pos.anchor.slice(0,200):'',top:number(pos.top,-10000,10000),scroll:number(pos.scroll,0,2000000),focus:''};
   }
  }
  if(s.lastScene&&typeof s.lastScene==='object'&&P(s.lastScene.path)?.entries.includes(s.lastScene.entry))prefs.lastScene={entry:s.lastScene.entry,path:s.lastScene.path};
  // Do not silently turn off spoiler protection or replace display preferences on import.
  save();render();toast('책갈피와 읽던 위치를 합쳤습니다. 공개 범위 설정은 유지했습니다.');
 }catch{toast('이 자료집에서 내보낸 읽기 기록인지 확인해 주세요.');}
}

 if(a==='show-clues'){showDialog('단서 목록 공개','질문에도 반전이 담길 수 있습니다.',`<p>단서의 이름과 질문, 펼친 해설에는 아직 읽지 않은 사건이 나옵니다.</p><div class="dialog-foot"><button class="button" data-action="close-dialog">지금은 돌아가기</button><button class="primary-button" data-action="confirm-clues">목록만 공개</button></div>`);return;}
 if(a==='confirm-clues'){closeDialog(false);$('.empty-state').outerHTML=clueCards();return;}
 if(a==='bookmark'){if(prefs.bookmarks.includes(route.entry))prefs.bookmarks=prefs.bookmarks.filter(x=>x!==route.entry);else prefs.bookmarks.push(route.entry);save();updateLnbBookmarks();button.setAttribute('aria-pressed',String(prefs.bookmarks.includes(route.entry)));button.textContent=prefs.bookmarks.includes(route.entry)?'책갈피 저장됨':'책갈피';toast('책갈피를 변경했습니다.');return;}
 if(a==='finish'){markDone();snapshot();const next=button.dataset.next,path=button.dataset.path;if(next)go(entryHref(next,path));else{go(href('book',{path}));toast('이야기의 마지막 장면에 읽음 표시를 남겼습니다.');}return;}
 if(a==='mark'){markDone();toast('읽은 기록으로 표시했습니다.');return;}
 if(a==='return-scene'){go(sceneLink(),{restore:true});return;}
 if(a==='size'||a==='leading'||a==='theme'){if(a==='size')prefs.size=Number(button.dataset.size);if(a==='leading')prefs.leading=Number(button.dataset.leading);if(a==='theme')prefs.theme=button.dataset.theme;applyPrefs();save();button.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));return;}
 if(a==='query'){searchQuery=button.dataset.query;$('#global-search').value=searchQuery;updateSearch();$('#global-search').focus();return;}
 if(a==='definition'){termDialog(button.dataset.term,true);return;}
 if(a==='search-back'){searchDialog(true);return;}
 if(a==='clear-search'){searchQuery='';$('#catalog-search').value='';updateCatalog();$('#catalog-search').focus();return;}
 if(a==='export-notes')return exportNotes();if(a==='import-notes')return $('#notes-file').click();
});
document.addEventListener('input',ev=>{if(ev.target.id==='global-search'){searchQuery=ev.target.value;updateSearch();}if(ev.target.id==='catalog-search'){searchQuery=ev.target.value;updateCatalog();}});
document.addEventListener('change',ev=>{if(ev.target.id==='catalog-type'){catalogFilter=ev.target.value;updateCatalog();}if(ev.target.id==='notes-file')importNotes(ev.target.files[0]);});
document.addEventListener('keydown',ev=>{
 if(drawerOpen&&!wideNavigation.matches){if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closeDrawer();return;}if(ev.key==='Tab'){trapLnbFocus(ev);return;}}
 // Search inputs consume Escape to clear text in some browsers. Close our modal first.
 if(ev.key==='Escape'&&$('#reader-dialog').open){ev.preventDefault();ev.stopPropagation();closeDialog();return;}
 if(ev.key==='/'&&!ev.ctrlKey&&!ev.metaKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!$('#reader-dialog').open){ev.preventDefault();searchDialog();}
},true);
window.addEventListener('scroll',()=>{updateProgress();if(!lnbScrollFrame)lnbScrollFrame=requestAnimationFrame(()=>{updateLnbLocation();lnbScrollFrame=0;});clearTimeout(scrollTimer);scrollTimer=setTimeout(snapshot,220);},{passive:true});
window.addEventListener('pagehide',snapshot);
window.addEventListener('popstate',()=>{closeDrawer(false);closeDialog(false);render({restore:true});});
window.addEventListener('hashchange',()=>{if(location.hash!==activeHash){closeDrawer(false);closeDialog(false);render();}});
// Expose narrow inspection hooks for local verification, not an editor or network API.
window.MANGYEONG_READER={version:1,getState:()=>JSON.parse(JSON.stringify(prefs)),getRoute:()=>({...route}),paths:X.paths,canRead:id=>canRead(E(id))};
try{history.scrollRestoration='manual';}catch{}
const measureHeader=()=>document.documentElement.style.setProperty('--header-height',$('.site-header').getBoundingClientRect().height+'px');
new ResizeObserver(measureHeader).observe($('.site-header'));
wideNavigation.addEventListener('change',()=>{const hadFocus=$('#site-lnb').contains(document.activeElement);drawerOpen=false;applyLnb();if(hadFocus&&$('#site-lnb').hidden)$('#lnb-toggle').focus({preventScroll:true});});
applyPrefs();measureHeader();render({restore:true});
})();
