 다른 결론을 말할 수 있다는 것이다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"egan","title":"Greg Egan · Permutation City, official synopsis","url":"https://www.gregegan.net/PERMUTATION/Permutation.html","locator":"저자 공식 시놉시스. 만경의 백지와 꿈배역은 이 작품과 별개의 판타지 전제다."}],"relations":[{"target":"yeoul","label":"등장인물","reason":"다른 삶에서 온 사람.","evidence":{"entry":"yeoul","anchor":"years","label":"이백 년을 한 문장으로 줄이지 않기"}},{"target":"act-two","label":"장면으로 확인","reason":"국의 간.","evidence":{"entry":"act-two","anchor":"nara","label":"소금 한 숟갈"}}],"spoiler":false,"shortTitle":"나중의 나는 정답지가 아니다","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-stage","title":"신의 마지막 소품은 지팡이가 아니다","summary":"퇴근 도장으로 바꾸어 읽는 『템페스트』의 마법 포기.","type":"deep","kind":"겹쳐 읽기","tags":["셰익스피어","템페스트","후일담"],"sections":[{"id":"reference","title":"현실 자료 · 마법의 책과 지팡이","blocks":[{"type":"paragraph","text":"셰익스피어의 『템페스트』 5막 1장에서 프로스페로는 자신의 마법을 포기하고 지팡이와 책을 버리겠다고 말한다. 강력한 존재가 통제의 수단을 내려놓는 장면으로 읽을 수 있다.","citation":"tempest","id":"reference-p1","terms":[]}]},{"id":"prop","title":"작중 변주 · 권능을 파괴하지 않는다","blocks":[{"type":"paragraph","text":"에이렌이 지팡이를 부러뜨려 모든 낙원을 없애면, 자신의 성장을 위해 주민들의 삶을 다시 인질로 잡는 결말이 된다. 이 작품은 그의 마법이 아니라 ‘내가 계속 구해야 한다’는 자리를 내려놓게 한다.","id":"prop-p1","terms":["에이렌"]},{"type":"paragraph","text":"그 때문에 훗날의 중요한 물건은 권능의 보석이 아니라 당직표다. 다른 사람에게도 창조권이 있고, 생활의 안전은 한 사람의 희생적인 성실함에 의존하지 않는다.","id":"prop-p2","terms":["창조권"]}]},{"id":"payoff","title":"떡밥의 뒷면 · 어머니의 질문","blocks":[{"type":"paragraph","text":"마지막 당직을 끝낸 미라에게 에이렌은 새 역할을 찾아주려 했다. 240년 뒤 자기 차례가 되었을 때에는 미라가 새 역할 대신 저녁을 내준다. 두 장면의 위치가 뒤바뀐다.","id":"payoff-p1","terms":["에이렌","미라"]},{"type":"paragraph","text":"처음의 질문은 남에게 필요 없는 사람도 행복할 수 있는가였다. 마지막의 질문은 남을 계속 구할 수 있는 사람도 그만두어도 되는가다. 같은 가치가 주인공 2에게도 적용되는 순간이다.","id":"payoff-p2","terms":[]}],"reveal":true}],"sources":[{"id":"tempest","title":"William Shakespeare · The Tempest, Act 5, scene 1","url":"https://www.folger.edu/explore/shakespeares-works/the-tempest/read/5/1/","locator":"Folger Shakespeare Library 원문. 마법 포기, 지팡이와 책에 관한 발언. 당직표와 퇴근은 본 작품의 변주."}],"relations":[{"target":"last-shift","label":"앞쪽 장면","reason":"어머니의 퇴직.","evidence":{"entry":"last-shift","anchor":"morning","label":"그다음 아침"}},{"target":"future-offduty","label":"뒤쪽 장면","reason":"신의 퇴근.","evidence":{"entry":"future-offduty","anchor":"supper","label":"내일의 용건"}}],"spoiler":false,"shortTitle":"신의 마지막 소품은 지팡이가 아니다","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"questions","title":"설정 질문 — 쉬운 해결책을 먼저 검토하기","summary":"이야기를 지키려고 전능이나 인물의 지능을 낮추지 않는다.","type":"guide","kind":"읽기 길잡이","tags":["허점 점검","가정","반론"],"sections":[{"id":"improve","title":"능력을 모두 높이면 경쟁 문제가 해결되지 않나?","blocks":[{"type":"paragraph","text":"능력 향상은 제공한다. 질병과 생활 조건도 개선한다. 다만 실제 사람들의 관심과 의사를 자동으로 배분하는 일은 다른 문제다. 또한 더 뛰어나지는 대신 지금 상태로 쉬고 싶다는 선택도 남는다. 만경은 향상만이 유일한 구원이라고 정하지 않는다.","id":"improve-p1","terms":["만경"]}]},{"id":"justice","title":"입주와 심판을 동시에 허용하면 되지 않나?","blocks":[{"type":"paragraph","text":"둘 다 허용한다. 라잔은 입주했고 심판도 열린다. 충돌하는 것은 자발적 참여가 아니라, 라잔이 거부해도 실제 출석을 강제할 권한이다. 입주를 막아야 심판할 수 있다는 잘못된 양자택일은 만들지 않는다.","id":"justice-p1","terms":["라잔"]}]},{"id":"division","title":"심판에 응하는 세계와 거부하는 세계로 나누면?","blocks":[{"type":"paragraph","text":"원하는 경험은 나눌 수 있다. 꿈배역의 사과나 출석하는 새갈래의 행동도 가치 있다. 그러나 거부하는 그 당사자를 강제할 권한을 묻는 요청 자체까지 없어지지는 않는다. 리아가 그런 권한을 포기할 수는 있지만, 그것은 기술로 소원을 구현한 결과가 아니라 자신의 판단을 바꾼 결과다.","id":"division-p1","terms":["꿈배역","새갈래","리아"]}]},{"id":"mind","title":"고집이나 복수심을 없애주면 되지 않나?","blocks":[{"type":"paragraph","text":"본인이 원하면 마음과 기억을 바꾸는 도움을 받을 수 있다. 그것을 선택한 피해자도 존중한다. 다만 반대 의사를 가진 사람의 판단을 수정해 정책에 동의하게 만드는 것은 갈등을 해결한 것인지, 반대자를 바꾼 것인지 따져야 한다.","id":"mind-p1","terms":[]},{"type":"paragraph","text":"리아의 요구를 곧바로 정신적 증상으로, 에이렌의 원칙을 곧바로 죄책감으로 진단하지 않는다. 삶의 경험은 동기를 설명하지만 주장 자체의 진위를 대신하지 않는다.","id":"mind-p2","terms":["에이렌","리아"]}]},{"id":"evidence","title":"모든 증거를 알면 피고를 부를 필요가 없지 않나?","blocks":[{"type":"paragraph","text":"사실 확인을 위해서는 반드시 필요하지 않다. 작품은 이 점을 인정한다. 리아가 요구하는 것은 정보를 얻는 수단이 아니라, 공적인 권한을 행사한 사람의 응답 의무다. 그 의무를 강제로 집행해도 되는지는 독자가 동의하지 않을 수 있는 가치 판단이다.","id":"evidence-p1","terms":["리아"]}]},{"id":"cheap","title":"괴롭히지 않고 아주 짧게 참석시키면?","blocks":[{"type":"paragraph","text":"리아는 부담을 최소화한 절차를 제안한다. 에이렌은 짧고 고통이 없으면 강제가 아니라고 보지는 않는다. 그렇다고 짧은 출석을 무기한 감금과 같다고 하지도 않는다. 제한의 실제 크기와 목적을 모두 놓고 다툰다.","id":"cheap-p1","terms":["에이렌","리아"]}]},{"id":"god","title":"에이렌도 결국 자기 법을 강요하는 것 아닌가?","blocks":[{"type":"paragraph","text":"그의 기본 보호 원칙이 공적 심판의 집행을 막는 효과가 있다는 비판은 정당한 쟁점이다. 에이렌은 중립적인 기계의 대변인이 아니다. 어떤 강제를 허용하지 않을지 결정한 책임이 있다.","id":"god-p1","terms":["에이렌"]},{"type":"paragraph","text":"그는 권능을 나누고 자신에 대한 심판도 받아들이지만, 그것만으로 이 비판이 사라지지는 않는다. 리아는 그의 선의와 권력의 효과를 동시에 문제 삼을 수 있다.","id":"god-p2","terms":["리아"]}]},{"id":"peace","title":"왜 두 사람은 전쟁 대신 계속 대화하나?","blocks":[{"type":"paragraph","text":"현재의 갈등은 실제 강제 출석을 집행하느냐에 관한 한정된 충돌이다. 전쟁을 시작해야만 신념이 진지한 것은 아니다. 이야기는 그 요청의 패배, 공적 기록의 변화, 증언의 선택, 관계의 손실을 구체적인 결과로 삼는다.","id":"peace-p1","terms":[]},{"type":"paragraph","text":"낙원을 지키기 위해 독자를 속이는 대재앙을 넣지는 않는다. 인물들이 바꿀 수 있었던 것과 끝내 얻지 못한 것을 함께 남긴다.","id":"peace-p2","terms":[]}]},{"id":"meaning","title":"전능한 에이렌이 편지의 답을 바로 알면 이야기가 끝나지 않나?","blocks":[{"type":"paragraph","text":"편지의 진위와 여울의 정체는 서장에서 공개된다. 나래의 과거와 라잔의 명령도 힘이 부족해서 못 찾는 정보가 아니다. 독자가 따라가는 것은 누가 속였는지가 아니라, 알고도 무엇에 서명할지다.","id":"meaning-p1","terms":["나래","라잔","여울"]},{"type":"paragraph","text":"에이렌이 모두의 기억과 평가를 바꿀 수 있다는 사실은 유지된다. 다만 그것을 상대가 스스로 동의한 일로 기록하지 않는다. 인물에게 공개 설명이나 증언을 요청하는 과정은 기술적 검색 실패가 아니라 어떤 공개를 원하느냐를 확인하는 과정이다.","id":"meaning-p2","terms":["에이렌"]}]},{"id":"future","title":"이백 년 뒤의 나래가 왔다면 용서는 이미 예정된 것 아닌가?","blocks":[{"type":"paragraph","text":"여울은 앞으로 반드시 생길 나래가 아니라, 일 년 전 자발적으로 갈라져 다른 시간 속에서 이미 살아온 사람이다. 현재의 나래는 그 길로 갈 의무가 없고 같은 결론에 도달할 보장도 없다. 두 개의 날짜 문서에서 재회와 시간 표기를 확인할 수 있다.","id":"future-p1","terms":["나래","여울"]}]},{"id":"stories","title":"사람들이 그냥 각자의 이야기를 믿고 살면 안 되나?","blocks":[{"type":"paragraph","text":"그렇게 살 수 있다. 문제는 자기 체험을 선택하는 것과 다른 당사자의 공개 증언까지 대신하는 것을 구분하는 데 있다. 라잔의 개인 왕국을 없애지 않지만, 해원의 사실 기록에 모든 시민이 그를 용서했다고 쓰지는 않는다. 공동 기록을 읽지 않을 자유도 남는다.","id":"stories-p1","terms":["라잔","해원"]}]},{"id":"why-not-fast","title":"신이 바로 답을 알려주면 사건이 끝나지 않나?","blocks":[{"type":"paragraph","text":"진본 확인, 사실 조회, 장소 이동처럼 힘으로 해결할 수 있는 일은 먼저 해결한다. 인계장의 뒷문장을 얻기 위해 마법이 갑자기 작동하지 않는 장치를 넣지 않는다. 문제는 그 진본을 확인한 뒤에도 신전의 의미와 출연자의 말이 자동으로 같아지지 않는 데 있다.","terms":[],"id":"why-not-fast-p1"},{"type":"paragraph","text":"다른 사람의 기억과 판단까지 강제로 바꾸면 표면적 합의도 만들 수 있다. 에이렌은 그 능력과 그것을 행사할 정당한 권한을 구별한다. 이것은 우주의 기술 한계가 아니라 만경이 선택한 운영 원칙이며, 모든 관점에서 증명된 유일 정답이라고 부르지 않는다.","terms":["에이렌","만경"],"id":"why-not-fast-p2"}]},{"id":"why-not-festival","title":"각자 다른 축제를 만들면 되지 않나?","blocks":[{"type":"paragraph","text":"가능하다. 여기서 모두와 합의하지 않아도 각자 행복한 행사와 삶을 얻을 수 있다. 이 이야기는 그 대안을 차단하지 않는다. 다만 나래는 실제로 알고 지내는 이웃에게 말하고 싶고, 결은 그 이웃들이 함께 만날 행사를 열고 싶어 한다.","terms":["나래"],"id":"why-not-festival-p1"},{"type":"paragraph","text":"이 선택은 생존을 위해 강요된 것은 아니다. 원하는 사람이 떠날 수 있는 상황에서도 다른 실제 사람을 만나기로 하면 갈등은 생길 수 있다. 원치 않는 관객에게 자신의 행사를 우주의 정전으로 강요하지 않는 한, 만남을 원하는 사람들의 갈등에도 의미가 있다.","terms":["정전"],"id":"why-not-festival-p2"}]},{"id":"actual-scale","title":"전능한 시대에는 긴장감이 없는 것 아닌가?","blocks":[{"type":"paragraph","text":"물리적 생사 위기는 창조권 이전의 항해록에서 다룬다. 현재에 같은 종류의 위기를 재현하려고 연료 부족이나 인질 장치를 몰래 덧붙이지 않는다. 현재의 긴장은 자신이 존경한 사람이 내 뜻에 반대할 때, 그를 고치지 않고 계속 만나려는 선택에 있다.","terms":["창조권"],"id":"actual-scale-p1"},{"type":"paragraph","text":"이 작품은 전능한 힘을 주고도 그것이 없는 것처럼 싸우는 재난물이 아니다. 과거의 구조 모험, 현재의 귀환과 공적 기억의 충돌, 먼 미래의 역할에서 벗어나는 이야기를 서로 다른 긴장으로 엮는다. 생사 액션이 본편의 주된 재미를 이끌어야 한다면 전능의 전제를 별도로 바꾸어야 하지만, 여기서는 그 전제를 유지했다.","terms":[],"id":"actual-scale-p2"}]},{"id":"citation-scope","title":"레퍼런스의 정답을 그대로 가져왔나?","blocks":[{"type":"paragraph","text":"공식 소개·원전·창작자 인터뷰에서 확인한 장치를 짧게 설명하고, 우리 이야기에서 무엇을 다르게 했는지 구별한다. 성서와 신화의 모든 전승을 하나의 정답으로 뭉치지 않는다. 라하이 로이처럼 상세 공식 본문을 읽지 못한 범위는 명칭 수준의 연결만 사용했다.","terms":[],"id":"citation-scope-p1"}]},{"id":"quarter","title":"왜 사분의 삼인가? 인구를 줄이면 같은 문제가 다시 생기지 않나?","blocks":[{"type":"paragraph","text":"사분의 삼은 당시 행정 분류의 크기를 가져온 아벨의 정치적 집행안이지 최적 인구의 발견이 아니다. 그는 출생 제한과 남은 제도의 개혁도 덧붙였지만, 그 개혁을 모두에게 먼저 적용하라는 반론에 답하지 못했다. 고통을 없애려는 목표가 인구 감소의 효과를 보증하지 않는다.","id":"quarter-p1","terms":["아벨"]}]},{"id":"new-force","title":"당시 낙원을 못 만들었다면 아벨에게 다른 선택이 없었던 것 아닌가?","blocks":[{"type":"paragraph","text":"없었던 것은 모든 소원을 양립시키는 전능이다. 지원과 개혁을 계속하거나, 도움을 거절하는 사람의 삶을 남겨두는 선택은 있었다. 아벨은 그 불확실한 기다림을 스스로 판단하여 끝내겠다고 했고, 그때 타인의 현재 의사를 넘었다. 좋은 해법의 불완전함은 살해를 유일한 대안으로 만들지 않는다.","id":"new-force-p1","terms":["아벨"]}]},{"id":"revived","title":"희생자가 돌아왔다면 살인은 나중에 무효가 되는가?","blocks":[{"type":"paragraph","text":"부활한 사람은 실제로 살아가며 충분히 행복해질 수 있다. 그 좋은 결과와, 과거에 원치 않는 죽음을 부과했다는 행위는 별개다. 당사자는 기억을 보존하거나 조정할 선택권도 있지만, 다른 사람에게 자기 과거의 동의를 대신 써줄 권한이 생기지는 않는다.","id":"revived-p1","terms":[]}]},{"id":"successes","title":"옛 위인들이 전부 실패해야 에이렌이 옳아지는가?","blocks":[{"type":"paragraph","text":"아니다. 요벨의 생활권, 프로네의 개방 기술, 레테의 자발적 치료, 사벨의 선택 가능한 지원은 지금도 유용하다. 만경은 전부 버리는 최종 정답이 아니라, 다른 답을 강제하지 않고 함께 제공할 수 있게 된 새 조건이다.","id":"successes-p1","terms":["생활권","프로네","레테","만경","사벨","요벨"]}]},{"id":"why-return","title":"악당을 굳이 되살려야 하는가?","blocks":[{"type":"paragraph","text":"누구나 귀환을 원할 필요는 없다. 아벨은 안전한 귀환이 가능하다면 다시 응답할 기회를 원한다는 기록을 남겼고 현재의 설명도 받아들였다. 피해자는 그를 만나지 않을 수 있다. 그는 개인 세계에서 남을 해칠 수 없으며, 실제 사람에게 용서나 관객의 자리를 요구할 권리는 얻지 못한다.","id":"why-return-p1","terms":["개인 세계","아벨"]}]}],"sources":[],"relations":[{"target":"clocks","label":"날짜의 규칙","reason":"예언이 아닌 재회.","evidence":{"entry":"clocks","anchor":"nara","label":"나래와 여울의 경우"}},{"target":"rules","label":"전능의 범위","reason":"기술과 선택을 구분한다.","evidence":{"entry":"rules","anchor":"consent","label":"할 수 있지만, 기본적으로 하지 않는 일"}}],"spoiler":false,"shortTitle":"설정 질문","preview":"","readingMinutes":5,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"notes","title":"참고 자료를 읽는 법 — 연결이지 정답은 아니다","summary":"실제 자료에서 확인한 부분과 만경이 새로 만든 부분을 구분한다.","type":"guide","kind":"읽기 길잡이","tags":["출처","읽기 안내"],"sections":[{"id":"fiction","title":"유래가 확인되는 연결","blocks":[{"type":"paragraph","text":"에이레네·디케·에우노미아의 관계는 『신통기』에서, 두 여왕과 잼·달리기는 『거울 나라의 앨리스』에서 확인했다. 법의 문지기는 『소송』의 우화, 마법 포기의 소품은 『템페스트』의 대사에 연결된다. 각 겹쳐 읽기 문서의 해당 문장에 원문 링크가 있다.","id":"fiction-p1","terms":[]}]},{"id":"persons","title":"작품이 붙인 연결","blocks":[{"type":"paragraph","text":"세 구조선과 해원의 도시 배치, 만경의 萬景·萬鏡 표기, 서안의 이름과 책상, 베일의 덮기와 가리기는 이 작품을 위해 설계한 연결이다. 현실의 어원이나 원작자의 숨은 의도를 발견한 것처럼 적지 않는다.","id":"persons-p1","terms":["만경","서안","해원"]}]},{"id":"reading","title":"모든 단어가 암호는 아니다","blocks":[{"type":"paragraph","text":"이름이나 소품은 독자가 다시 볼 때 장면을 더 풍부하게 해주는 장치다. 해설을 읽지 않으면 인물의 행동을 이해할 수 없도록 만들지 않는다. 단서함에서 첫 등장과 다시 돌아오는 장면을 나란히 찾을 수 있고, 회수 설명은 직접 펼칠 때만 보인다.","id":"reading-p1","terms":[]}]},{"id":"scope","title":"본문과 자료의 범위","blocks":[{"type":"paragraph","text":"세계의 작동과 인물의 행위는 창작 설정이다. 외부 참고문헌은 작명의 자료와 비교할 장면을 제공할 뿐, 에이렌이나 리아의 윤리가 옳다는 것을 증명하지 않는다. 미래 문서는 이 작품이 따라가는 후일담이며 현실 기술의 예측이 아니다.","id":"scope-p1","terms":["에이렌","리아"]}]},{"id":"reference-scope","title":"확인한 대목과 가져오지 않은 결말","blocks":[{"type":"paragraph","text":"레퍼런스 작업실에서 작품마다 확인한 원전·공식 소개·인터뷰·2차 정리를 구별한다. 계속 갱신되는 게임의 전체 결말을 일부 버전 소개만으로 확인했다고 쓰지 않는다. 특히 라하이로이 설정문은 공식 원문 주소를 명시한 전재본의 범위를 표시한다.","id":"reference-scope-p1","terms":[]},{"type":"paragraph","text":"원전의 이름과 대사를 그대로 바꿔 끼우기보다, 같은 발견이 이 세계에서는 다른 행동을 요구하게 한다. 신화의 인물이 실제로 해원의 역사 인물이었다는 거대한 합동 정체 반전은 두지 않는다.","id":"reference-scope-p2","terms":["해원"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"작품별 실제 적용","entry":"reference-workshop"},{"label":"고정한 인과와 시간","entry":"causal-ledger"}],"id":"reference-scope-p3","terms":[]}]}],"sources":[],"relations":[{"target":"deep-peace","label":"이름을 따라","reason":"확인되는 원전과 창작의 연결.","evidence":{"entry":"deep-peace","anchor":"word","label":"현실 자료 · 에이레네"}},{"target":"deep-jam","label":"말장난을 따라","reason":"두 여왕을 혼동하지 않기.","evidence":{"entry":"deep-jam","anchor":"reference","label":"현실 자료 · 두 여왕의 다른 말"}}],"spoiler":false,"shortTitle":"참고 자료를 읽는 법","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-messiah","title":"예언에서 잘린 한 문장 — 구원자는 집에 갈 수 있는가","summary":"듄의 경고, 앰포리어스의 계승, 메이의 인계장. 같은 사람을 돕는 일과 그 사람에게 미래를 맡기는 일은 다르다.","type":"deep","kind":"말과 장면의 연결","tags":["듄","앰포리어스","예언","교대"],"sections":[{"id":"reference","title":"좋은 구원자도 위험한 이야기의 중심이 된다","blocks":[{"type":"paragraph","text":"프랭크 허버트는 「Dune Genesis」에서 메시아적 지도자와 그를 둘러싼 권력의 위험을 다룬다. 중요한 비교점은 지도자가 처음부터 사기꾼이어야 한다는 것이 아니다. 실제 능력과 선의를 가진 인물도 추종과 제도의 중심이 될 수 있다는 질문이다.","terms":[],"citation":"dune","id":"reference-p1"},{"type":"paragraph","text":"앰포리어스에 관한 3.4 공식 소개는 파이논에게 모이는 기대와 희망, 과거를 향하는 여정을 연결한다. 여기서는 인물이 개인으로 살기 전에 이미 거대한 이야기의 몫을 받는다는 장치를 비교한다. 세부 반전이나 반복 횟수를 우리 세계의 규칙으로 옮기지는 않는다.","terms":[],"citation":"amph","id":"reference-p2"}]},{"id":"cut","title":"예언의 원전은 당직 인계장이었다","blocks":[{"type":"paragraph","text":"다음 사람이 오면 문을 넘겨주시오. 이 앞문장만 남으면 메이는 새로운 구원자를 기다린 예언자가 된다. 나는 집에 가겠소라는 뒷문장을 붙이면, 그녀는 다른 사람을 구한 뒤 쉬고 싶은 노동자가 된다. 같은 문장이지만 요구하는 미래가 정반대다.","terms":["메이"],"id":"cut-p1"},{"type":"paragraph","text":"결은 신화를 믿어서 어리석은 사람이 아니다. 그 이야기가 자신에게 침대를 내주었다. 에이렌도 신앙의 덕으로 사람들을 안심시킬 수 있었다. 따라서 비문을 정정하는 일에는 진짜 비용이 있다. 그러나 도움이 된 해석이 당사자의 발언권을 영구히 대신하지는 못한다.","terms":["에이렌"],"id":"cut-p2"}]},{"id":"payoff","title":"먼 훗날, 뒷문장이 에이렌에게 돌아온다","blocks":[{"type":"paragraph","text":"메이의 인계장 → 미라의 퇴직 → 회복원의 퇴소 문 → 에이렌의 상담 당직표. 네 장면은 한 인물이 다른 인물로 환생했다는 비밀이 아니다. 사회가 선한 사람에게 반복해서 요구한 같은 역할이다.","terms":["에이렌","회복원","메이","미라"],"id":"payoff-p1"},{"type":"paragraph","text":"240년 뒤 에이렌은 자기 인계장에 뒷문장부터 쓴다. 나는 집에 가겠소. 그 뒤에 누구에게 부탁할지 적는다. 구원자가 죽어야 끝나는 전설이 아니라, 살아 있는 채 교대할 수 있는 세계가 남는다.","terms":["에이렌"],"id":"payoff-p2"}],"reveal":true}],"sources":[{"id":"dune","title":"프랭크 허버트 · Dune Genesis (1980)","url":"https://vasil.ludost.net/dunegenesis.pdf","locator":"저자의 창작 에세이. 메시아적 권력에 관한 대목. 공개 미러의 PDF이며 원 잡지 사이트는 아니다."},{"id":"amph","title":"HoYoverse · Star Rail 3.4 제작진 소개","url":"https://blog.playstation.com/2025/06/20/honkai-star-rail-version-3-4-arrives-july-2/","locator":"앰포리어스, 파이논, 과거의 경험과 계승된 기대에 관한 공식 소개. 이후 버전의 반전·정확한 반복 횟수는 이 글의 근거로 쓰지 않았다."}],"relations":[{"target":"founder-return","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"founder-return","anchor":"inscription","label":"비문에 없는 뒷문장"}}],"shortTitle":"예언에서 잘린 한 문장","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-fire","title":"불을 훔친 사람의 이름보다, 불을 감싼 관","summary":"프로메테우스의 불을 통신관과 조난등으로 바꾸면 무엇이 달라지는가.","type":"deep","kind":"말과 장면의 연결","tags":["프로메테우스","삼박등","불"],"sections":[{"id":"reference","title":"신화에서 가져온 모양","blocks":[{"type":"paragraph","text":"헤시오도스의 「신통기」에서 프로메테우스는 속이 빈 회향 줄기에 불을 숨겨 가져온다. 여기서 가져오는 것은 인물이 벌받는 운명 전체가 아니라, 거대한 변화의 씨앗이 작고 일상적인 운반물 안에 들어 있다는 모양이다.","terms":[],"citation":"hesiod","id":"reference-p1"}]},{"id":"tube","title":"통신관 안에 들어 있던 것은","blocks":[{"type":"paragraph","text":"유란의 통신관에는 신의 일부가 들어 있지 않다. 눈을 다치지 않게 가린 식별등이 들어 있다. 메이가 그 빛을 옮기는 것은 자기 힘을 늘리려는 절도가 아니라, 사람들이 서로의 위치를 찾게 하려는 재배치다.","terms":["메이","유란"],"id":"tube-p1"},{"type":"paragraph","text":"여기서 능력의 위대함은 소유자의 전투력이 아니라 다른 사람이 이용할 수 있는가에 있다. 훗날 에이렌이 창조권을 자기 몸에만 묶지 않는 선택으로 같은 질문이 돌아온다. 불씨를 계속 독점하는 프로메테우스가 되지 않으려는 것이다.","terms":["에이렌","창조권"],"id":"tube-p2"}]},{"id":"payoff","title":"태양에서 다섯 나사로","blocks":[{"type":"paragraph","text":"첫 장면에서 삼박등은 신의 눈처럼 보인다. 항해록에서는 망가진 식별등이고, 기념관에서는 다섯 종류의 나사가 남은 공동 작업물이다. 마지막 밤에는 관객이 서로를 보는 신호가 된다. 위대한 사물의 의미를 작게 만드는 것이 아니라, 그 물건에 실제로 손을 댄 사람을 늘리는 반전이다.","terms":["삼박등"],"id":"payoff-p1"}],"reveal":true}],"sources":[{"id":"hesiod","title":"헤시오도스 · 신통기","url":"https://www.theoi.com/Text/HesiodTheogony.html","locator":"H. G. Evelyn-White 번역. 프로메테우스의 불 이야기 및 호라이 세 자매. 신화에는 다른 전승도 있다."}],"relations":[{"target":"rescue-night","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"rescue-night","anchor":"light","label":"통신관 안의 작은 불"}}],"shortTitle":"불을 훔친 사람의 이름보다, 불을 감싼 관","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-well","title":"누가 누구를 보고 있는가 — 라하이 로이와 우물","summary":"하늘의 눈을 아래에서 보낸 신호로 뒤집는 읽기. 명칭의 닮음과 공식 설정은 구별한다.","type":"deep","kind":"말과 장면의 연결","tags":["성경","라하이로이","시선","우물"],"sections":[{"id":"reference","title":"먼 이름에서 들리는 문장","blocks":[{"type":"paragraph","text":"창세기 16:13–14에서 하갈은 자신을 보는 신을 말하고, Beer Lahai Roi라는 우물 이름이 이어진다. NIV 역주는 이를 자신을 보는 살아 있는 이의 우물이라는 뜻으로 설명한다. 이것은 성서 본문과 해당 번역의 설명이다.","terms":[],"citation":"hagar","id":"reference-p1"},{"type":"paragraph","text":"명조의 공식 3.0 안내에 나오는 지역 이름은 Lahai-Roi다. 이름의 울림을 성서의 우물과 연결해 읽을 수 있지만, 이 자료집은 개발진이 그 어원을 확정했다고 주장하지 않는다. 공식 안내 본문 전체와 이후 이야기의 상세 반전을 확인하지 못해 그것을 근거로 가져오지는 않았다.","terms":[],"citation":"kuro","id":"reference-p2"}]},{"id":"verb","title":"지켜본다는 말의 두 손","blocks":[{"type":"paragraph","text":"지켜본다는 말에는 나를 놓치지 않는 돌봄과 나를 평가하는 시선이 함께 들어갈 수 있다. 공헌청은 전자를 약속하며 후자의 표식을 남겼다. 해원의 삼박등도 처음에는 여기에 사람이 있다는 요청이었는데, 도시를 굽어보는 신의 눈으로 읽히게 되었다.","terms":["공헌청","삼박등","해원"],"id":"verb-p1"},{"type":"paragraph","text":"이 작품은 위로를 모두 감시의 속임수로 폭로하지 않는다. 결은 실제로 그 빛을 보고 안심했다. 다만 누군가 안심했다는 사실로 다른 사람을 계속 관찰할 권한까지 얻지는 않는다.","terms":[],"id":"verb-p2"}]},{"id":"payoff","title":"태양의 주어를 바꾼다","blocks":[{"type":"paragraph","text":"마지막 밤에 달라지는 것은 태양의 연료가 아니라 문장의 주어다. 신이 우리를 보고 있다에서, 우리가 여기 있으니 서로를 보아달라로 옮겨간다. 메이는 하늘 대신 객석을 본다. 빛은 사라지지 않고 관계의 방향이 바뀐다.","terms":["메이"],"id":"payoff-p1"}],"reveal":true}],"sources":[{"id":"hagar","title":"창세기 16:13–14 · 하갈과 우물의 이름","url":"https://www.biblegateway.com/passage/?search=Genesis+16%3A13-14&version=NIV","locator":"NIV 본문과 Beer Lahai Roi에 관한 역주. 히브리어 어원 전체를 독자적으로 확정하는 자료로 쓰지 않는다."},{"id":"kuro","title":"KURO · Version 3.0 공식 패치 안내","url":"https://wutheringwaves.kurogames.com/en/main/news/detail/3920","locator":"공식 검색 안내에서 Lahai-Roi 지역명이 확인된다. 본문은 동적 렌더링으로 전체를 읽지 못해 상세 전개나 후속 반전은 채택하지 않았다."}],"relations":[{"target":"sun","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"sun","anchor":"origin","label":"보는 눈에서 보아달라는 눈으로"}}],"shortTitle":"누가 누구를 보고 있는가","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-canon","title":"정전 중에도 운행합니다 — 正典과 停電","summary":"디케 서고의 안내문을 두 번 읽는 방법. 바벨의 언어와 지하실의 기록이 만난다.","type":"deep","kind":"말과 장면의 연결","tags":["진격의 거인","바벨","정전","말장난"],"sections":[{"id":"reference","title":"도시의 아래에는 다른 문장이 있다","blocks":[{"type":"paragraph","text":"「진격의 거인」 21권의 공식 소개는 지하실에 다가가는 과정과 벽으로 둘러싸인 세계의 비밀을 연결한다. 이 자료집이 빌리는 것은 특정 혈통이나 전쟁의 정답이 아니라, 익숙한 공간 아래의 기록이 세계의 크기와 의미를 바꾸는 방식이다.","terms":[],"citation":"aot","id":"reference-p1"},{"type":"paragraph","text":"창세기 11장의 바벨은 도시와 탑, 언어와 흩어짐을 엮는다. USCCB 역주는 Babel과 balal의 유사음을 설명한다. 이를 단순한 실제 어원 등식보다 본문 속 말놀이로 읽는 편이 정확하다.","terms":[],"citation":"babel","id":"reference-p2"}]},{"id":"two","title":"한 건물에 두 개의 정전","blocks":[{"type":"paragraph","text":"해원 서고의 위층은 모두가 채택한 정전(正典), 아래층은 항로의 정전(停電)에 관한 기록이다. 한글로 쓰면 같은 두 글자다. 신화와 정비 일지가 같은 도시를 서로 다르게 기억한다.","terms":["정전","해원"],"id":"two-p1"},{"type":"paragraph","text":"엘리베이터의 정전 중에도 운행합니다는 처음에는 안전 안내다. 나중에는 공식 이야기가 흔들려도 생활과 대화는 멈출 필요가 없다는 문장으로 돌아온다. 말장난은 한 번 웃고 끝나는 암호가 아니라 등장인물이 그 장소에서 취할 행동을 바꾼다.","terms":["정전"],"id":"two-p2"}]},{"id":"payoff","title":"다른 말로 함께 읽는 정전","blocks":[{"type":"paragraph","text":"메이의 귀환 뒤에도 위층의 기념관을 없애지 않는다. 아래층 기록과 연결된 설명을 붙인다. 공동 기록은 모든 시민이 같은 느낌을 가져야만 성립하는 문서가 아니다. 무엇을 확인했고, 무엇에는 아직 의견이 다른지도 적을 수 있다.","terms":["메이"],"id":"payoff-p1"}],"reveal":true}],"sources":[{"id":"aot","title":"Kodansha · 진격의 거인 21권 소개","url":"https://kodansha.us/series/attack-on-titan/volume-21/","locator":"출판사 공식 소개. 지하실과 벽으로 둘러싸인 세계의 비밀이라는 서사 장치만 비교한다."},{"id":"babel","title":"창세기 11장 · 바벨의 도시","url":"https://bible.usccb.org/bible/genesis/11","locator":"본문과 역주. Babel과 balal의 유사음은 본문의 말놀이로 다루며, 단순한 역사적 어원 등식으로 쓰지 않는다."}],"relations":[{"target":"descent","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"descent","anchor":"stairs","label":"도시의 갈비뼈"}}],"shortTitle":"정전 중에도 운행합니다","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-mirror","title":"거울을 뒤집어도 사람이 나오지는 않는다","summary":"Erised와 Desire, 萬景과 萬鏡. 우리에게 필요한 것은 가짜를 깨는 망치가 아닐 수 있다.","type":"deep","kind":"말과 장면의 연결","tags":["해리포터","인셉션","거울","소금"],"sections":[{"id":"reference","title":"이름 안에 숨긴 사용 설명","blocks":[{"type":"paragraph","text":"해리 포터 공식 자료는 Erised를 거꾸로 읽으면 Desire가 된다고 설명한다. 공식 백과의 거울은 마음의 바람을 보여주지만 그 바람 자체를 이루어주지는 않는다. 이름에 기능을 숨기는 방식이 선명하다.","terms":[],"citation":"erised","id":"reference-p1"},{"type":"paragraph","text":"거울을 떠나지 못하는 위험에 관한 공식 설명과 달리, 만경은 실제로 삶을 제공할 수 있다는 별도의 전제에서 출발한다. 원전의 거울을 능력이 더 큰 거울로 그대로 복사하기보다, 그 경고가 더는 자동으로 성립하지 않는 조건을 택한 것이다.","terms":["만경"],"citation":"mirror","id":"reference-p2"}]},{"id":"two","title":"만경이라는 한 소리","blocks":[{"type":"paragraph","text":"공식 표기는 만 가지 풍경이라는 뜻을 붙인 萬景이다. 주민의 별명은 만 가지 거울이라는 뜻을 붙인 萬鏡이다. 동일한 역사적 어원이라는 주장이 아니라 작품 안에서 두 표기를 겹쳐 쓰는 장치다.","terms":[],"id":"two-p1"},{"type":"paragraph","text":"꿈배역은 내가 원하는 모습을 비춰줄 수 있다. 그러나 여울은 의식 있는 새갈래다. 나래가 자기 모습을 본다고 해서 자기 뜻대로 움직일 의무가 생기지 않는다. 거울인 줄 알았던 자리에 사람이 서 있는 것이다.","terms":["꿈배역","새갈래","나래","여울"],"id":"two-p2"}]},{"id":"salt","title":"현실을 확인하는 물건 대신 관계를 확인하는 맛","blocks":[{"type":"paragraph","text":"놀런은 「인셉션」에 관한 인터뷰에서 상징을 이용해 인물에게 감정의 이야기를 제공하는 작업을 이야기한다. 여기서는 꿈 여부의 정답이나 특정 결말 해석을 가져오지 않고, 작은 물건이 감정의 판단을 붙잡는다는 방식만 비교한다.","terms":[],"citation":"inception","id":"salt-p1"},{"type":"paragraph","text":"나래와 여울에게 그 물건은 회전하는 장치가 아니라 국에 넣는 소금이다. 맛이 다르다는 사실은 누가 가짜라는 증거가 아니다. 같은 출발점에서 다른 생활을 살아왔다는 증거다. 입맛의 차이는 거절해야 할 오류가 아니라 다음 대화를 여는 작은 문이다.","terms":["나래","여울"],"id":"salt-p2"}],"reveal":true}],"sources":[{"id":"erised","title":"Harry Potter 공식 퍼즐 · Erised와 Desire","url":"https://www.harrypotter.com/features/the-mirror-of-erised-wordsearch","locator":"Erised를 거꾸로 읽으면 Desire라는 공식 설명."},{"id":"mirror","title":"Harry Potter 공식 백과 · 소망의 거울","url":"https://www.harrypotter.com/fact-file/objects/the-mirror-of-erised","locator":"거울이 바람을 비추며 그 바람 자체를 실현해주지는 못한다는 공식 설명."},{"id":"inception","title":"크리스토퍼 놀런 인터뷰 · WIRED","url":"https://www.wired.com/2010/11/pl-inception-nolan/","locator":"2010년 인터뷰. 상징으로 감정의 이야기를 구성하는 작업에 관한 감독의 답변. 결말의 단일 정답을 주장하는 근거로 쓰지 않는다."}],"relations":[{"target":"act-two","label":"맛으로 읽는 만남","reason":"서로 다른 국의 간이 서로 다른 삶을 드러낸다.","evidence":{"entry":"act-two","anchor":"nara","label":"소금 한 숟갈"}},{"target":"act-two","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"act-two","anchor":"nara","label":"소금 한 숟갈"}}],"shortTitle":"거울을 뒤집어도 사람이 나오지는 않는다","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-answer","title":"미래의 정답지를 찢지 않고도 반대하는 법","summary":"Fate의 이상과 대면하는 사람, 슈타인즈 게이트의 메시지, 나래 앞으로 온 옆집의 편지.","type":"deep","kind":"말과 장면의 연결","tags":["페이트","슈타인즈게이트","두 시계","나래"],"sections":[{"id":"reference","title":"나보다 오래 산 내가 앞에 선다면","blocks":[{"type":"paragraph","text":"Fate/stay night [UBW] 제19화 공식 소개는 시로가 자신의 이상 끝에 있는 존재와 대면한다고 설명한다. 이 자료집은 미래의 자신이 지금의 꿈에 답을 들고 나타나는 구도를 비교한다. 결론과 대사, 영령 소환 체계는 가져오지 않는다.","terms":[],"citation":"fate","id":"reference-p1"},{"type":"paragraph","text":"STEINS;GATE ELITE의 공식 소개에는 과거로 보내는 메시지와 그에 따른 변화가 등장한다. 반면 여울의 편지는 과거를 바꾸지 않는다. 두 사람은 서로 다른 속도로 산 뒤 같은 현재에서 만난다. 한쪽의 미래가 다른 쪽의 이미 정해진 운명이 아니다.","terms":["여울"],"citation":"steins","id":"reference-p2"}]},{"id":"success","title":"실패한 미래가 아니라 성공한 다른 삶","blocks":[{"type":"paragraph","text":"여울이 사실 불행했다면 나래는 자기 길을 쉽게 정당화할 수 있다. 그러나 여울은 잘 살았고 진심으로 용서했다. 나래가 자기 마음을 지키려면 다른 사람의 성공을 망가뜨릴 필요가 없다는 점이 이 만남을 어렵게 만든다.","terms":["나래","여울"],"id":"success-p1"},{"type":"paragraph","text":"여울에게도 같은 부담이 돌아간다. 자신의 삶이 가치 있었다고 말하기 위해 나래의 현재를 미완성이라고 불러서는 안 된다. 한 사람의 오래 산 경험은 충고의 근거가 되지만 다른 갈래의 결정을 대신할 위임장이 되지는 않는다.","terms":["나래","여울"],"id":"success-p2"}]},{"id":"payoff","title":"봉투에 시계가 두 개 있는 이유","blocks":[{"type":"paragraph","text":"공통력과 살아온 시간을 두 줄로 적는 우체국 양식은 복잡한 설정을 과시하기 위한 표가 아니다. 편지의 날짜만 보고 여울을 나래의 필연적인 미래로 읽지 않도록 처음부터 제시한 안내다. 원리를 알아도 만남의 감정까지 미리 풀리지는 않는다.","terms":["살아온 시간","공통력","나래","여울"],"id":"payoff-p1"}],"reveal":true}],"sources":[{"id":"fate","title":"Fate/stay night [UBW] · 제19화 공식 소개","url":"https://www.fate-sn.com/ubw/story/20.html","locator":"페이지 파일명은 20.html이지만 표기된 에피소드는 제19화 「理想の末路(こたえ)」다. 아처의 정체와 이상에 대한 대면을 다룬다."},{"id":"steins","title":"Spike Chunsoft · STEINS;GATE ELITE","url":"https://www.spike-chunsoft.com/games/steinsgate-elite/","locator":"공식 제품 소개의 과거로 보내는 메시지와 분기하는 결과. 우리 세계의 두 시계가 과거 개변과 다르다는 비교에 사용."}],"relations":[{"target":"yeoul","label":"다른 길의 성공","reason":"행복한 상대를 틀렸다고 부를 필요가 없는 갈래.","evidence":{"entry":"yeoul","anchor":"years","label":"이백 년을 한 문장으로 줄이지 않기"}},{"target":"prologue","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"prologue","anchor":"envelope","label":"첫 문장"}}],"shortTitle":"미래의 정답지를 찢지 않고도 반대하는 법","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-chorus","title":"우리라는 말에 누가 들어 있는가","summary":"에반게리온의 질문을, 실제로 잘 작동하는 공동 마음의 방문기로 옮긴다.","type":"deep","kind":"말과 장면의 연결","tags":["에반게리온","합창","우리","여백"],"sections":[{"id":"reference","title":"완성이라는 단어의 크기","blocks":[{"type":"paragraph","text":"「엔드 오브 에반게리온」의 공식 배급 소개는 의식의 의례와 인간의 마음을 완성한다는 질문을 연결한다. 작품 전체를 단 하나의 철학적 정답으로 요약하지 않고, 완성이라는 말이 개인에게 무엇을 요구하는지 묻는 비교점으로 삼는다.","terms":[],"citation":"eva","id":"reference-p1"}]},{"id":"plural","title":"한 사람을 위한 낙원과 함께 느끼는 낙원","blocks":[{"type":"paragraph","text":"37년 뒤의 살아 있는 합창은 실패한 실험이 아니다. 동의한 사람들이 감각을 나누며 실제 외로움을 줄인다. 나래와 여울이 방문했을 때 숨겨진 희생자를 찾는 이야기가 시작되지 않는다. 합창에 남는 사람의 삶도 존중받는다.","terms":["살아 있는 합창","나래","여울"],"id":"plural-p1"},{"type":"paragraph","text":"그런데 우리가 용서했다고 말할 때의 우리는 누구인가. 함께 느꼈다는 사실과 같은 결정을 내렸다는 사실은 다르다. 합창은 이 구별을 배우며 더 잘 작동한다. 분리된 개인만 정상이라고 주장하는 대신, 어떤 형태의 관계든 자신의 범위를 정확히 알 필요가 있음을 보여준다.","terms":[],"id":"plural-p2"}]},{"id":"payoff","title":"여백과 여울","blocks":[{"type":"paragraph","text":"나래의 편지 끝에 남긴 여백, 기억의 흐름이 달라져 스스로 지은 여울이라는 이름, 합창 바깥에 둔 의자 하나가 연결된다. 이것은 두 낱말의 역사적 어원 분석이 아니라 장면을 엮기 위해 선택한 소리와 이미지의 연상이다.","terms":["나래","여울"],"id":"payoff-p1"},{"type":"paragraph","text":"다른 마음과 닿기 위해 모든 경계를 없애야 하는 것은 아니다. 경계는 관계를 가로막기도 하지만 서로 방문할 주소를 남기기도 한다.","terms":[],"id":"payoff-p2"}],"reveal":true}],"sources":[{"id":"eva","title":"GKIDS · 엔드 오브 에반게리온 공식 소개","url":"https://gkids.com/films/end-of-evangelion/","locator":"인간의 마음을 완성한다는 질문으로 끝나는 배급사 소개. 특정 팬 이론이나 모든 결말의 단일 해석을 전제하지 않는다."}],"relations":[{"target":"future-choir","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"future-choir","anchor":"pronoun","label":"나의 용서가 우리의 감각이 될 때"}}],"shortTitle":"우리라는 말에 누가 들어 있는가","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-exchange","title":"등가교환이 끝난 뒤에도 남는 영수증","summary":"몸을 되찾는 이야기를 넘어서, 정말 회복시킬 수 있을 때 무엇을 묻는가.","type":"deep","kind":"말과 장면의 연결","tags":["강철의 연금술사","부활","영수증","책임"],"sections":[{"id":"reference","title":"좋은 소원과 돌이킬 수 없는 결과","blocks":[{"type":"paragraph","text":"강철의 연금술사의 공식 소개는 엘릭 형제의 신체 상실과 그것을 되찾으려는 탐색을 중심에 둔다. 선한 바람이 결과를 정당화하지는 않는다는 긴장을 참고한다. 현자의 돌의 세부 원리나 국가 규모의 연성 장치는 만경에 이식하지 않는다.","terms":["만경"],"citation":"fma","id":"reference-p1"}]},{"id":"receipt","title":"이번에는 몸이 정말 돌아온다","blocks":[{"type":"paragraph","text":"만경에서는 회복과 부활이 가능하다. 그래서 원전과 같은 기술적 한계를 만들어 고통을 남기지 않는다. 그 대신 리아의 합의문이 다른 무게를 갖는다. 서안을 되찾은 결과는 좋았다. 그 결과를 위해 다른 가족의 말을 종결 처리한 행위도 남아 있다.","terms":["리아","만경","서안"],"id":"receipt-p1"},{"type":"paragraph","text":"에이렌이 과거의 피해를 고친다고 라잔이 스스로 응답한 사실까지 생기는 것은 아니다. 리아가 이 구별을 말한다고 회복된 서안을 다시 불행하게 만들 필요도 없다. 구제의 영수증은 거래가 있었음을 보여주지만 모든 사람이 같은 계약에 동의했다는 증거는 아니다.","terms":["에이렌","라잔","리아","서안"],"id":"receipt-p2"}]},{"id":"payoff","title":"빈칸은 미납 금액이 아니다","blocks":[{"type":"paragraph","text":"나래는 반송된 편지를 서랍에 넣는다. 그것은 빚을 반드시 다 받아낼 때까지 생활을 중단하겠다는 표식도, 모든 빚이 사라졌다는 영수증도 아니다. 기록은 남고 오늘의 저녁도 시작된다. 만경의 회복은 고통을 삶의 입장료로 삼지 않는다.","terms":["나래","만경"],"id":"payoff-p1"}],"reveal":true}],"sources":[{"id":"fma","title":"VIZ · 강철의 연금술사 공식 소개","url":"https://www.viz.com/fullmetal-alchemist","locator":"엘릭 형제의 신체 상실과 회복의 탐색, 국가와 힘의 관계에 관한 출판사 소개."}],"relations":[{"target":"ria","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"ria","anchor":"fault","label":"구제와 침묵을 맞바꾼 날"}}],"shortTitle":"등가교환이 끝난 뒤에도 남는 영수증","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-nobody","title":"아무도 아니므로, 먼저 태우시오","summary":"오디세우스의 이름 장난을 사람을 지우는 기술에서 사람을 살리는 순서로 뒤집는다.","type":"deep","kind":"말과 장면의 연결","tags":["오디세우스","무명","승선 명부"],"sections":[{"id":"reference","title":"이름을 모르게 해서 살아남는 사람","blocks":[{"type":"paragraph","text":"「오디세이아」 9권에서 오디세우스는 자신을 Nobody에 해당하는 이름으로 소개한다. 폴리페모스의 외침이 아무도 자신을 해치지 않는다는 말처럼 들리게 만드는 장난이다. 번역에 따라 표기는 Noman 등으로 달라진다.","terms":[],"citation":"odyssey","id":"reference-p1"}]},{"id":"manifest","title":"이름을 모른다는 것과 사람이 없다는 것","blocks":[{"type":"paragraph","text":"메이의 열일곱 명은 실제로 아무도 아닌 것이 아니다. 접수 체계가 그들의 이름을 아직 알지 못한다. 신원 미확인을 존재 미확인처럼 취급하는 순간 구조가 늦어진다. 메이는 장부를 불태우지 않고 순서를 바꾼다. 살린 뒤에 이름을 묻는다.","terms":["메이"],"id":"manifest-p1"},{"type":"paragraph","text":"훗날 무명이라는 말은 아름다운 희생의 호칭이 된다. 하지만 메이 자신은 이름과 집을 가진 사람이었다. 무명관의 명칭은 신원보다 먼저 침대를 주겠다는 뜻으로 지킬 수 있다. 성녀의 개인적인 삶까지 익명으로 덮을 필요는 없다.","terms":["무명관","메이"],"id":"manifest-p2"}]},{"id":"payoff","title":"돌아오려면 아무도 아니어도 된다","blocks":[{"type":"paragraph","text":"2,400년 뒤의 식당에서 에이렌을 알아보지 못하는 직원은 이야기를 모르는 나쁜 사람이 아니다. 이름을 알아야 좋은 자리를 얻는 세계가 끝났기 때문이다. 과거의 명부에서 비워둔 칸이 미래의 식당에서 아무 자격도 묻지 않는 의자로 돌아온다.","terms":["에이렌"],"id":"payoff-p1"}],"reveal":true}],"sources":[{"id":"odyssey","title":"호메로스 · 오디세이아","url":"https://www.gutenberg.org/files/1727/1727-h/1727-h.htm","locator":"Samuel Butler 번역. 9권의 Nobody 말놀이, 23권의 올리브나무 침대. 번역자 서문의 저자 가설은 채택하지 않았다."}],"relations":[{"target":"future-lastname","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"future-lastname","anchor":"receipt","label":"구원의 마지막 영수증"}}],"shortTitle":"아무도 아니므로, 먼저 태우시오","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-homecoming","title":"돌아온다는 말은 왕좌를 되찾는다는 말일까","summary":"오디세이아의 침대와 만경의 식탁. 기억하는 물건이 소유권을 판정하지 않는 귀환.","type":"deep","kind":"말과 장면의 연결","tags":["오디세이아","귀환","해원","식탁"],"sections":[{"id":"reference","title":"움직일 수 없는 침대","blocks":[{"type":"paragraph","text":"「오디세이아」 23권에서는 살아 있는 올리브나무를 바탕으로 만든 침대의 비밀이 오디세우스와 페넬로페의 재회에 중요하게 쓰인다. 집 안의 작은 물건이 정체성과 함께한 삶을 알아보는 실마리가 되는 장면이다.","terms":["리브"],"citation":"odyssey","id":"reference-p1"}]},{"id":"table","title":"이번에는 식탁이 두 집으로 간다","blocks":[{"type":"paragraph","text":"다온은 자신의 식탁을 알아본다. 그러나 그 물건의 구조를 안다는 이유로 자신이 없는 동안 살아온 가족의 선택을 취소하지 않는다. 귀환은 주인을 증명한 사람이 예전 질서를 자동으로 회복하는 장면이 아니다.","terms":["다온"],"id":"table-p1"},{"type":"paragraph","text":"만경에서는 식탁을 둘로 나누거나 두 집의 실제 만남을 잇는 같은 식탁으로 만들 수 있다. 그러므로 공간 부족을 억지로 만들어 갈등시키지 않는다. 남는 질문은 얼마나 큰 집을 가질까가 아니라 서로를 어떤 관계로 다시 부를까다.","terms":["만경"],"id":"table-p2"}]},{"id":"payoff","title":"해원으로 돌아온다는 말","blocks":[{"type":"paragraph","text":"도시 이름 해원은 작중에서 바다의 너른 공간이라는 표기 海原을 쓰고, 귀환기의 시인들은 원한을 푼다는 말 解冤과 겹쳐 읽는다. 이것은 이 도시의 실제 과거 문명이 한자권이었다는 주장이 아니라 독자가 읽는 이름에 부여한 문학적 겹침이다.","terms":["해원"],"id":"payoff-p1"},{"type":"paragraph","text":"바다로 돌아오는 것과 원한을 푸는 것이 언제나 같은 사건은 아니다. 나래는 용서하지 않은 채 해원으로 돌아올 수 있다. 도시의 이름부터 그 두 길을 하나로 강제하지 않는다.","terms":["나래","해원"],"id":"payoff-p2"}],"reveal":true}],"sources":[{"id":"odyssey","title":"호메로스 · 오디세이아","url":"https://www.gutenberg.org/files/1727/1727-h/1727-h.htm","locator":"Samuel Butler 번역. 9권의 Nobody 말놀이, 23권의 올리브나무 침대. 번역자 서문의 저자 가설은 채택하지 않았다."}],"relations":[{"target":"future-home","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"future-home","anchor":"threshold","label":"집을 알아보는 물건"}}],"shortTitle":"돌아온다는 말은 왕좌를 되찾는다는 말일까","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-sabbath","title":"쉬는 날을 허락하는 사람이 쉬지 못한다면","summary":"선데이, 만나, 오늘의 잼, 신의 당직표. 휴식이 목표 달성의 보상으로만 남지 않게 한다.","type":"deep","kind":"말과 장면의 연결","tags":["페나코니","선데이","성경","휴식"],"sections":[{"id":"reference","title":"낙원을 꿈꾸는 마음 자체는 죄가 아니다","blocks":[{"type":"paragraph","text":"스타레일 2.7의 공식 소개는 선데이가 기존 지위와 축복에서 내려와 필멸자의 모습으로 이상향을 찾는 길을 말한다. 이 연결에서 참고하는 것은 고통을 덜어주려는 이상을 단순한 악의로 처리하지 않고, 이상을 추구하는 자신의 자리도 바꿀 수 있다는 가능성이다.","terms":[],"citation":"sunday","id":"reference-p1"},{"type":"paragraph","text":"출애굽기 16장에서는 각자가 필요한 만큼 거두는 만나와, 미리 마련한 음식으로 쉴 수 있는 일곱째 날이 연결된다. 여기서는 특정 제도를 성서의 정답이라고 선언하지 않고 먹을 것과 쉼을 한 장면에 놓는 이미지로 읽는다.","terms":[],"citation":"manna","id":"reference-p2"}]},{"id":"jam","title":"언젠가의 휴식과 오늘의 잼","blocks":[{"type":"paragraph","text":"공헌청은 다음 교육을 마치면 안정될 것이라고 말한다. 등대동의 잼은 교육을 마치기 전에 식탁에 놓인다. 무엇을 배우는 즐거움을 없애는 것이 아니라, 배움을 그만둔 날의 식사까지 빼앗지 않는 것이다.","terms":["공헌청","등대동"],"id":"jam-p1"},{"type":"paragraph","text":"에이렌에게 더 어려운 일은 이 원칙을 자신에게 적용하는 것이다. 다른 사람에게는 쉬어도 된다고 말하며, 자신에게는 아직 한 사람 더 도울 수 있다는 이유를 계속 붙인다.","terms":["에이렌"],"id":"jam-p2"}]},{"id":"payoff","title":"구원과 구원 사이","blocks":[{"type":"paragraph","text":"구원(救援)과 구원(久遠)을 겹쳐 읽으면, 돕는 일이 끝없이 오래 지속되어야 한다는 묘한 문장이 생긴다. 둘의 어원이 같다는 뜻이 아니라 같은 소리에 다른 한자를 겹친 말놀이다. 신의 퇴근은 이 겹침을 끊는다. 도움은 계속되어도 같은 사람이 영원히 당직일 필요는 없다.","terms":["신의 퇴근"],"id":"payoff-p1"},{"type":"paragraph","text":"메이는 먼저 집에 간다. 미라는 역할 없는 방문을 요청한다. 마지막으로 에이렌이 의자에서 일어난다. 남을 구할수록 자신에게 붙인 입장 조건을 하나씩 걷는 이야기다.","terms":["에이렌","메이","미라"],"id":"payoff-p2"}],"reveal":true},{"id":"order-reading","title":"쉼을 주는 질서의 다른 얼굴","blocks":[{"type":"paragraph","text":"사벨은 선택을 요청하는 일도 지친 사람에게는 또 하나의 일이 될 수 있다고 생각했다. 그의 유예궁은 선데이가 추구한 질서의 낙원이라는 방향을 변주한다. 사벨은 한 질서의 감독이 되고, 에이렌은 원하지 않는 감독을 떠날 출구를 만든다.","citation":"sunday-order","id":"order-reading-p1","terms":["에이렌","유예궁","사벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"선데이와 질서를 따로 읽기","entry":"deep-order-rest"}],"id":"order-reading-p2"}]}],"sources":[{"id":"sunday","title":"HoYoverse · Star Rail 2.7 제작진 소개","url":"https://blog.playstation.com/2024/11/22/honkai-star-rail-version-2-7-bids-farewell-to-penacony-on-december-4/","locator":"개발사 필진의 공식 소개. 선데이가 이전의 축복과 지위에서 내려와 인간으로서 이상향을 찾는 설명. 2.7 공개 범위만 사용."},{"id":"manna","title":"출애굽기 16:16–30 · 만나와 쉬는 날","url":"https://www.biblegateway.com/passage/?search=Exodus+16%3A16-30&version=NIV","locator":"각자 필요한 양과 일곱째 날의 쉼에 관한 본문. 현대 정책의 단일한 성서적 정답으로 제시하지 않는다."},{"id":"sunday-order","title":"붕괴: 스타레일 · 선데이 공식 소개","url":"https://wiki.hoyolab.com/pc/hsr/entry/3150?lang=ko-kr","locator":"HoYoWiki 인물 소개: 「질서」의 좋은꿈과 이상을 버리지 않는 인물. 캐릭터 페이지는 동적 페이지이며 색인된 소개문을 확인했다. 전투 속성 「화합」과 본편에서 추구한 「질서」를 혼동하지 않는다."}],"relations":[{"target":"future-offduty","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"future-offduty","anchor":"handover","label":"인계장의 앞뒤가 바뀐다"}}],"shortTitle":"쉬는 날을 허락하는 사람이 쉬지 못한다면","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-fetter","title":"신을 묶는 실 — 고양이 발소리 대신 감사로","summary":"글레이프니르와 로키의 고독을, 파괴하지 않고 떠나는 신의 이야기로 돌린다.","type":"deep","kind":"말과 장면의 연결","tags":["북유럽신화","로키","TVA","당직표"],"sections":[{"id":"reference","title":"가느다란 것이 더 강하다","blocks":[{"type":"paragraph","text":"「신 에다」의 글레이프니르는 고양이의 발소리, 산의 뿌리 등 기이한 재료로 만든 부드러운 속박이다. 티르는 약속의 담보로 손을 내놓는다. 강한 존재를 붙잡는 것이 반드시 두꺼운 쇠사슬의 모양은 아니라는 점을 참고한다.","terms":[],"citation":"edda","id":"reference-p1"},{"type":"paragraph","text":"로키 시즌 2 결말에 관한 톰 히들스턴 인터뷰는 다중우주를 책임지는 선택의 고독을 다룬다. 그 장면의 고귀함을 부정하기보다, 만경은 세계의 존속을 한 사람의 영원한 고독에 묶지 않는 방향으로 질문을 바꾼다.","terms":["만경"],"citation":"loki","id":"reference-p2"}]},{"id":"thread","title":"존재하지 않는 의무의 재료","blocks":[{"type":"paragraph","text":"에이렌을 묶는 실은 요청받지 않은 약속, 이미 받은 감사, 자신이 없어도 해결될 내일이다. 이 목록은 에다의 원문 재료가 아니라 이 작품이 새로 만든 은유다. 시민들은 그가 떠나면 망하지 않는다. 그는 그 사실을 알면서도 누군가 자신을 찾을 가능성 앞에서 늘 남는다.","terms":["에이렌"],"id":"thread-p1"},{"type":"paragraph","text":"그래서 마지막 과제는 적을 죽여 속박을 끊는 일이 아니다. 자기 역할이 유일해야만 자기 삶이 귀하다는 믿음을 자기 자신에게도 적용하지 않는 일이다. 에이렌의 권능을 빼앗거나 주민을 위험에 빠뜨려 퇴직을 강요하지 않는다.","terms":["에이렌"],"id":"thread-p2"}]},{"id":"payoff","title":"세계수 대신 옆문","blocks":[{"type":"paragraph","text":"큰 나무가 모든 세계를 혼자 받치는 구도 대신 만경의 집들은 서로 만나기로 한 문을 갖는다. 세계가 계속되는 이유는 신이 아직 앉아 있어서가 아니라 시민들이 자기 세계를 이미 유지할 수 있기 때문이다.","terms":["만경"],"id":"payoff-p1"},{"type":"paragraph","text":"마지막 식당에서 그는 기적을 보여주지 않는다. 내일 친구를 데려와도 되느냐고 묻는다. 영원의 수호자보다 오래된 역할, 손님으로 돌아온다.","terms":[],"id":"payoff-p2"}],"reveal":true}],"sources":[{"id":"edda","title":"스노리 · 신 에다","url":"https://www.gutenberg.org/files/18947/18947-h/18947-h.htm","locator":"Rasmus B. Anderson 번역의 본문: Gylfaginning 8절의 이미르, 34절의 글레이프니르. 번역자 서문의 종교 해석과 구별했다."},{"id":"loki","title":"톰 히들스턴 인터뷰 · Loki 시즌 2 결말","url":"https://ew.com/tom-hiddleston-loki-season-2-finale-8402285","locator":"Entertainment Weekly의 배우 인터뷰. 다중우주를 맡으며 선택한 고독한 역할과 주체성의 질문. 이후 MCU 전개는 범위 밖이다."}],"relations":[{"target":"future-offduty","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"future-offduty","anchor":"door","label":"한 사람만 통과하지 못한 출구"}}],"shortTitle":"신을 묶는 실","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"deep-ribs","title":"거인의 뼈로 만든 도시 — 무엇을 제물로 삼지 않을 것인가","summary":"이미르의 몸과 해원의 선체. 장대한 지형을 살리되 숨은 희생자를 만들지 않는 변형.","type":"deep","kind":"말과 장면의 연결","tags":["북유럽신화","이미르","해원","지형"],"sections":[{"id":"reference","title":"세계가 한 몸이었다는 그림","blocks":[{"type":"paragraph","text":"「신 에다」의 창세 이야기에서는 이미르의 몸과 뼈, 두개골로 대지와 바위, 하늘이 만들어진다. 해원의 늑골길은 이 거대한 몸의 지형을 연상시키지만, 실제 거인을 죽여 도시의 에너지로 쓰는 설정은 아니다.","terms":["늑골길","해원"],"citation":"edda","id":"reference-p1"}]},{"id":"hull","title":"선체의 흉터가 도시의 계단이 된다","blocks":[{"type":"paragraph","text":"해원의 거인은 세 척의 배다. 갈비뼈는 선체의 구조재, 심장은 옛 기관실, 목소리는 조난등과 무전이다. 사물을 몸처럼 부르지만 그 사물 안에 몰래 의식을 가두지 않는다. 커다란 이미지와 윤리적 함정은 같은 것이 아니다.","terms":["해원"],"id":"hull-p1"},{"type":"paragraph","text":"거꾸로 붙은 객실 번호는 우주가 뒤집혔다는 떡밥이 아니라 착저한 배를 도시로 고치며 생긴 흔적이다. 계단을 내려갈수록 거대한 신화가 작고 구체적인 노동으로 바뀐다. 그 노동이 작다고 가치가 줄지는 않는다.","terms":[],"id":"hull-p2"}]},{"id":"payoff","title":"배가 세 척인 이유","blocks":[{"type":"paragraph","text":"질서의 배, 기록의 배, 생활의 배가 서로를 지탱한다. 어느 한 배가 숨겨진 진짜 배라는 반전은 없다. 기념 무대에서는 인물 하나가 문명의 모든 역할을 대표할 수 없다는 사실로 돌아온다.","terms":[],"id":"payoff-p1"}],"reveal":true}],"sources":[{"id":"edda","title":"스노리 · 신 에다","url":"https://www.gutenberg.org/files/18947/18947-h/18947-h.htm","locator":"Rasmus B. Anderson 번역의 본문: Gylfaginning 8절의 이미르, 34절의 글레이프니르. 번역자 서문의 종교 해석과 구별했다."}],"relations":[{"target":"world-route","label":"장면으로 돌아가기","reason":"해설보다 먼저 있었던 사람과 사물을 다시 읽는다.","evidence":{"entry":"world-route","anchor":"rib","label":"선체 아래 · 이름보다 먼저 놓인 침대"}}],"shortTitle":"거인의 뼈로 만든 도시","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"giants-opening","title":"서막 — 선생님, 낙원이 완성됐습니다","summary":"에이렌은 죽은 스승을 만나러 간다. 스승은 해원 인구의 대부분을 죽이려 했던 의사다.","type":"story","kind":"장면","tags":["두 번째 이야기","아벨","에이렌"],"sections":[{"id":"arrival","title":"귀환제 다음 달 · 대기실의 남자","blocks":[{"type":"paragraph","text":"대기실에는 의자 두 개와 창문 하나가 있었다. 창밖의 아이들은 같은 경기에서 모두 이겼다. 잠시 뒤 서로 다른 우승컵을 들고 한 식탁에 모였다. 아벨 노에는 마지막 슛이 어느 쪽 골대로 들어갔는지 묻지 않았다.","id":"arrival-p1","terms":["아벨 노에","아벨"]},{"type":"paragraph","text":"그는 두 아이가 아직 살아 있는지 물었다.","id":"arrival-p2","terms":[]},{"type":"dialogue","speaker":"에이렌","text":"둘 다요. 여기서 보시는 두 아이는 지금 직접 만나는 중입니다. 경기의 갈라진 순간에는 의식 없는 꿈배역이 상대를 맡았고요.","id":"arrival-p3","terms":["꿈배역"]},{"type":"paragraph","text":"아벨은 오랫동안 창밖을 보았다. 그가 감옥에서 불가능하다고 써두었던 삶은 유리가 없어도 멀쩡히 이어지고 있었다.","id":"arrival-p4","terms":["아벨"]},{"type":"dialogue","speaker":"에이렌","text":"선생님, 낙원이 완성됐습니다.","id":"arrival-p5","terms":[]},{"type":"dialogue","speaker":"아벨","text":"그럼…… 그때 내가 고른 결말은 필요 없었군.","id":"arrival-p6","terms":[]}]},{"id":"name","title":"살아 돌아온 사람의 이름","blocks":[{"type":"paragraph","text":"문이 열렸다. 이사 렌이 물을 가져왔다. 아벨은 컵보다 그 얼굴을 먼저 알아봤다. 사십이 년 전, 자신의 서명 아래 죽은 삼백열두 사람 중 하나였다.","id":"name-p1","terms":["이사 렌","아벨","이사"]},{"type":"paragraph","text":"이사는 귀환제 동안 먼저 돌아와 자기 삶을 시작했다. 이 만남은 본인이 신청했다. 피해자를 가해자의 반성을 이끌어내는 소품으로 초대한 자리가 아니었다.","id":"name-p2","terms":["귀환제","이사"]},{"type":"dialogue","speaker":"이사","text":"그때는 정말 다른 방법이 없었다고 말하실 건가요?","id":"name-p3","terms":[]},{"type":"dialogue","speaker":"아벨","text":"만경은 없었지.","id":"name-p4","terms":["만경"]},{"type":"dialogue","speaker":"이사","text":"그건 알아요. 만경이 없었다는 것과, 나를 죽여도 됐다는 건 다른 말이잖아요.","id":"name-p5","terms":["만경"]},{"type":"paragraph","text":"아벨은 컵을 내려놓았다. 긴 저녁 이후 마흔두 해가 흘렀고, 그중 스물네 해 동안 그는 죽어 있었다. 돌아왔다고 그 질문을 지나온 것은 아니었다.","id":"name-p6","terms":["아벨"]}]},{"id":"book","title":"먼저 읽어야 할 것은 마지막 장이 아니었다","blocks":[{"type":"paragraph","text":"에이렌은 낡은 책을 꺼냈다. 책등에는 《모두를 위한 마지막 저녁》이라고 적혀 있었다. 만경의 금서도, 기적의 작동법도 아니다. 범죄자가 썼고 시민 누구나 열람할 수 있는 책이다.","id":"book-p1","terms":["모두를 위한 마지막 저녁","에이렌","만경"]},{"type":"paragraph","text":"리아가 기다리는 추가 증언 자리로 가기 전에, 세 사람은 아벨이 처음으로 무료 식당을 열었던 날부터 이야기하기로 했다. 살인을 이해할 사연이 없어서가 아니다. 이해와 허가를 같은 말로 만들지 않기 위해서다.","id":"book-p2","terms":["리아","아벨"]},{"type":"quote","text":"그는 태어날 때부터 사람을 줄이려던 사람이 아니었다.\n그 사실이, 끝내 사람을 줄이려 했다는 사실을 덮어주지도 않는다.","attribution":"거인들의 유언 · 서막","id":"book-p3","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"거인들이 살던 시대부터","entry":"giants-atlas"},{"label":"아벨의 생애를 바로 읽기","entry":"abel"},{"label":"그를 막은 밤으로","entry":"long-evening"}],"id":"book-p4"}]}],"sources":[],"relations":[{"target":"abel","label":"대기실의 남자","reason":"그가 어떤 개혁을 지지하다 어느 선을 넘었는지 읽는다.","evidence":{"entry":"abel","anchor":"life","label":"그가 처음 멈춘 것은 사람의 삶이 아니었다"}}],"spoiler":false,"era":"공통력 개원 1개월 뒤","shortTitle":"서막","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"giants-atlas","title":"거인들의 시대 — 일곱 해법이 남긴 도시","summary":"권리, 능력, 미래, 마음, 질서, 죽음, 동행. 사람을 구하는 방법들이 실제로 충돌했던 백여 년.","type":"guide","kind":"읽기 길잡이","tags":["역사 인물","입문","해법 비교"],"sections":[{"id":"question","title":"한 가지 병을 일곱 가지로 진단했다","blocks":[{"type":"paragraph","text":"해원은 굶주림에서 벗어났지만 사람을 등급으로 말하는 버릇은 버리지 못했다. 누군가는 분배를, 누군가는 능력을, 누군가는 비교하는 마음을 문제로 보았다. 일곱 사람은 같은 실패를 일곱 번 반복한 것이 아니다. 다른 문제를 실제로 해결했고, 그 성공을 어디까지 넓혀도 되는지에서 갈라졌다.","id":"question-p1","terms":["해원"]},{"type":"paragraph","text":"이 시대의 기술은 물건을 충분히 만들고 일부 능력과 감각을 바꿀 수 있었지만, 각자에게 독립적인 현실과 확실한 부활을 제공하지는 못했다. 백지의 발견은 훨씬 뒤의 공동 연구다. 옛 사람들에게 미래의 전능이 있었다고 가정하고 그들의 선택을 평가하지는 않는다. 그렇다고 힘이 없었다는 사실이 학살을 허가하는 것도 아니다.","id":"question-p2","terms":["백지"]}]},{"id":"seven","title":"먼저 한 사람의 해법을 고르기","blocks":[{"type":"paragraph","text":"요벨 세라 — 살아갈 권리는 기여에 대한 대가가 아니다. 기본 생활권을 남긴 입법자.\n프로네 다엔 — 능력이 부족하다면 능력을 모두에게 나누자. 개방된 기술의 거인.\n카산 로 — 실패할 길로 들어서기 전에 길을 바꾸자. 예측을 행정으로 만든 사람.\n레테 미르 — 비교가 상처가 되지 않는 마음을 만들자. 동의의 경계를 넘은 치료자.\n사벨 오르 — 누구도 쓸모없는 배역을 받지 않는 질서. 한 개의 좋은꿈을 운영한 섭정.\n아벨 노에 — 살아갈 만한 내일을 보장할 수 없다면 고통의 주체를 없애자. 긴 저녁의 가해자.\n리브 아렌 — 성공을 보장하지 못해도 혼자 기다리게 두지는 말자. 작은 내일을 조직한 반대자.","id":"seven-p1","terms":["프로네 다엔","레테 미르","리브 아렌","사벨 오르","아벨 노에","요벨 세라","긴 저녁","카산 로","생활권","프로네","레테","리브","사벨","아벨","요벨","카산"]},{"type":"choice","label":"서로 다른 진단을 따라 읽기","options":[{"label":"§ 요벨 — 대가 없는 밥","entry":"yobel"},{"label":"§ 프로네 — 사다리가 된 선물","entry":"prone"},{"label":"§ 카산 — 너무 잘 맞은 예언","entry":"kasan"},{"label":"§ 레테 — 감사가 도착한 뒤","entry":"lethe-person"},{"label":"§ 사벨 — 누구나 필요한 도시","entry":"sabel"},{"label":"§ 아벨 — 다수의 안락이라는 이름","entry":"abel"},{"label":"§ 리브 — 한 사람을 남겨두지 않기","entry":"liv"}],"id":"seven-p2"}]},{"id":"inheritance","title":"악당의 유산이라고 모두 버릴 수 없는 이유","blocks":[{"type":"paragraph","text":"의료원의 통증 돌봄 기준에는 아벨이 남긴 좋은 문장이 있다. 회복원의 퇴소 심사에는 사벨의 보호 관행과 카산의 예측 서식이 섞여 있다. 배움의 도구는 프로네의 공개 기술이며, 식량을 끊을 수 없는 권리는 요벨의 법에서 왔다. 리브의 주소망은 리아의 미결 우체국으로 이어진다.","id":"inheritance-p1","terms":["미결 우체국","주소망","프로네","회복원","리브","리아","사벨","아벨","요벨","카산"]},{"type":"paragraph","text":"인물 한 명의 선악을 확정해도 도시 전체를 깨끗하게 분류할 수는 없다. 무엇을 이어받고 무엇을 폐기했는지, 그 선택을 살아 있는 사람들이 해야 한다.","id":"inheritance-p2","terms":[]}]},{"id":"scale","title":"이것은 우주에 예정된 일곱 신의 계보가 아니다","blocks":[{"type":"paragraph","text":"일곱은 해원 교과서가 자주 묶는 인물의 수다. 주변 정착지에는 다른 실험과 인물이 더 많았다. 이들은 전부 친척도, 같은 조직의 단원도 아니다. 같은 시대에 상대의 정책 아래 살고, 반대하고, 나중에 서로의 기술을 쓰게 된 사람들이다.","id":"scale-p1","terms":["해원"]},{"type":"paragraph","text":"한 사람씩 마법의 유품을 모아야 만경이 열린다는 장치는 없다. 남은 것은 기술, 법, 편지, 잘못된 승인 관행이다. 대단한 유물이 아니라 지금도 쓰는 양식 한 줄이 더 오래 사람의 삶을 움직인다.","id":"scale-p2","terms":["만경"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"시대와 기술을 한눈에","entry":"before-paradise"},{"label":"서로의 원인이 된 사건들","entry":"inheritance-war"},{"label":"이름의 겹뜻과 원전","entry":"names-of-giants"}],"id":"scale-p3"}]}],"sources":[],"relations":[{"target":"inheritance-war","label":"역사의 연결","reason":"서로 싸운 사람들의 제도가 한 기관에 함께 남는다.","evidence":{"entry":"inheritance-war","anchor":"network","label":"한 줄 계보 대신 충돌하는 연결"}}],"spoiler":false,"shortTitle":"거인들의 시대","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"before-paradise","title":"낙원 이전 — 풍요가 온 순서","summary":"172년의 역사를 넓히되, 물질의 풍요·마음의 기술·전능의 등장을 같은 시점으로 섞지 않는다.","type":"world","kind":"세계 설정","tags":["시대 구분","기술","연방"],"sections":[{"id":"scope","title":"바다 바깥에도 사람들이 있었다","blocks":[{"type":"paragraph","text":"해원은 우주 전체의 유일한 도시가 아니다. 항로 붕괴 뒤 세 척의 구조선을 토대로 재건한 해안 연방의 중심 항구다. 주변 열네 정착지와 물자·기술·시민 이동을 이어간다. 본편이 해원을 따라가는 이유는 만경의 첫 공개 실험과 그 배분 논쟁이 이곳에서 일어났기 때문이다.","id":"scope-p1","terms":["만경","해원"]},{"type":"paragraph","text":"인간을 비롯해 서로 다른 생태를 가진 이웃들은 전부 인간의 공헌 점수로 환산되지 않는다. 일곱 거인의 논쟁은 인간 중심 행정권의 역사다. 에이렌은 그 문헌을 우주 모든 유기체의 보편적 정답으로 발표하지 않는다.","id":"scope-p2","terms":["에이렌"]}]},{"id":"eras","title":"세 번의 문턱","blocks":[{"type":"paragraph","text":"개원 172년 전~89년 전: 복구기. 구조선과 요벨의 공동 배급이 도시를 살린다. 물질은 제한되며 숙련이 생산에 중요하다.\n개원 88년 전~4년 전: 풍요기. 기본 식량·주거·에너지는 넉넉하지만 기술 접근과 의사 결정권은 불평등하다. 원하는 현실을 모두 만들 수는 없다.\n개원 3년 전~1년 전: 백지를 공개하고, 사람이 없는 환경부터 동의한 참여자의 단기 체험까지 순차 검증한다.\n개원 1년 전~개원일: 시범 거주와 나래의 분기.\n개원일 이후: 연구 참여 절차 없이 이용하는 일반 개원. 귀환제는 개원을 기념하는 한 달의 행사다.","id":"eras-p1","terms":["백지","요벨"]}]},{"id":"retirement","title":"그런데 미라의 마지막 당직은 왜 30년 전인가","blocks":[{"type":"paragraph","text":"풍요가 시작된 날 모든 직무가 동시에 사라진 것은 아니다. 기초 생산의 자동화 뒤에도 항로 구조·예외 판단·공적 관리 같은 일은 남았다. 미라의 마지막 당직은 그중 해상 구조 현장의 마지막 세대가 물러난 날이다. 문명이 그날 갑자기 풍요로워졌다는 뜻이 아니다.","id":"retirement-p1","terms":["미라"]}]},{"id":"scarcity","title":"부족한 물건과 부족하게 만든 자리를 구별하기","blocks":[{"type":"paragraph","text":"공헌청의 문제는 산소가 모자라서 발언권을 줄여야 했다는 것이 아니다. 자신들의 결정권을 유지하려 평가와 의제 발의의 통로를 좁혀둔 데 있다. 사랑과 인정은 복제한 식량처럼 일괄 공급할 수 없지만, 그것이 시민권까지 차등 배분해야 한다는 근거는 아니다.","id":"scarcity-p1","terms":["공헌청"]},{"type":"paragraph","text":"이 구별 때문에 사회 개혁은 만경보다 먼저 실제 성과를 낸다. 낙원은 불평등을 고치지 않고 환상을 나눠주는 값싼 대체재가 아니다. 고친 사회에서도 남을 수 있는 서로 양립하지 않는 소망까지 다루는 추가 선택이다.","id":"scarcity-p2","terms":["만경"]}]}],"sources":[],"relations":[{"target":"timeline","label":"시간순 기록","reason":"풍요와 전능 사이에 여러 세대가 있었다.","evidence":{"entry":"timeline","anchor":"fleet","label":"개원 172년 전 · 세 척의 구조선"}}],"spoiler":false,"shortTitle":"낙원 이전","preview":"","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"yobel","title":"요벨 세라 — 공짜로 먹는 사람들의 입법자","summary":"도시의 장부에서 목숨값을 지웠다. 그러나 무대의 순서까지 바꾸지는 못했다.","type":"character","kind":"역사의 인물","tags":["위인","생활권","부분적 성공"],"sections":[{"id":"life","title":"먼저 살려두고 나중에 청구하는 도시","blocks":[{"type":"paragraph","text":"요벨의 어머니는 구조선에서 살려준 대가를 평생 공헌으로 갚았다. 누구도 그녀를 굶기지는 않았지만, 투표소에서는 구조 채무가 남아 있다는 말을 들었다. 구조는 끝났는데 구조비는 끝나지 않았다.","id":"life-p1","terms":["요벨"]},{"type":"paragraph","text":"장부원 출신 요벨은 은혜를 부정하지 않았다. 빚을 다 갚아야만 시민이 되는 조건을 반대했다. 메이가 생전에 고친 승선 명부를 근거로, 구조 비용은 수혜자 한 사람에게 청구할 수 없는 공동의 비용이라고 주장했다.","id":"life-p2","terms":["메이","요벨"]}]},{"id":"gift","title":"그가 실제로 남긴 승리","blocks":[{"type":"paragraph","text":"개원 129년 전, 요벨의 생활권 조항이 통과된다. 기본 식량·거처·치료를 기여 채무의 담보로 삼을 수 없고, 재난 채무는 정기적인 공적 정산으로 끝낸다. 후대의 악한 통치자조차 주민의 식량부터 끊지는 못한 이유다.","id":"gift-p1","terms":["생활권","요벨"]},{"type":"paragraph","text":"그는 전부 이기지는 못했다. 공헌청은 전문 심의와 공공 전시의 우선순위를 별도 자격으로 묶어두었다. 배는 든든해졌지만 중요한 말은 여전히 높은 등급부터 했다. 요벨의 성공은 거짓이 아니고, 충분하지도 않았다.","id":"gift-p2","terms":["공헌청","요벨"]}]},{"id":"scene","title":"마지막 채무자","blocks":[{"type":"paragraph","text":"새 법의 첫날, 한 노인이 식량 배급구에서 손목표를 내밀었다. 직원이 이제 필요 없다고 하자, 노인은 그 표를 버리지 않고 안주머니에 넣었다. 평생 갚은 시간이 아무 일도 아니게 된 것 같았기 때문이다.","id":"scene-p1","terms":[]},{"type":"dialogue","speaker":"요벨","text":"그 시간이 없었다는 법이 아닙니다. 더 갚지 않아도 된다는 법입니다.","id":"scene-p2","terms":[]},{"type":"paragraph","text":"요벨은 자신의 이름을 붙인 축하 행사를 짧게 끝냈다. 배급구가 아직 열려 있을 때 모두 집으로 돌아갈 수 있도록.","id":"scene-p3","terms":["요벨"]}]},{"id":"after","title":"다음 사람이 가져간 질문","blocks":[{"type":"paragraph","text":"프로네는 요벨의 법으로 무료 교육을 받았고, 살아갈 권리 다음에는 잘할 능력도 나눠야 한다고 생각했다. 아벨은 훗날 이 법을 지지하면서도 밥만 보장한 채 절망을 방치한다고 비판했다. 리브는 먼저 밥을 보장했기 때문에 다른 삶을 기다릴 시간이 생겼다고 답했다.","id":"after-p1","terms":["프로네","리브","아벨","요벨"]},{"type":"paragraph","text":"만경은 요벨의 법을 쓸모없어진 예비 단계로 폐기하지 않는다. 전능을 쓰지 않는 동네에서도 생활권은 계속 유효하다.","id":"after-p2","terms":["생활권","만경","요벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"이름: 나팔과 희년","entry":"deep-jubilee"},{"label":"요벨 이후의 프로네","entry":"prone"}],"id":"after-p3"}]}],"sources":[],"relations":[{"target":"deep-jubilee","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-jubilee","anchor":"source","label":"원전 · 희년의 나팔"}}],"spoiler":false,"era":"생애: 개원 166년 전~87년 전 · 생활권 법: 129년 전","motive":{"출발":"살려준 비용을 평생 갚는 어머니의 장부","선택":"기여와 생존권을 분리","남긴 비용":"명예와 결정권의 서열까지 해체하지 못했다"},"shortTitle":"요벨 세라","preview":"살아갈 권리를 기여의 대가와 분리하려 했던 입법자.","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"prone","title":"프로네 다엔 — 천재를 공공재로 만들려던 사람","summary":"정말로 더 많은 사람이 더 많은 것을 할 수 있게 됐다. 그 뒤에도 맨 위 자리는 하나였다.","type":"character","kind":"역사의 인물","tags":["위인","능력","공개 기술"],"sections":[{"id":"life","title":"문제의 원인을 사람 안에서 본 발명가","blocks":[{"type":"paragraph","text":"요벨의 법 아래 자란 프로네는 기술 도서관의 폐문 시간마다 문턱에 앉아 복습했다. 무능해서가 아니라 비싼 인지 보조 장치를 쓰지 못해 속도가 느렸다. 장치 하나를 빌린 뒤 같은 사람이 전혀 다른 성과를 내자, 그는 재능의 상당 부분이 접근권의 다른 이름임을 보았다.","id":"life-p1","terms":["프로네","요벨"]}]},{"id":"gift","title":"사다리를 훔친 날","blocks":[{"type":"paragraph","text":"개원 76년 전, 프로네는 자신이 개발한 학습·운동 보조 체계의 사용권을 공개했다. 실제로 치료를 더 잘하고 연구를 시작하며 작품을 완성하는 사람들이 늘었다. 장치에는 숨겨진 생명 연료도, 능력과 교환해야 할 영혼도 없었다.","id":"gift-p1","terms":["프로네"]},{"type":"paragraph","text":"그가 받은 형벌은 신의 쇠사슬이 아니라 계약 위반 재판이었다. 그는 독점 면허를 잃었지만 기술은 이미 공공 도서관으로 퍼졌다. 당시의 성공은 만경 이전 문명에 남아 지금도 쓰인다.","id":"gift-p2","terms":["만경"]}]},{"id":"failure","title":"모두가 올라갔는데도 떨어지는 사람","blocks":[{"type":"paragraph","text":"공헌청은 더 많은 사람이 새 기준에 도달하자 평가 기준을 상대 순위로 다시 높였다. 프로네의 학생들은 예전의 교수보다 많은 일을 했지만 여전히 아래 등급이 될 수 있었다. 프로네는 능력을 모두에게 주는 일과 위계의 이유를 없애는 일이 다름을 뒤늦게 배웠다.","id":"failure-p1","terms":["공헌청","프로네"]},{"type":"paragraph","text":"그는 한동안 가장 낮은 사람도 다음 장치를 받으면 된다고 설득했다. 그 말이 무한한 업그레이드의 의무가 되는 순간을 알아차리기까지 오래 걸렸다. 회복원의 교육 체계는 그의 선물과 이 늦은 깨달음 모두에서 시작한다.","id":"failure-p2","terms":["회복원"]}]},{"id":"students","title":"다른 길을 고른 두 제자","blocks":[{"type":"paragraph","text":"의료 연구에서 함께 일했던 아벨과 레테는 정반대로 갔다. 아벨은 고통을 겪을 사람을 줄이려 했고, 레테는 같은 사건이 상처가 되는 마음을 바꾸려 했다. 프로네는 둘 모두에게 동의하지 않았지만 자신의 기술이 실제로 그들의 체계를 가능하게 했다는 책임도 피하지 않았다.","id":"students-p1","terms":["프로네","레테","아벨"]},{"type":"quote","text":"불을 나눠준 다음에는, 불을 안 켜겠다는 사람의 방도 남겨뒀어야 했다.","attribution":"프로네의 공개 면허 마지막 주석","id":"students-p2","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"불이 선물이 되는 조건","entry":"deep-open-fire"},{"label":"제자 아벨","entry":"abel"},{"label":"제자 레테","entry":"lethe-person"}],"id":"students-p3"}]}],"sources":[],"relations":[{"target":"yobel","label":"선행한 생활권","reason":"배우는 동안 먹고 살 권리가 기술의 공개를 받쳤다.","evidence":{"entry":"yobel","anchor":"life","label":"먼저 살려두고 나중에 청구하는 도시"}},{"target":"deep-open-fire","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-open-fire","anchor":"source","label":"원전 · 도구를 나누는 존재"}}],"spoiler":false,"era":"생애: 개원 124년 전~39년 전 · 기술 공개: 76년 전","motive":{"출발":"능력 차이처럼 보였던 장치 접근의 차이","선택":"학습·감각 기술의 독점권 포기","남긴 비용":"더 좋아져야만 존중받는 기준까지는 바꾸지 못했다"},"shortTitle":"프로네 다엔","preview":"능력을 높이는 기술을 널리 공개한 발명가.","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"kasan","title":"카산 로 — 아무도 틀렸다고 말하지 않은 예언자","summary":"미래를 보지는 못했다. 미래에 들어가는 자리를 배정했다.","type":"character","kind":"역사의 인물","tags":["예언","지원 배정","실패한 개혁"],"sections":[{"id":"life","title":"빨리 알았더라면 막을 수 있었던 일","blocks":[{"type":"paragraph","text":"카산은 구조선의 정비 예측을 연구했다. 위험한 부품을 미리 교체하고 항해 일정을 바꾸는 기술로 사고를 줄였다. 예측이 맞는 것은 재앙을 맞히는 일이 아니라 재앙이 오지 않게 하는 일이었다. 그 성공을 사람의 진로에도 적용하고 싶어졌다.","id":"life-p1","terms":["카산"]}]},{"id":"success","title":"정답원이 처음 열렸을 때","blocks":[{"type":"paragraph","text":"개원 67년 전, 정답원은 적성·교육·취업을 연결했다. 더 알맞은 교육을 받는 사람이 늘었고 중도 포기와 생활 불안도 줄었다. 카산의 보고서는 가능한 조건과 오차를 적었다. 처음부터 거짓 예언을 팔았던 것은 아니다.","id":"success-p1","terms":["정답원","카산"]}]},{"id":"trap","title":"권고의 옆에 자원 배정이 붙었다","blocks":[{"type":"paragraph","text":"공헌청은 지원을 낭비하지 않으려 예측에 맞는 진로에만 장비와 전시 기회를 주었다. 권장된 길의 성공률은 높아지고, 거절한 길은 지원을 잃어 실제로 실패하기 쉬워졌다. 예측이 사람을 이해해서 맞았는지, 예측이 길을 막아서 맞았는지가 섞였다.","id":"trap-p1","terms":["공헌청"]},{"type":"paragraph","text":"카산은 이 문제를 알면서도 모든 경로를 열면 도움이 가장 필요한 사람부터 다시 실패할 것이라고 주장했다. 감독받지 않는 자유와 입증된 기회 중 후자를 우선했다. 그의 과오는 부정확한 숫자 하나가 아니라, 숫자를 믿고 싶다는 이유로 반례가 자랄 자리를 닫은 선택이었다.","id":"trap-p2","terms":["카산"]}]},{"id":"scene","title":"두 문장 사이의 여백","blocks":[{"type":"paragraph","text":"한 학생이 상담문을 들고 왔다. 원문에는 “이 지원 조건에서는 다른 진로보다 성공 가능성이 낮다”라고 적혀 있었다. 학교가 나눠준 요약에는 “당신은 이 일을 할 수 없다”라고 적혀 있었다.","id":"scene-p1","terms":[]},{"type":"dialogue","speaker":"학생","text":"둘 중 어느 문장에 선생님 이름을 남길까요?","id":"scene-p2","terms":[]},{"type":"paragraph","text":"카산은 전자를 선택했다. 그러나 후자의 효력으로 이미 거절한 학생들의 시간까지 되돌릴 수는 없었다. 그가 공개한 배정 기록은 훗날 리아가 조건 없는 재심을 요구하는 근거가 된다.","id":"scene-p3","terms":["리아","카산"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"카산드라: 믿지 않는 예언을 뒤집기","entry":"deep-cassan"},{"label":"배정 기록이 회복원에 남긴 것","entry":"inheritance-war"}],"id":"scene-p4"}]},{"id":"missing-passengers","title":"예측표에서 빠진 이용자","blocks":[{"type":"paragraph","text":"카산의 정답원을 계승한 수요 예측은 환상선 바깥의 노선 투자에도 쓰였다. 승인되지 않은 길의 신청이 실제 수요로 집계되지 않자 그 길을 지원할 근거가 계속 부족해졌다. 뒤의 배차 담당자는 긴 저녁에 그 주석을 읽고 현장 확인과 예외 운행을 승인한다.","id":"missing-passengers-p1","terms":["긴 저녁","정답원","환상선","카산"]},{"type":"paragraph","text":"카산이 미래를 보고 학살이나 만경을 설계했다는 비밀은 없다. 사람을 잘 안내하려던 모델과 행정 양식이, 자신이 만든 결과를 외부의 운명처럼 되읽는 문제가 남은 것이다.","id":"missing-passengers-p2","terms":["카산","만경"]}]}],"sources":[],"relations":[{"target":"society","label":"배정의 기준","reason":"능력 예측이 발언권과 지원을 고르는 서식이 된다.","evidence":{"entry":"society","anchor":"origin","label":"처음에는 필요한 기관이었다"}},{"target":"deep-cassan","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-cassan","anchor":"source","label":"원전 · 카산드라의 불신"}}],"spoiler":false,"era":"생애: 개원 111년 전~37년 전 · 정답원: 67년 전","motive":{"출발":"예측으로 사고를 막아본 성공","선택":"사람에게도 가장 안전한 길을 배정","남긴 비용":"추천이 스스로 맞도록 다른 길을 닫았다"},"shortTitle":"카산 로","preview":"선택의 결과를 예측해 진로를 안내하던 연구자.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"lethe-person","title":"레테 미르 — 고통보다 먼저 마음을 고친 사람","summary":"치료받은 사람들은 실제로 행복해졌다. 문제는 그 전에 했던 거절이었다.","type":"character","kind":"역사의 인물","tags":["마음","동의","부분적 성공"],"sections":[{"id":"life","title":"질투가 없어진 뒤에도 음악은 남았다","blocks":[{"type":"paragraph","text":"레테는 어릴 때부터 재능 있는 연주자를 사랑했고, 사랑하는 사람의 연주를 들을 때마다 자기 음악을 미워했다. 자신에게 화가 나면서도 그 반응을 멈추기 어려웠다. 프로네와 연구하며 외부 평가와 자기 존재를 강하게 묶는 반응을 완화하는 기술을 만들었다.","id":"life-p1","terms":["프로네","레테"]},{"type":"paragraph","text":"첫 적용은 자기 자신이었다. 타인의 음악을 여전히 아름답다고 느꼈고 자신의 음악도 계속 만들었다. 성취욕과 감정이 전부 사라지지 않았다. 레테는 처음으로 상대의 연주가 끝난 뒤에도 자기 악기를 치우지 않았다.","id":"life-p2","terms":["레테"]}]},{"id":"gift","title":"다른 삶으로 걸어나온 사람들","blocks":[{"type":"paragraph","text":"개원 58년 전, 충분히 설명을 듣고 자원한 성인들의 치료가 시작된다. 기록을 보존하고 변화에 관해 말할 수 있게 했다. 레테는 사회의 모욕을 그대로 둬도 된다고 말하지 않았지만, 사회가 바뀔 때까지 개인이 아파야 할 이유도 없다고 주장했다.","id":"gift-p1","terms":["레테"]}]},{"id":"crossing","title":"바뀐 사람의 감사가 바꾸기 전의 동의인가","blocks":[{"type":"paragraph","text":"이후 레테는 심사를 거친 일부 거부자에게도 적용하는 시범안을 지지했다. 지금의 거절이 고통을 만드는 반응의 일부이고, 변화 뒤 충분히 숙고한 사람이 긍정한다면 더 자유로운 판단일 수 있다고 본 것이다.","id":"crossing-p1","terms":["레테"]},{"type":"paragraph","text":"실제로 일부 당사자는 바뀐 삶을 좋아했고, 강제 적용이 정당했다고까지 말했다. 다른 사람은 상태를 되돌려달라고 하거나, 좋아진 상태를 유지하면서도 거절을 무시한 일에는 책임을 물었다. 같은 사람 안에서도 결과에 대한 만족과 과정에 대한 평가는 다를 수 있었다.","id":"crossing-p2","terms":[]}]},{"id":"price","title":"그가 없애지 않은 자료","blocks":[{"type":"paragraph","text":"시범은 중단되고 레테는 승인 책임을 인정한다. 그는 자발적인 치료까지 없애자는 요구에는 반대한다. 해방과 침해가 같은 기술에서 나왔다는 이유로 어느 한쪽 경험을 지우지 않는다.","id":"price-p1","terms":["레테"]},{"type":"paragraph","text":"리아의 미결 우체국은 이 사건의 기록 양식에서 한 가지를 가져온다. 만족과 동의를 같은 체크 칸에 넣지 않는 것이다. 만경에서 마음을 바꾸는 선택이 가능하면서도 몰래 반대를 고치지는 않는 까닭도 여기에 닿아 있다.","id":"price-p2","terms":["미결 우체국","리아","만경"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"레테와 지워지지 않는 편지","entry":"deep-lethe"},{"label":"원하는 기억 조정과 강제 변화","entry":"rules","anchor":"consent"}],"id":"price-p3"}]}],"sources":[],"relations":[{"target":"postoffice","label":"문서의 후예","reason":"만족과 동의를 구별하는 양식이 남았다.","evidence":{"entry":"postoffice","anchor":"work","label":"무한한 세계에 우체국이 필요한 이유"}},{"target":"deep-lethe","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-lethe","anchor":"source","label":"원전 · 잊음의 이름"}}],"spoiler":false,"era":"생애: 개원 103년 전~11년 전 · 마음 조정 시범: 58년 전","motive":{"출발":"사랑하는 사람과 자신을 동시에 좋아하고 싶었다","선택":"비교가 자멸로 이어지는 반응을 완화","남긴 비용":"나중의 감사를 지금의 동의처럼 사용했다"},"shortTitle":"레테 미르","preview":"비교 때문에 생기는 자기혐오를 다루던 치료자.","readingMinutes":1,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"sabel","title":"사벨 오르 — 누구나 필요한 도시의 섭정","summary":"선택을 요구하는 것조차 지친 사람에게 폭력일 수 있다고 생각했다. 그래서 모든 배역을 혼자 맡아 정했다.","type":"character","kind":"역사의 인물","tags":["질서의 낙원","보호","선데이"],"sections":[{"id":"life","title":"의자에 앉아 있는 것부터 어려운 사람들","blocks":[{"type":"paragraph","text":"사벨은 배움터가 닫힌 뒤에도 남아 있는 사람들에게 저녁을 차리던 운영자였다. “하고 싶은 일을 고르세요”라는 말이 언제나 해방은 아니었다. 무엇을 원하는지 말할 힘도 없는 날에, 고르는 책임까지 자신에게 돌아온다고 느끼는 사람이 있었다.","id":"life-p1","terms":["사벨"]},{"type":"paragraph","text":"그에게 좋은 보호란 끝없는 선택창보다 오늘 갈 곳이 정해져 있고 나를 기다리는 사람이 있다는 확실성이었다. 이 마음은 단순한 권력욕의 위장이 아니다.","id":"life-p2","terms":[]}]},{"id":"palace","title":"개원 50년 전 · 유예궁","blocks":[{"type":"paragraph","text":"유예궁은 실제 거주지와 공동 감각 무대를 결합한 피난처였다. 거주자는 질서 있는 생활, 자신이 잘해낼 수 있는 도전, 끝나면 자신을 기다리는 이웃을 얻었다. 일부는 배역임을 알고도 깊이 회복했다. 의식 없는 환영을 이용하는 장면 자체가 잘못은 아니었다.","id":"palace-p1","terms":["유예궁"]},{"type":"paragraph","text":"그러나 당시의 기술은 여러 사람이 함께 드는 제한된 무대였다. 만경처럼 모든 소망의 현실을 독립적으로 갈라 연결할 수 없었다. 어떤 사람의 승리와 다른 사람의 선택이 충돌하면 사벨이 대본을 정했다.","id":"palace-p2","terms":["만경","사벨"]}]},{"id":"order","title":"보호자는 마지막 거절도 심사했다","blocks":[{"type":"paragraph","text":"거주자가 배역을 거부하거나 떠나려 하면 사벨은 재적응 계획이 먼저 필요하다고 했다. 힘이 있을 때 자발적으로 들어온 사람에게도, 지금 나가는 것이 위험하다는 이유로 체류 연장을 요구했다. 밖에서 실패할 자유보다 안에서 보호받을 가능성을 앞세운 것이다.","id":"order-p1","terms":["사벨"]},{"type":"paragraph","text":"그는 약자를 위해 더 강한 질서를 만들려 했다. 사벨에게 비극은 도시가 거짓이어서가 아니라, 진짜로 좋아진 사람들이 있다는 사실이 다른 사람을 붙잡는 근거가 된 데 있다.","id":"order-p2","terms":["사벨"]}]},{"id":"abel","title":"아벨을 막은 사람이 남긴 다른 문","blocks":[{"type":"paragraph","text":"아벨이 삶 자체를 끝내려 하자 사벨은 유예궁의 보호구를 피난처로 열었다. 그날 수많은 사람이 살아남았다. 그러나 사건 뒤에도 돌아갈 준비가 덜 됐다는 이유로 문을 닫아두었다. 사람을 죽이지 않았다는 사실로 자기 강제가 충분히 정당해졌다고 생각했다.","id":"abel-p1","terms":["유예궁","사벨","아벨"]},{"type":"paragraph","text":"유예궁은 시민의 감독 아래 자발적 거주지로 바뀐다. 사벨은 죽을 때까지 모든 퇴장을 옳다고 믿지는 못했지만, 자신이 단독으로 심사하는 권한은 내려놓았다. 그의 생활 지원과 강제 체류 관행은 각각 다른 후계자에게 넘어간다.","id":"abel-p2","terms":["유예궁","사벨"]}]},{"id":"sunday","title":"만경에서 다시 만난 쉬는 날","blocks":[{"type":"paragraph","text":"귀환한 사벨은 에이렌에게 아주 구체적인 수정을 요청한다. 수천 개 선택지를 보여주기 전에, 아무 결정도 하지 않고 지낼 기본 집과 담당 안내자를 마련해달라는 것이다. 에이렌은 받아들인다. 도움을 거절할 권리와 도움받기 위해 먼저 모든 선택을 끝내야 하는 조건은 다르다.","id":"sunday-p1","terms":["에이렌","사벨"]},{"type":"quote","text":"나는 당신들의 자유가 부럽다.\n다만 지친 사람이 첫 문을 고를 때도, 그 자유가 곁에 앉아 있어주었으면 한다.","attribution":"사벨의 귀환 뒤 첫 면담","id":"sunday-p2","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"선데이와 사벨: 질서가 누구를 위한가","entry":"deep-order-rest"},{"label":"긴 저녁의 피난처","entry":"long-evening"}],"id":"sunday-p3"}]},{"id":"white-coat","title":"자기 이름으로 다른 사람을 걷게 한 밤","blocks":[{"type":"paragraph","text":"긴 저녁에 사벨은 외투와 인장, 공개 보호 명령을 리브에게 내주었다. 그날 밤에는 원하는 안전한 목적지로 이동할 수 있도록 권한을 위임했다. 그 선행이 거짓이었다고 번복하지 않는다.","id":"white-coat-p1","terms":["긴 저녁","사벨","리브"]},{"type":"paragraph","text":"문제는 다음 시기의 확대다. 귀가 길의 긴급 위험을 확인하던 임시 제한이, 당사자가 밖에서 잘 살 준비가 되었는지 심사하는 권한으로 넓어졌다. 사벨이 지키려던 안정을 좋아하는 사람과 그 권한에 항의하는 사람이 함께 존재한다.","id":"white-coat-p2","terms":["사벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"옷을 내준 장면","entry":"lining-supper"},{"label":"좋은 밤 다음에 남은 대기표","entry":"lining-morning"}],"id":"white-coat-p3","terms":[]}]}],"sources":[],"relations":[{"target":"recovery","label":"제도로 남은 보호","reason":"좋은 피난처의 출구 관리가 회복원에 이어졌다.","evidence":{"entry":"recovery","anchor":"purpose","label":"에이렌이 처음 설계한 것"}},{"target":"deep-order-rest","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-order-rest","anchor":"source","label":"원전 · 질서의 좋은꿈"}}],"spoiler":false,"era":"생애: 개원 96년 전~16년 전 · 유예궁: 50년 전","motive":{"출발":"무엇을 고를지 말할 힘도 없는 사람들을 돌봤다","선택":"안정과 역할을 대신 정해주는 질서","남긴 비용":"실제 보호의 성공을 퇴장 제한의 근거로 삼았다"},"shortTitle":"사벨 오르","preview":"규칙적인 일상과 보호를 약속한 유예궁의 운영자.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"abel","title":"아벨 노에 — 마지막 저녁을 약속한 의사","summary":"낙원을 상상했으나 만들 힘은 없었다. 그는 고통을 끝내겠다며 고통받는 사람을 끝내기로 했다.","type":"character","kind":"역사의 인물","tags":["급진적 악당","낙원의 선구자","대안식안"],"sections":[{"id":"life","title":"그가 처음 멈춘 것은 사람의 삶이 아니었다","blocks":[{"type":"paragraph","text":"아벨은 재난 의료 뒤 장기 돌봄을 맡았다. 낫지 않는 병을 더 이상 개인의 실패로 말하지 않았고, 추가 성과를 내지 못하는 환자도 충분히 돌봤다. 그의 무료 병동에는 회복 목표를 적지 않아도 들어갈 수 있었다. 그는 생전에 사람을 살렸고, 통증을 줄였으며, 돌봄을 성과에 묶는 규정을 고쳤다.","id":"life-p1","terms":["아벨"]},{"type":"paragraph","text":"프로네와 일하면서 능력 향상과 재교육도 지원했다. 처음에는 모두에게 맞는 길을 찾아줄 수 있다고 생각했다. 그는 실제로 성공한 환자들의 편지도 오래 보관했다. 나중에 그 편지를 거짓이라고 부르지는 않았다.","id":"life-p2","terms":["프로네"]}]},{"id":"attempts","title":"그가 가볍게 건너뛰지 않은 대안","blocks":[{"type":"paragraph","text":"아벨은 기본 생활 지원, 무료 교육, 낮은 서열의 작은 공동체, 자발적 마음 조정, 유예궁을 차례로 지원했다. 사람들은 각각 도움받았다. 그럼에도 일부는 다시 외로워졌고, 다시 남보다 쓸모없는 사람이라는 평가를 받았다. 공헌청은 성공 사례는 정책의 공으로, 돌아온 절망은 개인의 문제로 처리했다.","id":"attempts-p1","terms":["공헌청","유예궁","아벨"]},{"type":"paragraph","text":"아벨은 모든 사람이 불행하다고 관찰한 것이 아니다. 실제로 안정된 삶을 찾은 사람이 있다는 사실을 알면서도, 아직 그러지 못한 사람에게 불확실한 미래를 기다리라고 요구하는 일을 더 심각하게 보게 됐다. 그 변화가 그의 급진성을 만든다.","id":"attempts-p2","terms":["아벨"]}]},{"id":"paradise","title":"사람을 줄이기 전에, 세계를 늘리는 상상을 했다","blocks":[{"type":"paragraph","text":"아벨의 초기 노트에는 이런 문장이 있다. “서로의 자리를 빼앗지 않고도 각자가 중요해질 수 있다면. 한 사람에게 한 세계를 내어줄 수 있다면.” 그는 안전한 개인 세계와 서로 원할 때의 만남을 구상했지만 구현할 기술이 없었다.","id":"paradise-p1","terms":["개인 세계","아벨"]},{"type":"paragraph","text":"이 노트가 백지를 발견한 비밀 설계도는 아니다. 당시에도 여러 작가와 연구자가 비슷한 꿈을 썼다. 에이렌은 이 노트에서 꿈을 배웠으나, 만경의 물리적 바탕은 훗날 여러 정착지의 공동 연구가 만들었다. 학살이 과학적 돌파를 낳았다는 인과는 두지 않는다.","id":"paradise-p2","terms":["에이렌","만경","백지"]}]},{"id":"turn","title":"불확실한 희망보다 확실한 무고통을 택했다","blocks":[{"type":"paragraph","text":"아벨은 “좋아질 수도 있다”는 말만으로 끝없는 절망을 감수시킬 권리가 없다고 주장했다. 여기까지는 현재의 고통을 가볍게 넘기지 말라는 강한 비판이었다. 그러나 그는 곧 다수의 생을 끝내면 그들이 앞으로 겪을 고통도 끝난다는 결론을 정책으로 밀어붙인다.","id":"turn-p1","terms":["아벨"]},{"type":"paragraph","text":"해원 인구의 사분의 삼을 대상으로 한 「대안식안」이 그 결과다. 사분의 삼은 우주의 법칙이나 수학으로 입증된 최적값이 아니다. 당시 행정 자료에서 장기적인 기능 상실·반복 좌절 범주로 묶은 규모를 집행 대상으로 삼은 정치적 선택이다. 아벨은 그 자료로 사람의 가치까지 판정할 수 없다는 비판을 알고도 추진했다.","id":"turn-p2","terms":["대안식안","아벨","해원"]},{"type":"paragraph","text":"그는 남은 사분의 일이 저절로 행복해질 것이라고 약속하지는 않았다. 남은 제도를 고치고 새로운 출생을 제한하겠다는 계획도 붙였다. 하지만 그 개혁을 살아 있는 모두에게 먼저 적용할 수 없느냐는 반론 앞에서, 기다리는 동안 생길 고통을 이유로 살해를 앞세웠다.","id":"turn-p3","terms":[]}]},{"id":"consent","title":"그의 결정이 학살이 되는 정확한 지점","blocks":[{"type":"paragraph","text":"대안식안은 처음에 자발적 요청만을 내세웠다. 이후 아직 살고 싶다고 말하는 사람까지 보호 대상으로 지정했다. 아벨은 생을 붙잡는 의지 또한 주어진 몸과 사회가 만든 것이며, 그것이 계속 고통받는 선택을 반드시 정당화하지는 않는다고 주장했다.","id":"consent-p1","terms":["대안식안","아벨"]},{"type":"paragraph","text":"그 논리는 자신의 자비와 판단도 주어진 경험에서 생겼다는 문제를 피하지 못한다. 상대의 희망을 의심할 이유가 있다고 해서, 자기 판단이 상대의 생을 끝낼 권한을 얻는 것은 아니다. 본인이 원치 않는 사람들을 죽이려 했으므로, 이 작품의 서술은 그것을 안락사라는 좋은 이름으로만 부르지 않는다.","id":"consent-p2","terms":[]},{"type":"paragraph","text":"아벨은 자신에게 예외를 두지 않았다. 자기 이름도 대상 명부에 넣었다. 그러나 함께 죽겠다는 결심은 남의 동의를 대신하지 못한다. 자기희생이 다른 사람을 함께 희생시킬 면허가 되는 것은 아니다.","id":"consent-p3","terms":["아벨"]}]},{"id":"authority","title":"왜 이 계획이 책에서 현실로 넘어갔나","blocks":[{"type":"paragraph","text":"해원 전체가 학살에 투표한 것은 아니었다. 돌봄을 맡은 몇몇 자치구는 아벨의 오랜 공로를 근거로 예외 심사권을 넘겼다. 처음의 자발적 신청 기준이 전문가가 대신 판단하는 보호 기준으로 넓어졌을 때, 내부 반대가 있었지만 독립적인 중단 권한은 늦게 작동했다.","id":"authority-p1","terms":["아벨","해원"]},{"type":"paragraph","text":"공헌청 일부는 장기 지원을 실패로 인정할 부담을 덜고 싶었고, 일부 의료진은 고통을 방치하는 사람으로 보이고 싶지 않았다. 같은 문서에 서명했어도 이유는 같지 않았다. 이 결합이 작은 범위의 선집행을 가능하게 했다. 전 도시의 동의가 있었다는 주장은 이후 재판에서 부정된다.","id":"authority-p2","terms":["공헌청"]}]},{"id":"night","title":"긴 저녁과 살아남은 제도","blocks":[{"type":"paragraph","text":"개원 42년 전, 일부 행정권과 돌봄 기관이 참여한 선집행에서 312명이 숨졌다. 거주지 전체로 확대되기 전, 리브의 연락망과 사벨의 보호구, 프로네의 기술자들이 집행 중단과 시민 대피를 이끌었다. 아벨은 체포됐다. 재판에서는 명부에 적힌 사람들의 거절서와, 그 거절을 받아들이지 않은 승인 기록이 나란히 공개됐다.","id":"night-p1","terms":["프로네","리브","사벨","아벨"]},{"type":"paragraph","text":"아벨을 막은 공헌청은 이후 쉬거나 승급을 포기하겠다는 말까지 재발 위험으로 묶었다. 사람을 죽이지 않기 위해 사람을 고칠 때까지 놓아주지 않겠다는 회복원 논리가 여기서 힘을 얻는다. 등대동이 훗날 그 두 번째 문턱에 걸린다.","id":"night-p2","terms":["공헌청","등대동","회복원","아벨"]}]},{"id":"pupil","title":"죄수와 청년의 두 번의 만남","blocks":[{"type":"paragraph","text":"개원 32년 전, 교육 연구를 시작한 청년 에이렌이 기록 열람을 위해 그를 찾았다. 아벨은 자기가 성공한 치료를 무시하지도, 희생자를 숫자로 없애지도 않았다. 그러나 그때는 아직, 대안을 충분히 만들지 못한 시대의 책임을 자기 범죄와 나누려 했다.","id":"pupil-p1","terms":["에이렌","아벨"]},{"type":"paragraph","text":"삼 년 뒤 다시 온 에이렌은 어머니의 마지막 당직 이야기를 했다. 아벨은 새로운 역할을 계속 찾아주려는 그를 보고 “자네도 쉬는 사람의 다음 직업을 먼저 묻는군”이라고 말했다. 정확한 비판이었다. 정확한 비판을 할 수 있다는 사실이 그가 저지른 일을 옳게 만들지는 않았다.","id":"pupil-p2","terms":["에이렌","아벨"]},{"type":"paragraph","text":"아벨은 개원 24년 전 감옥에서 죽었다. 사후에 의식과 삶을 실제로 이을 수 있는 때가 온다면, 안전한 설명을 듣고 다시 답할 기회를 원한다는 의사를 남겼다. 귀환은 형벌이나 축제 출연을 위해 강제한 부활이 아니다.","id":"pupil-p3","terms":["아벨"]}]},{"id":"return","title":"낙원이 가능해진 뒤에도 같은 악당으로 남아야 하는가","blocks":[{"type":"paragraph","text":"귀환한 아벨은 만경이 실제로 작동한다는 것을 확인하면 자신의 옛 정책을 철회한다. 기술 조건이 달라졌는데도 자기 명예를 지키기 위해 살인을 계속 주장하는 인물로 쓰지 않는다. 그는 더 많은 사람에게 낙원의 선택지가 열리도록 돕고 싶어 한다. 입주 안내소는 그의 지원을 받되 피해자의 상담 담당으로 배정하지 않는다.","id":"return-p1","terms":["만경","아벨"]},{"type":"paragraph","text":"그러나 한때 살해한 사람들이 돌아왔다는 사실로 자신의 행위를 장기 수면이었다고 고쳐 부르려는 추종자들에게 반대해야 한다. 미래의 구원이 과거의 살인을 치료로 바꾸지는 않는다. 그가 이제 옳은 행동을 한다고 해서, 이사에게 용서하거나 함께 일할 의무도 생기지 않는다.","id":"return-p2","terms":["이사"]},{"type":"quote","text":"나는 사람을 끝낼 권한이 없었고, 그들이 다시 산다는 사실도 그 권한을 뒤늦게 만들어주지는 않는다.","attribution":"귀환 뒤 아벨의 수정 서문","id":"return-p3","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"그를 막은 사람 리브","entry":"liv"},{"label":"서막에서 이사를 다시 만나기","entry":"giants-opening","anchor":"name"},{"label":"이름과 전도서의 두 문장","entry":"deep-abel"}],"id":"return-p4"}]}],"sources":[],"relations":[{"target":"eiren","label":"제자","reason":"같은 꿈을 받되 사람을 줄이는 처방은 거절했다.","evidence":{"entry":"eiren","anchor":"life","label":"구조를 고치는 일에 능했던 사람"}},{"target":"sabel","label":"돌봄의 동료, 긴 저녁의 적","reason":"오늘 밤을 연장할 것인가, 생을 끝낼 것인가에서 갈라졌다.","evidence":{"entry":"sabel","anchor":"life","label":"의자에 앉아 있는 것부터 어려운 사람들"}},{"target":"isa","label":"그가 대신 결정했던 사람","reason":"귀환한 이사는 그의 성과도 면죄부도 아니다.","evidence":{"entry":"isa","anchor":"life","label":"긴 저녁 이전에 하던 일"}},{"target":"deep-abel","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-abel","anchor":"abel","label":"원전 · 살해된 사람의 이름"}}],"spoiler":false,"era":"생애: 개원 98년 전~24년 전 · 긴 저녁: 42년 전 · 귀환: 개원 1개월 뒤","motive":{"출발":"더 나아지지 못해도 돌보겠다는 의사","선택":"기다릴 고통을 없애겠다며 다수의 생을 끝내려 했다","남긴 비용":"살고 싶다는 의사까지 무시한 312명의 죽음과 뒤이은 강제 보호"},"shortTitle":"아벨 노에","preview":"만경 이전의 구원론에 영향을 남긴 의사. 삶의 고통을 줄이는 문제를 다르게 보았다.","readingMinutes":5,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"liv","title":"리브 아렌 — 구원을 약속하지 않은 구원자","summary":"아벨의 명부에서 사람을 빼냈다. 이후 자기 약속에서 돌봄 노동자를 빼내는 법도 배웠다.","type":"character","kind":"역사의 인물","tags":["위인","시민 연대","다른 구원"],"sections":[{"id":"life","title":"불합격한 생활 조정사","blocks":[{"type":"paragraph","text":"리브는 공헌청의 진로 조정사 시험에 세 번 떨어졌다. 기술을 몰랐기 때문이 아니다. 성공 가능성이 낮은 신청자를 더 적합한 분야로 돌려보내지 않고, 그 사람이 왜 그 일을 좋아하는지 오래 물었다. 평가에는 필요한 상담 시간을 넘겼다고 적혔다.","id":"life-p1","terms":["공헌청","리브"]},{"type":"paragraph","text":"그는 무능을 미덕으로 찬양하지 않았다. 필요한 의료나 구조 일에는 실력을 요구해야 한다고 봤다. 다만 일을 맡길 기준과 사람이 계속 살아갈 대접을 같은 점수로 정하는 데 반대했다.","id":"life-p2","terms":[]}]},{"id":"network","title":"내일이 보장되지 않아도, 내일 만날 약속은 만들 수 있다","blocks":[{"type":"paragraph","text":"리브는 작은 주소망을 만들었다. 누군가 다음 날 한 번 연락해주기를 원하는지, 오늘 혼자 있기를 원하는지 적었다. 사랑할 상대를 배정하지는 않았다. 원한 사람끼리 함께 먹거나 배워볼 수 있는 연결과 생활 지원을 제공했다.","id":"network-p1","terms":["주소망","리브"]},{"type":"paragraph","text":"이것은 만병통치가 아니었다. 여전히 외로운 사람도 있었고 돌아오지 않는 관계도 있었다. 하지만 아벨의 집계에서는 아무 성공도 없다고 보이던 사람들 사이에 실제 하루와 다음 약속이 생겼다. 그의 조직은 좋은 미래를 주장하는 대신, 기다리는 현재의 비용을 나눴다.","id":"network-p2","terms":["아벨"]}]},{"id":"night","title":"명부에 대한 반대 의견은 명부 밖에서 왔다","blocks":[{"type":"paragraph","text":"긴 저녁 전날, 리브는 대상자로 지정된 사람들에게 먼저 무엇을 원하는지 물었다. 삶이 좋다고 말할 필요는 없었다. 지금은 죽고 싶지 않다는 응답만으로도 대피 요청을 받았다. 그 의사를 행정 보고서가 아니라 자신의 목소리로 남겼다.","id":"night-p1","terms":["긴 저녁","리브"]},{"type":"paragraph","text":"사벨은 보호구를 열고, 프로네의 기술자들은 중단 명령이 전달되도록 도왔다. 행정 내부의 반대자들도 합류했다. 한 영웅의 일격으로 밤이 끝난 것이 아니라, 돌봄과 기록과 피난이 맞물려 확대 집행을 막았다.","id":"night-p2","terms":["프로네","사벨","합류"]}]},{"id":"error","title":"그의 좋은 약속도 누군가를 붙잡았다","blocks":[{"type":"paragraph","text":"사건 뒤 리브는 누구도 다시 혼자 남지 않게 하겠다고 서약했다. 남아 있는 담당자들이 하나씩 일을 그만두지 못했다. 한 사람이 쉬면 리브의 약속이 깨지는 구조가 된 것이다.","id":"error-p1","terms":["리브"]},{"type":"dialogue","speaker":"당직자","text":"제가 그만두면, 당신이 그 사람에게 한 약속을 제가 배신하는 건가요?","id":"error-p2","terms":[]},{"type":"paragraph","text":"리브는 자신의 약속을 수정한다. 한 사람의 영구 책임 대신 교대, 빈자리 공개, 외부 지원을 마련했다. 모든 관계를 무한히 보장할 수 있다고 말하지 않았다. 그 뒤에도 누군가는 자신을 버렸다고 느꼈고, 리브는 그 마음까지 바로잡아 자신의 선행을 완성하려 하지 않았다.","id":"error-p3","terms":["리브"]}]},{"id":"legacy","title":"리아에게 남긴 것은 영웅의 자격이 아니었다","blocks":[{"type":"paragraph","text":"늙은 리브는 강제 회복원에 반대하는 리아에게 주소망과 기록을 넘겼다. 사람을 구한 서명만 보관하지 말고, 도움을 거절한 응답도 지우지 말라고 했다. 자신이 살린 사람들의 이야기를 자기 주장의 소유물로 삼지 않으려던 늦은 원칙이다.","id":"legacy-p1","terms":["주소망","회복원","리브","리아"]},{"type":"paragraph","text":"리브는 개원 6년 전 죽었다. 만경을 실제로 보지는 못했다. 그가 남긴 연락과 교대의 방식은 새 우주의 물리법칙이 아니라, 새 우주에서도 계속 필요한 환대의 기술이 되었다.","id":"legacy-p2","terms":["리브","만경"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"리브라는 이름과 종말의 두 생존자","entry":"deep-liv"},{"label":"약속이 아니라 피난이었던 밤","entry":"long-evening"}],"id":"legacy-p3"}]},{"id":"long-sleeve","title":"잘 맞지 않는 옷을 입은 사람","blocks":[{"type":"paragraph","text":"긴 저녁에 리브는 사벨의 흰 외투를 입고 보호 명령을 전달했다. 이사가 줄여준 왼쪽 소매와 임시로 접은 오른쪽 소매가 그 사실을 남긴다. 옷은 위임받은 권한의 표식이지, 거짓으로 다른 신분을 사칭하는 만능 열쇠가 아니다.","id":"long-sleeve-p1","terms":["긴 저녁","흰 외투","이사","사벨","리브"]},{"type":"paragraph","text":"그는 한밤에는 사벨의 권한을 빌려 사람들을 구하고, 이후에는 그 권한이 사람을 붙잡지 못하도록 요구한다. 원래부터 어느 기관에도 기대지 않고 모든 일을 혼자 한 영웅이 아니다.","id":"long-sleeve-p2","terms":["사벨"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"그가 탔던 돌아오는 열차","entry":"lining-loop"}],"id":"long-sleeve-p3","terms":[]}]}],"sources":[],"relations":[{"target":"ria","label":"방법을 이어받은 사람","reason":"거절한 도움까지 기록하는 주소록을 물려받았다.","evidence":{"entry":"ria","anchor":"life","label":"원래 원했던 삶"}},{"target":"deep-liv","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-liv","anchor":"source","label":"원전 · 큰 겨울 뒤의 이름"}}],"spoiler":false,"era":"생애: 개원 81년 전~6년 전 · 주소망: 46년 전부터","motive":{"출발":"당장의 쓸모보다 사람이 원하는 이유를 물었다","선택":"성공을 약속하지 않고 기다릴 현재를 함께 부담","남긴 비용":"자신의 좋은 약속에 남의 삶을 묶을 뻔했다"},"shortTitle":"리브 아렌","preview":"거창한 미래보다 당장 머물 주소와 만날 사람을 마련한 활동가.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"isa","title":"이사 렌 — 죽은 뒤에도 피해자로만 남지 않은 사람","summary":"312명 중 하나였던 이름. 다시 살아난 뒤 가장 먼저 정한 것은 새 생활의 문 여는 시간이었다.","type":"character","kind":"역사의 인물","tags":["귀환","증언","이사"],"sections":[{"id":"life","title":"긴 저녁 이전에 하던 일","blocks":[{"type":"paragraph","text":"이사는 생활구에서 옷을 고쳤다. 더 싼 자동 수선이 가능했지만, 사람들은 자신의 오래된 옷이 왜 버리기 어려운지 설명하러 그의 가게에 왔다. 공헌청의 기준에서는 대체 가능한 일, 이웃에게는 대체하지 않고 싶은 방문이었다.","id":"life-p1","terms":["공헌청","이사"]},{"type":"paragraph","text":"아벨의 병동이 무료 식사를 처음 내놓았을 때, 이사는 의사들의 낡은 가운을 고쳤다. 아벨은 그가 자기 옷의 안주머니를 조금 넓혀주었던 일을 기억했다. 긴 저녁 뒤 기록을 다시 읽었을 때도 그 이름을 모르는 사람으로 돌릴 수는 없었다.","id":"life-p2","terms":["긴 저녁","아벨","이사"]},{"type":"paragraph","text":"그는 모든 날이 행복했던 사람이 아니다. 가게를 닫고 싶었던 날도 있었고 관계가 끊긴 적도 있었다. 그렇다고 자기 삶을 끝내달라고 맡기지는 않았다. 긴 저녁의 선집행 명부는 그 구별을 지웠다.","id":"life-p3","terms":["긴 저녁"]}]},{"id":"return","title":"마흔두 해 뒤의 새 가게","blocks":[{"type":"paragraph","text":"이사는 귀환제에 돌아와 예전 가게를 그대로 복원하지 않았다. 옷을 맡기는 대신 함께 고쳐보고 싶은 사람도 들르는 작은 공간을 골랐다. 원한다면 만경이 옷을 즉시 완벽하게 만들 수 있다는 것을 안다. 그래도 이 만남의 속도가 좋다.","id":"return-p1","terms":["귀환제","만경","이사"]},{"type":"paragraph","text":"그의 귀환은 과거에 죽지 않았다는 증명이 아니다. 다시 삶이 생겼다는 사건이다. 이사는 공개된 사망 기록을 유지하면서도 새 생활의 주소는 모두에게 열어주지 않는다.","id":"return-p2","terms":["이사"]}]},{"id":"meeting","title":"아벨과 만난 이유","blocks":[{"type":"paragraph","text":"가해자의 눈물을 확인하려고 간 것은 아니다. 아벨을 찬양하는 모임이 자신의 귀환을 옛 정책이 잠깐의 휴식을 제공했다는 증거로 쓰기 시작했기 때문이다. 이사는 자기 말로 그 주장을 거절하기로 했다.","id":"meeting-p1","terms":["아벨","이사"]},{"type":"quote","text":"내가 다시 행복해지는 것은 당신 계획의 마지막 단계가 아니에요.\n내가 여기서 시작한 일입니다.","attribution":"이사의 면담 기록","id":"meeting-p2","terms":[]},{"type":"paragraph","text":"그는 면담을 마치고 가게로 돌아간다. 아벨의 답을 평생 기다리는 역할도, 그를 용서하지 않는 사람들의 대표 역할도 자동으로 맡지 않는다.","id":"meeting-p3","terms":["아벨"]}]},{"id":"lining","title":"구원의 증인이 아니라, 길을 남긴 사람","blocks":[{"type":"paragraph","text":"긴 저녁 당일, 이사는 생활 노선에서 빠진 연결길을 기록한 지도를 두 장 복사하고 사벨의 외투 안감에도 옮겼다. 이 지도는 만경의 설계도나 학살의 암호가 아니었다. 자기가 납품하며 확인했던 문턱·경사길·주소들의 기록이었다.","id":"lining-p1","terms":["긴 저녁","이사","안감","사벨","만경"]},{"type":"paragraph","text":"그는 다른 사람을 구하기 위해 죽음을 선택하지 않았다. 강제 이송 뒤 자신의 구조도 요청했다. 지도는 죽기 전에 전달되었고, 죽음은 구조를 완성한 대가가 아니라 구조가 끝내 막지 못한 범죄였다.","id":"lining-p2","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"이사가 실제로 살아 움직이는 전사","entry":"lining-map"},{"label":"현재의 의뢰 장면","entry":"lining-opening"}],"id":"lining-p3","terms":[]}]}],"sources":[],"relations":[{"target":"deep-abel","label":"이름을 더 깊게","reason":"원전의 이름이 어떤 물건과 선택에서 다시 나타나는지 읽는다.","evidence":{"entry":"deep-abel","anchor":"abel","label":"원전 · 살해된 사람의 이름"}}],"spoiler":false,"era":"긴 저녁의 희생자 · 개원 귀환","motive":{"출발":"원하지 않은 죽음을 행정이 대신 선택했다","선택":"돌아온 삶을 자기 주소에서 시작한다","남긴 비용":"좋아졌다는 사실을 가해자의 면책으로 쓰지 못하게 직접 말해야 한다"},"shortTitle":"이사 렌","preview":"해원의 재봉사. 외전 「안감의 지도」에서 따라가는 인물.","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"long-evening","title":"개원 42년 전 — 내일을 기다린 사람들이 살아남은 밤","summary":"행정은 다수의 평안을 선언했다. 사람들은 자기 이름으로 아직이라고 답했다.","type":"history","kind":"연결된 역사","tags":["전사","학살 중단","역사의 갈림길"],"sections":[{"id":"morning","title":"아침 · 두 종류의 명부","blocks":[{"type":"paragraph","text":"공헌청의 회의실에는 네 권의 장부가 놓여 있었다. 한 권은 남아 생활 체계를 유지할 사람들, 세 권은 대안식 대상으로 분류한 사람들이었다. 표지에는 위험·실패·불안정이 적혀 있었고, 당사자에게 묻는 칸은 뒤쪽에 붙었다.","id":"morning-p1","terms":["공헌청"]},{"type":"paragraph","text":"리브의 장부에는 오늘 찾아가도 되는지와 누구에게 연락하면 되는지가 적혀 있었다. 거창한 반대 이론은 없었다. 공적 장부의 같은 번호가 리브의 장부에서는 서로 다른 이름과 요청이었다.","id":"morning-p2","terms":["리브"]}]},{"id":"supper","title":"저녁 · 아벨과 사벨","blocks":[{"type":"paragraph","text":"두 사람은 오랫동안 병동 식탁에서 저녁을 먹었다. 아벨이 사람을 치료하면 사벨은 그 사람이 돌아갈 일상을 준비했다. 같은 컵을 쓰던 동료가 그날은 서로 다른 보호 명령에 서명했다.","id":"supper-p1","terms":["사벨","아벨"]},{"type":"dialogue","speaker":"아벨","text":"너는 그들에게 영원히 여기 있어도 좋다고 약속할 수 있나?","id":"supper-p2","terms":[]},{"type":"dialogue","speaker":"사벨","text":"아니. 오늘 밤 머물 자리는 있어.","id":"supper-p3","terms":[]},{"type":"dialogue","speaker":"아벨","text":"결국 내일을 미루는군.","id":"supper-p4","terms":[]},{"type":"dialogue","speaker":"사벨","text":"네가 끝내려는 사람에게는, 그 내일이 필요해.","id":"supper-p5","terms":[]},{"type":"paragraph","text":"사벨은 그날 옳은 문을 열었다. 나중에는 자신이 문을 닫을 차례를 결정해도 된다고 믿었다. 같은 사람의 선행과 다른 잘못은 동시에 남는다.","id":"supper-p6","terms":["사벨"]}]},{"id":"refusal","title":"밤 · 사분의 삼이라는 말에서 빠져나온 사람들","blocks":[{"type":"paragraph","text":"첫 집행에서 312명이 죽었다는 소식이 들어왔다. 리브는 그 숫자 옆에 이름을 쓰기 시작했다. 이름을 몰라도 우선 대피시켰고, 자기 생활이 충분히 가치 있다고 증명하라고 요구하지 않았다.","id":"refusal-p1","terms":["리브"]},{"type":"paragraph","text":"피난처로 가는 길에는 아벨에게 치료받은 사람이 아벨의 집행을 피하려 줄을 섰다. 그가 한때 자기를 살렸다는 기억을 지우지 않고도 지금 그를 거절할 수 있었다.","id":"refusal-p2","terms":["아벨"]},{"type":"paragraph","text":"기술자·의료진·행정 내부의 반대자들이 확대 집행을 막았다. 아벨을 제압하는 일과 살아남은 사람을 먹이고 재우는 일이 동시에 필요했다. 인명 기록과 피해는 나중에 공개 심판에서 별도로 판단됐다.","id":"refusal-p3","terms":["아벨"]}]},{"id":"aftermath","title":"그다음 날 · 죽이지 않았다는 이유만으로","blocks":[{"type":"paragraph","text":"시민들은 밤새 보호구에 머물렀다. 첫날에는 길과 시설의 안전을 확인할 시간이 필요했다. 며칠 뒤 안전이 확인된 곳에서도 퇴소가 미뤄졌다. 이제 담당자는 “또 같은 절망으로 돌아가게 둘 수 없습니다”라고 말했다. 긴급 대피의 확인이 개인의 생활 준비 심사로 바뀌었다.","id":"aftermath-p1","terms":["긴 저녁","회복원"]},{"type":"paragraph","text":"리브는 아벨에게서 사람들을 빼냈다고 해서 사벨과 공헌청에게 그 사람들을 넘긴 것은 아니라고 항의했다. 그는 양쪽에서 자기들이 살린 사람들의 감사도 모른다는 말을 들었다.","id":"aftermath-p2","terms":["공헌청","리브","사벨","아벨"]},{"type":"quote","text":"구조한 사람의 다음 주소를, 구조자가 평생 정하지는 않는다.","attribution":"리브의 사건 뒤 서한","id":"aftermath-p3","terms":[]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"그 공포가 회복원으로 이어지는 과정","entry":"inheritance-war"},{"label":"에이렌의 첫 면회","entry":"prison-window"}],"id":"aftermath-p4"}]},{"id":"lining-records","title":"같은 밤을 장면으로 따라가기","blocks":[{"type":"paragraph","text":"공개된 구조 기록을 시간순으로 읽으면 사벨의 외투를 입고 걸은 리브, 안감에 경로를 적은 이사, 그 사본으로 배차를 조정한 미라가 연결된다. 사벨의 보호 명령과 내부 집행 거부도 함께 작동했다. 학살을 막은 한 명의 숨은 주인공이 있다는 뜻은 아니다.","id":"lining-records-p1","terms":["이사","안감","미라","사벨","리브"]},{"type":"choice","label":"이 장면에서 이어 읽기","options":[{"label":"아침의 수선집부터","entry":"lining-map"},{"label":"밤의 환상선에서","entry":"lining-loop"},{"label":"다음 날의 퇴장 심사","entry":"lining-morning"}],"id":"lining-records-p2","terms":[]}]}],"sources":[],"relations":[],"spoiler":true,"era":"개원 42년 전","shortTitle":"개원 42년 전","preview":"","readingMinutes":2,"requires":["prologue","act-one","founder-return","descent","act-two","act-three","last-scene","festival-night"]},{"id":"prison-window","title":"개원 29년 전 — 죄수의 창문","summary":"같은 비판에 도달한 두 사람이, 같은 처방을 선택해야 하는 것은 아니다.","type":"history","kind":"연결된 역사","tags":["계승","대사 떡밥","창문"],"sections":[{"id":"visit","title":"두 번째 면회","blocks":[{"type":"paragraph","text":"에이렌은 어머니에게 줄 강의 계획서를 들고 감옥에 왔다. 미라는 마지막 구조 당직을 마친 뒤 새 일을 찾지 않고 있었다. 에이렌은 그것이 걱정스러웠다.","id":"visit-p1","terms":["에이렌","미라"]},{"type":"paragraph","text":"아벨은 계획서의 여백을 보았다. 해야 할 일은 자세했고, 하지 않을 때의 생활은 비어 있었다.","id":"visit-p2","terms":["아벨"]},{"type":"dialogue","speaker":"아벨","text":"자네 어머니는 누군가를 돕지 않으면 찾아갈 수 없는 분인가?","id":"visit-p3","terms":[]},{"type":"paragraph","text":"에이렌은 대답하지 못했다.","id":"visit-p4","terms":["에이렌"]}]},{"id":"window","title":"종이에 두 개의 창문을 그리다","blocks":[{"type":"paragraph","text":"아벨은 노트에 창문 두 개를 그렸다. 하나는 여름, 하나는 겨울이었다. 어느 쪽을 택해도 반대 계절을 원하는 사람이 추워지거나 더워지지 않는 방. 그가 현실로 만들지 못했던 가정이었다.","id":"window-p1","terms":["아벨"]},{"type":"dialogue","speaker":"에이렌","text":"그 방이 없으면 사람부터 지워도 됩니까?","id":"window-p2","terms":[]},{"type":"dialogue","speaker":"아벨","text":"없을지도 모를 방을 기다리라고 말하는 자네는, 그동안 그들이 겪을 일을 얼마나 맡겠나?","id":"window-p3","terms":[]},{"type":"dialogue","speaker":"에이렌","text":"다 맡겠다고 말하면, 또 선생님처럼 그들의 삶을 대신 정하게 될 것 같습니다.","id":"window-p4","terms":
